name: Backup retention audit (dry-run only)

on:
  schedule:
    - cron: '0 7 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-postgres-retention-audit
  cancel-in-progress: false

jobs:
  audit:
    name: List encrypted retention candidates without deleting
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Read-only deploy key, externally limited to main.  This workflow has no
    # write key, git rm, commit, push, or deletion activation variable.
    environment: backup-status-main
    steps:
      - name: Checkout pinned known_hosts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Configure read-only offsite identity
        shell: bash
        env:
          BACKUP_READONLY_KEY: ${{ secrets.BACKUP_REPO_READONLY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          umask 077
          test -n "$BACKUP_READONLY_KEY"
          install -d -m 0700 "$RUNNER_TEMP/backup-ssh"
          printf '%s\n' "$BACKUP_READONLY_KEY" >"$RUNNER_TEMP/backup-ssh/readonly_ed25519"
          install -m 0600 .github/backup-known_hosts "$RUNNER_TEMP/backup-ssh/known_hosts"
          ssh-keygen -F github.com -f "$RUNNER_TEMP/backup-ssh/known_hosts" >/dev/null
          ssh-keygen -l -f "$RUNNER_TEMP/backup-ssh/known_hosts" >/dev/null
          ssh -G -F /dev/null -i "$RUNNER_TEMP/backup-ssh/readonly_ed25519" \
            -o UserKnownHostsFile="$RUNNER_TEMP/backup-ssh/known_hosts" \
            -o StrictHostKeyChecking=yes -o BatchMode=yes -o IdentitiesOnly=yes \
            -o ConnectTimeout=10 -o ConnectionAttempts=1 git@github.com \
            >"$RUNNER_TEMP/backup-ssh/effective"
          grep -Fxq 'hostname github.com' "$RUNNER_TEMP/backup-ssh/effective"
          grep -Fxq 'port 22' "$RUNNER_TEMP/backup-ssh/effective"
          grep -Fxq 'user git' "$RUNNER_TEMP/backup-ssh/effective"
          grep -Fxq 'batchmode yes' "$RUNNER_TEMP/backup-ssh/effective"
          grep -Fxq 'identitiesonly yes' "$RUNNER_TEMP/backup-ssh/effective"
          grep -Eq '^stricthostkeychecking (yes|true)$' "$RUNNER_TEMP/backup-ssh/effective"
      - name: Clone offsite read-only
        shell: bash
        run: |
          set -Eeuo pipefail
          export GIT_TERMINAL_PROMPT=0 GIT_ASKPASS=/bin/false
          export GIT_SSH_COMMAND="ssh -F /dev/null -i $RUNNER_TEMP/backup-ssh/readonly_ed25519 -o UserKnownHostsFile=$RUNNER_TEMP/backup-ssh/known_hosts -o StrictHostKeyChecking=yes -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=10 -o ConnectionAttempts=1"
          timeout --signal=TERM --kill-after=10s 15m git clone \
            --filter=blob:none --single-branch --branch main \
            git@github.com:BrunoMediador/startap-backups.git "$RUNNER_TEMP/startap-backups"
      - name: Compute proposal without mutation
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$RUNNER_TEMP/startap-backups"
          cutoff="$(date -u -d '30 days ago' '+%Y%m%d')"
          candidates=0
          while IFS= read -r path; do
            name="$(basename "$path")"
            stamp="${name#backup-}"
            day="${stamp:0:8}"
            printf '%s' "$day" | grep -Eq '^[0-9]{8}$'
            if [[ "$day" < "$cutoff" ]]; then
              candidates=$((candidates + 1))
            fi
          done < <(find dumps -type f -name '*.sql.gz.age' -print | sort)
          printf '### Retention proposal (no deletion)\n\n- encrypted candidates older than 30d: `%s`\n- mutation: `disabled`\n' \
            "$candidates" >>"$GITHUB_STEP_SUMMARY"
      - name: Remove ephemeral identity
        if: always()
        shell: bash
        run: |
          rm -f -- "$RUNNER_TEMP/backup-ssh/readonly_ed25519" \
            "$RUNNER_TEMP/backup-ssh/known_hosts" "$RUNNER_TEMP/backup-ssh/effective"
          rmdir -- "$RUNNER_TEMP/backup-ssh" 2>/dev/null || true
