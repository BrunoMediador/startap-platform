name: Deploy to Production

# Dispara SOMENTE quando o workflow CI conclui com sucesso na main.
# Isso garante que o deploy nunca roda com build quebrado.
on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types:
      - completed

jobs:
  deploy:
    name: Deploy via SSH
    runs-on: ubuntu-latest
    # So roda se o CI passou
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e
            cd /opt/automacoes/code
            ./scripts/deploy.sh
