name: Deploy to Production

# Dispara SOMENTE quando o workflow CI conclui com sucesso na main.
# Isso garante que o deploy nunca roda com build quebrado.
on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types:
      - completed

# Serializa deploys para o mesmo servidor.
# Sem isso, dois merges seguidos disparam `docker compose up -d` concorrentes
# e batem com "container name already in use" (containers órfãos prefixados).
# cancel-in-progress: false — nunca aborta um deploy no meio; enfileira.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy via SSH
    runs-on: ubuntu-latest
    # So roda se o CI passou
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e
            cd /opt/automacoes/code
            bash ./scripts/deploy.sh

      - name: Prune Docker build cache (>7 dias)
        if: success()
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            docker builder prune -f --filter "until=168h"
