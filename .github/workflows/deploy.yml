name: Deploy to Production

# Dispara SOMENTE quando o workflow CI conclui com sucesso na main.
# Isso garante que o deploy nunca roda com build quebrado.
on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types:
      - completed

# Serializa deploys para o mesmo servidor.
# Sem isso, dois merges seguidos disparam `docker compose up -d` concorrentes
# e batem com "container name already in use" (containers órfãos prefixados).
# cancel-in-progress: false — nunca aborta um deploy no meio; enfileira.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy via SSH
    runs-on: ubuntu-latest
    # So roda se o CI passou
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      # O provedor de rede da VPS (Hostinger) tem anti-DDoS na borda que, de forma
      # intermitente, dropa faixas do GitHub Actions ANTES de chegar no servidor.
      # Sintoma: `dial tcp :22 i/o timeout`. O firewall do SO esta liberado.
      #
      # `nick-fields/retry` re-executa o passo inteiro com backoff: se o bloqueio
      # for intermitente e o IP do runner sair da faixa dropada (ou a borda liberar),
      # uma das 3 tentativas passa. NAO resolve bloqueio sustentado (ver ticket de
      # whitelist no provedor + opcao de tunel Tailscale).
      - name: Deploy to server (with retry)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 18          # teto por tentativa (deploy real ~3-5min)
          max_attempts: 3              # 3 tentativas
          retry_wait_seconds: 30       # backoff entre tentativas
          retry_on: error
          command: |
            mkdir -p ~/.ssh
            printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
            chmod 600 ~/.ssh/deploy_key
            ssh -i ~/.ssh/deploy_key \
                -o StrictHostKeyChecking=no \
                -o UserKnownHostsFile=/dev/null \
                -o ConnectTimeout=120 \
                -o ServerAliveInterval=30 \
                -o ServerAliveCountMax=4 \
                -p 22 \
                root@${{ secrets.SERVER_HOST }} \
                'set -e; cd /opt/automacoes/code; bash ./scripts/deploy.sh'

      # Limpeza pos-deploy: o build roda com --no-cache, entao o cache de build
      # NUNCA e reusado — so acumula (chegou a ~44GB e encheu o disco). O filtro
      # antigo (>7 dias) deixava escapar o cache novo de cada deploy. Prune TOTAL
      # apos deploy OK. Redundante com o passo equivalente no deploy.sh
      # (idempotente) — mantido aqui como rede de seguranca no caminho via CI.
      #
      # ⚠️ JAMAIS trocar por `docker system prune -a` ou `docker image prune -a`:
      # isso removeria imagens paradas porem taggeadas, incluindo a
      # devlikeapro/waha-plus (imagem doada/congelada, NAO re-baixavel) e
      # derrubaria os bots. So cache de build + imagens dangling (<none>).
      - name: Prune Docker build cache (pos-deploy)
        if: success()
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          timeout: 120s
          command_timeout: 15m
          script: |
            docker builder prune -af || true
            docker image prune -f || true
