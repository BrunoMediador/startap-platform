name: Deploy to Production

# Dispara SOMENTE quando o workflow CI conclui com sucesso na main.
# Isso garante que o deploy nunca roda com build quebrado.
on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types:
      - completed

# Serializa deploys para o mesmo servidor.
# Sem isso, dois merges seguidos disparam `docker compose up -d` concorrentes
# e batem com "container name already in use" (containers órfãos prefixados).
# cancel-in-progress: false — nunca aborta um deploy no meio; enfileira.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy (self-hosted runner na VPS)
    # ------------------------------------------------------------------------
    # MUDANÇA (infra/self-hosted-runner): o deploy agora roda DENTRO da VPS,
    # num GitHub Actions self-hosted runner (systemd, /opt/actions-runner).
    #
    # Por quê: o anti-DDoS/firewall do provedor da VPS dropa de forma
    # SUSTENTADA as faixas de IP dos runners hospedados do GitHub, fazendo
    # TODO deploy automático falhar com `dial tcp :22 i/o timeout` (3/3
    # tentativas do retry antigo). Vinha virando deploy manual toda vez.
    #
    # Com o runner NA VPS, o job executa local: NÃO há SSH cruzando o
    # firewall do provedor. O runner usa só conexão de SAÍDA (HTTPS long-poll)
    # pra receber jobs do GitHub — esse caminho não é bloqueado.
    #
    # O runner roda como root (mesma identidade do deploy manual: os arquivos
    # de /opt/automacoes/code e o .git são root:root; acesso ao docker daemon).
    # Justificativa de não usar usuário dedicado: o deploy exige grupo `docker`
    # (≈ root efetivo) de qualquer forma, e trocar o dono de /opt/automacoes/code
    # em produção (clientes vivos) seria risco sem ganho real de isolamento.
    # ------------------------------------------------------------------------
    runs-on: [self-hosted, vps, deploy]
    # So roda se o CI passou
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      # NÃO usamos actions/checkout: o deploy roda no checkout de PRODUÇÃO
      # (/opt/automacoes/code), não no _work do runner. O próprio deploy.sh
      # faz `git fetch` + checkout lá dentro.
      #
      # SCRUM-109: passamos o SHA EXATO que passou no CI (workflow_run.head_sha)
      # via DEPLOY_SHA. O deploy.sh faz `git checkout --detach <sha>` desse commit
      # — assim sobe o codigo TESTADO, e nao o HEAD de main NA HORA (que, com um 2o
      # merge proximo, poderia ser um commit ainda SEM CI verde). Se DEPLOY_SHA vier
      # vazio (deploy manual na VPS / dispatch), o script cai pro checkout main antigo.
      - name: Deploy (scripts/deploy.sh local na VPS)
        working-directory: /opt/automacoes/code
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -e
          echo "Runner: $(hostname) | user: $(whoami) | pwd: $(pwd)"
          echo "DEPLOY_SHA (workflow_run.head_sha): ${DEPLOY_SHA:-<vazio>}"
          bash ./scripts/deploy.sh

      # Limpeza pos-deploy: o build roda com --no-cache, entao o cache de build
      # NUNCA e reusado — so acumula (chegou a ~44GB e encheu o disco). O filtro
      # antigo (>7 dias) deixava escapar o cache novo de cada deploy. Prune TOTAL
      # apos deploy OK. Redundante com o passo equivalente no deploy.sh
      # (idempotente) — mantido aqui como rede de seguranca.
      #
      # ⚠️ JAMAIS trocar por `docker system prune -a` ou `docker image prune -a`:
      # isso removeria imagens paradas porem taggeadas, incluindo a
      # devlikeapro/waha-plus (imagem doada/congelada, NAO re-baixavel) e
      # derrubaria os bots. So cache de build + imagens dangling (<none>).
      - name: Prune Docker build cache (pos-deploy)
        if: success()
        continue-on-error: true
        run: |
          docker builder prune -af || true
          docker image prune -f || true

# ============================================================================
# FALLBACK (deploy via SSH externo) — manter como referência caso o runner caia
# ----------------------------------------------------------------------------
# Se o self-hosted runner ficar offline (systemd parado, VPS reiniciando, etc),
# o job acima fica "Queued" indefinidamente porque ninguém o pega. Opções:
#
#   1) Reanimar o runner na VPS (preferido):
#        ssh root@<VPS> 'cd /opt/actions-runner && ./svc.sh status'
#        ssh root@<VPS> 'cd /opt/actions-runner && ./svc.sh start'
#      (o serviço é `enabled` no boot; isto é só pra quando o processo morreu.)
#
#   2) Deploy manual na VPS (sempre funciona, independe de runner):
#        ssh root@<VPS> 'cd /opt/automacoes/code && bash ./scripts/deploy.sh'
#
#   3) Reverter este PR para o caminho SSH externo (runs-on: ubuntu-latest +
#      nick-fields/retry + appleboy/ssh-action). Esse caminho dependia dos
#      secrets SSH_PRIVATE_KEY e SERVER_HOST, que continuam configurados no
#      repo. Sujeito ao timeout :22 do firewall do provedor (motivo desta troca).
#
# A versão SSH anterior deste arquivo está no histórico git (git show <commit>:
# .github/workflows/deploy.yml no commit imediatamente anterior a este PR).
# ============================================================================
