name: CI

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    name: Build & typecheck
    runs-on: ubuntu-latest
    # Postgres 16 EFÊMERO p/ migrations e testes de INTEGRAÇÃO SQL real.
    # Sem ele, integrações AUTO-SKIPAM (PG_TEST_URL ausente) e a cadeia de schema não é validada.
    # Banco descartável, vive só durante o job; nunca toca prod.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: itestuser
          POSTGRES_PASSWORD: itestpass
          POSTGRES_DB: itestdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U itestuser -d itestdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - name: TypeScript build (all workspaces)
        run: npm run build --workspaces --if-present
      - name: Migrations (Postgres 16 vazio)
        env:
          PG_TEST_URL: postgres://itestuser:itestpass@localhost:5432/itestdb
        run: npm run test:migrations
      - name: Tests (painel admin legado)
        run: npm run test:panel
      - name: Build painel image + runtime import smoke
        # O Dockerfile importa /packages/db/dist/index.js durante o build. Assim o CI
        # barra package scope ESM/dependência runtime quebrados sem publicar imagem.
        run: docker build --file painel-admin/Dockerfile --tag startap-painel-ci:${{ github.sha }} .
      - name: Tests (suíte Vitest na raiz)
        # SCRUM-50: o comando antigo `npm test --workspaces --if-present` PULAVA
        # 92/149 test files (~62%): apps/* (api, portal-api, portal-web, worker) NÃO
        # têm script `test`, então `--if-present` os ignorava em SILÊNCIO — só rodavam
        # os 3 packages/* (core, db, integrations = 57 files / ~826 testes). "CI verde"
        # era falsa confiança (classes inteiras de defeito em apps/* invisíveis).
        #
        # `npm test` na RAIZ usa o vitest.config.ts da raiz e descobre packages/*,
        # apps/* e scripts/*. O painel-admin usa node:test e roda UMA vez na etapa
        # anterior. O build acima é PRÉ-REQUISITO: os
        # packages exportam via ./dist/*.js, então sem build os apps/* que importam
        # @startap/* quebram na resolução.
        #
        # PG_TEST_URL liga os testes de integração de SQL real contra o service postgres:16
        # acima. As integrações usam schemas próprios no mesmo banco descartável, depois do
        # gate de migrations; sem a env, esses testes AUTO-SKIPAM.
        env:
          PG_TEST_URL: postgres://itestuser:itestpass@localhost:5432/itestdb
        run: npm test

  e2e:
    name: E2E Compose isolado
    runs-on: ubuntu-24.04
    needs: build
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - name: Guardas estáticos do harness
        run: npm run e2e:validate
      - name: Typecheck do harness
        run: npm run e2e:typecheck
      - name: Preflight Docker Engine
        run: npm run e2e:preflight
      - name: Prova E2E (up + test + teardown)
        run: npm run e2e
