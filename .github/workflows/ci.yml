name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    name: Build & typecheck
    runs-on: ubuntu-latest
    # Postgres 16 EFÊMERO p/ os testes de INTEGRAÇÃO de SQL real (ex.: packages-deducao.integration).
    # Sem ele, esses testes AUTO-SKIPAM (PG_TEST_URL ausente) e classes inteiras de defeito ficam
    # invisíveis: o mock só compara a STRING do SQL e deixou passar o P0 do #321 (FOR UPDATE + GROUP BY
    # = erro 0A000 no PG 16, inexecutável). Banco descartável, vive só durante o job; nunca toca prod.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: itestuser
          POSTGRES_PASSWORD: itestpass
          POSTGRES_DB: itestdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U itestuser -d itestdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - name: TypeScript build (all workspaces)
        run: npm run build --workspaces --if-present
      - name: Tests (suíte real na raiz)
        # SCRUM-50: o comando antigo `npm test --workspaces --if-present` PULAVA
        # 92/149 test files (~62%): apps/* (api, portal-api, portal-web, worker) NÃO
        # têm script `test`, então `--if-present` os ignorava em SILÊNCIO — só rodavam
        # os 3 packages/* (core, db, integrations = 57 files / ~826 testes). "CI verde"
        # era falsa confiança (classes inteiras de defeito em apps/* invisíveis).
        #
        # `npx vitest run` na RAIZ usa o vitest.config.ts da raiz e descobre TODOS os
        # test files (packages/* + apps/* + scripts/ = 149 files / 2165 testes),
        # respeitando os excludes (.claude/worktrees, dist, node_modules,
        # painel-admin/test que usa node:test). O build acima é PRÉ-REQUISITO: os
        # packages exportam via ./dist/*.js, então sem build os apps/* que importam
        # @startap/* quebram na resolução.
        #
        # PG_TEST_URL liga os testes de integração de SQL real (packages-deducao.integration)
        # contra o service postgres:16 acima. O suite de integração cria/dropa as próprias
        # tabelas num banco vazio (autocontido). Sem ele, esse teste AUTO-SKIPA.
        env:
          PG_TEST_URL: postgres://itestuser:itestpass@localhost:5432/itestdb
        run: npx vitest run
