name: Backup Postgres → startap-backups

on:
  schedule:
    # 06:00 UTC = 03:00 BRT — fora do pico de atendimento
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Nunca cancela backup em andamento; enfileira se houver sobreposição.
concurrency:
  group: backup-postgres
  cancel-in-progress: false

jobs:
  backup:
    name: Restricted pg_dump → encrypted offsite
    # Esta condição é só defesa em profundidade. O controle de confiança é o
    # environment GitHub configurado externamente para aceitar apenas main.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       vars.BACKUP_RESILIENCE_PRODUCER_ENABLED != 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: backup-legacy-main

    steps:
      - name: Checkout pinned workflow inputs
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Configure dump-only VPS identity and offsite deploy key
        shell: bash
        env:
          LEGACY_DUMP_SSH_KEY: ${{ secrets.BACKUP_LEGACY_DUMP_SSH_KEY }}
          BACKUP_DEPLOY_KEY: ${{ secrets.BACKUP_REPO_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          umask 077
          test -n "$LEGACY_DUMP_SSH_KEY"
          test -n "$BACKUP_DEPLOY_KEY"
          install -d -m 0700 "$RUNNER_TEMP/backup-ssh"
          printf '%s\n' "$LEGACY_DUMP_SSH_KEY" > "$RUNNER_TEMP/backup-ssh/legacy_dump_ed25519"
          printf '%s\n' "$BACKUP_DEPLOY_KEY" > "$RUNNER_TEMP/backup-ssh/offsite_write_ed25519"
          install -m 0600 .github/backup-known_hosts "$RUNNER_TEMP/backup-ssh/known_hosts"
          chmod 0600 "$RUNNER_TEMP/backup-ssh/"*_ed25519 "$RUNNER_TEMP/backup-ssh/known_hosts"
          ssh-keygen -F 187.77.242.220 -f "$RUNNER_TEMP/backup-ssh/known_hosts" >/dev/null
          ssh-keygen -F github.com -f "$RUNNER_TEMP/backup-ssh/known_hosts" >/dev/null
          ssh-keygen -l -f "$RUNNER_TEMP/backup-ssh/known_hosts" >/dev/null

          printf '%s\n' \
            'Host backup-vps' \
            '  HostName 187.77.242.220' \
            '  Port 22' \
            '  User startap-backup-legacy-dump' \
            "  IdentityFile $RUNNER_TEMP/backup-ssh/legacy_dump_ed25519" \
            '  BatchMode yes' \
            '  IdentitiesOnly yes' \
            '  StrictHostKeyChecking yes' \
            "  UserKnownHostsFile $RUNNER_TEMP/backup-ssh/known_hosts" \
            '  ConnectTimeout 10' \
            '  ConnectionAttempts 1' \
            'Host github.com' \
            '  User git' \
            "  IdentityFile $RUNNER_TEMP/backup-ssh/offsite_write_ed25519" \
            '  BatchMode yes' \
            '  IdentitiesOnly yes' \
            '  StrictHostKeyChecking yes' \
            "  UserKnownHostsFile $RUNNER_TEMP/backup-ssh/known_hosts" \
            '  ConnectTimeout 10' \
            '  ConnectionAttempts 1' > "$RUNNER_TEMP/backup-ssh/config"
          chmod 0600 "$RUNNER_TEMP/backup-ssh/config"

          ssh -G -F "$RUNNER_TEMP/backup-ssh/config" backup-vps \
            > "$RUNNER_TEMP/backup-ssh/vps.effective"
          grep -Fxq 'hostname 187.77.242.220' "$RUNNER_TEMP/backup-ssh/vps.effective"
          grep -Fxq 'user startap-backup-legacy-dump' "$RUNNER_TEMP/backup-ssh/vps.effective"
          grep -Fxq 'port 22' "$RUNNER_TEMP/backup-ssh/vps.effective"
          grep -Fxq 'batchmode yes' "$RUNNER_TEMP/backup-ssh/vps.effective"
          grep -Fxq 'identitiesonly yes' "$RUNNER_TEMP/backup-ssh/vps.effective"
          grep -Eq '^stricthostkeychecking (yes|true)$' "$RUNNER_TEMP/backup-ssh/vps.effective"

          ssh -G -F "$RUNNER_TEMP/backup-ssh/config" github.com \
            > "$RUNNER_TEMP/backup-ssh/offsite.effective"
          grep -Fxq 'hostname github.com' "$RUNNER_TEMP/backup-ssh/offsite.effective"
          grep -Fxq 'user git' "$RUNNER_TEMP/backup-ssh/offsite.effective"
          grep -Fxq 'batchmode yes' "$RUNNER_TEMP/backup-ssh/offsite.effective"
          grep -Fxq 'identitiesonly yes' "$RUNNER_TEMP/backup-ssh/offsite.effective"
          grep -Eq '^stricthostkeychecking (yes|true)$' "$RUNNER_TEMP/backup-ssh/offsite.effective"

      - name: Checkout startap-backups with the single-repository key
        shell: bash
        run: |
          set -Eeuo pipefail
          export GIT_SSH_COMMAND="ssh -F $RUNNER_TEMP/backup-ssh/config"
          timeout --signal=TERM --kill-after=10s 15m git clone \
            --single-branch --branch main \
            git@github.com:BrunoMediador/startap-backups.git startap-backups

      - name: Fixed remote dump, integrity validation, and mandatory age encryption
        id: dump
        shell: bash
        env:
          BACKUP_AGE_PUBKEY: ${{ secrets.BACKUP_AGE_PUBKEY }}
        run: |
          set -Eeuo pipefail
          umask 077
          AGE_VERSION='1.3.1'
          AGE_ARCHIVE_SHA256='bdc69c09cbdd6cf8b1f333d372a1f58247b3a33146406333e30c0f26e8f51377'
          AGE_BINARY_SHA256='2e305637f2a0555305e21c17fb74446acbb39b53135d43d4b744e50c287133a5'
          TIMESTAMP="$(date -u '+%Y-%m-%d-%H%M%S')"
          YEAR="$(date -u '+%Y')"
          MONTH="$(date -u '+%m')"
          OUTDIR="startap-backups/dumps/${YEAR}/${MONTH}"
          TMPGZ="${RUNNER_TEMP}/${TIMESTAMP}.sql.gz"
          RECIPIENT_FILE="${RUNNER_TEMP}/age-recipient"
          AGE_STDERR="${RUNNER_TEMP}/age.stderr"
          ARCHIVE="${RUNNER_TEMP}/age.tar.gz"
          cleanup_sensitive() {
            rm -f -- "$TMPGZ" "$RECIPIENT_FILE" "$AGE_STDERR" "$ARCHIVE"
          }
          trap cleanup_sensitive EXIT INT TERM HUP

          test -n "$BACKUP_AGE_PUBKEY"
          printf '%s\n' "$BACKUP_AGE_PUBKEY" > "$RECIPIENT_FILE"
          mkdir -p "$OUTDIR"

          curl --fail --silent --show-error --location \
            "https://github.com/FiloSottile/age/releases/download/v${AGE_VERSION}/age-v${AGE_VERSION}-linux-amd64.tar.gz" \
            -o "$ARCHIVE"
          printf '%s  %s\n' "$AGE_ARCHIVE_SHA256" "$ARCHIVE" | sha256sum -c -
          tar -xzf "$ARCHIVE" -C "$RUNNER_TEMP"
          AGE_BIN="$RUNNER_TEMP/age/age"
          printf '%s  %s\n' "$AGE_BINARY_SHA256" "$AGE_BIN" | sha256sum -c -
          test "$("$AGE_BIN" --version)" = "v${AGE_VERSION}"

          # A chave SSH só pode alcançar o forced command `dump`; container,
          # database, role e argumentos são definidos no helper root da VPS.
          timeout --signal=TERM --kill-after=30s 32m \
            ssh -F "$RUNNER_TEMP/backup-ssh/config" backup-vps dump | gzip -n > "$TMPGZ"
          test "$(stat -c%s "$TMPGZ")" -ge 1024
          gzip -t "$TMPGZ"
          gzip -dc "$TMPGZ" | sed -n '1,20p' | grep -Fq 'PostgreSQL database dump'
          gzip -dc "$TMPGZ" | tail -n 20 | grep -Fq 'PostgreSQL database dump complete'

          OUTFILE="${OUTDIR}/${TIMESTAMP}.sql.gz.age"
          if ! "$AGE_BIN" -R "$RECIPIENT_FILE" -o "$OUTFILE" "$TMPGZ" 2>"$AGE_STDERR"; then
            rm -f -- "$OUTFILE" "$AGE_STDERR"
            echo 'age encryption failed; detail withheld' >&2
            exit 1
          fi
          rm -f -- "$TMPGZ" "$RECIPIENT_FILE" "$AGE_STDERR"
          test -s "$OUTFILE"
          FINAL_SIZE="$(stat -c%s "$OUTFILE")"
          echo "timestamp=${TIMESTAMP}" >> "$GITHUB_OUTPUT"
          echo "outfile=${OUTFILE}" >> "$GITHUB_OUTPUT"
          echo "relative=${OUTFILE#startap-backups/}" >> "$GITHUB_OUTPUT"
          echo "size=${FINAL_SIZE}" >> "$GITHUB_OUTPUT"

      - name: Commit and push encrypted artifact only
        shell: bash
        run: |
          set -Eeuo pipefail
          cd startap-backups
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -- "${{ steps.dump.outputs.relative }}"
          git commit -m "backup: ${{ steps.dump.outputs.timestamp }} UTC ($(numfmt --to=iec ${{ steps.dump.outputs.size }}))"
          export GIT_SSH_COMMAND="ssh -F $RUNNER_TEMP/backup-ssh/config"
          timeout --signal=TERM --kill-after=10s 15m git push origin HEAD:main

      - name: Remove ephemeral SSH material
        if: always()
        shell: bash
        run: |
          rm -f -- "$RUNNER_TEMP/backup-ssh/legacy_dump_ed25519" \
            "$RUNNER_TEMP/backup-ssh/offsite_write_ed25519" \
            "$RUNNER_TEMP/backup-ssh/known_hosts" \
            "$RUNNER_TEMP/backup-ssh/config" \
            "$RUNNER_TEMP/backup-ssh/vps.effective" \
            "$RUNNER_TEMP/backup-ssh/offsite.effective"
          rmdir -- "$RUNNER_TEMP/backup-ssh" 2>/dev/null || true
