services:
  api:
    build:
      context: .
      args:
        APP: api
    container_name: startap-api
    restart: unless-stopped
    env_file: .env
    environment:
      - SERVICE_NAME=api
    networks: [rede_interna]
    depends_on: [redis]
    expose: ["3040"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3040/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    build:
      context: .
      args:
        APP: worker
    container_name: startap-worker
    restart: unless-stopped
    env_file: .env
    environment:
      - SERVICE_NAME=worker
    networks: [rede_interna]
    depends_on: [redis]
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'node ./app/dist/worker.js' > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  portal-api:
    build:
      context: .
      dockerfile: apps/portal-api/Dockerfile
    container_name: startap-portal-api
    restart: unless-stopped
    env_file: .env
    environment:
      - SERVICE_NAME=portal-api
    networks: [rede_interna]
    depends_on: [redis]
    # Nao exposto publicamente (ADR 0012, Decisao 5): so o portal-web (Next) fala
    # com ele pela rede interna. A internet so ve o Next.
    expose: ["3051"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3051/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  portal-web:
    build:
      context: .
      dockerfile: apps/portal-web/Dockerfile
    container_name: startap-portal-web
    restart: unless-stopped
    # Mesmo env_file dos demais; o Next so usa PORTAL_API_URL (rede interna).
    env_file: .env
    environment:
      - SERVICE_NAME=portal-web
      - NODE_ENV=production
      # O Next fala com o portal-api pela rede interna (sem CORS, mesmo dominio
      # publico via NPM). NAO expoe o portal-api a internet.
      - PORTAL_API_URL=http://startap-portal-api:3051
    networks: [rede_interna]
    depends_on: [portal-api]
    # Unico container do portal exposto: o NPM roteia app.startap.tech -> aqui.
    expose: ["3050"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3050/ > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: startap-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning --requirepass ${REDIS_PASSWORD}
    networks: [rede_interna]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  redis_data:

networks:
  rede_interna:
    name: automacoes_rede_interna
    external: true
