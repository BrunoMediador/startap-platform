<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Startap — Login</title>
  <!-- Fontes auto-hospedadas (rebrand Cadência F1) — sem CDN. Servidas de
       /fonts/ (express.static), liberadas no auth-gate por serem públicas. -->
  <link rel="preload" href="/fonts/inter-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/sora-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin />
  <style>
    @font-face { font-family: 'Inter'; font-style: normal; font-weight: 400; font-display: swap; src: url('/fonts/inter-latin-400-normal.woff2') format('woff2'); }
    @font-face { font-family: 'Inter'; font-style: normal; font-weight: 500; font-display: swap; src: url('/fonts/inter-latin-500-normal.woff2') format('woff2'); }
    @font-face { font-family: 'Inter'; font-style: normal; font-weight: 600; font-display: swap; src: url('/fonts/inter-latin-600-normal.woff2') format('woff2'); }
    @font-face { font-family: 'Sora'; font-style: normal; font-weight: 600; font-display: swap; src: url('/fonts/sora-latin-600-normal.woff2') format('woff2'); }
    @font-face { font-family: 'Sora'; font-style: normal; font-weight: 700; font-display: swap; src: url('/fonts/sora-latin-700-normal.woff2') format('woff2'); }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* Tokens Cadência Noturna — espelho do portal globals.css (tema único escuro). */
    :root {
      --c-bg:            #14121c;
      --c-surface:       #1e1b2b;
      --c-surface-sunken:#0f0d17;
      --c-line:          #332e45;
      --c-line-strong:   #433c5c;
      --c-ink:           #f3f1fa;
      --c-ink-soft:      #b4aecb;
      --c-ink-faint:     #807a95;
      --c-brand:         #9a7cf0;
      --c-brand-fill:    #6431d6;
      --c-brand-fill-hover:#5526c0;
      --c-brand-on-fill: #14121c;
      --c-danger:        #ff6b5e;
      --c-danger-soft:   #33161a;
      --radius-card:     22px;
      --radius-field:    12px;
      --font-display: 'Sora', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      --font-sans:    'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    /* Cor-base no html (não no body) — body opaco tamparia o canvas z-index:-1
       (mesmo gotcha do portal). Aqui o canvas é z-index:0 e o conteúdo z-index:2,
       então o body só não pode ter background opaco POR CIMA do canvas. */
    html { background: var(--c-bg); }
    body {
      font-family: var(--font-sans);
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      color: var(--c-ink);
      -webkit-font-smoothing: antialiased;
      position: relative;
      overflow: hidden;
    }

    /* Constelação — full-screen, atrás do conteúdo (z-index:0). */
    #login-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      display: block;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    /* Vinheta — escurece as bordas pra garantir contraste AA do texto sobre as
       partículas (eco do .login-vignette do portal). z-index:1, acima do canvas
       e abaixo do card. */
    .login-vignette {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        radial-gradient(90% 70% at 50% 38%, rgba(20,18,28,0) 35%, rgba(20,18,28,.62) 100%),
        radial-gradient(60% 70% at 18% 25%, rgba(100,49,214,.12) 0%, rgba(20,18,28,0) 70%);
    }

    .brand {
      text-align: center;
      margin-bottom: 22px;
    }
    .brand__dot {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 40px; height: 40px;
      border-radius: 11px;
      background: var(--c-brand-fill);
      box-shadow: 0 0 0 1px rgba(154,124,240,.35), 0 8px 24px rgba(100,49,214,.45);
      margin-bottom: 12px;
    }
    .brand__logo {
      font-family: var(--font-display);
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--c-ink);
      line-height: 1;
    }
    .brand__tagline {
      font-size: 0.75rem;
      color: var(--c-ink-soft);
      margin-top: 8px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 500;
    }

    /* Card escuro que "acende" sobre o fundo vivo (glow contido + filete). */
    .card {
      position: relative;
      z-index: 2;
      background: var(--c-surface);
      border: 1px solid var(--c-line-strong);
      border-radius: var(--radius-card);
      box-shadow:
        0 0 0 1px rgba(154,124,240,.06),
        0 24px 60px rgba(0,0,0,.45),
        0 0 80px rgba(100,49,214,.10);
      padding: 34px 30px 28px;
      width: 100%;
      max-width: 400px;
    }
    .card::before {
      content: "";
      position: absolute;
      left: 30px; right: 30px; top: 0;
      height: 2px;
      border-radius: 0 0 2px 2px;
      background: linear-gradient(90deg, transparent, #9a7cf0 30%, #e0a23c 85%, transparent);
      opacity: 0.55;
    }

    .form__group { margin-bottom: 18px; }
    .form__label {
      display: block;
      font-size: 0.8125rem;
      font-weight: 600;
      color: var(--c-ink);
      margin-bottom: 6px;
    }
    .form__input {
      display: block;
      width: 100%;
      height: 52px;
      padding: 0 14px;
      font-size: 0.9375rem;
      font-family: inherit;
      color: var(--c-ink);
      background: var(--c-surface-sunken);
      border: 1.5px solid var(--c-line-strong);
      border-radius: var(--radius-field);
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .form__input:focus {
      border-color: var(--c-brand);
      box-shadow: 0 0 0 4px rgba(154,124,240,.18);
    }
    .form__input::placeholder { color: var(--c-ink-faint); }

    .btn-submit {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      height: 52px;
      margin-top: 8px;
      font-size: 0.9375rem;
      font-weight: 600;
      font-family: var(--font-display);
      color: var(--c-brand-on-fill);
      background: var(--c-brand-fill);
      border: none;
      border-radius: 13px;
      cursor: pointer;
      box-shadow: 0 8px 22px rgba(154,124,240,.28), 0 0 0 1px rgba(154,124,240,.20);
      transition: background 0.15s, box-shadow 0.15s, transform 0.1s;
    }
    .btn-submit:hover:not(:disabled) {
      background: var(--c-brand-fill-hover);
      box-shadow: 0 10px 28px rgba(154,124,240,.36);
      transform: translateY(-1px);
    }
    .btn-submit:active:not(:disabled) { transform: translateY(0); }
    .btn-submit:disabled { opacity: 0.65; cursor: not-allowed; }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(20,18,28,0.35);
      border-top-color: var(--c-brand-on-fill);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .alert {
      display: none;
      align-items: flex-start;
      gap: 8px;
      padding: 10px 14px;
      border-radius: var(--radius-field);
      font-size: 0.8125rem;
      font-weight: 500;
      line-height: 1.45;
      margin-top: 16px;
    }
    .alert--error {
      background: var(--c-danger-soft);
      border: 1px solid rgba(255,107,94,.4);
      color: var(--c-danger);
    }
    .alert.is-visible { display: flex; }

    .footer {
      margin-top: 28px;
      text-align: center;
      font-size: 0.75rem;
      color: var(--c-ink-faint);
    }

    @media (max-width: 480px) {
      .card { padding: 30px 22px 24px; }
    }
    /* prefers-reduced-motion: o canvas não roda o loop (JS); só corta o spinner. */
    @media (prefers-reduced-motion: reduce) {
      .spinner { animation-duration: 0.001ms; }
    }
  </style>
</head>
<body>
  <!-- Fundo vivo (constelação) + vinheta — decorativo, não interativo. -->
  <canvas id="login-bg" aria-hidden="true" tabindex="-1"></canvas>
  <div class="login-vignette" aria-hidden="true"></div>

  <div class="card" role="main">
    <div class="brand">
      <div class="brand__dot" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2C8 2 4 5.5 4 10c0 3 1.5 5.5 4 7l4 5 4-5c2.5-1.5 4-4 4-7 0-4.5-4-8-8-8z"/>
          <circle cx="12" cy="10" r="3" fill="white" stroke="none"/>
        </svg>
      </div>
      <div class="brand__logo">Startap</div>
      <div class="brand__tagline">Painel de gestão</div>
    </div>

    <form id="loginForm" novalidate>
      <div class="form__group">
        <label class="form__label" for="username">Usuário</label>
        <input
          class="form__input"
          type="text"
          id="username"
          name="username"
          placeholder="admin"
          autocomplete="username"
          required
          autofocus
        />
      </div>

      <div class="form__group">
        <label class="form__label" for="password">Senha</label>
        <input
          class="form__input"
          type="password"
          id="password"
          name="password"
          placeholder="••••••••"
          autocomplete="current-password"
          required
        />
      </div>

      <button class="btn-submit" type="submit" id="submitBtn">
        <span id="btnLabel">Entrar</span>
      </button>

      <div class="alert alert--error" id="errorAlert" role="alert" aria-live="polite">
        <span id="errorMsg"></span>
      </div>
    </form>

    <div class="footer" id="footerVersion"></div>
  </div>

  <script>
    (function () {
      'use strict';

      // ── Login (lógica PRESERVADA da v1): POST /api/login, redirect /, 429/401 ──
      // Lê versão do meta tag injetado pelo servidor (se disponível).
      const verMeta = document.querySelector('meta[name="app-version"]');
      if (verMeta && verMeta.content) {
        document.getElementById('footerVersion').textContent = 'v' + verMeta.content;
      }

      const form      = document.getElementById('loginForm');
      const submitBtn = document.getElementById('submitBtn');
      const errorAlert = document.getElementById('errorAlert');
      const errorMsg  = document.getElementById('errorMsg');

      function showError(msg) {
        errorMsg.textContent = msg;
        errorAlert.classList.add('is-visible');
      }

      function clearError() {
        errorAlert.classList.remove('is-visible');
        errorMsg.textContent = '';
      }

      function setLoading(loading) {
        submitBtn.disabled = loading;
        if (loading) {
          submitBtn.innerHTML = '<div class="spinner"></div><span>Entrando...</span>';
        } else {
          submitBtn.innerHTML = '<span id="btnLabel">Entrar</span>';
        }
      }

      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        clearError();

        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;

        if (!username || !password) {
          showError('Preencha usuário e senha.');
          return;
        }

        setLoading(true);
        try {
          const res = await fetch('/api/login', {
            method: 'POST',
            credentials: 'include',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password }),
          });

          if (res.ok) {
            window.location.href = '/';
            return;
          }

          if (res.status === 429) {
            showError('Muitas tentativas. Aguarde 15 minutos.');
            return;
          }

          let detail = 'Usuário ou senha incorretos.';
          try {
            const data = await res.json();
            if (data && data.error) detail = data.error;
          } catch (_) { /* ignore */ }
          showError(detail);
        } catch (_) {
          showError('Falha na conexão. Verifique sua internet e tente novamente.');
        } finally {
          setLoading(false);
        }
      });

      // Se já autenticado, redireciona direto (evita flash da tela de login).
      fetch('/api/status', { credentials: 'include', method: 'HEAD' })
        .then(function (r) {
          if (r.ok || r.status === 405) {
            window.location.replace('/');
          }
        })
        .catch(function () { /* ignore — não autenticado, fica na tela de login */ });

      // ── Fundo vivo (constelação) — porte JS-puro da ParticleField, variante
      //    'login' (canvas z-0, conteúdo z-2, cursorLink). Mesma vivacidade do
      //    portal. Performance/A11y: Page Visibility, DPR cap, reduced-motion. ──
      (function constellation() {
        const canvas = document.getElementById('login-bg');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        if (!ctx) return;

        const CFG = {
          density: 14000, maxDesktop: 90, maxMobile: 45, minCount: 14,
          speed: 0.32, radiusMin: 1.1, radiusMax: 2.3,
          linkDesktop: 130, linkMobile: 100, pointAlpha: 0.85, lineAlpha: 0.34,
          cursorLink: true,
        };
        const SHARED = { amberEvery: 9, cursorRadius: 160, cursorAlpha: 0.45, dprCap: 2, mobileBreakpoint: 880 };
        const PURPLE = '#9A7CF0', AMBER = '#E0A23C';
        const rand = (min, max) => Math.random() * (max - min) + min;

        const motionQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
        let reduced = motionQuery.matches;
        let W = 0, H = 0, particles = [], rafId = null, running = false, resizeTimer = null;
        const mouse = { x: null, y: null };
        const isMobile = () => window.innerWidth <= SHARED.mobileBreakpoint;

        function targetCount() {
          const cap = isMobile() ? CFG.maxMobile : CFG.maxDesktop;
          return Math.max(CFG.minCount, Math.min(cap, Math.round((W * H) / CFG.density)));
        }
        const linkDist = () => (isMobile() ? CFG.linkMobile : CFG.linkDesktop);

        function makeParticle() {
          const amber = Math.random() < 1 / SHARED.amberEvery;
          const vx = rand(-CFG.speed, CFG.speed) || 0.08;
          const vy = rand(-CFG.speed, CFG.speed) || 0.08;
          return {
            x: Math.random() * W, y: Math.random() * H,
            vx: Math.max(-CFG.speed, Math.min(CFG.speed, vx)),
            vy: Math.max(-CFG.speed, Math.min(CFG.speed, vy)),
            r: rand(CFG.radiusMin, CFG.radiusMax),
            color: amber ? AMBER : PURPLE,
          };
        }
        function build() {
          const n = targetCount();
          particles = [];
          for (let i = 0; i < n; i++) particles.push(makeParticle());
        }
        function resize() {
          const dpr = Math.min(window.devicePixelRatio || 1, SHARED.dprCap);
          W = window.innerWidth; H = window.innerHeight;
          canvas.width = Math.floor(W * dpr); canvas.height = Math.floor(H * dpr);
          canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          build();
          if (reduced) step();
        }
        function step() {
          ctx.clearRect(0, 0, W, H);
          const dist = linkDist();
          for (const p of particles) {
            p.x += p.vx; p.y += p.vy;
            if (p.x < -10) p.x = W + 10; else if (p.x > W + 10) p.x = -10;
            if (p.y < -10) p.y = H + 10; else if (p.y > H + 10) p.y = -10;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fillStyle = p.color; ctx.globalAlpha = CFG.pointAlpha; ctx.fill();
          }
          ctx.globalAlpha = 1;
          const mobile = isMobile();
          for (let a = 0; a < particles.length; a++) {
            const pa = particles[a];
            for (let b = a + 1; b < particles.length; b++) {
              const pb = particles[b];
              const dx = pa.x - pb.x, dy = pa.y - pb.y, d2 = dx * dx + dy * dy;
              if (d2 < dist * dist) {
                const alpha = (1 - Math.sqrt(d2) / dist) * CFG.lineAlpha;
                ctx.strokeStyle = 'rgba(154,124,240,' + alpha.toFixed(3) + ')';
                ctx.lineWidth = 1;
                ctx.beginPath(); ctx.moveTo(pa.x, pa.y); ctx.lineTo(pb.x, pb.y); ctx.stroke();
              }
            }
            if (CFG.cursorLink && mouse.x !== null && mouse.y !== null && !mobile) {
              const mdx = pa.x - mouse.x, mdy = pa.y - mouse.y, md2 = mdx * mdx + mdy * mdy;
              const mr = SHARED.cursorRadius;
              if (md2 < mr * mr) {
                const ma = (1 - Math.sqrt(md2) / mr) * SHARED.cursorAlpha;
                ctx.strokeStyle = 'rgba(224,162,60,' + ma.toFixed(3) + ')';
                ctx.lineWidth = 1;
                ctx.beginPath(); ctx.moveTo(pa.x, pa.y); ctx.lineTo(mouse.x, mouse.y); ctx.stroke();
              }
            }
          }
          ctx.globalAlpha = 1;
        }
        function loop() { if (!running) return; step(); rafId = requestAnimationFrame(loop); }
        function start() { if (reduced || running) return; running = true; loop(); }
        function stop() { running = false; if (rafId !== null) { cancelAnimationFrame(rafId); rafId = null; } }

        document.addEventListener('visibilitychange', () => { if (document.hidden) stop(); else start(); });
        window.addEventListener('mousemove', (e) => { mouse.x = e.clientX; mouse.y = e.clientY; });
        window.addEventListener('mouseleave', () => { mouse.x = null; mouse.y = null; });
        window.addEventListener('resize', () => {
          if (resizeTimer !== null) clearTimeout(resizeTimer);
          resizeTimer = window.setTimeout(() => { resize(); if (reduced) stop(); else start(); }, 150);
        });
        motionQuery.addEventListener('change', (e) => {
          reduced = e.matches;
          if (reduced) { stop(); resize(); } else { resize(); start(); }
        });

        resize();
        if (!reduced) start(); else step();
      })();
    })();
  </script>
</body>
</html>
