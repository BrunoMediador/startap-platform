      <div class="bots-grid" id="group-interno">${skeletonCard}</div>
    </div>
    <div class="bots-group">
      <div class="bots-group-header"><span class="h2">Matrizes — para testes</span><p class="muted">Fluxos base que podem ser clonados por cliente</p></div>
      <div class="bots-grid" id="group-matrizes">${skeletonCard.repeat(3)}</div>
    </div>
    <div class="bots-group">
      <div class="bots-group-header"><span class="h2">Clones — instâncias por cliente</span><p class="muted">Cada clone roda num número de WhatsApp separado</p></div>
      <div id="group-clones"><div class="clones-grid">${'<div class="clone-card"><div class="skeleton" style="height:40px;width:40px;border-radius:8px;margin-bottom:.75rem"></div><div class="skeleton" style="width:140px;margin-bottom:.5rem"></div><div class="skeleton" style="width:80px"></div></div>'.repeat(3)}</div></div>
    </div>`;

  try {
    const [botsRaw, clonesRaw] = await Promise.all([api('/api/bots'), api('/api/clones').catch(() => [])]);
    const bots = Array.isArray(botsRaw) ? botsRaw : (botsRaw.bots || Object.values(botsRaw));
    const clones = Array.isArray(clonesRaw) ? clonesRaw : (clonesRaw.clones || clonesRaw.data || []);

    const interno = bots.filter(b => (b.slot || b.slug) === INTERNAL_BOT_SLOT);
    const matrizes = bots.filter(b => MATRIZ_SLOTS.includes(b.slot || b.slug));

    _renderBotGroup(interno, document.getElementById('group-interno'), false, clones);
    _renderBotGroup(matrizes, document.getElementById('group-matrizes'), true, clones);
    renderBotClones(clones, document.getElementById('group-clones'));
  } catch (err) {
    wrap.innerHTML += `<div class="card"><p class="muted">${icon('alert-triangle',14)} Erro ao carregar bots: ${escapeHtml(err.message)}</p><button class="btn btn--sm" style="margin-top:.75rem" onclick="renderBots()">${icon('refresh-cw',14)} Tentar novamente</button></div>`;
  }
}

function _renderBotGroup(bots, container, showCloneBtn, allClones) {
  if (!bots.length) { container.innerHTML = `<p class="muted">Nenhum bot neste grupo.</p>`; return; }
  const grid = document.createElement('div');
  grid.className = 'bots-grid';

  bots.forEach(bot => {
    const card = document.createElement('div');
    card.className = 'bot-card' + (_selectedBot?.slot === bot.slot ? ' selected' : '');
    card.setAttribute('role', 'button');
    card.setAttribute('tabindex', '0');
    card.setAttribute('aria-label', `Abrir detalhes do bot ${bot.name || bot.slot}`);

    const header = document.createElement('div');
    header.className = 'bot-card__header';
    header.appendChild(botAvatar(bot.slug || bot.slot, 40));

    const isInternal = (bot.slot || bot.slug) === INTERNAL_BOT_SLOT;
    const cloneCount = allClones.filter(c => c.matriz_slot === (bot.slot || bot.slug)).length;
    const meta = document.createElement('div');
    meta.innerHTML = `
      <div class="bot-card__name">${escapeHtml(bot.name || bot.slot)}${isInternal ? ` <span class="badge" style="background:rgba(245,158,11,.18);color:#f59e0b;font-size:.6875rem">Interno</span>` : ''}</div>
      <div class="bot-card__slug">${escapeHtml(bot.slug || bot.slot || '')}${showCloneBtn && cloneCount > 0 ? ` <span class="muted">${cloneCount} clone${cloneCount !== 1 ? 's' : ''} ativo${cloneCount !== 1 ? 's' : ''}</span>` : ''}</div>`;
    header.appendChild(meta);
    card.appendChild(header);

    const st = bot.waha_status || bot.status || '';
    if (st) card.insertAdjacentHTML('beforeend', statusBadge(st));

    const model = bot.model || bot.llm_model || '';
    if (model) card.insertAdjacentHTML('beforeend', `<div class="muted mono">${escapeHtml(model)}</div>`);

    if (showCloneBtn) {
      const cloneBtn = document.createElement('button');
      cloneBtn.className = 'btn btn--accent btn--sm';
      cloneBtn.setAttribute('aria-label', `Clonar matriz ${bot.name || bot.slot}`);
      cloneBtn.innerHTML = `${icon('git-branch', 13)} <span class="btn-label">Clonar este</span>`;
      cloneBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        openCloneWizard(bot.slot || bot.slug);
      });
      card.appendChild(cloneBtn);
    }

    card.addEventListener('click', () => {
      _selectedBot = bot;
      const wrap = document.getElementById('bots-content');
      _renderBotsDetail(bots, wrap, bot);
    });
    card.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') card.click(); });

    grid.appendChild(card);
  });

  container.innerHTML = '';
  container.appendChild(grid);
}

function _renderBotsDetail(bots, wrap, selectedBot) {
  let detail = wrap.querySelector('.bot-detail');
  if (!detail) {
    detail = document.createElement('div');
    wrap.appendChild(detail);
  }
  renderBotDetail(selectedBot, detail);
}

function renderBotsListAndDetail(bots, wrap) {
  if (_selectedBot) _renderBotsDetail(bots, wrap, _selectedBot);
}

function renderBotDetail(bot, container) {
  const slot = bot.slot || bot.slug;
  container.className = 'bot-detail';
  container.innerHTML = `
    <div class="bot-detail__header">
      <div id="bot-detail-avatar"></div>
      <div>
        <div class="bot-detail__title">${escapeHtml(bot.name || slot)}</div>
        <div class="bot-detail__meta">${escapeHtml(bot.slug || slot)} — ${escapeHtml(bot.provider || '')} ${escapeHtml(bot.model || '')}</div>
      </div>
      <div style="margin-left:auto">${statusBadge(bot.waha_status || bot.status || '')}</div>
    </div>
    <div class="tabs" id="bot-tabs" role="tablist">
      <button class="tab-btn${_selectedBotTab === 'overview' ? ' active' : ''}" data-tab="overview" role="tab" aria-selected="${_selectedBotTab === 'overview'}">Visão geral</button>
      <button class="tab-btn${_selectedBotTab === 'prompt' ? ' active' : ''}" data-tab="prompt" role="tab" aria-selected="${_selectedBotTab === 'prompt'}">Prompt</button>
      <button class="tab-btn${_selectedBotTab === 'media' ? ' active' : ''}" data-tab="media" role="tab" aria-selected="${_selectedBotTab === 'media'}">Mídias</button>
      <button class="tab-btn${_selectedBotTab === 'routing' ? ' active' : ''}" data-tab="routing" role="tab" aria-selected="${_selectedBotTab === 'routing'}">Roteamento</button>
      <button class="tab-btn${_selectedBotTab === 'config-ia' ? ' active' : ''}" data-tab="config-ia" role="tab" aria-selected="${_selectedBotTab === 'config-ia'}">Configuração IA</button>
    </div>
    <div id="bot-tab-content"></div>`;

  container.querySelector('#bot-detail-avatar').appendChild(botAvatar(bot.slug || slot, 48));

  container.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      // guard: se aba config-ia tiver mudanças não salvas, confirma antes de navegar
      if (_configIaDirty && btn.dataset.tab !== 'config-ia') {
        if (!window.confirm('Existem mudanças não salvas. Deseja sair mesmo assim?')) return;
        _configIaDirty = false;
      }
      _selectedBotTab = btn.dataset.tab;
      container.querySelectorAll('.tab-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.tab === _selectedBotTab);
        b.setAttribute('aria-selected', b.dataset.tab === _selectedBotTab);
      });
      loadBotTab(slot, _selectedBotTab, container.querySelector('#bot-tab-content'), bot);
    });
  });

  loadBotTab(slot, _selectedBotTab, container.querySelector('#bot-tab-content'), bot);
}

async function loadBotTab(slot, tab, el, bot) {
  el.innerHTML = `<div style="padding:1rem 0"><div class="spinner"></div></div>`;

  if (tab === 'overview') {
    await renderBotOverview(slot, el, bot);
  } else if (tab === 'prompt') {
    await renderBotPrompt(slot, el);
  } else if (tab === 'media') {
    await renderBotMedia(slot, el);
  } else if (tab === 'routing') {
    await renderBotRouting(slot, el, bot);
  } else if (tab === 'config-ia') {
    await renderBotConfigIA(slot, el);
  }
}

async function renderBotOverview(slot, el, bot) {
  el.innerHTML = `
    <form id="bot-overview-form">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem">
        <div class="field">
          <label for="ov-name">Nome</label>
          <input id="ov-name" name="name" value="${escapeHtml(bot.name || '')}" placeholder="Nome do bot" />
        </div>
        <div class="field">
          <label for="ov-provider">Provider</label>
          <select id="ov-provider" name="provider">
            <option value="openai" ${bot.provider === 'openai' ? 'selected' : ''}>OpenAI</option>
            <option value="anthropic" ${bot.provider === 'anthropic' ? 'selected' : ''}>Anthropic</option>
            <option value="groq" ${bot.provider === 'groq' ? 'selected' : ''}>Groq</option>
          </select>
        </div>
        <div class="field">
          <label for="ov-model">Modelo</label>
          <input id="ov-model" name="model" value="${escapeHtml(bot.model || bot.llm_model || '')}" placeholder="ex: gpt-4o-mini" />
        </div>
        <div class="field">
          <label for="ov-temp">Temperatura (0–2)</label>
          <input id="ov-temp" name="temperature" type="number" min="0" max="2" step="0.1" value="${bot.temperature ?? 0.7}" />
        </div>
      </div>
      <button type="submit" class="btn btn--primary">${icon('check-circle-2',14)} Salvar alterações</button>
    </form>`;

  el.querySelector('#bot-overview-form').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const fd = new FormData(ev.target);
    const body = { name: fd.get('name'), provider: fd.get('provider'), model: fd.get('model'), temperature: Number(fd.get('temperature')) };
    const btn = ev.target.querySelector('[type=submit]');
    btn.disabled = true;
    try {
      await api(`/api/bots/${slot}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      toast('Bot atualizado com sucesso!', 'success');
    } catch (err) {
      toast('Erro ao salvar: ' + err.message, 'danger');
    } finally {
      btn.disabled = false;
    }
  });
}

async function renderBotPrompt(slot, el) {
  try {
    const data = await api(`/api/bots/${slot}/prompt`);
    const promptText = data?.prompt || data?.content || data?.system_prompt || '';
    el.innerHTML = `
      <div class="field">
        <label for="prompt-ta">Prompt do sistema</label>
        <textarea id="prompt-ta" rows="16" placeholder="Escreva o prompt de sistema do bot aqui...">${escapeHtml(promptText)}</textarea>
        <div class="char-count"><span id="prompt-count">${promptText.length}</span> caracteres</div>
      </div>
      <button class="btn btn--primary" id="btn-save-prompt" style="margin-top:.75rem">${icon('check-circle-2',14)} Salvar prompt</button>`;

    const ta = el.querySelector('#prompt-ta');
    const count = el.querySelector('#prompt-count');
    ta.addEventListener('input', () => { count.textContent = ta.value.length; });

    el.querySelector('#btn-save-prompt').addEventListener('click', async () => {
      const btn = el.querySelector('#btn-save-prompt');
      btn.disabled = true;
      try {
        await api(`/api/bots/${slot}/prompt`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ prompt: ta.value }) });
        toast('Prompt salvo com sucesso!', 'success');
      } catch (err) {
        toast('Erro ao salvar prompt: ' + err.message, 'danger');
      } finally {
        btn.disabled = false;
      }
    });
  } catch (err) {
    el.innerHTML = `<p class="muted">${icon('alert-triangle',14)} Erro ao carregar prompt: ${escapeHtml(err.message)}</p><button class="btn btn--sm" onclick="loadBotTab('${escapeHtml(slot)}','prompt',this.parentElement)">${icon('refresh-cw',14)} Tentar novamente</button>`;
  }
}

async function renderBotConfigIA(slot, el) {
  /* ── dados iniciais ──────────────────────────────────────── */
  let botData = null;
  let promptData = null;
  let _dirty = false;
  _configIaDirty = false; // reset ao (re)renderizar a aba

  const MODELS_BY_PROVIDER = {
    openai:   ['gpt-4o', 'gpt-4o-mini', 'gpt-4-turbo', 'gpt-3.5-turbo'],
    deepseek: ['deepseek-chat', 'deepseek-reasoner'],
  };

  function markDirty() { _dirty = true; _configIaDirty = true; }

  function confirmLeave() {
    if (_dirty) return window.confirm('Existem mudanças não salvas. Deseja sair mesmo assim?');
    return true;
  }

  /* ── render skeleton ─────────────────────────────────────── */
  el.innerHTML = `<div style="padding:1rem 0"><div class="spinner"></div></div>`;

  try {
    [botData, promptData] = await Promise.all([
      api(`/api/bots/${slot}`),
      api(`/api/bots/${slot}/prompt`).catch(() => ({ prompt: '' })),
    ]);
  } catch (err) {
    el.innerHTML = `<p class="muted">${icon('alert-triangle',14)} Erro ao carregar configurações: ${escapeHtml(err.message)}</p>
      <button class="btn btn--sm" onclick="renderBotConfigIA('${escapeHtml(slot)}',this.parentElement)">${icon('refresh-cw',14)} Tentar novamente</button>`;
    return;
  }

  const currentProvider = botData.provider || 'openai';
  const currentModel    = botData.model || '';
  const currentTemp     = botData.temperature !== undefined ? botData.temperature : 0.5;
  const currentPrompt   = promptData.prompt || '';

  /* ── constrói opções de modelo ───────────────────────────── */
  function buildModelOptions(provider, selectedModel) {
    const known = MODELS_BY_PROVIDER[provider] || [];
    const isCustom = selectedModel && !known.includes(selectedModel);
    let html = known.map(m => `<option value="${escapeHtml(m)}" ${m === selectedModel ? 'selected' : ''}>${escapeHtml(m)}</option>`).join('');
    html += `<option value="__custom__" ${isCustom ? 'selected' : ''}>Outro (personalizado)...</option>`;
    return html;
  }

  /* ── markup ──────────────────────────────────────────────── */
  el.innerHTML = `
    <div class="config-ia-wrap">

      <!-- Bloco: Prompt -->
      <div style="margin-bottom:var(--space-6)">
        <div class="label" style="margin-bottom:var(--space-3)">Prompt de sistema</div>
        <div class="field">
          <textarea id="cia-prompt" rows="20"
            style="font-family:ui-monospace,monospace;font-size:13px;resize:vertical"
            placeholder="Escreva aqui o prompt de sistema do bot...">${escapeHtml(currentPrompt)}</textarea>
          <div class="char-count"><span id="cia-prompt-count">${currentPrompt.length}</span> caracteres</div>
        </div>
        <div style="display:flex;align-items:center;gap:var(--space-3);margin-top:var(--space-3);flex-wrap:wrap">
          <button class="btn btn--primary" id="btn-save-prompt-ia">${icon('check-circle-2',14)} Salvar prompt</button>
          <button class="btn btn--ghost btn--sm" id="btn-reload-ia">${icon('refresh-cw',14)} Recarregar do servidor</button>
          <span class="subtle" style="margin-left:auto">Mudanças aplicam em até 30s — testes em andamento podem demorar</span>
        </div>
      </div>

      <!-- Bloco: Modelo e Parâmetros -->
      <div>
        <div class="label" style="margin-bottom:var(--space-3)">Modelo e parâmetros</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--space-4);margin-bottom:var(--space-4)">
          <div class="field">
            <label for="cia-provider">Provider</label>
            <select id="cia-provider">
              <option value="openai"   ${currentProvider === 'openai'   ? 'selected' : ''}>OpenAI</option>
              <option value="deepseek" ${currentProvider === 'deepseek' ? 'selected' : ''}>DeepSeek</option>
            </select>
          </div>
          <div class="field">
            <label for="cia-model">Modelo</label>
            <select id="cia-model">${buildModelOptions(currentProvider, currentModel)}</select>
          </div>
        </div>
        <div id="cia-custom-model-wrap" style="display:${(MODELS_BY_PROVIDER[currentProvider]||[]).includes(currentModel)?'none':'block'};margin-bottom:var(--space-4)">
          <div class="field">
            <label for="cia-model-custom">Modelo personalizado</label>
            <input id="cia-model-custom" type="text" placeholder="ex: gpt-4o-2024-11-20"
              value="${escapeHtml((MODELS_BY_PROVIDER[currentProvider]||[]).includes(currentModel) ? '' : currentModel)}" />
          </div>
        </div>
        <div class="field" style="max-width:360px;margin-bottom:var(--space-4)">
          <label for="cia-temp">Temperatura — <span id="cia-temp-val">${currentTemp}</span></label>
          <input id="cia-temp" type="range" min="0" max="2" step="0.1" value="${currentTemp}" style="width:100%;accent-color:var(--primary)" />
          <div style="display:flex;justify-content:space-between">
            <span class="subtle">0 (determinístico)</span>
            <span class="subtle">2 (criativo)</span>
          </div>
        </div>
        <div style="display:flex;gap:var(--space-3);flex-wrap:wrap">
          <button class="btn btn--primary" id="btn-save-config-ia">${icon('check-circle-2',14)} Salvar configuração</button>
        </div>
        <p class="subtle" style="margin-top:var(--space-3)">Mudanças de modelo e temperatura aplicam em até 60s nos próximos messages do bot</p>
      </div>
    </div>`;

  /* ── refs ────────────────────────────────────────────────── */
  const taPrompt       = el.querySelector('#cia-prompt');
  const promptCount    = el.querySelector('#cia-prompt-count');
  const selProvider    = el.querySelector('#cia-provider');
  const selModel       = el.querySelector('#cia-model');
  const customWrap     = el.querySelector('#cia-custom-model-wrap');
  const inputCustom    = el.querySelector('#cia-model-custom');
  const rangeTemp      = el.querySelector('#cia-temp');
  const spanTemp       = el.querySelector('#cia-temp-val');
  const btnSavePrompt  = el.querySelector('#btn-save-prompt-ia');
  const btnSaveConfig  = el.querySelector('#btn-save-config-ia');
  const btnReload      = el.querySelector('#btn-reload-ia');

  /* ── interações ──────────────────────────────────────────── */
  taPrompt.addEventListener('input', () => {
    promptCount.textContent = taPrompt.value.length;
    markDirty();
  });

  rangeTemp.addEventListener('input', () => {
    spanTemp.textContent = rangeTemp.value;
    markDirty();
  });

  selProvider.addEventListener('change', () => {
    const prov = selProvider.value;
    selModel.innerHTML = buildModelOptions(prov, '');
    customWrap.style.display = 'none';
    inputCustom.value = '';
    markDirty();
  });

  selModel.addEventListener('change', () => {
    const isCustom = selModel.value === '__custom__';
    customWrap.style.display = isCustom ? 'block' : 'none';
    if (!isCustom) inputCustom.value = '';
    markDirty();
  });

  inputCustom.addEventListener('input', markDirty);

  /* ── helpers ─────────────────────────────────────────────── */
  function resolvedModel() {
    return selModel.value === '__custom__' ? inputCustom.value.trim() : selModel.value;
  }

  /* ── salvar prompt ───────────────────────────────────────── */
  btnSavePrompt.addEventListener('click', async () => {
    const promptVal = taPrompt.value;
    if (!promptVal.trim()) { toast('Prompt não pode estar vazio.', 'danger'); return; }
    btnSavePrompt.disabled = true;
    try {
      await api(`/api/bots/${slot}/prompt`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prompt: promptVal }),
      });
      _dirty = false; _configIaDirty = false;
      toast('Prompt salvo — aplica em até 30s nos próximos messages do bot', 'success');
    } catch (err) {
      toast('Erro ao salvar prompt: ' + escapeHtml(err.message), 'danger');
    } finally {
      btnSavePrompt.disabled = false;
    }
  });

  /* ── salvar configuração ─────────────────────────────────── */
  btnSaveConfig.addEventListener('click', async () => {
    const model = resolvedModel();
    if (!model) { toast('Selecione ou informe um modelo.', 'danger'); return; }
    btnSaveConfig.disabled = true;
    try {
      await api(`/api/bots/${slot}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          provider: selProvider.value,
          model,
          temperature: Number(rangeTemp.value),
        }),
      });
      _dirty = false; _configIaDirty = false;
      toast('Configuração salva — aplica em até 60s nos próximos messages do bot', 'success');
    } catch (err) {
      toast('Erro ao salvar configuração: ' + escapeHtml(err.message), 'danger');
    } finally {
      btnSaveConfig.disabled = false;
    }
  });

  /* ── recarregar ──────────────────────────────────────────── */
  btnReload.addEventListener('click', () => {
    if (confirmLeave()) {
      _dirty = false; _configIaDirty = false;
      renderBotConfigIA(slot, el);
    }
  });
  // guard de saída via navegação de abas é tratado no handler de .tab-btn
  // no escopo de renderBotDetail (usa _configIaDirty global)
}

async function renderBotMedia(slot, el) {
  try {
    const medias = await api(`/api/bots/${slot}/media`);
    const arr = Array.isArray(medias) ? medias : (medias.media || medias.items || []);

    const addBtn = `<button class="btn btn--primary" id="btn-add-media" aria-label="Adicionar mídia">${icon('plus',14)} Adicionar mídia</button>`;

    if (!arr.length) {
      el.innerHTML = `<div class="empty-state">${icon('inbox',36)}<div class="empty-state__title">Sem mídias</div><p class="empty-state__text">Nenhuma mídia cadastrada para este bot.</p>${addBtn}</div>`;
    } else {
      const grid = document.createElement('div');
      grid.className = 'media-grid';
      arr.forEach(m => grid.appendChild(buildMediaCard(m, slot, el)));
      el.innerHTML = `<div style="display:flex;justify-content:flex-end;margin-bottom:.75rem">${addBtn}</div>`;
      el.appendChild(grid);
    }

    el.querySelector('#btn-add-media').addEventListener('click', () => openAddMediaModal(slot, el));
  } catch (err) {
    el.innerHTML = `<p class="muted">${icon('alert-triangle',14)} Erro ao carregar mídias: ${escapeHtml(err.message)}</p><button class="btn btn--sm" onclick="renderBotMedia('${escapeHtml(slot)}',this.parentElement)">${icon('refresh-cw',14)} Tentar novamente</button>`;
  }
}

function buildMediaCard(m, slot, parentEl) {
  const card = document.createElement('div');
  card.className = 'media-card';
  const preview = renderMediaPreview(m);
  card.appendChild(preview);

  const info = document.createElement('div');
  info.className = 'media-card__info';
  const name = document.createElement('span');
  name.className = 'media-card__name';
  name.textContent = m.filename || m.name || m.title || 'Mídia';
  info.appendChild(name);

  const delBtn = document.createElement('button');
  delBtn.className = 'btn btn--ghost btn--sm btn--icon';
  delBtn.setAttribute('aria-label', 'Excluir mídia');
  delBtn.innerHTML = icon('trash-2', 14);
  delBtn.style.color = 'var(--danger)';
  delBtn.addEventListener('click', async () => {
    if (!confirm(`Excluir "${m.filename || m.name || 'esta mídia'}"?`)) return;
    delBtn.disabled = true;
    try {
      await api(`/api/media/${m.id}`, { method: 'DELETE' });
      toast('Mídia excluída.', 'success');
      await renderBotMedia(slot, parentEl);
    } catch (err) {
      toast('Erro ao excluir: ' + err.message, 'danger');
      delBtn.disabled = false;
    }
  });
  info.appendChild(delBtn);
  card.appendChild(info);
  return card;
}

function openAddMediaModal(slot, parentEl) {
  openModal(`
    <div class="modal__header">
      <span class="modal__title">Adicionar mídia</span>
      <button class="btn btn--ghost btn--icon" onclick="closeModal()" aria-label="Fechar">${icon('x', 16)}</button>
    </div>
    <div id="upload-status" style="margin-bottom:.75rem"></div>
    <label class="upload-area" for="media-file-input">
      <input type="file" id="media-file-input" accept="image/*,video/*,audio/*,.pdf,.doc,.docx" />
      ${icon('upload-cloud', 32)}
      <p style="margin:.5rem 0 0">Clique para selecionar ou arraste o arquivo</p>
      <p class="muted" style="margin:.25rem 0 0">Imagem, vídeo, áudio ou documento</p>
    </label>
    <button class="btn btn--primary" id="btn-do-upload" style="margin-top:1rem;width:100%" disabled>${icon('upload-cloud',14)} Enviar</button>
  `);

  const fileInput = document.getElementById('media-file-input');
  const uploadBtn = document.getElementById('btn-do-upload');
  const statusDiv = document.getElementById('upload-status');

  fileInput.addEventListener('change', () => {
    uploadBtn.disabled = !fileInput.files.length;
  });

  uploadBtn.addEventListener('click', async () => {
    if (!fileInput.files.length) return;
    uploadBtn.disabled = true;
    statusDiv.innerHTML = `<div style="display:flex;align-items:center;gap:.5rem"><div class="spinner"></div> Enviando…</div>`;
    try {
      const fd = new FormData();
      fd.append('file', fileInput.files[0]);
      const uploaded = await api('/api/uploads/media', { method: 'POST', body: fd });
      const fileId = uploaded.id || uploaded.file_id || uploaded.filename;

      await api(`/api/bots/${slot}/media`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ file_id: fileId, filename: fileInput.files[0].name }),
      });

      toast('Mídia adicionada com sucesso!', 'success');
      closeModal();
      await renderBotMedia(slot, parentEl);
    } catch (err) {
      statusDiv.innerHTML = `<p class="muted" style="color:var(--danger)">${icon('alert-triangle',14)} ${escapeHtml(err.message)}</p>`;
      uploadBtn.disabled = false;
    }
  });
}

async function renderBotRouting(slot, el, bot) {
  try {
    const [routingData, workflowsData] = await Promise.all([
      api('/api/routing'),
      api('/api/workflows'),
    ]);
    const routes = Array.isArray(routingData) ? routingData : (routingData.routes || routingData.rules || []);
    const workflows = Array.isArray(workflowsData) ? workflowsData : (workflowsData.workflows || workflowsData.data || []);

    const botWorkflow = workflows.find(w => w.bot_slot === slot || w.slug === slot);
    const botRoutes = botWorkflow
      ? routes.filter(r => r.workflow_id === botWorkflow.id || r.bot_slot === slot)
      : routes.filter(r => r.bot_slot === slot);

    // Apenas workflows roteáveis disponíveis no select
    const routableWorkflows = workflows.filter(w => w.routable);

    const listHtml = botRoutes.length
      ? `<div class="card-flat" style="padding:0;margin-bottom:.875rem">
          <div style="padding:.875rem 1rem;border-bottom:1px solid var(--border)">
            <span class="label">${botRoutes.length} acesso${botRoutes.length !== 1 ? 's' : ''} vinculado${botRoutes.length !== 1 ? 's' : ''}</span>
          </div>
          <div style="padding:.5rem 1rem">
            ${botRoutes.map(r => `
              <div class="routing-row">
                <code class="routing-row__pattern">${escapeHtml(r.telefone || r.pattern || r.keyword || r.trigger || '*')}</code>
                ${r.nome_cliente ? `<span class="routing-row__target">${escapeHtml(r.nome_cliente)}</span>` : ''}
                <span class="routing-row__target">${icon('chevron-right', 12)} ${escapeHtml(r.workflow_name || r.target || r.workflow || r.action || '—')}</span>
              </div>`).join('')}
          </div>
        </div>`
      : `<div class="empty-state" style="padding:1rem 0">
          ${icon('users',28)}<div class="empty-state__title">Sem acessos</div>
          <p class="empty-state__text">Adicione um telefone abaixo para liberar acesso ao teste.</p>
        </div>`;

    const workflowOptions = routableWorkflows
      .map(w => `<option value="${escapeHtml(w.id)}" ${botWorkflow && w.id === botWorkflow.id ? 'selected' : ''}>${escapeHtml(w.name)}</option>`)
      .join('');

    el.innerHTML = `
      ${listHtml}
      <div class="card-flat" style="padding:.875rem 1rem">
        <p class="label" style="margin-bottom:.75rem">${icon('user-plus',14)} Liberar acesso</p>
        <div style="display:flex;flex-direction:column;gap:.5rem">
          <div class="field">
            <label for="routing-tel-${slot}">Telefone <span style="color:var(--danger)">*</span></label>
            <input id="routing-tel-${slot}" type="tel" placeholder="5511999990000" maxlength="15"
              style="font-family:var(--font-mono,monospace)" />
          </div>
          <div class="field">
            <label for="routing-nome-${slot}">Nome do cliente (opcional)</label>
            <input id="routing-nome-${slot}" type="text" placeholder="Ex: João da Silva" maxlength="80" />
          </div>
          <div class="field">
            <label for="routing-wf-${slot}">Router de teste <span style="color:var(--danger)">*</span></label>
            <select id="routing-wf-${slot}">
              ${workflowOptions || '<option value="">— nenhum router disponível —</option>'}
            </select>
          </div>
          <button id="routing-add-btn-${slot}" class="btn btn--primary btn--sm" style="align-self:flex-start">
            ${icon('plus',13)} Adicionar acesso
          </button>
        </div>
      </div>`;

    document.getElementById(`routing-add-btn-${slot}`)?.addEventListener('click', async () => {
      const telRaw = (document.getElementById(`routing-tel-${slot}`)?.value || '').replace(/\D/g, '');
      const nome = (document.getElementById(`routing-nome-${slot}`)?.value || '').trim();
      const workflowId = document.getElementById(`routing-wf-${slot}`)?.value;

      if (!telRaw || telRaw.length < 10) {
        toast('Informe um telefone válido (mínimo 10 dígitos)', 'warning');
        return;
      }
      if (!workflowId) {
        toast('Selecione um router de teste', 'warning');
        return;
      }

      const btn = document.getElementById(`routing-add-btn-${slot}`);
      if (btn) btn.disabled = true;

      try {
        await api('/api/routing', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ telefone: telRaw, workflow_id: workflowId, nome_cliente: nome || undefined }),
        });
        toast('Acesso liberado com sucesso!', 'success');
        // Recarrega a seção para refletir o novo registro
        await renderBotRouting(slot, el, bot);
      } catch (err) {
        const msg = err.message || 'Erro desconhecido';
        toast('Erro: ' + msg, 'danger');
        if (btn) btn.disabled = false;
      }
    });

  } catch (err) {
    el.innerHTML = `<p class="muted">${icon('alert-triangle',14)} Erro ao carregar roteamento: ${escapeHtml(err.message)}</p>`;
  }
}

function openDrawer(html) {
  document.getElementById('drawer-inner').innerHTML = html;
  document.getElementById('drawer').classList.add('open');
  document.getElementById('drawer-backdrop').classList.add('open');
}
function closeDrawer() {
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('drawer-backdrop').classList.remove('open');
  document.getElementById('drawer-inner').innerHTML = '';
}
document.getElementById('drawer-backdrop').addEventListener('click', closeDrawer);

   EXECUÇÕES
   ══════════════════════════════════════════════════════════════════ */
let _execSSE = null;
let _execFilters = { hours: '24', status: '', bot: '', q: '' };
let _execLogs = [];

function maskPhone(p) {
  const s = String(p || '');
  if (s.length < 6) return s || '—';
  return s.slice(0, 4) + '****' + s.slice(-2);
}

function fmtDuration(ms) {
  if (!ms && ms !== 0) return '—';
  if (ms < 1000) return ms + 'ms';
  return (ms / 1000).toFixed(1) + 's';
}

function execStatusBadge(st) {
  const map = {
    success:    'badge--success',
    error:      'badge--danger',
    running:    'badge--warning',
    ignored:    'badge--muted',
  };
  const labels = { success:'Sucesso', error:'Erro', running:'Em andamento', ignored:'Ignorado' };
  const key = (st || '').toLowerCase();
  const cls = map[key] || 'badge--muted';
  const lbl = labels[key] || escapeHtml(st || '—');
  return `<span class="badge badge--dot ${cls}">${lbl}</span>`;
}

function execStatusIcon(st) {
  const key = (st || '').toLowerCase();
  if (key === 'success') return `<span style="color:var(--success)">${icon('check-circle-2', 14)}</span>`;
  if (key === 'error')   return `<span style="color:var(--danger)">${icon('alert-triangle', 14)}</span>`;
  if (key === 'running') return `<span style="color:var(--warning)">${icon('activity', 14)}</span>`;
  return `<span style="color:var(--text-subtle)">${icon('minus', 14)}</span>`;
}

function buildExecRow(e) {
  const tr = document.createElement('tr');
  tr.style.cursor = 'pointer';
  const phone = maskPhone(e.telefone || e.phone || e.from || '');
  const dur = fmtDuration(e.duration_ms || e.duration || null);
  const msg = escapeHtml((e.mensagem || e.message || e.event_type || '').slice(0, 60));
  tr.innerHTML = `
    <td>${execStatusIcon(e.status)}</td>
    <td class="mono">${escapeHtml(fmtDate(e.created_at || e.timestamp))}</td>
    <td><div style="display:flex;align-items:center;gap:.375rem">${botAvatar(e.flow_id || e.workflow_id || e.bot || 'bot', 20).outerHTML}<span class="mono" style="font-size:.75rem">${escapeHtml((e.flow_id || e.workflow_id || '—').slice(0,16))}</span></div></td>
    <td><span class="badge badge--muted" style="font-family:var(--font-mono)">${escapeHtml(e.event_type || '—')}</span></td>
    <td class="mono">${escapeHtml(phone)}</td>
    <td class="mono">${escapeHtml(dur)}</td>
    <td style="max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-muted)">${msg}</td>`;

  tr.addEventListener('click', () => {
    const meta = e.metadata || e.meta || {};
    openDrawer(`
      <div class="drawer__header">
        <span class="drawer__title">Detalhe da execução</span>
        <button class="btn btn--ghost btn--icon" onclick="closeDrawer()" aria-label="Fechar">${icon('x', 16)}</button>
      </div>
      <div class="drawer__body">
        <div style="display:flex;flex-direction:column;gap:.75rem">
          <div>${execStatusBadge(e.status)}</div>
          <div class="field"><label>Horário</label><div class="mono">${escapeHtml(fmtDate(e.created_at || e.timestamp))}</div></div>
          <div class="field"><label>Flow</label><div class="mono">${escapeHtml(e.flow_id || e.workflow_id || '—')}</div></div>
          <div class="field"><label>Evento</label><div class="mono">${escapeHtml(e.event_type || '—')}</div></div>
          <div class="field"><label>Telefone</label><div class="mono">${escapeHtml(e.telefone || e.phone || e.from || '—')}</div></div>
          <div class="field"><label>Duração</label><div class="mono">${escapeHtml(fmtDuration(e.duration_ms || e.duration || null))}</div></div>
          ${e.error_summary ? `<div class="field"><label>Erro</label><div class="mono" style="color:var(--danger)">${escapeHtml(e.error_summary)}</div></div>` : ''}
          ${e.mensagem || e.message ? `<div class="field"><label>Mensagem</label><div class="mono">${escapeHtml(e.mensagem || e.message)}</div></div>` : ''}
          <div class="field"><label>Metadata</label><pre>${escapeHtml(JSON.stringify(meta, null, 2))}</pre></div>
        </div>
      </div>`);
  });
  return tr;
}

function renderExecTable(logs) {
  if (!logs.length) {
    return `<div class="empty-state">${icon('inbox', 36)}<div class="empty-state__title">Nenhuma execução no período</div><p class="empty-state__text">Ajuste os filtros ou aguarde novas execuções.</p></div>`;
  }
  const rows = logs.map(e => buildExecRow(e).outerHTML).join('');
  return `<div class="table-wrap"><table class="table">
    <thead><tr>
      <th style="width:32px"></th>
      <th>Hora</th><th>Flow</th><th>Evento</th><th>Telefone</th><th>Duração</th><th>Mensagem</th>
    </tr></thead>
    <tbody>${rows}</tbody>
  </table></div>`;
}

async function loadExecData() {
  const sec = document.querySelector('#sec-execucoes');
  const tableWrap = sec.querySelector('#exec-table-wrap');
  const kpiWrap   = sec.querySelector('#exec-kpis');
  if (!tableWrap) return;

  tableWrap.innerHTML = `<div class="skeleton-block" style="height:220px"></div>`;
  kpiWrap.innerHTML   = `<div class="kpi-grid">${'<div class="kpi-card"><div class="skeleton" style="height:28px;width:80px;margin-bottom:.5rem"></div><div class="skeleton" style="width:80px"></div></div>'.repeat(4)}</div>`;

  const { hours, status, bot, q } = _execFilters;
  const params = new URLSearchParams();
  if (hours)  params.set('hours',  hours);
  if (status) params.set('status', status);
  if (bot)    params.set('bot',    bot);
  if (q)      params.set('q',      q);
  const qs = params.toString() ? '?' + params.toString() : '';

  try {
    const [logs, summary] = await Promise.allSettled([
      api('/api/flow-logs' + qs),
      api('/api/flow-logs/summary' + qs),
    ]);

    const arr = logs.status === 'fulfilled' ? (Array.isArray(logs.value) ? logs.value : (logs.value?.data || logs.value?.logs || [])) : [];
    _execLogs = arr;

    const sum = summary.status === 'fulfilled' ? summary.value : {};
    const total   = sum?.total   ?? arr.length;
    const success = sum?.success ?? arr.filter(e => (e.status || '').toLowerCase() === 'success').length;
    const errors  = sum?.errors  ?? arr.filter(e => (e.status || '').toLowerCase() === 'error').length;
    const rate    = total > 0 ? Math.round((success / total) * 100) : 0;
    const rateColor = rate >= 90 ? 'var(--success)' : rate >= 70 ? 'var(--warning)' : 'var(--danger)';

    kpiWrap.innerHTML = `<div class="kpi-grid">
      <div class="kpi-card"><div class="kpi-card__icon" style="background:var(--info-bg);color:var(--info)">${icon('activity',18)}</div><div class="kpi-card__value">${fmtNum(total)}</div><div class="kpi-card__label">Total</div></div>
      <div class="kpi-card"><div class="kpi-card__icon" style="background:var(--success-bg);color:var(--success)">${icon('check-circle-2',18)}</div><div class="kpi-card__value">${fmtNum(success)}</div><div class="kpi-card__label">Sucesso</div></div>
      <div class="kpi-card"><div class="kpi-card__icon" style="background:var(--danger-bg);color:var(--danger)">${icon('alert-triangle',18)}</div><div class="kpi-card__value">${fmtNum(errors)}</div><div class="kpi-card__label">Erros</div></div>
      <div class="kpi-card"><div class="kpi-card__icon" style="background:var(--warning-bg);color:var(--warning)">${icon('zap',18)}</div><div class="kpi-card__value" style="color:${rateColor}">${rate}%</div><div class="kpi-card__label">Taxa de sucesso</div></div>
    </div>`;

    // Re-render rows with real DOM nodes so event listeners work
    if (!arr.length) {
      tableWrap.innerHTML = `<div class="empty-state">${icon('inbox',36)}<div class="empty-state__title">Nenhuma execução no período</div><p class="empty-state__text">Ajuste os filtros ou aguarde novas execuções.</p></div>`;
    } else {
      const tableEl = document.createElement('div');
      tableEl.className = 'table-wrap';
      const tbl = document.createElement('table');
      tbl.className = 'table';
      tbl.innerHTML = `<thead><tr><th style="width:32px"></th><th>Hora</th><th>Flow</th><th>Evento</th><th>Telefone</th><th>Duração</th><th>Mensagem</th></tr></thead>`;
      const tbody = document.createElement('tbody');
      arr.forEach(e => tbody.appendChild(buildExecRow(e)));
      tbl.appendChild(tbody);
      tableEl.appendChild(tbl);
      tableWrap.innerHTML = '';
      tableWrap.appendChild(tableEl);
    }
  } catch (err) {
    tableWrap.innerHTML = `<div class="card"><p class="muted">${icon('alert-triangle',14)} Erro: ${escapeHtml(err.message)}</p><button class="btn btn--sm" style="margin-top:.5rem" onclick="loadExecData()">${icon('refresh-cw',14)} Tentar novamente</button></div>`;
  }
}

function startExecSSE(liveBtn) {
  if (_execSSE) return;
  _execSSE = new EventSource('/api/flow-logs/stream');
  _execSSE.onmessage = (ev) => {
    try {
      const e = JSON.parse(ev.data);
      const tbody = document.querySelector('#sec-execucoes .table tbody');
      if (tbody) {
        const firstRow = buildExecRow(e);
        tbody.insertBefore(firstRow, tbody.firstChild);
        // Trim to 100
        while (tbody.children.length > 100) tbody.removeChild(tbody.lastChild);
      }
    } catch (_) {}
  };
  _execSSE.onerror = () => { stopExecSSE(liveBtn); };
  liveBtn.classList.add('btn--success');
  liveBtn.innerHTML = `<span class="live-dot"></span> Ao vivo`;
}

function stopExecSSE(liveBtn) {
  if (_execSSE) { _execSSE.close(); _execSSE = null; }
  liveBtn.classList.remove('btn--success');
  liveBtn.innerHTML = `${icon('activity', 14)} Ao vivo`;
}

async function renderExecucoes() {
  const sec = document.querySelector('#sec-execucoes');
  sec.innerHTML = `
    <div class="section-header">
      <div class="section-header__left">
        <h1 class="h1">Execuções</h1>
        <p class="muted">Log de execuções dos bots</p>
      </div>
    </div>
    <div class="filter-bar" id="exec-filter-bar">
      <div class="pill-group" id="exec-period-pills">
        <button class="pill" data-h="1">1h</button>
        <button class="pill" data-h="6">6h</button>
        <button class="pill active" data-h="24">24h</button>
        <button class="pill" data-h="168">7d</button>
      </div>
      <select id="exec-filter-status" aria-label="Filtrar por status" style="width:auto;flex:0 0 auto">
        <option value="">Todos os status</option>
        <option value="success">Sucesso</option>
        <option value="error">Erro</option>
        <option value="running">Em andamento</option>
        <option value="ignored">Ignorado</option>
      </select>
      <select id="exec-filter-bot" aria-label="Filtrar por bot" style="width:auto;flex:0 0 auto">
        <option value="">Todos os bots</option>
      </select>
      <input type="text" id="exec-search" placeholder="Buscar…" aria-label="Busca livre" style="max-width:180px" />
      <button class="btn btn--sm" id="exec-live-btn" aria-label="Ativar monitoramento ao vivo">${icon('activity',14)} Ao vivo</button>
      <button class="btn btn--sm btn--ghost btn--icon" id="exec-refresh-btn" aria-label="Recarregar execuções">${icon('refresh-cw',14)}</button>
    </div>
    <div id="exec-kpis"></div>
    <div id="exec-table-wrap"><div class="skeleton-block" style="height:220px"></div></div>`;

  // Populate bot filter
  try {
    const wfs = await api('/api/workflows');
    const arr = Array.isArray(wfs) ? wfs : (wfs.workflows || wfs.data || []);
    const sel = sec.querySelector('#exec-filter-bot');
    arr.forEach(w => {
      const opt = document.createElement('option');
      opt.value = w.workflow_id || w.id || w.slug || w.name;
      opt.textContent = w.name || w.workflow_id || w.id;
      sel.appendChild(opt);
    });
  } catch (_) {}

  // Period pills
  sec.querySelector('#exec-period-pills').addEventListener('click', (ev) => {
    const btn = ev.target.closest('.pill');
    if (!btn) return;
    sec.querySelectorAll('#exec-period-pills .pill').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    _execFilters.hours = btn.dataset.h;
    loadExecData();
  });

  // Filters
  sec.querySelector('#exec-filter-status').addEventListener('change', (ev) => { _execFilters.status = ev.target.value; loadExecData(); });
  sec.querySelector('#exec-filter-bot').addEventListener('change', (ev) => { _execFilters.bot = ev.target.value; loadExecData(); });
  let _execDebounce;
  sec.querySelector('#exec-search').addEventListener('input', (ev) => {
    clearTimeout(_execDebounce);
    _execDebounce = setTimeout(() => { _execFilters.q = ev.target.value; loadExecData(); }, 450);
  });

  // Live toggle
  const liveBtn = sec.querySelector('#exec-live-btn');
  liveBtn.addEventListener('click', () => {
    if (_execSSE) stopExecSSE(liveBtn); else startExecSSE(liveBtn);
  });

  // Refresh
  sec.querySelector('#exec-refresh-btn').addEventListener('click', loadExecData);

  loadExecData();
}

/* ══════════════════════════════════════════════════════════════════
   RELATÓRIOS

const COL_LABELS = {
  id: 'ID', nome: 'Nome', telefone: 'Telefone', telefone_masked: 'Telefone',
  mensagem_inicial: 'Mensagem', origem: 'Origem', criado_em: 'Criado em',
  created_at: 'Criado em', updated_at: 'Atualizado em',
  servico: 'Serviço', data_solicitada: 'Data solicitada',
  status: 'Status', date: 'Data', count: 'Mensagens', total: 'Total',
  slot: 'Origem (slot)', _table: 'Tabela',
};

function colLabel(k) { return COL_LABELS[k] || k.replace(/_/g,' ').replace(/\b\w/g, c => c.toUpperCase()); }

function renderGenericTable(rows, hideCols = []) {
  if (!rows || !rows.length) return `<div class="empty-state">${icon('inbox',36)}<div class="empty-state__title">Nenhum registro encontrado</div></div>`;
  const keys = Object.keys(rows[0]).filter(k => !hideCols.includes(k));
  const thead = keys.map(k => `<th>${escapeHtml(colLabel(k))}</th>`).join('');
  const tbody = rows.map(r => `<tr>${keys.map(k => {
    const v = r[k];
    const isDate = k.endsWith('_at') || k === 'criado_em' || k === 'data_solicitada';
    const display = isDate ? fmtDate(v) : escapeHtml(String(v ?? '—'));
    const isMono = k === 'id' || k === 'telefone' || k === 'telefone_masked';
    return `<td${isMono ? ' class="mono"' : ''}>${display}</td>`;
  }).join('')}</tr>`).join('');
  return `<div class="table-wrap"><table class="table"><thead><tr>${thead}</tr></thead><tbody>${tbody}</tbody></table></div>`;
}

function renderBarChart(data) {
  if (!data || !data.length) return `<div class="empty-state">${icon('bar-chart-2',36)}<div class="empty-state__title">Sem dados no período</div></div>`;
  const max = Math.max(...data.map(d => d.count || d.total || 0), 1);
  const cols = data.map(d => {
    const val = d.count || d.total || 0;
    const pct  = Math.round((val / max) * 100);
    const lbl  = (() => { try { const dt = new Date(d.date || d.day || d.created_at); return `${String(dt.getDate()).padStart(2,'0')}/${String(dt.getMonth()+1).padStart(2,'0')}`; } catch(_){return d.date||'';} })();
    return `<div class="bar-chart__col">
      <span class="bar-chart__val">${val}</span>
      <div class="bar-chart__bar" style="height:${pct}%;min-height:2px" title="${val} mensagens"></div>
      <span class="bar-chart__lbl">${escapeHtml(lbl)}</span>
    </div>`;
  }).join('');
  return `<div class="bar-chart">${cols}</div>`;
}

async function loadCfgFluxos(content) {
  try {
    const [wfsData, routingData] = await Promise.allSettled([
      api('/api/workflows'),
      _cfgRoutingCache ? Promise.resolve(_cfgRoutingCache) : api('/api/routing'),
    ]);
    const wfs = wfsData.status === 'fulfilled' ? (Array.isArray(wfsData.value) ? wfsData.value : (wfsData.value?.workflows || wfsData.value?.data || [])) : [];
    if (routingData.status === 'fulfilled') _cfgRoutingCache = routingData.value;
    const routing = _cfgRoutingCache || [];
    const routingArr = Array.isArray(routing) ? routing : (routing.routes || routing.rules || []);

    if (!wfs.length) {
      content.innerHTML = `<div class="empty-state">${icon('settings',36)}<div class="empty-state__title">Nenhum fluxo encontrado</div></div>`;
      return;
    }

    const wrap = document.createElement('div');
    wrap.style.cssText = 'display:flex;flex-direction:column;gap:.75rem';

    wfs.forEach(w => {
      const wId = w.workflow_id || w.id;
      const clients = routingArr.filter(r => r.workflow_id === wId || r.bot_slot === w.bot_slot).length;
      const isActive = w.active !== false;

      const card = document.createElement('div');
      card.className = 'card row row--wrap';

      const av = botAvatar(w.workflow_id || w.name || 'w', 36);
      card.appendChild(av);

      const info = document.createElement('div');
      info.className = 'flex-1';
      info.style.cssText = 'min-width:120px';
      info.innerHTML = `<div class="h3">${escapeHtml(w.name || w.workflow_id || '—')}</div><div class="muted mono" style="font-size:.75rem">${escapeHtml(w.workflow_id || w.source || '')}</div><div class="subtle" style="margin-top:2px">${fmtNum(clients)} cliente${clients !== 1 ? 's' : ''} roteado${clients !== 1 ? 's' : ''}</div>`;
      card.appendChild(info);

      const badge = document.createElement('span');
      badge.className = `badge ${isActive ? 'badge--success' : 'badge--muted'}`;
      badge.textContent = isActive ? 'Ativo' : 'Inativo';
      card.appendChild(badge);

      // Badge de categoria: destaca fluxos internos e indica roteamento
      if (w.category === 'interno') {
        const catBadge = document.createElement('span');
        catBadge.className = 'badge badge--warning';
        catBadge.textContent = 'Interno';
        card.appendChild(catBadge);
      }
      const routBadge = document.createElement('span');
      routBadge.className = `badge ${w.routable ? 'badge--info' : 'badge--muted'}`;
      routBadge.textContent = w.routable ? 'Com roteamento' : 'Sem roteamento';
      card.appendChild(routBadge);

      // Toggle
      const toggleLabel = document.createElement('label');
      toggleLabel.className = 'toggle';
      toggleLabel.setAttribute('aria-label', `${isActive ? 'Desativar' : 'Ativar'} fluxo ${w.name || wId}`);
      const chk = document.createElement('input');
      chk.type = 'checkbox';
      chk.checked = isActive;
      const track = document.createElement('span');
      track.className = 'toggle__track';
      toggleLabel.appendChild(chk);
      toggleLabel.appendChild(track);
      card.appendChild(toggleLabel);

      chk.addEventListener('change', async () => {
        chk.disabled = true;
        try {
          await api(`/api/workflows/${encodeURIComponent(wId)}/active`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ active: chk.checked }),
          });
          badge.className = `badge ${chk.checked ? 'badge--success' : 'badge--muted'}`;
          badge.textContent = chk.checked ? 'Ativo' : 'Inativo';
          toast(`Fluxo ${chk.checked ? 'ativado' : 'desativado'} com sucesso.`, 'success');
        } catch (err) {
          chk.checked = !chk.checked;
          toast('Erro: ' + err.message, 'danger');
        } finally {
          chk.disabled = false;
        }
      });

      // Palavras-chave
      const kwBtn = document.createElement('button');
      kwBtn.className = 'btn btn--sm';
      kwBtn.innerHTML = `${icon('pencil', 13)} Palavras-chave`;
      kwBtn.addEventListener('click', () => openPauseKeywordsModal(wId));
      card.appendChild(kwBtn);

      wrap.appendChild(card);
    });

    content.innerHTML = '';
    content.appendChild(wrap);
  } catch (err) {
    content.innerHTML = `<div class="card"><p class="muted">${icon('alert-triangle',14)} Erro: ${escapeHtml(err.message)}</p></div>`;
  }
}

/* ── Helpers de clone ───────────────────────────────────────────── */
function slugify(s) {
  return String(s || '')
    .toLowerCase()
    .normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/[^a-z0-9]+/g, '_')
    .replace(/^_+|_+$/g, '')
    .slice(0, 40) || 'clone';
}

function statusCloneBadge(status) {
  const map = {
    'rascunho':       { cls: 'badge--muted',   label: 'Rascunho',       dot: false },
    'aguardando_qr':  { cls: 'badge--warning',  label: 'Aguardando QR',  dot: true  },
    'conectado':      { cls: 'badge--success',  label: 'Conectado',      dot: true  },
    'desconectado':   { cls: 'badge--danger',   label: 'Desconectado',   dot: false },
    'falhou':         { cls: 'badge--danger',   label: 'Falhou',         dot: false },
  };
  const s = map[status] || { cls: 'badge--muted', label: escapeHtml(status || 'Desconhecido'), dot: false };
  const dotHtml = s.dot && status === 'conectado'
    ? `<span class="dot-pulse" style="margin-right:3px"></span>`
    : s.dot ? `<span class="badge--dot" style="display:inline-block;width:6px;height:6px;border-radius:50%;background:currentColor;margin-right:3px;vertical-align:middle"></span>` : '';
  return `<span class="badge ${s.cls}" style="display:inline-flex;align-items:center;gap:3px">${dotHtml}${escapeHtml(s.label)}</span>`;
}

/* ── pollQR ─────────────────────────────────────────────────────── */
let _activeQRPoll = null;

function pollQR(sessionName, onUpdate) {
  if (_activeQRPoll) { clearInterval(_activeQRPoll); _activeQRPoll = null; }
  _activeQRPoll = setInterval(async () => {
    try {
      const data = await api(`/api/sessions/${encodeURIComponent(sessionName)}/qr`);
      onUpdate(data);
    } catch (err) {
      onUpdate({ error: err.message });
    }
  }, 2000);
  return function stop() {
    if (_activeQRPoll) { clearInterval(_activeQRPoll); _activeQRPoll = null; }
  };
}

/* ── renderBotClones (grupo interno de Bots) ────────────────────── */
function renderBotClones(clones, container) {
  if (!clones.length) {
    container.innerHTML = `

function renderClonesList(clones, wrap) {
  if (!clones.length) {
    wrap.innerHTML = `
      <div class="empty-state">
        <div class="empty-state__icon">${icon('git-branch', 48)}</div>
        <div class="empty-state__title">Nenhum clone criado</div>
        <p class="empty-state__text">Clone um fluxo matriz para atender um novo cliente no WhatsApp.</p>
        <button class="btn btn--primary" onclick="openCloneWizard()">${icon('plus',14)} Clonar fluxo matriz</button>
      </div>`;
    return;
  }

  const grid = document.createElement('div');
  grid.className = 'clones-grid';

  clones.forEach(c => {
    const card = document.createElement('div');
    card.className = 'clone-card';

    const header = document.createElement('div');
    header.className = 'clone-card__header';
    header.appendChild(botAvatar(c.display_name || c.matriz_slot || 'clone', 40));

    const info = document.createElement('div');
    info.className = 'clone-card__info';
    info.innerHTML = `
      <div class="clone-card__name">${escapeHtml(c.display_name || 'Clone')}</div>
      <div class="clone-card__sub">${escapeHtml(c.matriz_slot || '')}${c.cliente_nome ? ' — ' + escapeHtml(c.cliente_nome) : ''}</div>`;
    header.appendChild(info);
    card.appendChild(header);

    card.insertAdjacentHTML('beforeend', statusCloneBadge(c.status));

    const actions = document.createElement('div');
    actions.className = 'clone-card__actions';

    const configBtn = document.createElement('button');
    configBtn.className = 'btn btn--sm';
    configBtn.innerHTML = `${icon('settings', 13)} Configurar`;
    configBtn.addEventListener('click', () => openCloneConfigModal(c));
    actions.appendChild(configBtn);

    const connectBtn = document.createElement('button');
    connectBtn.className = 'btn btn--sm';
    if (c.status === 'conectado') {
      connectBtn.innerHTML = `${icon('check-circle-2', 13)} Conectado`;
      connectBtn.classList.add('btn--success');
    } else {
      connectBtn.innerHTML = `${icon('qr-code', 13)} Conectar WhatsApp`;
    }
    connectBtn.addEventListener('click', () => openCloneQRModal(c));
    actions.appendChild(connectBtn);

    const delBtn = document.createElement('button');
    delBtn.className = 'btn btn--sm btn--ghost btn--icon';
    delBtn.setAttribute('aria-label', 'Excluir clone');
    delBtn.style.color = 'var(--danger)';
    delBtn.innerHTML = icon('trash-2', 14);
    delBtn.addEventListener('click', () => confirmDeleteClone(c));
    actions.appendChild(delBtn);

    card.appendChild(actions);
    grid.appendChild(card);
  });

  wrap.innerHTML = '';
  wrap.appendChild(grid);
}

async function confirmDeleteClone(c) {
  if (!confirm(`Excluir clone "${c.display_name || c.id}"? Esta ação não pode ser desfeita.`)) return;
  try {
    await api(`/api/clones/${c.id}`, { method: 'DELETE' });
    toast('Clone excluído.', 'success');
    _rendered['bots'] = false;
    renderBots();
  } catch (err) {
    toast('Erro ao excluir: ' + err.message, 'danger');
  }
}
