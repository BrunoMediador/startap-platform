<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Startap — Painel</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
/* ── Tokens ─────────────────────────────────────────────────────────── */
:root {
  --bg:            #0a0f1e;
  --bg-2:          #0f172a;
  --surface:       #1e293b;
  --surface-2:     #263247;
  --surface-3:     #334155;
  --border:        #1e3a5f;
  --border-light:  #2d4a6e;
  --text:          #f1f5f9;
  --text-muted:    #94a3b8;
  --text-subtle:   #64748b;
  --primary:       #3b82f6;
  --primary-hover: #2563eb;
  --primary-glow:  rgba(59,130,246,0.18);
  --success:       #10b981;
  --success-bg:    rgba(16,185,129,0.12);
  --danger:        #ef4444;
  --danger-bg:     rgba(239,68,68,0.12);
  --warning:       #f59e0b;
  --warning-bg:    rgba(245,158,11,0.12);
  --info:          #38bdf8;
  --info-bg:       rgba(56,189,248,0.12);
  --radius-sm:     4px;
  --radius-md:     8px;
  --radius-lg:     12px;
  --radius-xl:     16px;
  --radius-full:   9999px;
  --shadow-sm:     0 1px 2px rgba(0,0,0,0.4);
  --shadow-md:     0 4px 12px rgba(0,0,0,0.3);
  --shadow-lg:     0 8px 32px rgba(0,0,0,0.4);
  --sidebar-w:     240px;
  --header-h:      56px;
  --transition:    .15s ease;
  --font-mono:     'JetBrains Mono', ui-monospace, monospace;
}
/* ── Reset ──────────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; }
html { font-size: 14px; }
body {
  margin: 0;
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  line-height: 1.5;
}
a { color: var(--primary); text-decoration: none; }
a:hover { text-decoration: underline; }
img, video, audio { max-width: 100%; display: block; }
button { font-family: inherit; cursor: pointer; }
textarea, input, select { font-family: inherit; }
/* ── Typography ─────────────────────────────────────────────────────── */
.h1  { font-size: 1.5rem;   font-weight: 700; margin: 0 0 .5rem; line-height: 1.2; }
.h2  { font-size: 1.125rem; font-weight: 600; margin: 0 0 .5rem; }
.h3  { font-size: 1rem;     font-weight: 600; margin: 0; }
.muted   { color: var(--text-muted); font-size: .8125rem; }
.subtle  { color: var(--text-subtle); font-size: .75rem; }
.mono    { font-family: var(--font-mono); font-size: .8125rem; }
.label   { font-size: .75rem; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--text-muted); }
/* ── Layout shell ───────────────────────────────────────────────────── */
.shell { display: flex; min-height: 100vh; }
/* ── Sidebar ────────────────────────────────────────────────────────── */
.sidebar {
  width: var(--sidebar-w);
  background: var(--bg-2);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  position: fixed;
  top: 0; left: 0; bottom: 0;
  z-index: 200;
  transition: transform var(--transition);
}
.sidebar__logo {
  display: flex;
  align-items: center;
  gap: .625rem;
  padding: 1.125rem 1rem;
  border-bottom: 1px solid var(--border);
  text-decoration: none;
}
.sidebar__logo-icon {
  width: 32px; height: 32px;
  background: var(--primary);
  border-radius: var(--radius-md);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.sidebar__logo-wordmark {
  font-size: .9375rem;
  font-weight: 700;
  color: var(--text);
  letter-spacing: -.01em;
}
.sidebar__logo-sub {
  font-size: .6875rem;
  color: var(--text-muted);
  font-weight: 400;
  display: block;
  margin-top: -2px;
}
.sidebar__nav {
  flex: 1;
  overflow-y: auto;
  padding: .75rem .5rem;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: .625rem;
  padding: .5rem .75rem;
  border-radius: var(--radius-md);
  color: var(--text-muted);
  font-size: .875rem;
  font-weight: 500;
  cursor: pointer;
  border: none;
  background: transparent;
  width: 100%;
  text-align: left;
  transition: background var(--transition), color var(--transition);
  margin-bottom: 2px;
}
.nav-item:hover { background: var(--surface); color: var(--text); }
.nav-item.active {
  background: var(--primary-glow);
  color: var(--primary);
  border: 1px solid rgba(59,130,246,0.2);
}
.nav-item .nav-icon { flex-shrink: 0; opacity: .8; }
.nav-item.active .nav-icon { opacity: 1; }
.sidebar__footer {
  padding: .75rem 1rem;
  border-top: 1px solid var(--border);
  font-size: .75rem;
  color: var(--text-subtle);
}
/* ── Mobile header ──────────────────────────────────────────────────── */
.mobile-header {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0;
  height: var(--header-h);
  background: var(--bg-2);
  border-bottom: 1px solid var(--border);
  align-items: center;
  padding: 0 1rem;
  z-index: 100;
  gap: .75rem;
}
.mobile-header__brand { font-weight: 700; font-size: .9375rem; }
.sidebar-backdrop {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.6);
  z-index: 150;
}
/* ── Main content ───────────────────────────────────────────────────── */
.main {
  flex: 1;
  margin-left: var(--sidebar-w);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
.section {
  display: none;
  padding: 1.5rem;
  flex: 1;
}
.section.active { display: block; }
.section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1.5rem;
  gap: 1rem;
  flex-wrap: wrap;
}
.section-header__left { display: flex; flex-direction: column; gap: .125rem; }
/* ── Cards ──────────────────────────────────────────────────────────── */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 1rem;
}
.card-flat {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
}
.card--hover { transition: border-color var(--transition), box-shadow var(--transition); cursor: pointer; }
.card--hover:hover { border-color: var(--border-light); box-shadow: var(--shadow-md); }
/* ── KPI Grid ───────────────────────────────────────────────────────── */
.kpi-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 1rem;
  margin-bottom: 1.5rem;
}
.kpi-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 1rem;
  display: flex;
  flex-direction: column;
  gap: .375rem;
}
.kpi-card__icon {
  width: 36px; height: 36px;
  border-radius: var(--radius-md);
  display: flex; align-items: center; justify-content: center;
  margin-bottom: .25rem;
  flex-shrink: 0;
}
.kpi-card__value { font-size: 1.75rem; font-weight: 700; line-height: 1; }
.kpi-card__label { font-size: .75rem; color: var(--text-muted); font-weight: 500; }
.kpi-card__delta {
  display: inline-flex; align-items: center; gap: .25rem;
  font-size: .75rem; font-weight: 500; margin-top: .125rem;
}
.kpi-card__delta--up   { color: var(--success); }
.kpi-card__delta--down { color: var(--danger); }
/* ── Buttons ────────────────────────────────────────────────────────── */
.btn {
  display: inline-flex; align-items: center; gap: .375rem;
  padding: .4375rem .875rem;
  border-radius: var(--radius-md);
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  font-size: .875rem;
  font-weight: 500;
  cursor: pointer;
  transition: all var(--transition);
  white-space: nowrap;
  line-height: 1;
  text-decoration: none;
}
.btn:hover { background: var(--surface-2); border-color: var(--border-light); }
.btn:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.btn--primary { background: var(--primary); border-color: var(--primary); color: #fff; }
.btn--primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
.btn--danger  { background: var(--danger);  border-color: var(--danger);  color: #fff; }
.btn--danger:hover  { background: #dc2626;  border-color: #dc2626; }
.btn--success { background: var(--success); border-color: var(--success); color: #fff; }
.btn--ghost   { background: transparent; border-color: transparent; }
.btn--ghost:hover { background: var(--surface-2); }
.btn--sm { padding: .25rem .625rem; font-size: .8125rem; border-radius: var(--radius-sm); }
.btn--icon { padding: .375rem; border-radius: var(--radius-md); }
.btn[disabled] { opacity: .5; cursor: not-allowed; pointer-events: none; }
/* ── Badges ─────────────────────────────────────────────────────────── */
.badge {
  display: inline-flex; align-items: center; gap: .25rem;
  padding: 2px 8px; border-radius: var(--radius-full);
  font-size: .6875rem; font-weight: 600;
}
.badge--success { background: var(--success-bg); color: var(--success); }
.badge--danger  { background: var(--danger-bg);  color: var(--danger); }
.badge--warning { background: var(--warning-bg); color: var(--warning); }
.badge--info    { background: var(--info-bg);    color: var(--info); }
.badge--muted   { background: var(--surface-3);  color: var(--text-muted); }
.badge--dot::before {
  content: '';
  display: inline-block;
  width: 6px; height: 6px;
  border-radius: 50%;
  background: currentColor;
  flex-shrink: 0;
}
/* ── Skeleton ───────────────────────────────────────────────────────── */
.skeleton {
  background: linear-gradient(90deg, var(--surface) 25%, var(--surface-2) 50%, var(--surface) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.5s infinite;
  border-radius: var(--radius-md);
  height: 1.125em;
}
@keyframes shimmer {
  0%   { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}
.skeleton-block { border-radius: var(--radius-lg); animation: shimmer 1.5s infinite;
  background: linear-gradient(90deg, var(--surface) 25%, var(--surface-2) 50%, var(--surface) 75%);
  background-size: 200% 100%;
}
/* ── Empty state ────────────────────────────────────────────────────── */
.empty-state {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: .75rem;
  padding: 3rem 1.5rem;
  text-align: center; color: var(--text-muted);
}
.empty-state__icon { opacity: .4; }
.empty-state__title { font-weight: 600; font-size: 1rem; color: var(--text); }
.empty-state__text  { font-size: .875rem; max-width: 28ch; }
/* ── Table ──────────────────────────────────────────────────────────── */
.table-wrap { overflow-x: auto; border-radius: var(--radius-lg); border: 1px solid var(--border); }
.table { width: 100%; border-collapse: collapse; font-size: .875rem; }
.table th, .table td { padding: .5rem .875rem; text-align: left; border-bottom: 1px solid var(--border); }
.table th {
  font-weight: 600; color: var(--text-muted); font-size: .6875rem;
  text-transform: uppercase; letter-spacing: .06em;
  background: rgba(0,0,0,.2); white-space: nowrap;
}
.table tr:last-child td { border-bottom: none; }
.table tbody tr:hover td { background: rgba(255,255,255,.02); }
.table td.mono { font-family: var(--font-mono); font-size: .8rem; }
/* ── Forms ──────────────────────────────────────────────────────────── */
.field { display: flex; flex-direction: column; gap: .375rem; }
.field label { font-size: .75rem; font-weight: 600; color: var(--text-muted); }
input, select, textarea {
  background: var(--bg);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: .4375rem .75rem;
  font-size: .875rem;
  font-family: inherit;
  width: 100%;
  transition: border-color var(--transition), box-shadow var(--transition);
}
input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 3px var(--primary-glow);
}
input::placeholder, textarea::placeholder { color: var(--text-subtle); }
textarea { resize: vertical; min-height: 120px; font-family: var(--font-mono); font-size: .8125rem; }
.char-count { font-size: .75rem; color: var(--text-subtle); text-align: right; }
/* ── Tabs (pill) ────────────────────────────────────────────────────── */
.tabs {
  display: flex; gap: .25rem;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  padding: .25rem;
  width: fit-content;
  flex-wrap: wrap;
  margin-bottom: 1.25rem;
}
.tab-btn {
  padding: .3125rem .875rem;
  border-radius: var(--radius-full);
  border: none;
  background: transparent;
  color: var(--text-muted);
  font-size: .8125rem;
  font-weight: 500;
  cursor: pointer;
  transition: all var(--transition);
  white-space: nowrap;
}
.tab-btn:hover { color: var(--text); }
.tab-btn.active { background: var(--primary); color: #fff; }
/* ── Bot avatar ─────────────────────────────────────────────────────── */
.bot-avatar {
  border-radius: var(--radius-md);
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; color: #fff;
  flex-shrink: 0;
  font-size: .875rem;
  text-transform: uppercase;
}
/* ── Bot cards grid ──────────────────────────────────────────────────── */
.bots-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 1rem;
  margin-bottom: 1.5rem;
}
.bot-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 1rem;
  cursor: pointer;
  transition: border-color var(--transition), box-shadow var(--transition);
  display: flex; flex-direction: column; gap: .75rem;
}
.bot-card:hover { border-color: var(--border-light); box-shadow: var(--shadow-md); }
.bot-card.selected { border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary-glow); }
.bot-card__header { display: flex; align-items: center; gap: .75rem; }
.bot-card__name   { font-weight: 600; font-size: .9375rem; }
.bot-card__slug   { font-size: .75rem; color: var(--text-muted); font-family: var(--font-mono); }
/* ── Bot detail ─────────────────────────────────────────────────────── */
.bot-detail {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 1.25rem;
}
.bot-detail__header {
  display: flex; align-items: center; gap: 1rem;
  margin-bottom: 1.25rem; padding-bottom: 1rem;
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
}
.bot-detail__title { font-size: 1.125rem; font-weight: 700; }
.bot-detail__meta  { font-size: .8125rem; color: var(--text-muted); }
/* ── Media cards ─────────────────────────────────────────────────────── */
.media-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 1rem;
}
.media-card {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  overflow: hidden;
  display: flex; flex-direction: column;
}
.media-card__preview {
  background: var(--bg-2);
  min-height: 140px;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
  position: relative;
}
.media-card__preview video,
.media-card__preview audio { width: 100%; }
.media-card__preview .media-img {
  width: 100%; height: 160px; object-fit: cover; cursor: zoom-in;
  transition: transform .2s;
}
.media-card__preview .media-img:hover { transform: scale(1.03); }
.media-card__info {
  padding: .625rem .75rem;
  display: flex; align-items: center; justify-content: space-between; gap: .5rem;
  border-top: 1px solid var(--border);
}
.media-card__name { font-size: .8125rem; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
/* ── Lightbox ────────────────────────────────────────────────────────── */
.lightbox {
  display: none;
  position: fixed; inset: 0; z-index: 1000;
  background: rgba(0,0,0,.92);
  align-items: center; justify-content: center;
  padding: 1rem;
}
.lightbox.open { display: flex; }
.lightbox img { max-height: 90vh; max-width: 90vw; border-radius: var(--radius-md); }
.lightbox__close {
  position: absolute; top: 1rem; right: 1rem;
  background: rgba(255,255,255,.1); border: none;
  border-radius: var(--radius-full);
  color: #fff; width: 36px; height: 36px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; font-size: 1.25rem;
  transition: background var(--transition);
}
.lightbox__close:hover { background: rgba(255,255,255,.2); }
/* ── WAHA session cards ───────────────────────────────────────────────── */
.sessions-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 1rem;
  margin-bottom: 1.5rem;
}
.session-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 1rem;
  display: flex; flex-direction: column; gap: .5rem;
}
.session-card__name { font-weight: 600; font-size: .9375rem; }
/* ── Toast ──────────────────────────────────────────────────────────── */
#toast-container {
  position: fixed; bottom: 1.25rem; right: 1.25rem;
  display: flex; flex-direction: column; gap: .5rem;
  z-index: 9999;
  max-width: min(360px, calc(100vw - 2.5rem));
}
.toast {
  padding: .75rem 1rem;
  border-radius: var(--radius-lg);
  font-size: .875rem; font-weight: 500;
  display: flex; align-items: center; gap: .5rem;
  box-shadow: var(--shadow-lg);
  animation: toast-in .2s ease forwards;
  border: 1px solid transparent;
}
.toast--success { background: var(--success-bg); border-color: var(--success); color: var(--success); }
.toast--danger  { background: var(--danger-bg);  border-color: var(--danger);  color: var(--danger); }
.toast--info    { background: var(--info-bg);    border-color: var(--info);    color: var(--info); }
.toast--warning { background: var(--warning-bg); border-color: var(--warning); color: var(--warning); }
@keyframes toast-in {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}
/* ── Modal ──────────────────────────────────────────────────────────── */
#modal-backdrop {
  display: none;
  position: fixed; inset: 0; z-index: 500;
  background: rgba(0,0,0,.7);
  align-items: center; justify-content: center;
  padding: 1rem;
}
#modal-backdrop.open { display: flex; }
.modal {
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-xl);
  width: 100%; max-width: 520px;
  max-height: 90vh; overflow-y: auto;
  padding: 1.5rem;
  box-shadow: var(--shadow-lg);
}
.modal__header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 1.25rem; padding-bottom: .875rem;
  border-bottom: 1px solid var(--border);
}
.modal__title { font-weight: 700; font-size: 1.0625rem; }
/* ── Upload area ────────────────────────────────────────────────────── */
.upload-area {
  border: 2px dashed var(--border-light);
  border-radius: var(--radius-lg);
  padding: 2rem;
  text-align: center;
  color: var(--text-muted);
  cursor: pointer;
  transition: border-color var(--transition), background var(--transition);
}
.upload-area:hover { border-color: var(--primary); background: var(--primary-glow); color: var(--text); }
.upload-area input[type="file"] { display: none; }
/* ── Divider ────────────────────────────────────────────────────────── */
.divider { height: 1px; background: var(--border); margin: 1.25rem 0; }
/* ── Routing table rows ─────────────────────────────────────────────── */
.routing-row { display: flex; align-items: center; gap: .75rem; padding: .625rem 0; border-bottom: 1px solid var(--border); }
.routing-row:last-child { border-bottom: none; }
.routing-row__pattern { font-family: var(--font-mono); font-size: .8125rem; flex: 1; }
.routing-row__target  { font-size: .8125rem; color: var(--text-muted); }
/* ── Dashboard grid ─────────────────────────────────────────────────── */
.dash-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1rem;
  margin-top: 1.5rem;
}
.dash-grid--full { grid-column: 1 / -1; }
/* ── Spinner ────────────────────────────────────────────────────────── */
.spinner {
  width: 20px; height: 20px;
  border: 2px solid var(--surface-3);
  border-top-color: var(--primary);
  border-radius: 50%;
  animation: spin .7s linear infinite;
  flex-shrink: 0;
}
@keyframes spin { to { transform: rotate(360deg); } }
/* ── Section status indicator row ─────────────────────────────────────── */
.status-row {
  display: flex; align-items: center; gap: .75rem;
  padding: .5rem 0; border-bottom: 1px solid var(--border);
  font-size: .875rem;
}
.status-row:last-child { border-bottom: none; }
.status-row__name { flex: 1; font-weight: 500; }
.status-row__detail { color: var(--text-muted); font-size: .8125rem; }
/* ── Drawer lateral ─────────────────────────────────────────────── */
.drawer-backdrop { position:fixed; inset:0; background:rgba(0,0,0,0.4); z-index:900; opacity:0; pointer-events:none; transition:opacity 200ms; }
.drawer-backdrop.open { opacity:1; pointer-events:auto; }
.drawer { position:fixed; top:0; right:0; bottom:0; width:min(420px, 90vw); background:var(--surface); border-left:1px solid var(--border); transform:translateX(100%); transition:transform 250ms ease-out; z-index:901; overflow-y:auto; padding:1.5rem; }
.drawer.open { transform:translateX(0); }
.drawer__header { display:flex; align-items:center; justify-content:space-between; margin-bottom:1.25rem; padding-bottom:.875rem; border-bottom:1px solid var(--border); }
.drawer__title { font-weight:700; font-size:1rem; }
.drawer__body pre { background:var(--bg); border:1px solid var(--border); border-radius:var(--radius-md); padding:.75rem; font-size:.75rem; font-family:var(--font-mono); overflow-x:auto; white-space:pre-wrap; word-break:break-all; }
/* ── Toggle switch ──────────────────────────────────────────────── */
.toggle { position:relative; display:inline-flex; align-items:center; cursor:pointer; gap:.5rem; font-size:.875rem; }
.toggle input { position:absolute; opacity:0; width:0; height:0; }
.toggle__track { width:36px; height:20px; background:var(--surface-3); border-radius:var(--radius-full); transition:background var(--transition); flex-shrink:0; position:relative; }
.toggle input:checked + .toggle__track { background:var(--success); }
.toggle__track::after { content:''; position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:#fff; transition:transform var(--transition); }
.toggle input:checked + .toggle__track::after { transform:translateX(16px); }
/* ── Filter bar ─────────────────────────────────────────────────── */
.filter-bar { display:flex; align-items:center; gap:.5rem; flex-wrap:wrap; margin-bottom:1rem; }
.filter-bar .pill-group { display:flex; gap:2px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-full); padding:2px; }
.filter-bar .pill { padding:.25rem .6rem; border-radius:var(--radius-full); border:none; background:transparent; color:var(--text-muted); font-size:.8rem; cursor:pointer; transition:all var(--transition); white-space:nowrap; }
.filter-bar .pill.active { background:var(--primary); color:#fff; }
.filter-bar select, .filter-bar input[type="text"] { width:auto; min-width:0; flex:1; }
/* ── Bar chart ──────────────────────────────────────────────────── */
.bar-chart { display:flex; align-items:flex-end; gap:4px; height:120px; }
.bar-chart__col { display:flex; flex-direction:column; align-items:center; flex:1; gap:3px; }
.bar-chart__bar { width:100%; background:var(--primary); border-radius:var(--radius-sm) var(--radius-sm) 0 0; min-height:2px; transition:opacity var(--transition); }
.bar-chart__bar:hover { opacity:.8; }
.bar-chart__val { font-size:.65rem; color:var(--text-muted); font-family:var(--font-mono); line-height:1; }
.bar-chart__lbl { font-size:.6rem; color:var(--text-subtle); white-space:nowrap; }
/* ── Live dot ───────────────────────────────────────────────────── */
.live-dot { width:8px; height:8px; border-radius:50%; background:var(--success); animation:pulse-dot 1.4s ease-in-out infinite; flex-shrink:0; }
@keyframes pulse-dot { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(.7)} }
/* ── Responsive ─────────────────────────────────────────────────────── */
@media (max-width: 768px) {
  :root { --sidebar-w: 240px; }
  .sidebar {
    transform: translateX(-100%);
    top: var(--header-h);

  .media-grid { grid-template-columns: 1fr; }
  .sessions-grid { grid-template-columns: 1fr; }
  .dash-grid { grid-template-columns: 1fr; }
  .tabs { width: 100%; justify-content: flex-start; overflow-x: auto; }
  .section-header { flex-direction: column; align-items: flex-start; }
}
@media (max-width: 480px) {

/* ── icon() helper ──────────────────────────────────────────────── */
function icon(name, size = 16) {
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name] || ''}</svg>`;
}

/* ── botAvatar() ────────────────────────────────────────────────── */
function botAvatar(slug, size = 40) {
  const PALETTE = ['#3b82f6','#8b5cf6','#10b981','#f59e0b','#ef4444','#ec4899','#06b6d4','#f97316'];
  let hash = 0;
  for (let i = 0; i < (slug || '').length; i++) hash = (hash * 31 + slug.charCodeAt(i)) >>> 0;
  const color = PALETTE[hash % PALETTE.length];
  const letter = (slug || '?')[0].toUpperCase();
  const el = document.createElement('div');
  el.className = 'bot-avatar';
  el.style.cssText = `width:${size}px;height:${size}px;background:${color};font-size:${Math.round(size * 0.4)}px;`;
  el.textContent = letter;
  return el;
}

/* ── renderMediaPreview() ───────────────────────────────────────── */
function renderMediaPreview(media) {
  if (!media) {
    const el = document.createElement('div');
    el.style.cssText = 'display:flex;align-items:center;justify-content:center;height:120px;color:var(--text-subtle);';
    el.innerHTML = icon('upload-cloud', 32);
    return el;
  }
  let url = media.url || media.media_url || '';
  const mtype = (media.media_type || '').toLowerCase();
  const fname = media.filename || media.name || url.split('/').pop() || 'arquivo';

  // Proxy insecure URLs
  if (url && url.startsWith('http://')) url = `/media-proxy?u=${encodeURIComponent(url)}`;

  const isVideo = mtype === 'video' || /\.(mp4|webm|mov)(\?|$)/i.test(url);
  const isAudio = mtype === 'audio' || /\.(mp3|ogg|wav|m4a)(\?|$)/i.test(url);
  const isImage = mtype === 'image' || /\.(jpe?g|png|gif|webp|svg)(\?|$)/i.test(url);

  const wrap = document.createElement('div');
  wrap.className = 'media-card__preview';

  if (!url) {
    wrap.innerHTML = `<span style="color:var(--text-subtle)">${icon('upload-cloud', 28)}</span>`;
    return wrap;
  }

  if (isVideo) {
    const v = document.createElement('video');
    v.controls = true;
    v.preload = 'metadata';
    v.src = url;
    v.style.cssText = 'width:100%;max-width:360px;aspect-ratio:16/9;border-radius:var(--radius-md);background:#000;';
    wrap.appendChild(v);
  } else if (isAudio) {
    const a = document.createElement('audio');
    a.controls = true;
    a.src = url;
    a.style.cssText = 'width:100%;padding:.5rem;';
    wrap.appendChild(a);
  } else if (isImage) {
    const img = document.createElement('img');
    img.loading = 'lazy';
    img.src = url;
    img.className = 'media-img';
    img.alt = fname;
    img.addEventListener('click', () => openLightbox(url));
    wrap.appendChild(img);
  } else {
    // file / pdf / etc
    wrap.style.flexDirection = 'column';
    wrap.style.gap = '.5rem';
    wrap.innerHTML = `
      <span style="color:var(--text-muted)">${icon('file-text', 36)}</span>
      <span class="muted" style="max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(fname)}</span>
      <a href="${url}" target="_blank" rel="noopener noreferrer" class="btn btn--sm btn--primary">Abrir</a>`;
  }
  return wrap;
}

/* ── statusBadge() ──────────────────────────────────────────────── */
function statusBadge(wahaStatus) {
  const map = {
    'WORKING':       { cls: 'badge--success', label: 'Conectado' },
    'FAILED':        { cls: 'badge--danger',  label: 'Falhou' },
    'STARTING':      { cls: 'badge--warning', label: 'Iniciando' },
    'STOPPED':       { cls: 'badge--muted',   label: 'Parado' },
    'SCAN_QR_CODE':  { cls: 'badge--info',    label: 'Aguardando QR' },
  };
  const s = map[wahaStatus] || { cls: 'badge--muted', label: wahaStatus || 'Desconhecido' };
  return `<span class="badge badge--dot ${s.cls}">${escapeHtml(s.label)}</span>`;
}

/* ── Helpers ────────────────────────────────────────────────────── */
function escapeHtml(str) {
  return String(str ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function fmtNum(n) {
  if (n == null || isNaN(n)) return '—';
  return Number(n).toLocaleString('pt-BR');
}

function fmtBRL(n) {
  if (n == null || isNaN(n)) return '—';
  return Number(n).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
}

function fmtDate(d) {
  if (!d) return '—';
  return new Date(d).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' });
}

function fmtRelative(d) {
  if (!d) return '—';
  const diff = Date.now() - new Date(d).getTime();
  const m = Math.floor(diff / 60000);
  if (m < 1)  return 'agora';
  if (m < 60) return `há ${m} min`;
  const h = Math.floor(m / 60);
  if (h < 24) return `há ${h} h`;
  const days = Math.floor(h / 24);
  return `há ${days} d`;
}

async function api(path, opts = {}) {
  const res = await fetch(path, { credentials: 'include', ...opts });
  if (!res.ok) {
    let msg = `Erro ${res.status}`;
    try { const j = await res.json(); msg = j.error || j.message || msg; } catch (_) {}
    throw new Error(msg);
  }
  return res.json();
}

/* ── Toast ─────────────────────────────────────────────────────── */
function toast(msg, type = 'info') {
  const container = document.getElementById('toast-container');
  const el = document.createElement('div');
  el.className = `toast toast--${type}`;
  const iconName = { success: 'check-circle-2', danger: 'alert-triangle', warning: 'alert-triangle', info: 'message-circle' }[type] || 'message-circle';
  el.innerHTML = `${icon(iconName, 16)}<span>${escapeHtml(msg)}</span>`;
  container.appendChild(el);
  setTimeout(() => el.remove(), 4500);
}

/* ── Modal ─────────────────────────────────────────────────────── */
function openModal(html) {
  const backdrop = document.getElementById('modal-backdrop');
  document.getElementById('modal-content').innerHTML = html;
  backdrop.classList.add('open');
}
function closeModal() {
  document.getElementById('modal-backdrop').classList.remove('open');
  document.getElementById('modal-content').innerHTML = '';
}

/* ── Lightbox ───────────────────────────────────────────────────── */
function openLightbox(src) {
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
}

async function renderDashKPIs() {
  const wrap = document.getElementById('dash-kpis');
  wrap.innerHTML = `
    <div class="kpi-card"><div class="skeleton" style="height:28px;width:80px;margin-bottom:.5rem"></div><div class="skeleton" style="width:120px"></div></div>
    <div class="kpi-card"><div class="skeleton" style="height:28px;width:80px;margin-bottom:.5rem"></div><div class="skeleton" style="width:120px"></div></div>
    <div class="kpi-card"><div class="skeleton" style="height:28px;width:80px;margin-bottom:.5rem"></div><div class="skeleton" style="width:120px"></div></div>
    <div class="kpi-card"><div class="skeleton" style="height:28px;width:80px;margin-bottom:.5rem"></div><div class="skeleton" style="width:120px"></div></div>`;

  try {
    const [statusData, msgStats, usageSummary] = await Promise.allSettled([
      api('/api/status'),
      api('/api/message-stats'),
      api('/api/usage/summary?days=7'),
    ]);

    const sessions = statusData.status === 'fulfilled' ? (statusData.value?.sessions || statusData.value || []) : [];
    const sessArr = Array.isArray(sessions) ? sessions : Object.values(sessions);
    const workingSessions = sessArr.filter(s => (s.status || s.state) === 'WORKING').length;

    const bots = statusData.status === 'fulfilled' ? (statusData.value?.bots || []) : [];
    const activeBots = Array.isArray(bots) ? bots.filter(b => b.active !== false).length : 0;

    const msgs = msgStats.status === 'fulfilled' ? msgStats.value : null;
    const msgsToday = msgs?.today ?? msgs?.total ?? '—';

    const usage = usageSummary.status === 'fulfilled' ? usageSummary.value : null;
    const cost7d = usage?.total_cost ?? usage?.cost ?? null;

    const kpis = [
      {
        label: 'Sessões WAHA',
        value: sessArr.length ? `${workingSessions}/${sessArr.length}` : '—',
        icon: 'wifi-off',
        iconColor: '#3b82f6',
        iconBg: 'rgba(59,130,246,0.12)',
      },
      {
        label: 'Bots ativos',
        value: fmtNum(activeBots) || '—',
        icon: 'bot',
        iconColor: '#10b981',
        iconBg: 'rgba(16,185,129,0.12)',
      },
      {
        label: 'Mensagens hoje',
        value: fmtNum(msgsToday),
        icon: 'message-circle',
        iconColor: '#8b5cf6',
        iconBg: 'rgba(139,92,246,0.12)',
      },
      {
        label: 'Custo 7 dias',
        value: cost7d != null ? fmtBRL(cost7d) : '—',
        icon: 'zap',
        iconColor: '#f59e0b',
        iconBg: 'rgba(245,158,11,0.12)',
      },
    ];

    wrap.innerHTML = kpis.map(k => `
      <div class="kpi-card">
        <div class="kpi-card__icon" style="background:${k.iconBg};color:${k.iconColor};">${icon(k.icon, 18)}</div>
        <div class="kpi-card__value">${escapeHtml(String(k.value))}</div>
        <div class="kpi-card__label">${escapeHtml(k.label)}</div>
      </div>`).join('');
  } catch (err) {
    console.error('[dashboard kpis]', err);
    wrap.innerHTML = `<div class="card" style="grid-column:1/-1"><p class="muted">${icon('alert-triangle',14)} Erro ao carregar KPIs: ${escapeHtml(err.message)}</p></div>`;
  }
}

async function renderDashSessions() {
  const wrap = document.getElementById('dash-sessions-wrap');
  wrap.innerHTML = `<h2 class="h2" style="margin-bottom:.75rem">Sessões WAHA</h2><div class="sessions-grid">${'<div class="session-card"><div class="skeleton" style="height:20px;width:120px;margin-bottom:.5rem"></div><div class="skeleton" style="width:80px"></div></div>'.repeat(3)}</div>`;

  try {
    const data = await api('/api/status');
    const sessions = data?.sessions || data || [];
    const sessArr = Array.isArray(sessions) ? sessions : Object.values(sessions);

    if (!sessArr.length) {
      wrap.innerHTML = `<h2 class="h2" style="margin-bottom:.75rem">Sessões WAHA</h2><div class="empty-state">${icon('wifi-off', 36)}<div class="empty-state__title">Nenhuma sessão</div><p class="empty-state__text">Nenhuma sessão WAHA encontrada.</p></div>`;
      return;
    }

    const cards = sessArr.map(s => {
      const name = escapeHtml(s.name || s.session || s.id || 'Sessão');
      const st = s.status || s.state || '';
      return `<div class="session-card">
        <div class="session-card__name">${name}</div>
        ${statusBadge(st)}
        ${s.me?.phone ? `<div class="muted">${escapeHtml(s.me.phone)}</div>` : ''}
      </div>`;
    }).join('');

    wrap.innerHTML = `<h2 class="h2" style="margin-bottom:.75rem">Sessões WAHA</h2><div class="sessions-grid">${cards}</div>`;
  } catch (err) {
    console.error('[dashboard sessions]', err);
    wrap.innerHTML = `<div class="card"><p class="muted">${icon('alert-triangle',14)} Erro ao carregar sessões: ${escapeHtml(err.message)}</p></div>`;
  }

  // Últimas execuções
  renderDashExec();
}

async function renderDashExec() {
  const wrap = document.getElementById('dash-exec-wrap');
  wrap.innerHTML = `<h2 class="h2" style="margin-bottom:.75rem">Últimas execuções</h2><div class="table-wrap"><div class="skeleton" style="height:200px"></div></div>`;

  try {
    const data = await api('/api/status');
    const execs = data?.executions || data?.recent_executions || [];

    if (!execs.length) {
      wrap.innerHTML = `<h2 class="h2" style="margin-bottom:.75rem">Últimas execuções</h2><div class="empty-state">${icon('activity',36)}<div class="empty-state__title">Sem execuções recentes</div></div>`;
      return;
    }

    const rows = execs.slice(0, 10).map(e => {
      const status = e.status === 'success' || e.finished
        ? `<span class="badge badge--dot badge--success">Sucesso</span>`
        : e.status === 'error' || e.stoppedAt
        ? `<span class="badge badge--dot badge--danger">Erro</span>`
        : `<span class="badge badge--dot badge--warning">Em andamento</span>`;
      return `<tr>
        <td class="mono">${escapeHtml(String(e.id || '—'))}</td>
        <td>${escapeHtml(e.workflowName || e.workflow || '—')}</td>
        <td>${status}</td>
        <td class="muted">${fmtRelative(e.startedAt || e.created_at)}</td>
      </tr>`;
    }).join('');

    wrap.innerHTML = `
      <h2 class="h2" style="margin-bottom:.75rem">Últimas execuções</h2>
      <div class="table-wrap">
        <table class="table">
          <thead><tr><th>ID</th><th>Workflow</th><th>Status</th><th>Iniciado</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>`;
  } catch (err) {
    console.error('[dashboard exec]', err);
    wrap.innerHTML = `<div class="card"><p class="muted">${icon('alert-triangle',14)} Erro ao carregar execuções: ${escapeHtml(err.message)}</p></div>`;
  }
}

/* ══════════════════════════════════════════════════════════════════
   BOTS
   ══════════════════════════════════════════════════════════════════ */
let _selectedBot = null;
let _selectedBotTab = 'overview';

async function renderBots() {
  const wrap = document.getElementById('bots-content');
  wrap.innerHTML = `<div class="bots-grid">${'<div class="bot-card"><div class="skeleton" style="height:40px;width:40px;border-radius:8px;margin-bottom:.75rem"></div><div class="skeleton" style="width:120px;margin-bottom:.5rem"></div><div class="skeleton" style="width:80px"></div></div>'.repeat(4)}</div>`;

  try {
    const bots = await api('/api/bots');
    const arr = Array.isArray(bots) ? bots : (bots.bots || Object.values(bots));
    if (!arr.length) {
      wrap.innerHTML = `<div class="empty-state">${icon('bot-off',40)}<div class="empty-state__title">Nenhum bot encontrado</div><p class="empty-state__text">Nenhum bot cadastrado ainda.</p></div>`;
      return;
    }
    renderBotsList(arr, wrap);
  } catch (err) {
    console.error('[bots]', err);
    wrap.innerHTML = `<div class="card"><p class="muted">${icon('alert-triangle',14)} Erro ao carregar bots: ${escapeHtml(err.message)}</p><button class="btn btn--sm" style="margin-top:.75rem" onclick="renderBots()">${icon('refresh-cw',14)} Tentar novamente</button></div>`;
  }
}

function renderBotsList(bots, wrap) {
  const grid = document.createElement('div');
  grid.className = 'bots-grid';

  bots.forEach(bot => {
    const card = document.createElement('div');
    card.className = 'bot-card' + (_selectedBot?.slot === bot.slot ? ' selected' : '');
    card.setAttribute('role', 'button');
    card.setAttribute('tabindex', '0');
    card.setAttribute('aria-label', `Abrir detalhes do bot ${bot.name || bot.slot}`);

    const header = document.createElement('div');
    header.className = 'bot-card__header';
    header.appendChild(botAvatar(bot.slug || bot.slot, 40));

    const meta = document.createElement('div');
    meta.innerHTML = `<div class="bot-card__name">${escapeHtml(bot.name || bot.slot)}</div><div class="bot-card__slug">${escapeHtml(bot.slug || bot.slot || '')}</div>`;
    header.appendChild(meta);
    card.appendChild(header);

    const st = bot.waha_status || bot.status || '';
    if (st) card.insertAdjacentHTML('beforeend', statusBadge(st));

    const model = bot.model || bot.llm_model || '';
    if (model) card.insertAdjacentHTML('beforeend', `<div class="muted mono">${escapeHtml(model)}</div>`);

    card.addEventListener('click', () => {
      _selectedBot = bot;
      renderBotsListAndDetail(bots, wrap);
    });
    card.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') card.click(); });

    grid.appendChild(card);
  });

  wrap.innerHTML = '';
  wrap.appendChild(grid);

  if (_selectedBot) {
    const selected = bots.find(b => b.slot === _selectedBot.slot) || bots[0];
    _selectedBot = selected;
    const detail = document.createElement('div');
    wrap.appendChild(detail);
    renderBotDetail(selected, detail);
  }
}

function renderBotsListAndDetail(bots, wrap) {
  renderBotsList(bots, wrap);
}

function renderBotDetail(bot, container) {
  const slot = bot.slot || bot.slug;
  container.className = 'bot-detail';
  container.innerHTML = `
    <div class="bot-detail__header">
      <div id="bot-detail-avatar"></div>
      <div>
        <div class="bot-detail__title">${escapeHtml(bot.name || slot)}</div>
        <div class="bot-detail__meta">${escapeHtml(bot.slug || slot)} — ${escapeHtml(bot.provider || '')} ${escapeHtml(bot.model || '')}</div>
      </div>
      <div style="margin-left:auto">${statusBadge(bot.waha_status || bot.status || '')}</div>
    </div>
    <div class="tabs" id="bot-tabs" role="tablist">
      <button class="tab-btn${_selectedBotTab === 'overview' ? ' active' : ''}" data-tab="overview" role="tab" aria-selected="${_selectedBotTab === 'overview'}">Visão geral</button>
      <button class="tab-btn${_selectedBotTab === 'prompt' ? ' active' : ''}" data-tab="prompt" role="tab" aria-selected="${_selectedBotTab === 'prompt'}">Prompt</button>
      <button class="tab-btn${_selectedBotTab === 'media' ? ' active' : ''}" data-tab="media" role="tab" aria-selected="${_selectedBotTab === 'media'}">Mídias</button>
      <button class="tab-btn${_selectedBotTab === 'routing' ? ' active' : ''}" data-tab="routing" role="tab" aria-selected="${_selectedBotTab === 'routing'}">Roteamento</button>
    </div>
    <div id="bot-tab-content"></div>`;

  container.querySelector('#bot-detail-avatar').appendChild(botAvatar(bot.slug || slot, 48));

  container.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      _selectedBotTab = btn.dataset.tab;
      container.querySelectorAll('.tab-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.tab === _selectedBotTab);
        b.setAttribute('aria-selected', b.dataset.tab === _selectedBotTab);
      });
      loadBotTab(slot, _selectedBotTab, container.querySelector('#bot-tab-content'), bot);
    });
  });

  loadBotTab(slot, _selectedBotTab, container.querySelector('#bot-tab-content'), bot);
}

async function loadBotTab(slot, tab, el, bot) {
  el.innerHTML = `<div style="padding:1rem 0"><div class="spinner"></div></div>`;

  if (tab === 'overview') {
    await renderBotOverview(slot, el, bot);
  } else if (tab === 'prompt') {
    await renderBotPrompt(slot, el);
  } else if (tab === 'media') {
    await renderBotMedia(slot, el);
  } else if (tab === 'routing') {
    await renderBotRouting(slot, el, bot);
  }
}

async function renderBotOverview(slot, el, bot) {
  el.innerHTML = `
    <form id="bot-overview-form">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem">
        <div class="field">
          <label for="ov-name">Nome</label>
          <input id="ov-name" name="name" value="${escapeHtml(bot.name || '')}" placeholder="Nome do bot" />
        </div>
        <div class="field">
          <label for="ov-provider">Provider</label>
          <select id="ov-provider" name="provider">
            <option value="openai" ${bot.provider === 'openai' ? 'selected' : ''}>OpenAI</option>
            <option value="anthropic" ${bot.provider === 'anthropic' ? 'selected' : ''}>Anthropic</option>
            <option value="groq" ${bot.provider === 'groq' ? 'selected' : ''}>Groq</option>
          </select>
        </div>
        <div class="field">
          <label for="ov-model">Modelo</label>
          <input id="ov-model" name="model" value="${escapeHtml(bot.model || bot.llm_model || '')}" placeholder="ex: gpt-4o-mini" />
        </div>
        <div class="field">
          <label for="ov-temp">Temperatura (0–2)</label>
          <input id="ov-temp" name="temperature" type="number" min="0" max="2" step="0.1" value="${bot.temperature ?? 0.7}" />
        </div>
      </div>
      <button type="submit" class="btn btn--primary">${icon('check-circle-2',14)} Salvar alterações</button>
    </form>`;

  el.querySelector('#bot-overview-form').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const fd = new FormData(ev.target);
    const body = { name: fd.get('name'), provider: fd.get('provider'), model: fd.get('model'), temperature: Number(fd.get('temperature')) };
    const btn = ev.target.querySelector('[type=submit]');
    btn.disabled = true;
    try {
      await api(`/api/bots/${slot}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      toast('Bot atualizado com sucesso!', 'success');
    } catch (err) {
      console.error('[bot overview save]', err);
      toast('Erro ao salvar: ' + err.message, 'danger');
    } finally {
      btn.disabled = false;
    }
  });
}

async function renderBotPrompt(slot, el) {
  try {
    const data = await api(`/api/bots/${slot}/prompt`);
    const promptText = data?.prompt || data?.content || data?.system_prompt || '';
    el.innerHTML = `
      <div class="field">
        <label for="prompt-ta">Prompt do sistema</label>
        <textarea id="prompt-ta" rows="16" placeholder="Escreva o prompt de sistema do bot aqui...">${escapeHtml(promptText)}</textarea>
        <div class="char-count"><span id="prompt-count">${promptText.length}</span> caracteres</div>
      </div>
      <button class="btn btn--primary" id="btn-save-prompt" style="margin-top:.75rem">${icon('check-circle-2',14)} Salvar prompt</button>`;

    const ta = el.querySelector('#prompt-ta');
    const count = el.querySelector('#prompt-count');
    ta.addEventListener('input', () => { count.textContent = ta.value.length; });

    el.querySelector('#btn-save-prompt').addEventListener('click', async () => {
      const btn = el.querySelector('#btn-save-prompt');
      btn.disabled = true;
      try {
        await api(`/api/bots/${slot}/prompt`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ prompt: ta.value }) });
        toast('Prompt salvo com sucesso!', 'success');
      } catch (err) {
        console.error('[bot prompt save]', err);
        toast('Erro ao salvar prompt: ' + err.message, 'danger');
      } finally {
        btn.disabled = false;
      }
    });
  } catch (err) {
    console.error('[bot prompt]', err);
    el.innerHTML = `<p class="muted">${icon('alert-triangle',14)} Erro ao carregar prompt: ${escapeHtml(err.message)}</p><button class="btn btn--sm" onclick="loadBotTab('${escapeHtml(slot)}','prompt',this.parentElement)">${icon('refresh-cw',14)} Tentar novamente</button>`;
  }
}

async function renderBotMedia(slot, el) {
  try {
    const medias = await api(`/api/bots/${slot}/media`);
    const arr = Array.isArray(medias) ? medias : (medias.media || medias.items || []);

    const addBtn = `<button class="btn btn--primary" id="btn-add-media" aria-label="Adicionar mídia">${icon('plus',14)} Adicionar mídia</button>`;

    if (!arr.length) {
      el.innerHTML = `<div class="empty-state">${icon('inbox',36)}<div class="empty-state__title">Sem mídias</div><p class="empty-state__text">Nenhuma mídia cadastrada para este bot.</p>${addBtn}</div>`;
    } else {
      const grid = document.createElement('div');
      grid.className = 'media-grid';
      arr.forEach(m => grid.appendChild(buildMediaCard(m, slot, el)));
      el.innerHTML = `<div style="display:flex;justify-content:flex-end;margin-bottom:.75rem">${addBtn}</div>`;
      el.appendChild(grid);
    }

    el.querySelector('#btn-add-media').addEventListener('click', () => openAddMediaModal(slot, el));
  } catch (err) {
    console.error('[bot media]', err);
    el.innerHTML = `<p class="muted">${icon('alert-triangle',14)} Erro ao carregar mídias: ${escapeHtml(err.message)}</p><button class="btn btn--sm" onclick="renderBotMedia('${escapeHtml(slot)}',this.parentElement)">${icon('refresh-cw',14)} Tentar novamente</button>`;
  }
}

function buildMediaCard(m, slot, parentEl) {
  const card = document.createElement('div');
  card.className = 'media-card';
  const preview = renderMediaPreview(m);
  card.appendChild(preview);

  const info = document.createElement('div');
  info.className = 'media-card__info';
  const name = document.createElement('span');
  name.className = 'media-card__name';
  name.textContent = m.filename || m.name || m.title || 'Mídia';
  info.appendChild(name);

  const delBtn = document.createElement('button');
  delBtn.className = 'btn btn--ghost btn--sm btn--icon';
  delBtn.setAttribute('aria-label', 'Excluir mídia');
  delBtn.innerHTML = icon('trash-2', 14);
  delBtn.style.color = 'var(--danger)';
  delBtn.addEventListener('click', async () => {
    if (!confirm(`Excluir "${m.filename || m.name || 'esta mídia'}"?`)) return;
    delBtn.disabled = true;
    try {
      await api(`/api/media/${m.id}`, { method: 'DELETE' });
      toast('Mídia excluída.', 'success');
      await renderBotMedia(slot, parentEl);
    } catch (err) {
      console.error('[media delete]', err);
      toast('Erro ao excluir: ' + err.message, 'danger');
      delBtn.disabled = false;
    }
  });
  info.appendChild(delBtn);
  card.appendChild(info);
  return card;
}

function openAddMediaModal(slot, parentEl) {
  openModal(`
    <div class="modal__header">
      <span class="modal__title">Adicionar mídia</span>
      <button class="btn btn--ghost btn--icon" onclick="closeModal()" aria-label="Fechar">${icon('x', 16)}</button>
    </div>
    <div id="upload-status" style="margin-bottom:.75rem"></div>
    <label class="upload-area" for="media-file-input">
      <input type="file" id="media-file-input" accept="image/*,video/*,audio/*,.pdf,.doc,.docx" />
      ${icon('upload-cloud', 32)}
      <p style="margin:.5rem 0 0">Clique para selecionar ou arraste o arquivo</p>
      <p class="muted" style="margin:.25rem 0 0">Imagem, vídeo, áudio ou documento</p>
    </label>
    <button class="btn btn--primary" id="btn-do-upload" style="margin-top:1rem;width:100%" disabled>${icon('upload-cloud',14)} Enviar</button>
  `);

  const fileInput = document.getElementById('media-file-input');
  const uploadBtn = document.getElementById('btn-do-upload');
  const statusDiv = document.getElementById('upload-status');

  fileInput.addEventListener('change', () => {
    uploadBtn.disabled = !fileInput.files.length;
  });

  uploadBtn.addEventListener('click', async () => {
    if (!fileInput.files.length) return;
    uploadBtn.disabled = true;
    statusDiv.innerHTML = `<div style="display:flex;align-items:center;gap:.5rem"><div class="spinner"></div> Enviando…</div>`;
    try {
      const fd = new FormData();
      fd.append('file', fileInput.files[0]);
      const uploaded = await api('/api/uploads/media', { method: 'POST', body: fd });
      const fileId = uploaded.id || uploaded.file_id || uploaded.filename;

      await api(`/api/bots/${slot}/media`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ file_id: fileId, filename: fileInput.files[0].name }),
      });

      toast('Mídia adicionada com sucesso!', 'success');
      closeModal();
      await renderBotMedia(slot, parentEl);
    } catch (err) {
      console.error('[media upload]', err);
      statusDiv.innerHTML = `<p class="muted" style="color:var(--danger)">${icon('alert-triangle',14)} ${escapeHtml(err.message)}</p>`;
      uploadBtn.disabled = false;
    }
  });
}

async function renderBotRouting(slot, el, bot) {
  try {
    const [routingData, workflowsData] = await Promise.all([
      api('/api/routing'),
      api('/api/workflows'),
    ]);
    const routes = Array.isArray(routingData) ? routingData : (routingData.routes || routingData.rules || []);
    const workflows = Array.isArray(workflowsData) ? workflowsData : (workflowsData.workflows || workflowsData.data || []);

    const botWorkflow = workflows.find(w => w.bot_slot === slot || w.slug === slot);
    const botRoutes = botWorkflow
      ? routes.filter(r => r.workflow_id === botWorkflow.id || r.bot_slot === slot)
      : routes.filter(r => r.bot_slot === slot);

    if (!botRoutes.length) {
      el.innerHTML = `<div class="empty-state">${icon('chevron-right',36)}<div class="empty-state__title">Sem roteamento</div><p class="empty-state__text">Nenhuma regra de roteamento para este bot.</p></div>`;
      return;
    }

    el.innerHTML = `
      <div class="card-flat" style="padding:0">
        <div style="padding:.875rem 1rem;border-bottom:1px solid var(--border)">
          <span class="label">${botRoutes.length} regra${botRoutes.length !== 1 ? 's' : ''}</span>
        </div>
        <div style="padding:.5rem 1rem">
          ${botRoutes.map(r => `
            <div class="routing-row">
              <code class="routing-row__pattern">${escapeHtml(r.pattern || r.keyword || r.trigger || '*')}</code>
              <span class="routing-row__target">${icon('chevron-right', 12)} ${escapeHtml(r.target || r.workflow || r.action || '—')}</span>
              ${r.priority != null ? `<span class="badge badge--muted">P${r.priority}</span>` : ''}
            </div>`).join('')}
        </div>
      </div>`;
  } catch (err) {
    console.error('[bot routing]', err);
    el.innerHTML = `<p class="muted">${icon('alert-triangle',14)} Erro ao carregar roteamento: ${escapeHtml(err.message)}</p>`;
  }
}

function openDrawer(html) {
  document.getElementById('drawer-inner').innerHTML = html;
  document.getElementById('drawer').classList.add('open');
  document.getElementById('drawer-backdrop').classList.add('open');
}
function closeDrawer() {
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('drawer-backdrop').classList.remove('open');
  document.getElementById('drawer-inner').innerHTML = '';
}
document.getElementById('drawer-backdrop').addEventListener('click', closeDrawer);

   ══════════════════════════════════════════════════════════════════ */
let _execSSE = null;
let _execFilters = { hours: '24', status: '', bot: '', q: '' };
let _execLogs = [];

function maskPhone(p) {
  const s = String(p || '');
  if (s.length < 6) return s || '—';
  return s.slice(0, 4) + '****' + s.slice(-2);
}

function fmtDuration(ms) {
  if (!ms && ms !== 0) return '—';
  if (ms < 1000) return ms + 'ms';
  return (ms / 1000).toFixed(1) + 's';
}

function execStatusBadge(st) {
  const map = {
    success:    'badge--success',
    error:      'badge--danger',
    running:    'badge--warning',
    ignored:    'badge--muted',
  };
  const labels = { success:'Sucesso', error:'Erro', running:'Em andamento', ignored:'Ignorado' };
  const key = (st || '').toLowerCase();
  const cls = map[key] || 'badge--muted';
  const lbl = labels[key] || escapeHtml(st || '—');
  return `<span class="badge badge--dot ${cls}">${lbl}</span>`;
}

function execStatusIcon(st) {
  const key = (st || '').toLowerCase();
  if (key === 'success') return `<span style="color:var(--success)">${icon('check-circle-2', 14)}</span>`;
  if (key === 'error')   return `<span style="color:var(--danger)">${icon('alert-triangle', 14)}</span>`;
  if (key === 'running') return `<span style="color:var(--warning)">${icon('activity', 14)}</span>`;
  return `<span style="color:var(--text-subtle)">${icon('minus', 14)}</span>`;
}

function buildExecRow(e) {
  const tr = document.createElement('tr');
  tr.style.cursor = 'pointer';
  const phone = maskPhone(e.telefone || e.phone || e.from || '');
  const dur = fmtDuration(e.duration_ms || e.duration || null);
  const msg = escapeHtml((e.mensagem || e.message || e.event_type || '').slice(0, 60));
  tr.innerHTML = `
    <td>${execStatusIcon(e.status)}</td>
    <td class="mono">${escapeHtml(fmtDate(e.created_at || e.timestamp))}</td>
    <td><div style="display:flex;align-items:center;gap:.375rem">${botAvatar(e.flow_id || e.workflow_id || e.bot || 'bot', 20).outerHTML}<span class="mono" style="font-size:.75rem">${escapeHtml((e.flow_id || e.workflow_id || '—').slice(0,16))}</span></div></td>
    <td><span class="badge badge--muted" style="font-family:var(--font-mono)">${escapeHtml(e.event_type || '—')}</span></td>
    <td class="mono">${escapeHtml(phone)}</td>
    <td class="mono">${escapeHtml(dur)}</td>
    <td style="max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-muted)">${msg}</td>`;

  tr.addEventListener('click', () => {
    const meta = e.metadata || e.meta || {};
    openDrawer(`
      <div class="drawer__header">
        <span class="drawer__title">Detalhe da execução</span>
        <button class="btn btn--ghost btn--icon" onclick="closeDrawer()" aria-label="Fechar">${icon('x', 16)}</button>
      </div>
      <div class="drawer__body">
        <div style="display:flex;flex-direction:column;gap:.75rem">
          <div>${execStatusBadge(e.status)}</div>
          <div class="field"><label>Horário</label><div class="mono">${escapeHtml(fmtDate(e.created_at || e.timestamp))}</div></div>
          <div class="field"><label>Flow</label><div class="mono">${escapeHtml(e.flow_id || e.workflow_id || '—')}</div></div>
          <div class="field"><label>Evento</label><div class="mono">${escapeHtml(e.event_type || '—')}</div></div>
          <div class="field"><label>Telefone</label><div class="mono">${escapeHtml(e.telefone || e.phone || e.from || '—')}</div></div>
          <div class="field"><label>Duração</label><div class="mono">${escapeHtml(fmtDuration(e.duration_ms || e.duration || null))}</div></div>
          ${e.error_summary ? `<div class="field"><label>Erro</label><div class="mono" style="color:var(--danger)">${escapeHtml(e.error_summary)}</div></div>` : ''}
          ${e.mensagem || e.message ? `<div class="field"><label>Mensagem</label><div class="mono">${escapeHtml(e.mensagem || e.message)}</div></div>` : ''}
          <div class="field"><label>Metadata</label><pre>${escapeHtml(JSON.stringify(meta, null, 2))}</pre></div>
        </div>
      </div>`);
  });
  return tr;
}

function renderExecTable(logs) {
  if (!logs.length) {
    return `<div class="empty-state">${icon('inbox', 36)}<div class="empty-state__title">Nenhuma execução no período</div><p class="empty-state__text">Ajuste os filtros ou aguarde novas execuções.</p></div>`;
  }
  const rows = logs.map(e => buildExecRow(e).outerHTML).join('');
  return `<div class="table-wrap"><table class="table">
    <thead><tr>
      <th style="width:32px"></th>
      <th>Hora</th><th>Flow</th><th>Evento</th><th>Telefone</th><th>Duração</th><th>Mensagem</th>
    </tr></thead>
    <tbody>${rows}</tbody>
  </table></div>`;
}

async function loadExecData() {
  const sec = document.querySelector('#sec-execucoes');
  const tableWrap = sec.querySelector('#exec-table-wrap');
  const kpiWrap   = sec.querySelector('#exec-kpis');
  if (!tableWrap) return;

  tableWrap.innerHTML = `<div class="skeleton-block" style="height:220px"></div>`;
  kpiWrap.innerHTML   = `<div class="kpi-grid">${'<div class="kpi-card"><div class="skeleton" style="height:28px;width:80px;margin-bottom:.5rem"></div><div class="skeleton" style="width:80px"></div></div>'.repeat(4)}</div>`;

  const { hours, status, bot, q } = _execFilters;
  const params = new URLSearchParams();
  if (hours)  params.set('hours',  hours);
  if (status) params.set('status', status);
  if (bot)    params.set('bot',    bot);
  if (q)      params.set('q',      q);
  const qs = params.toString() ? '?' + params.toString() : '';

  try {
    const [logs, summary] = await Promise.allSettled([
      api('/api/flow-logs' + qs),
      api('/api/flow-logs/summary' + qs),
    ]);

    const arr = logs.status === 'fulfilled' ? (Array.isArray(logs.value) ? logs.value : (logs.value?.data || logs.value?.logs || [])) : [];
    _execLogs = arr;

    const sum = summary.status === 'fulfilled' ? summary.value : {};
    const total   = sum?.total   ?? arr.length;
    const success = sum?.success ?? arr.filter(e => (e.status || '').toLowerCase() === 'success').length;
    const errors  = sum?.errors  ?? arr.filter(e => (e.status || '').toLowerCase() === 'error').length;
    const rate    = total > 0 ? Math.round((success / total) * 100) : 0;
    const rateColor = rate >= 90 ? 'var(--success)' : rate >= 70 ? 'var(--warning)' : 'var(--danger)';

    kpiWrap.innerHTML = `<div class="kpi-grid">
      <div class="kpi-card"><div class="kpi-card__icon" style="background:var(--info-bg);color:var(--info)">${icon('activity',18)}</div><div class="kpi-card__value">${fmtNum(total)}</div><div class="kpi-card__label">Total</div></div>
      <div class="kpi-card"><div class="kpi-card__icon" style="background:var(--success-bg);color:var(--success)">${icon('check-circle-2',18)}</div><div class="kpi-card__value">${fmtNum(success)}</div><div class="kpi-card__label">Sucesso</div></div>
      <div class="kpi-card"><div class="kpi-card__icon" style="background:var(--danger-bg);color:var(--danger)">${icon('alert-triangle',18)}</div><div class="kpi-card__value">${fmtNum(errors)}</div><div class="kpi-card__label">Erros</div></div>
      <div class="kpi-card"><div class="kpi-card__icon" style="background:var(--warning-bg);color:var(--warning)">${icon('zap',18)}</div><div class="kpi-card__value" style="color:${rateColor}">${rate}%</div><div class="kpi-card__label">Taxa de sucesso</div></div>
    </div>`;

    // Re-render rows with real DOM nodes so event listeners work
    if (!arr.length) {
      tableWrap.innerHTML = `<div class="empty-state">${icon('inbox',36)}<div class="empty-state__title">Nenhuma execução no período</div><p class="empty-state__text">Ajuste os filtros ou aguarde novas execuções.</p></div>`;
    } else {
      const tableEl = document.createElement('div');
      tableEl.className = 'table-wrap';
      const tbl = document.createElement('table');
      tbl.className = 'table';
      tbl.innerHTML = `<thead><tr><th style="width:32px"></th><th>Hora</th><th>Flow</th><th>Evento</th><th>Telefone</th><th>Duração</th><th>Mensagem</th></tr></thead>`;
      const tbody = document.createElement('tbody');
      arr.forEach(e => tbody.appendChild(buildExecRow(e)));
      tbl.appendChild(tbody);
      tableEl.appendChild(tbl);
      tableWrap.innerHTML = '';
      tableWrap.appendChild(tableEl);
    }
  } catch (err) {
    tableWrap.innerHTML = `<div class="card"><p class="muted">${icon('alert-triangle',14)} Erro: ${escapeHtml(err.message)}</p><button class="btn btn--sm" style="margin-top:.5rem" onclick="loadExecData()">${icon('refresh-cw',14)} Tentar novamente</button></div>`;
  }
}

function startExecSSE(liveBtn) {
  if (_execSSE) return;
  _execSSE = new EventSource('/api/flow-logs/stream');
  _execSSE.onmessage = (ev) => {
    try {
      const e = JSON.parse(ev.data);
      const tbody = document.querySelector('#sec-execucoes .table tbody');
      if (tbody) {
        const firstRow = buildExecRow(e);
        tbody.insertBefore(firstRow, tbody.firstChild);
        // Trim to 100
        while (tbody.children.length > 100) tbody.removeChild(tbody.lastChild);
      }
    } catch (_) {}
  };
  _execSSE.onerror = () => { stopExecSSE(liveBtn); };
  liveBtn.classList.add('btn--success');
  liveBtn.innerHTML = `<span class="live-dot"></span> Ao vivo`;
}

function stopExecSSE(liveBtn) {
  if (_execSSE) { _execSSE.close(); _execSSE = null; }
  liveBtn.classList.remove('btn--success');
  liveBtn.innerHTML = `${icon('activity', 14)} Ao vivo`;
}

  const sec = document.querySelector('#sec-execucoes');
  sec.innerHTML = `

        <p class="muted">Log de execuções dos bots</p>

    <div class="filter-bar" id="exec-filter-bar">

      <button class="btn btn--sm" id="exec-live-btn" aria-label="Ativar monitoramento ao vivo">${icon('activity',14)} Ao vivo</button>
      <button class="btn btn--sm btn--ghost btn--icon" id="exec-refresh-btn" aria-label="Recarregar execuções">${icon('refresh-cw',14)}</button>
    </div>
    <div id="exec-kpis"></div>
    <div id="exec-table-wrap"><div class="skeleton-block" style="height:220px"></div></div>`;

  // Populate bot filter
  try {
    const wfs = await api('/api/workflows');
    const arr = Array.isArray(wfs) ? wfs : (wfs.workflows || wfs.data || []);
    const sel = sec.querySelector('#exec-filter-bot');
    arr.forEach(w => {
      const opt = document.createElement('option');
      opt.value = w.workflow_id || w.id || w.slug || w.name;
      opt.textContent = w.name || w.workflow_id || w.id;
      sel.appendChild(opt);
    });
  } catch (_) {}

  // Period pills
  sec.querySelector('#exec-period-pills').addEventListener('click', (ev) => {
    const btn = ev.target.closest('.pill');
    if (!btn) return;
    sec.querySelectorAll('#exec-period-pills .pill').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    _execFilters.hours = btn.dataset.h;
    loadExecData();
  });

  // Filters
  sec.querySelector('#exec-filter-status').addEventListener('change', (ev) => { _execFilters.status = ev.target.value; loadExecData(); });
  sec.querySelector('#exec-filter-bot').addEventListener('change', (ev) => { _execFilters.bot = ev.target.value; loadExecData(); });
  let _execDebounce;
  sec.querySelector('#exec-search').addEventListener('input', (ev) => {
    clearTimeout(_execDebounce);
    _execDebounce = setTimeout(() => { _execFilters.q = ev.target.value; loadExecData(); }, 450);
  });

  // Live toggle
  const liveBtn = sec.querySelector('#exec-live-btn');
  liveBtn.addEventListener('click', () => {
    if (_execSSE) stopExecSSE(liveBtn); else startExecSSE(liveBtn);
  });

  // Refresh
  sec.querySelector('#exec-refresh-btn').addEventListener('click', loadExecData);

  loadExecData();
}

const COL_LABELS = {
  id: 'ID', nome: 'Nome', telefone: 'Telefone', telefone_masked: 'Telefone',
  mensagem_inicial: 'Mensagem', origem: 'Origem', criado_em: 'Criado em',
  created_at: 'Criado em', updated_at: 'Atualizado em',
  servico: 'Serviço', data_solicitada: 'Data solicitada',
  status: 'Status', date: 'Data', count: 'Mensagens', total: 'Total',
};

function colLabel(k) { return COL_LABELS[k] || k.replace(/_/g,' ').replace(/\b\w/g, c => c.toUpperCase()); }

function renderGenericTable(rows, hideCols = []) {
  if (!rows || !rows.length) return `<div class="empty-state">${icon('inbox',36)}<div class="empty-state__title">Nenhum registro encontrado</div></div>`;
  const keys = Object.keys(rows[0]).filter(k => !hideCols.includes(k));
  const thead = keys.map(k => `<th>${escapeHtml(colLabel(k))}</th>`).join('');
  const tbody = rows.map(r => `<tr>${keys.map(k => {
    const v = r[k];
    const isDate = k.endsWith('_at') || k === 'criado_em' || k === 'data_solicitada';
    const display = isDate ? fmtDate(v) : escapeHtml(String(v ?? '—'));
    const isMono = k === 'id' || k === 'telefone' || k === 'telefone_masked';
    return `<td${isMono ? ' class="mono"' : ''}>${display}</td>`;
  }).join('')}</tr>`).join('');
  return `<div class="table-wrap"><table class="table"><thead><tr>${thead}</tr></thead><tbody>${tbody}</tbody></table></div>`;
}

function renderBarChart(data) {
  if (!data || !data.length) return `<div class="empty-state">${icon('bar-chart-2',36)}<div class="empty-state__title">Sem dados no período</div></div>`;
  const max = Math.max(...data.map(d => d.count || d.total || 0), 1);
  const cols = data.map(d => {
    const val = d.count || d.total || 0;
    const pct  = Math.round((val / max) * 100);
    const lbl  = (() => { try { const dt = new Date(d.date || d.day || d.created_at); return `${String(dt.getDate()).padStart(2,'0')}/${String(dt.getMonth()+1).padStart(2,'0')}`; } catch(_){return d.date||'';} })();
    return `<div class="bar-chart__col">
      <span class="bar-chart__val">${val}</span>
      <div class="bar-chart__bar" style="height:${pct}%;min-height:2px" title="${val} mensagens"></div>
      <span class="bar-chart__lbl">${escapeHtml(lbl)}</span>
    </div>`;
  }).join('');
  return `<div class="bar-chart">${cols}</div>`;
}
