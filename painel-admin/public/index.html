async function loadCfgFluxos(content) {
  try {
    const [wfsData, routingData] = await Promise.allSettled([
      api('/api/workflows'),
      _cfgRoutingCache ? Promise.resolve(_cfgRoutingCache) : api('/api/routing'),
    ]);
    const wfs = wfsData.status === 'fulfilled' ? (Array.isArray(wfsData.value) ? wfsData.value : (wfsData.value?.workflows || wfsData.value?.data || [])) : [];
    if (routingData.status === 'fulfilled') _cfgRoutingCache = routingData.value;
    const routing = _cfgRoutingCache || [];
    const routingArr = Array.isArray(routing) ? routing : (routing.routes || routing.rules || []);

    if (!wfs.length) {
      content.innerHTML = `<div class="empty-state">${icon('settings',36)}<div class="empty-state__title">Nenhum fluxo encontrado</div></div>`;
      return;
    }

    const wrap = document.createElement('div');
    wrap.style.cssText = 'display:flex;flex-direction:column;gap:.75rem';

    wfs.forEach(w => {
      const wId = w.workflow_id || w.id;
      const clients = routingArr.filter(r => r.workflow_id === wId || r.bot_slot === w.bot_slot).length;
      const isActive = w.active !== false;

      const card = document.createElement('div');
      card.className = 'card';
      card.style.cssText = 'display:flex;align-items:center;gap:1rem;flex-wrap:wrap';

      const av = botAvatar(w.workflow_id || w.name || 'w', 36);
      card.appendChild(av);

      const info = document.createElement('div');
      info.style.cssText = 'flex:1;min-width:120px';
      info.innerHTML = `<div class="h3">${escapeHtml(w.name || w.workflow_id || '—')}</div><div class="muted mono" style="font-size:.75rem">${escapeHtml(w.workflow_id || w.source || '')}</div><div class="subtle" style="margin-top:2px">${fmtNum(clients)} cliente${clients !== 1 ? 's' : ''} roteado${clients !== 1 ? 's' : ''}</div>`;
      card.appendChild(info);

      const badge = document.createElement('span');
      badge.className = `badge ${isActive ? 'badge--success' : 'badge--muted'}`;
      badge.textContent = isActive ? 'Ativo' : 'Inativo';
      card.appendChild(badge);

      // Toggle
      const toggleLabel = document.createElement('label');
      toggleLabel.className = 'toggle';
      toggleLabel.setAttribute('aria-label', `${isActive ? 'Desativar' : 'Ativar'} fluxo ${w.name || wId}`);
      const chk = document.createElement('input');
      chk.type = 'checkbox';
      chk.checked = isActive;
      const track = document.createElement('span');
      track.className = 'toggle__track';
      toggleLabel.appendChild(chk);
      toggleLabel.appendChild(track);
      card.appendChild(toggleLabel);

      chk.addEventListener('change', async () => {
        chk.disabled = true;
        try {
          await api(`/api/workflows/${encodeURIComponent(wId)}/active`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ active: chk.checked }),
          });
          badge.className = `badge ${chk.checked ? 'badge--success' : 'badge--muted'}`;
          badge.textContent = chk.checked ? 'Ativo' : 'Inativo';
          toast(`Fluxo ${chk.checked ? 'ativado' : 'desativado'} com sucesso.`, 'success');
        } catch (err) {
          chk.checked = !chk.checked;
          toast('Erro: ' + err.message, 'danger');
        } finally {
          chk.disabled = false;
        }
      });

      // Palavras-chave
      const kwBtn = document.createElement('button');
      kwBtn.className = 'btn btn--sm';
      kwBtn.innerHTML = `${icon('pencil', 13)} Palavras-chave`;
      kwBtn.addEventListener('click', () => openPauseKeywordsModal(wId));
      card.appendChild(kwBtn);

      wrap.appendChild(card);
    });

    content.innerHTML = '';
    content.appendChild(wrap);
  } catch (err) {
    content.innerHTML = `<div class="card"><p class="muted">${icon('alert-triangle',14)} Erro: ${escapeHtml(err.message)}</p></div>`;
  }
}

function openPauseKeywordsModal(workflowId) {
  openModal(`
    <div class="modal__header">
      <span class="modal__title">Palavras-chave de pausa</span>
      <button class="btn btn--ghost btn--icon" onclick="closeModal()" aria-label="Fechar">${icon('x',16)}</button>
    </div>
    <div id="kw-loading" style="text-align:center;padding:1rem"><div class="spinner" style="margin:auto"></div></div>
    <div id="kw-form" style="display:none">
      <div class="field" style="margin-bottom:1rem">
        <label for="kw-pause">Pausar (uma por linha)</label>
        <textarea id="kw-pause" rows="5" placeholder="pausar&#10;parar&#10;stop"></textarea>
      </div>
      <div class="field" style="margin-bottom:1rem">
        <label for="kw-resume">Retomar (uma por linha)</label>
        <textarea id="kw-resume" rows="5" placeholder="retomar&#10;continuar&#10;go"></textarea>
      </div>
      <button class="btn btn--primary" id="kw-save-btn" style="width:100%">${icon('check-circle-2',14)} Salvar palavras-chave</button>
    </div>`);

  api(`/api/workflows/${encodeURIComponent(workflowId)}/pause-keywords`)
    .then(data => {
      document.getElementById('kw-loading').style.display = 'none';
      const form = document.getElementById('kw-form');
      form.style.display = 'block';
      document.getElementById('kw-pause').value  = (data?.pause  || data?.pause_keywords  || []).join('\n');
      document.getElementById('kw-resume').value = (data?.resume || data?.resume_keywords || []).join('\n');

      document.getElementById('kw-save-btn').addEventListener('click', async () => {
        const btn = document.getElementById('kw-save-btn');
        btn.disabled = true;
        try {
          const pause  = document.getElementById('kw-pause').value.split('\n').map(s=>s.trim()).filter(Boolean);
          const resume = document.getElementById('kw-resume').value.split('\n').map(s=>s.trim()).filter(Boolean);
          await api(`/api/workflows/${encodeURIComponent(workflowId)}/pause-keywords`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ pause, resume }),
          });
          toast('Palavras-chave salvas!', 'success');
          closeModal();
        } catch (err) {
          toast('Erro ao salvar: ' + err.message, 'danger');
          btn.disabled = false;
        }
      });
    })
    .catch(err => {
      document.getElementById('kw-loading').innerHTML = `<p class="muted">${icon('alert-triangle',14)} Erro: ${escapeHtml(err.message)}</p>`;
    });
}

async function loadCfgLimpeza(content) {
  content.innerHTML = `<div style="display:flex;flex-direction:column;gap:1rem">
    <div class="card" id="cfg-cleanup-status"><div class="skeleton" style="height:80px"></div></div>
    <div class="card" id="cfg-cleanup-manual">
      <h3 class="h3" style="margin-bottom:.75rem">Limpar logs antigos manualmente</h3>
      <div style="display:flex;align-items:center;gap:.75rem;flex-wrap:wrap">
        <div class="field" style="flex:0 0 auto">
          <label for="cfg-days-input">Manter últimos N dias</label>
          <input type="number" id="cfg-days-input" value="30" min="1" max="365" style="width:100px" />
        </div>
        <button class="btn btn--danger" id="cfg-prune-btn" style="margin-top:1.25rem">${icon('trash-2',14)} Executar limpeza agora</button>
      </div>
    </div>
  </div>`;

  // Status card
  try {
    const status = await api('/api/cleanup/status');
    const s = status || {};
    content.querySelector('#cfg-cleanup-status').innerHTML = `
      <h3 class="h3" style="margin-bottom:.75rem">Status do cron de limpeza</h3>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:.75rem">
        <div class="field"><label>Última execução</label><div class="mono">${fmtDate(s.last_run || s.lastRun)}</div></div>
        <div class="field"><label>Próxima execução</label><div class="mono">${fmtDate(s.next_run || s.nextRun)}</div></div>
        <div class="field"><label>Intervalo</label><div class="mono">${escapeHtml(s.interval || s.schedule || '—')}</div></div>
        <div class="field"><label>Tabelas</label><div class="mono">${escapeHtml((s.tables || []).join(', ') || '—')}</div></div>
      </div>`;
  } catch (_) {
    content.querySelector('#cfg-cleanup-status').innerHTML = `<h3 class="h3" style="margin-bottom:.5rem">Status do cron de limpeza</h3><p class="muted">Não disponível</p>`;
  }

  // Manual prune
  content.querySelector('#cfg-prune-btn').addEventListener('click', () => {
    const days = parseInt(content.querySelector('#cfg-days-input').value, 10) || 30;
    openModal(`
      <div class="modal__header">
        <span class="modal__title">Confirmar limpeza</span>
        <button class="btn btn--ghost btn--icon" onclick="closeModal()" aria-label="Fechar">${icon('x',16)}</button>
      </div>
      <p style="margin:.5rem 0 1.25rem">Remover logs com mais de <strong>${days} dias</strong>? Esta ação não pode ser desfeita.</p>
      <div style="display:flex;gap:.75rem;justify-content:flex-end">
        <button class="btn" onclick="closeModal()">Cancelar</button>
        <button class="btn btn--danger" id="confirm-prune-btn">${icon('trash-2',14)} Confirmar limpeza</button>
      </div>`);

    document.getElementById('confirm-prune-btn').addEventListener('click', async () => {
      const btn = document.getElementById('confirm-prune-btn');
      btn.disabled = true;
      try {
        const result = await api('/api/flow-logs/prune', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ days }),
        });
        const deleted = result?.deleted ?? result?.count ?? '?';
        toast(`Limpeza concluída: ${deleted} registro(s) removido(s).`, 'success');
        closeModal();
      } catch (err) {
        toast('Erro na limpeza: ' + err.message, 'danger');
        btn.disabled = false;
      }
    });
  });
}

/* ══════════════════════════════════════════════════════════════════
   NAVIGATION
   ══════════════════════════════════════════════════════════════════ */
const NAV_ITEMS = [
  { id: 'dashboard',     label: 'Dashboard',      icon: 'layout-dashboard', render: renderDashboard },
  { id: 'bots',          label: 'Bots',            icon: 'bot',              render: renderBots },
  { id: 'execucoes',     label: 'Execuções',       icon: 'activity',         render: renderExecucoes },
  { id: 'relatorios',    label: 'Relatórios',      icon: 'bar-chart-2',      render: renderRelatorios },
  { id: 'configuracoes', label: 'Configurações',   icon: 'settings',         render: renderConfig },
];

let _activeSection = localStorage.getItem('paineladmin:section') || 'dashboard';
let _rendered = {};

function buildNav() {
  const nav = document.getElementById('sidebar-nav');
  nav.innerHTML = '';
  NAV_ITEMS.forEach(item => {
    const btn = document.createElement('button');
    btn.className = 'nav-item' + (_activeSection === item.id ? ' active' : '');
    btn.dataset.section = item.id;
    btn.innerHTML = `<span class="nav-icon">${icon(item.icon, 18)}</span><span>${item.label}</span>`;
    btn.addEventListener('click', () => navigateTo(item.id));
    nav.appendChild(btn);
  });
}

function navigateTo(sectionId) {
  _activeSection = sectionId;
  localStorage.setItem('paineladmin:section', sectionId);

  // Update sections visibility
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  const target = document.getElementById(`sec-${sectionId}`);
  if (target) target.classList.add('active');

  // Update nav active state
  document.querySelectorAll('.nav-item').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.section === sectionId);
  });

  // Close mobile sidebar
  closeSidebar();

  // Fecha SSE se sair da seção execuções
  if (sectionId !== 'execucoes' && _execSSE) {
    const liveBtn = document.querySelector('#exec-live-btn');
    if (liveBtn) stopExecSSE(liveBtn); else { _execSSE.close(); _execSSE = null; }
  }

  // Render if not yet rendered (or always re-render dashboard for freshness)
  const item = NAV_ITEMS.find(i => i.id === sectionId);
  if (item && (sectionId === 'dashboard' || !_rendered[sectionId])) {
    _rendered[sectionId] = true;
    item.render();
  }
}

/* ── Mobile sidebar ─────────────────────────────────────────────── */
function openSidebar() {
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('sidebar-backdrop').classList.add('open');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebar-backdrop').classList.remove('open');
}

/* ══════════════════════════════════════════════════════════════════
   BOOTSTRAP
   ══════════════════════════════════════════════════════════════════ */
(function init() {
  // Hamburger icon
  const hambBtn = document.getElementById('btn-hamburger');
  if (hambBtn) {
    hambBtn.innerHTML = icon('menu', 20);
    hambBtn.addEventListener('click', openSidebar);
  }

  // Backdrop click to close
  document.getElementById('sidebar-backdrop').addEventListener('click', closeSidebar);

  // Modal close on backdrop click
  document.getElementById('modal-backdrop').addEventListener('click', (e) => {
    if (e.target === e.currentTarget) closeModal();
  });

  // Lightbox close
  document.getElementById('lightbox-close').addEventListener('click', closeLightbox);
  document.getElementById('lightbox').addEventListener('click', (e) => {
    if (e.target === e.currentTarget) closeLightbox();
  });

  // Refresh dashboard button
  const refreshBtn = document.getElementById('btn-refresh-dash');
  if (refreshBtn) {
    refreshBtn.innerHTML = `${icon('refresh-cw',14)} Atualizar`;
    refreshBtn.addEventListener('click', renderDashboard);
  }

  // Build navigation
  buildNav();

  // Activate stored or default section
  document.getElementById(`sec-${_activeSection}`)?.classList.add('active');
  const initItem = NAV_ITEMS.find(i => i.id === _activeSection);
  if (initItem) {
    _rendered[_activeSection] = true;
    initItem.render();
  }

  // Keyboard ESC closes modal / lightbox / drawer
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      closeModal();
      closeLightbox();
      closeDrawer();
    }
  });

  // Fechar SSE antes de sair da página
  window.addEventListener('beforeunload', () => {
    if (_execSSE) { _execSSE.close(); _execSSE = null; }
  });
})();
</script>
