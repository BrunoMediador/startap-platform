function openLinkMediaModal(slot, courseSlug, medias, parentEl) {
  const videos = medias.filter(m => (m.media_type || '').toLowerCase() === 'video');
  const linkedHere  = videos.filter(m => m.course_slug === courseSlug);
  const linkedOther = videos.filter(m => m.course_slug && m.course_slug !== courseSlug);
  const available   = videos.filter(m => !m.course_slug);
  const atLimit     = linkedHere.length >= 5;

  function buildRow(m, group) {
    const name = escapeHtml(m.title || m.nome || m.filename || m.original_name
      || (m.url ? m.url.split('/').pop().split('?')[0] : '')
      || `Mídia #${m.position_order ?? m.position ?? m.id}`);
    const isIntro = m.is_course_intro === true || m.is_course_intro === 1;
    if (group === 'linked') {
      const introBadge = isIntro
        ? `<span class="course-slug-badge course-slug-badge--warning" style="font-size:.7rem;flex-shrink:0">${icon('star',10)} apresentação</span>`
        : `<button class="btn btn--ghost btn--sm js-set-intro-modal" data-id="${m.id}" title="Definir como apresentação" style="font-size:.75rem;flex-shrink:0;white-space:nowrap">${icon('star',12)} Definir intro</button>`;
      return `<div class="link-media-row" data-id="${m.id}">
        <span class="link-media-row__name">${name}</span>
        ${introBadge}
        <button class="btn btn--ghost btn--sm js-unlink-media" data-id="${m.id}" title="Desvincular" style="flex-shrink:0">${icon('link-2-off',13)} Desvincular</button>
      </div>`;
    }
    if (group === 'other') {
      return `<div class="link-media-row link-media-row--disabled" data-id="${m.id}">
        <span class="link-media-row__name">${name}</span>
        <span class="course-slug-badge" style="flex-shrink:0">${escapeHtml(m.course_slug)}</span>
      </div>`;
    }
    // available
    return `<div class="link-media-row" data-id="${m.id}">
      <span class="link-media-row__name">${name}</span>
      ${atLimit ? '' : `<button class="btn btn--primary btn--sm js-link-media" data-id="${m.id}" title="Vincular">${icon('link',13)} Vincular</button>`}
    </div>`;
  }

  const linkedHtml  = linkedHere.length  ? linkedHere.map(m => buildRow(m, 'linked')).join('')  : `<p class="muted" style="font-size:.8rem;padding:.375rem 0">Nenhuma mídia vinculada.</p>`;
  const otherHtml   = linkedOther.length ? linkedOther.map(m => buildRow(m, 'other')).join('')  : '';
  const availHtml   = available.length   ? available.map(m => buildRow(m, 'free')).join('')     : `<p class="muted" style="font-size:.8rem;padding:.375rem 0">Nenhum vídeo disponível.</p>`;
  const limitHint   = atLimit ? `<p class="muted" style="font-size:.75rem;margin:.25rem 0 .5rem;color:var(--warning)">${icon('alert-triangle',12)} Limite de 5 mídias por curso atingido.</p>` : '';

  openModal(`
    <div class="modal__header">
      <span class="modal__title">${icon('link',15)} Vincular mídia — <span class="course-slug-badge">${escapeHtml(courseSlug)}</span></span>
      <button class="btn btn--ghost btn--icon" onclick="closeModal()" aria-label="Fechar">${icon('x', 16)}</button>
    </div>
    <div id="link-status"></div>
    <div class="link-media-group">
      <div class="link-media-group__title">Vinculadas a este curso (${linkedHere.length}/5)</div>
      ${limitHint}
      <div id="linked-here-list">${linkedHtml}</div>
    </div>
    ${linkedOther.length ? `<div class="link-media-group"><div class="link-media-group__title">Vinculadas a outros cursos (somente leitura)</div>${otherHtml}</div>` : ''}
    <div class="link-media-group">
      <div class="link-media-group__title">Disponíveis (biblioteca livre)</div>
      <div id="available-list">${availHtml}</div>
    </div>
    <div style="margin-top:.75rem;display:flex;justify-content:flex-end">
      <button class="btn btn--ghost" onclick="closeModal()">Fechar</button>
    </div>
  `);

  const modalEl = document.getElementById('modal-backdrop');

  // definir apresentação — botão explícito no modal (usa endpoint dedicado /intro/:media_id)
  modalEl.querySelectorAll('.js-set-intro-modal').forEach(btn => {
    btn.addEventListener('click', async () => {
      btn.disabled = true;
      const statusDiv = document.getElementById('link-status');
      try {
        await api(`/api/bots/${slot}/courses/${courseSlug}/intro/${btn.dataset.id}`, {
          method: 'PUT',
        });
        toast('Vídeo de apresentação definido.', 'success');
        closeModal();
        await renderBotCourses(slot, parentEl);
      } catch (err) {
        if (statusDiv) statusDiv.innerHTML = `<p style="color:var(--danger);font-size:.8rem;margin-bottom:.5rem">${icon('alert-triangle',13)} ${escapeHtml(err.message)}</p>`;
        btn.disabled = false;
      }
    });
  });

  // vincular
  modalEl.querySelectorAll('.js-link-media').forEach(btn => {
    btn.addEventListener('click', async () => {
      btn.disabled = true;
      const statusDiv = document.getElementById('link-status');
      try {
        await api(`/api/bots/${slot}/media/${btn.dataset.id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ course_slug: courseSlug }),
        });
        toast('Mídia vinculada.', 'success');
        closeModal();
        const newMedias = await api(`/api/bots/${slot}/media`);
        const arr = Array.isArray(newMedias) ? newMedias : (newMedias.media || newMedias.items || []);
        openLinkMediaModal(slot, courseSlug, arr, parentEl);
      } catch (err) {
        if (statusDiv) statusDiv.innerHTML = `<p style="color:var(--danger);font-size:.8rem;margin-bottom:.5rem">${icon('alert-triangle',13)} ${escapeHtml(err.message)}</p>`;
        btn.disabled = false;
      }
    });
  });

  // desvincular
  modalEl.querySelectorAll('.js-unlink-media').forEach(btn => {
    btn.addEventListener('click', async () => {
      btn.disabled = true;
      const statusDiv = document.getElementById('link-status');
      try {
        await api(`/api/bots/${slot}/media/${btn.dataset.id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ course_slug: null, is_course_intro: false }),
        });
        toast('Mídia desvinculada.', 'success');
        closeModal();
        const newMedias = await api(`/api/bots/${slot}/media`);
        const arr = Array.isArray(newMedias) ? newMedias : (newMedias.media || newMedias.items || []);
        openLinkMediaModal(slot, courseSlug, arr, parentEl);
      } catch (err) {
        if (statusDiv) statusDiv.innerHTML = `<p style="color:var(--danger);font-size:.8rem;margin-bottom:.5rem">${icon('alert-triangle',13)} ${escapeHtml(err.message)}</p>`;
        btn.disabled = false;
      }
    });
  });
}

function _buildFilePreviewHtml(file) {
  if (!file) return '';
  if (file.type.startsWith('image/')) {
    const url = URL.createObjectURL(file);
    return `<div class="upload-preview"><img src="${url}" alt="preview"></div>`;
  }
  const t = mediaMimeToType(file.type);
  const icons = { video: 'film', audio: 'music', doc: 'file-text', other: 'file' };
  return `<div class="upload-preview"><div class="upload-preview-icon">${icon(icons[t]||'file',32)}<span>${escapeHtml(file.name)}</span></div></div>`;
}

function openAddMediaModal(slot, parentEl) {
  openModal(`
    <div class="modal__header">
      <span class="modal__title">Adicionar mídia</span>
      <button class="btn btn--ghost btn--icon" onclick="closeModal()" aria-label="Fechar">${icon('x', 16)}</button>
    </div>
    <div id="upload-status"></div>
    <label class="upload-area" for="media-file-input" id="upload-label">
      <input type="file" id="media-file-input" accept="image/*,video/*,audio/*,.pdf,.doc,.docx,.txt,.odt" />
      ${icon('upload-cloud', 32)}
      <p style="margin:.5rem 0 0">Clique para selecionar ou arraste o arquivo</p>
      <p class="muted" style="margin:.25rem 0 0">Imagem, vídeo, áudio, PDF, Word, TXT</p>
    </label>
    <div id="upload-file-preview"></div>
    <div style="margin-top:.875rem">
      <label class="label" for="media-context-input">Contexto para IA <span style="color:var(--danger)">*</span></label>
      <textarea id="media-context-input" class="input" rows="3" placeholder="Descreva quando a IA deve enviar esta mídia. Ex: 'Cardápio de cortes com preços. Enviar quando cliente perguntar serviços ou valores.'" style="resize:vertical"></textarea>
    </div>
    <div style="margin-top:.625rem">
      <label class="label" for="media-caption-input">Legenda (opcional)</label>
      <input id="media-caption-input" class="input" type="text" placeholder="Legenda enviada junto com a mídia">
    </div>
    <div id="upload-progress-wrap" style="display:none;margin-top:.75rem">
      <div class="upload-progress"><div class="upload-progress__bar" id="upload-bar"></div></div>
      <p class="muted" style="font-size:.75rem;margin:.25rem 0 0" id="upload-label-text">Preparando…</p>
    </div>
    <button class="btn btn--primary" id="btn-do-upload" style="margin-top:1rem;width:100%" disabled>${icon('upload-cloud',14)} Upload e adicionar</button>
  `);

  const fileInput = document.getElementById('media-file-input');
  const uploadBtn = document.getElementById('btn-do-upload');
  const statusDiv = document.getElementById('upload-status');
  const previewDiv = document.getElementById('upload-file-preview');
  const progressWrap = document.getElementById('upload-progress-wrap');
  const progressBar = document.getElementById('upload-bar');
  const progressLabel = document.getElementById('upload-label-text');
  const contextInput = document.getElementById('media-context-input');
  const captionInput = document.getElementById('media-caption-input');

  fileInput.addEventListener('change', () => {
    const f = fileInput.files[0];
    if (!f) { previewDiv.innerHTML = ''; uploadBtn.disabled = true; return; }
    previewDiv.innerHTML = _buildFilePreviewHtml(f);
    uploadBtn.disabled = false;
  });


  // ── Drag-and-drop ───────────────────────────────────────────────────────────────────────
  const uploadLabel = document.getElementById('upload-label');

  function _handleDropFile(file) {
    if (!file) return;
    const dt = new DataTransfer();
    dt.items.add(file);
    fileInput.files = dt.files;
    previewDiv.innerHTML = _buildFilePreviewHtml(file);
    uploadBtn.disabled = false;
  }

  uploadLabel.addEventListener('dragenter', (e) => {
    e.preventDefault();
    uploadLabel.classList.add('upload-area--active');
  });

  uploadLabel.addEventListener('dragover', (e) => {
    e.preventDefault();
    uploadLabel.classList.add('upload-area--active');
  });

  uploadLabel.addEventListener('dragleave', (e) => {
    if (!uploadLabel.contains(e.relatedTarget)) {
      uploadLabel.classList.remove('upload-area--active');
    }
  });

  uploadLabel.addEventListener('drop', (e) => {
    e.preventDefault();
    uploadLabel.classList.remove('upload-area--active');
    const file = (e.dataTransfer.files && e.dataTransfer.files[0]) || null;
    _handleDropFile(file);
  });
  // ───────────────────────────────────────────────────────────────────────────
  uploadBtn.addEventListener('click', async () => {
    if (!fileInput.files.length) return;
    const context = contextInput.value.trim();
    if (!context) {
      contextInput.focus();
      statusDiv.innerHTML = `<p style="color:var(--danger);font-size:.8rem;margin-bottom:.5rem">${icon('alert-triangle',13)} Contexto para IA é obrigatório.</p>`;
      return;
    }
    uploadBtn.disabled = true;
    statusDiv.innerHTML = '';
    progressWrap.style.display = 'block';
    progressBar.style.width = '10%';
    progressLabel.textContent = 'Subindo arquivo…';

    try {
      const fd = new FormData();
      fd.append('file', fileInput.files[0]);
      progressBar.style.width = '40%';
      const uploaded = await api('/api/uploads/media', { method: 'POST', body: fd });
      // file_id garantido pelo backend padronizado
      const url = uploaded.url;
      const mime = uploaded.mime_type;
      if (!url) throw new Error('servidor nao retornou url do arquivo');

      progressBar.style.width = '70%';
      progressLabel.textContent = 'Registrando mídia…';

      await api(`/api/bots/${slot}/media`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          url,
          media_type: mediaMimeToType(mime),
          context: context,
          caption: captionInput.value.trim() || null,
        }),
      });

      progressBar.style.width = '100%';
      progressLabel.textContent = 'Concluído!';
      toast('Mídia adicionada com sucesso!', 'success');
      closeModal();
      await renderBotMedia(slot, parentEl);
    } catch (err) {
      progressWrap.style.display = 'none';
      statusDiv.innerHTML = `<p style="color:var(--danger);font-size:.8rem;margin-bottom:.5rem">${icon('alert-triangle',13)} ${escapeHtml(err.message)}</p>`;
      uploadBtn.disabled = false;
    }
  });
}

    saveBtn.disabled = true;
    try {
      const courseSlugVal = (courseSelect && isVideo) ? (courseSelect.value || null) : undefined;
      const isCourseIntro = (introCheck && isVideo && courseSlugVal) ? introCheck.checked : (courseSlugVal === null ? false : undefined);
      const body = {
        context: document.getElementById('edit-context-input').value.trim() || null,
        caption: document.getElementById('edit-caption-input').value.trim() || null,
        position_order: Number(document.getElementById('edit-order-input').value) || 0,
      };
      if (isVideo) {
        body.course_slug = courseSlugVal;
        if (courseSlugVal !== null) body.is_course_intro = introCheck ? introCheck.checked : false;
        else body.is_course_intro = false;
      }
      await api(`/api/bots/${slot}/media/${m.id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      toast('Mídia atualizada.', 'success');
      closeModal();
      await renderBotMedia(slot, parentEl);
    } catch (err) {
      statusDiv.innerHTML = `<p style="color:var(--danger);font-size:.8rem;margin-bottom:.5rem">${icon('alert-triangle',13)} ${escapeHtml(err.message)}</p>`;
      saveBtn.disabled = false;
    }
  });
}

function openDrawer(html) {
  document.getElementById('drawer-inner').innerHTML = html;
  document.getElementById('drawer').classList.add('open');
  document.getElementById('drawer-backdrop').classList.add('open');
}
function closeDrawer() {
  const drawerEl = document.getElementById('drawer');
  // Limpa estado de bot selecionado se o drawer era do tipo bot
  if (drawerEl.dataset.drawerType === 'bot') {
    _selectedBot = null;
    document.querySelectorAll('.bot-card.selected, .bot-row.selected').forEach(c => c.classList.remove('selected'));
    delete drawerEl.dataset.drawerType;
  }
  drawerEl.classList.remove('open', 'drawer--wide');
  document.getElementById('drawer-backdrop').classList.remove('open');
  document.getElementById('drawer-inner').innerHTML = '';
}

let _execSSE = null;
let _execFilters = { hours: '24', status: '', bot: '', q: '' };
let _execLogs = [];

function maskPhone(p) {
  const s = String(p || '');
  if (s.length < 6) return s || '—';
  return s.slice(0, 4) + '****' + s.slice(-2);
}

function fmtDuration(ms) {
  if (!ms && ms !== 0) return '—';
  if (ms < 1000) return ms + 'ms';
  return (ms / 1000).toFixed(1) + 's';
}

function execStatusBadge(st) {
  const map = {
    success:    'badge--success',
    error:      'badge--danger',
    running:    'badge--warning',
    ignored:    'badge--muted',
  };
  const labels = { success:'Sucesso', error:'Erro', running:'Em andamento', ignored:'Ignorado' };
  const key = (st || '').toLowerCase();
  const cls = map[key] || 'badge--muted';
  const lbl = labels[key] || escapeHtml(st || '—');
  return `<span class="badge badge--dot ${cls}">${lbl}</span>`;
}

function execStatusIcon(st) {
  const key = (st || '').toLowerCase();
  if (key === 'success') return `<span style="color:var(--success)">${icon('check-circle-2', 14)}</span>`;
  if (key === 'error')   return `<span style="color:var(--danger)">${icon('alert-triangle', 14)}</span>`;
  if (key === 'running') return `<span style="color:var(--warning)">${icon('activity', 14)}</span>`;
  return `<span style="color:var(--text-subtle)">${icon('minus', 14)}</span>`;
}

function buildExecRow(e) {
  const tr = document.createElement('tr');
  tr.style.cursor = 'pointer';
  const phone = maskPhone(e.telefone || e.phone || e.from || '');
  const dur = fmtDuration(e.duration_ms || e.duration || null);
  const msg = escapeHtml((e.mensagem || e.message || e.event_type || '').slice(0, 60));
  tr.innerHTML = `
    <td>${execStatusIcon(e.status)}</td>
    <td class="mono">${escapeHtml(fmtDate(e.created_at || e.timestamp))}</td>
    <td><div style="display:flex;align-items:center;gap:.375rem">${botAvatar(e.flow_id || e.workflow_id || e.bot || 'bot', 20).outerHTML}<span class="mono" style="font-size:.75rem">${escapeHtml((e.flow_id || e.workflow_id || '—').slice(0,16))}</span></div></td>
    <td><span class="badge badge--muted" style="font-family:var(--font-mono)">${escapeHtml(e.event_type || '—')}</span></td>
    <td class="mono">${escapeHtml(phone)}</td>
    <td class="mono">${escapeHtml(dur)}</td>
    <td style="max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-muted)">${msg}</td>`;

  tr.addEventListener('click', () => {
    const meta = e.metadata || e.meta || {};
    openDrawer(`
      <div class="drawer__header">
        <span class="drawer__title">Detalhe da execução</span>
        <button class="btn btn--ghost btn--icon" onclick="closeDrawer()" aria-label="Fechar">${icon('x', 16)}</button>
      </div>
      <div class="drawer__body">
        <div style="display:flex;flex-direction:column;gap:.75rem">
          <div>${execStatusBadge(e.status)}</div>
          <div class="field"><label>Horário</label><div class="mono">${escapeHtml(fmtDate(e.created_at || e.timestamp))}</div></div>
          <div class="field"><label>Flow</label><div class="mono">${escapeHtml(e.flow_id || e.workflow_id || '—')}</div></div>
          <div class="field"><label>Evento</label><div class="mono">${escapeHtml(e.event_type || '—')}</div></div>
          <div class="field"><label>Telefone</label><div class="mono">${escapeHtml(e.telefone || e.phone || e.from || '—')}</div></div>
          <div class="field"><label>Duração</label><div class="mono">${escapeHtml(fmtDuration(e.duration_ms || e.duration || null))}</div></div>
          ${e.error_summary ? `<div class="field"><label>Erro</label><div class="mono" style="color:var(--danger)">${escapeHtml(e.error_summary)}</div></div>` : ''}
          ${e.mensagem || e.message ? `<div class="field"><label>Mensagem</label><div class="mono">${escapeHtml(e.mensagem || e.message)}</div></div>` : ''}
          <div class="field"><label>Metadata</label><pre>${escapeHtml(JSON.stringify(meta, null, 2))}</pre></div>
        </div>
      </div>`);
  });
  return tr;
}

function renderExecTable(logs) {
  if (!logs.length) {
    return `<div class="empty-state">${icon('inbox', 36)}<div class="empty-state__title">Nenhuma execução no período</div><p class="empty-state__text">Ajuste os filtros ou aguarde novas execuções.</p></div>`;
  }
  const rows = logs.map(e => buildExecRow(e).outerHTML).join('');
  return `<div class="table-wrap"><table class="table">
    <thead><tr>
      <th style="width:32px"></th>
      <th>Hora</th><th>Flow</th><th>Evento</th><th>Telefone</th><th>Duração</th><th>Mensagem</th>
    </tr></thead>
    <tbody>${rows}</tbody>
  </table></div>`;
}

async function loadExecData() {
  const sec = document.querySelector('#sec-execucoes');
  const tableWrap = sec.querySelector('#exec-table-wrap');
  const kpiWrap   = sec.querySelector('#exec-kpis');
  if (!tableWrap) return;

  tableWrap.innerHTML = `<div class="skeleton-block" style="height:220px"></div>`;
  kpiWrap.innerHTML   = `<div class="kpi-grid">${'<div class="kpi-card"><div class="skeleton" style="height:28px;width:80px;margin-bottom:.5rem"></div><div class="skeleton" style="width:80px"></div></div>'.repeat(4)}</div>`;

  const { hours, status, bot, q } = _execFilters;
  const params = new URLSearchParams();
  if (hours)  params.set('hours',  hours);
  if (status) params.set('status', status);
  if (bot)    params.set('bot',    bot);
  if (q)      params.set('q',      q);
  const qs = params.toString() ? '?' + params.toString() : '';

  try {
    const [logs, summary] = await Promise.allSettled([
      api('/api/flow-logs' + qs),
      api('/api/flow-logs/summary' + qs),
    ]);

    const arr = logs.status === 'fulfilled' ? (Array.isArray(logs.value) ? logs.value : (logs.value?.data || logs.value?.logs || [])) : [];
    _execLogs = arr;

    const sum = summary.status === 'fulfilled' ? summary.value : {};
    const total   = sum?.total   ?? arr.length;
    const success = sum?.success ?? arr.filter(e => (e.status || '').toLowerCase() === 'success').length;
    const errors  = sum?.errors  ?? arr.filter(e => (e.status || '').toLowerCase() === 'error').length;
    const rate    = total > 0 ? Math.round((success / total) * 100) : 0;
    const rateColor = rate >= 90 ? 'var(--success)' : rate >= 70 ? 'var(--warning)' : 'var(--danger)';

    kpiWrap.innerHTML = `<div class="kpi-grid">
      <div class="kpi-card"><div class="kpi-card__icon" style="background:var(--info-bg);color:var(--info)">${icon('activity',18)}</div><div class="kpi-card__value">${fmtNum(total)}</div><div class="kpi-card__label">Total</div></div>
      <div class="kpi-card"><div class="kpi-card__icon" style="background:var(--success-bg);color:var(--success)">${icon('check-circle-2',18)}</div><div class="kpi-card__value">${fmtNum(success)}</div><div class="kpi-card__label">Sucesso</div></div>
      <div class="kpi-card"><div class="kpi-card__icon" style="background:var(--danger-bg);color:var(--danger)">${icon('alert-triangle',18)}</div><div class="kpi-card__value">${fmtNum(errors)}</div><div class="kpi-card__label">Erros</div></div>
      <div class="kpi-card"><div class="kpi-card__icon" style="background:var(--warning-bg);color:var(--warning)">${icon('zap',18)}</div><div class="kpi-card__value" style="color:${rateColor}">${rate}%</div><div class="kpi-card__label">Taxa de sucesso</div></div>
    </div>`;

    // Re-render rows with real DOM nodes so event listeners work
    if (!arr.length) {
      tableWrap.innerHTML = `<div class="empty-state">${icon('inbox',36)}<div class="empty-state__title">Nenhuma execução no período</div><p class="empty-state__text">Ajuste os filtros ou aguarde novas execuções.</p></div>`;
    } else {
      const tableEl = document.createElement('div');
      tableEl.className = 'table-wrap';
      const tbl = document.createElement('table');
      tbl.className = 'table';
      tbl.innerHTML = `<thead><tr><th style="width:32px"></th><th>Hora</th><th>Flow</th><th>Evento</th><th>Telefone</th><th>Duração</th><th>Mensagem</th></tr></thead>`;
      const tbody = document.createElement('tbody');
      arr.forEach(e => tbody.appendChild(buildExecRow(e)));
      tbl.appendChild(tbody);
      tableEl.appendChild(tbl);
      tableWrap.innerHTML = '';
      tableWrap.appendChild(tableEl);
    }
  } catch (err) {
    tableWrap.innerHTML = `<div class="card"><p class="muted">${icon('alert-triangle',14)} Erro: ${escapeHtml(err.message)}</p><button class="btn btn--sm" style="margin-top:.5rem" onclick="loadExecData()">${icon('refresh-cw',14)} Tentar novamente</button></div>`;
  }
}

function startExecSSE(liveBtn) {
  if (_execSSE) return;
  _execSSE = new EventSource('/api/flow-logs/stream');
  _execSSE.onmessage = (ev) => {
    try {
      const e = JSON.parse(ev.data);
      const tbody = document.querySelector('#sec-execucoes .table tbody');
      if (tbody) {
        const firstRow = buildExecRow(e);
        tbody.insertBefore(firstRow, tbody.firstChild);
        // Trim to 100
        while (tbody.children.length > 100) tbody.removeChild(tbody.lastChild);
      }
    } catch (e) { console.warn('[execSSE] payload invalido:', e?.message); }
  };
  _execSSE.onerror = () => { stopExecSSE(liveBtn); };
  liveBtn.classList.add('btn--success');
  liveBtn.innerHTML = `<span class="live-dot"></span> Ao vivo`;
}

function stopExecSSE(liveBtn) {
  if (_execSSE) { _execSSE.close(); _execSSE = null; }
  liveBtn.classList.remove('btn--success');
  liveBtn.innerHTML = `${icon('activity', 14)} Ao vivo`;
}

async function renderExecucoes() {
  const sec = document.querySelector('#sec-execucoes');
  sec.innerHTML = `
    <div class="section-header">
      <div class="section-header__left">
        <h1 class="h1">Execuções</h1>
        <p class="muted">Log de execuções dos bots</p>
      </div>
    </div>
    <div class="filter-bar" id="exec-filter-bar">
      <div class="pill-group" id="exec-period-pills">
        <button class="pill" data-h="1">1h</button>
        <button class="pill" data-h="6">6h</button>
        <button class="pill active" data-h="24">24h</button>
        <button class="pill" data-h="168">7d</button>
      </div>
      <select id="exec-filter-status" aria-label="Filtrar por status" style="width:auto;flex:0 0 auto">
        <option value="">Todos os status</option>
        <option value="success">Sucesso</option>
        <option value="error">Erro</option>
        <option value="running">Em andamento</option>
        <option value="ignored">Ignorado</option>
      </select>
      <select id="exec-filter-bot" aria-label="Filtrar por bot" style="width:auto;flex:0 0 auto">
        <option value="">Todos os bots</option>
      </select>
      <input type="text" id="exec-search" placeholder="Buscar…" aria-label="Busca livre" style="max-width:180px" />
      <button class="btn btn--sm" id="exec-live-btn" aria-label="Ativar monitoramento ao vivo">${icon('activity',14)} Ao vivo</button>
      <button class="btn btn--sm btn--ghost btn--icon" id="exec-refresh-btn" aria-label="Recarregar execuções">${icon('refresh-cw',14)}</button>
    </div>
    <div id="exec-kpis"></div>
    <div id="exec-table-wrap"><div class="skeleton-block" style="height:220px"></div></div>`;

  // Populate bot filter
  try {
    const wfs = await api('/api/workflows');
    const arr = Array.isArray(wfs) ? wfs : (wfs.workflows || wfs.data || []);
    const sel = sec.querySelector('#exec-filter-bot');
    arr.forEach(w => {
      const opt = document.createElement('option');
      opt.value = w.workflow_id || w.id || w.slug || w.name;
      opt.textContent = w.name || w.workflow_id || w.id;
      sel.appendChild(opt);
    });
  } catch (e) { console.warn('[execFilter] falha ao carregar workflows:', e?.message); }

  // Period pills
  sec.querySelector('#exec-period-pills').addEventListener('click', (ev) => {
    const btn = ev.target.closest('.pill');
    if (!btn) return;
    sec.querySelectorAll('#exec-period-pills .pill').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    _execFilters.hours = btn.dataset.h;
    loadExecData();
  });

  // Filters
  sec.querySelector('#exec-filter-status').addEventListener('change', (ev) => { _execFilters.status = ev.target.value; loadExecData(); });
  sec.querySelector('#exec-filter-bot').addEventListener('change', (ev) => { _execFilters.bot = ev.target.value; loadExecData(); });
  let _execDebounce;
  sec.querySelector('#exec-search').addEventListener('input', (ev) => {
    clearTimeout(_execDebounce);
    _execDebounce = setTimeout(() => { _execFilters.q = ev.target.value; loadExecData(); }, 450);
  });

  // Live toggle
  const liveBtn = sec.querySelector('#exec-live-btn');
  liveBtn.addEventListener('click', () => {
    if (_execSSE) stopExecSSE(liveBtn); else startExecSSE(liveBtn);
  });

  // Refresh
  sec.querySelector('#exec-refresh-btn').addEventListener('click', loadExecData);

  loadExecData();
}

const COL_LABELS = {
  id: 'ID', nome: 'Nome', telefone: 'Telefone', telefone_masked: 'Telefone',
  mensagem_inicial: 'Mensagem', origem: 'Canal', criado_em: 'Criado em',
  created_at: 'Criado em', updated_at: 'Atualizado em',
  servico: 'Serviço', data_solicitada: 'Data solicitada',
  status: 'Status', date: 'Data', count: 'Mensagens', total: 'Total',
  slot: 'Bot/Fluxo', _table: 'Tabela',
};

function colLabel(k) { return COL_LABELS[k] || k.replace(/_/g,' ').replace(/\b\w/g, c => c.toUpperCase()); }

function renderGenericTable(rows, hideCols = []) {
  if (!rows || !rows.length) return `<div class="empty-state">${icon('inbox',36)}<div class="empty-state__title">Nenhum registro encontrado</div></div>`;
  const keys = Object.keys(rows[0]).filter(k => !hideCols.includes(k));
  const thead = keys.map(k => `<th>${escapeHtml(colLabel(k))}</th>`).join('');
  const tbody = rows.map(r => `<tr>${keys.map(k => {
    const v = r[k];
    const isDate = k.endsWith('_at') || k === 'criado_em' || k === 'data_solicitada';
    const display = isDate ? fmtDate(v) : escapeHtml(String(v ?? '—'));
    const isMono = k === 'id' || k === 'telefone' || k === 'telefone_masked';
    return `<td${isMono ? ' class="mono"' : ''}>${display}</td>`;
  }).join('')}</tr>`).join('');
  return `<div class="table-wrap"><table class="table"><thead><tr>${thead}</tr></thead><tbody>${tbody}</tbody></table></div>`;
}

function renderBarChart(data) {
  if (!data || !data.length) return `<div class="empty-state">${icon('bar-chart-2',36)}<div class="empty-state__title">Sem dados no período</div></div>`;
  const max = Math.max(...data.map(d => d.count || d.total || 0), 1);
  const cols = data.map(d => {
    const val = d.count || d.total || 0;
    const pct  = Math.round((val / max) * 100);
    const lbl  = (() => { try { const dt = new Date(d.date || d.day || d.created_at); if (isNaN(dt.getTime())) return String(d.date || d.day || ''); const fmt = new Intl.DateTimeFormat('pt-BR', { timeZone: 'America/Sao_Paulo', day:'2-digit', month:'2-digit' }); return fmt.format(dt); } catch(_){return d.date||'';} })();
    return `<div class="bar-chart__col">
      <span class="bar-chart__val">${val}</span>
      <div class="bar-chart__bar" style="height:${pct}%;min-height:2px" title="${val} mensagens"></div>
      <span class="bar-chart__lbl">${escapeHtml(lbl)}</span>
    </div>`;
  }).join('');
  return `<div class="bar-chart">${cols}</div>`;
}

    </div>

  async function loadCfgTab(tab) {
    _cfgTab = tab;

    sec.querySelectorAll('#cfg-tabs .tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
    const content = sec.querySelector('#cfg-tab-content');
    content.innerHTML = `<div class="skeleton-block" style="height:200px"></div>`;

    if (tab === 'fluxos') {
      await loadCfgFluxos(content);

      await loadCfgLimpeza(content);
    } else {
      await loadCfgSistema(content);
    }
  }

  sec.querySelector('#cfg-tabs').addEventListener('click', (ev) => {
    const btn = ev.target.closest('.tab-btn');
    if (btn) loadCfgTab(btn.dataset.tab);
  });

  loadCfgTab(_cfgTab);
}

async function loadCfgFluxos(content) {
  try {
    const [wfsData, routingData] = await Promise.allSettled([
      api('/api/workflows'),
      _cfgRoutingCache ? Promise.resolve(_cfgRoutingCache) : api('/api/routing'),
    ]);
    const wfs = wfsData.status === 'fulfilled' ? (Array.isArray(wfsData.value) ? wfsData.value : (wfsData.value?.workflows || wfsData.value?.data || [])) : [];
    if (routingData.status === 'fulfilled') _cfgRoutingCache = routingData.value;
    const routing = _cfgRoutingCache || [];
    const routingArr = Array.isArray(routing) ? routing : (routing.routes || routing.rules || []);

    if (!wfs.length) {
      content.innerHTML = `<div class="empty-state">${icon('settings',36)}<div class="empty-state__title">Nenhum fluxo encontrado</div></div>`;
      return;
    }

    const wrap = document.createElement('div');
    wrap.style.cssText = 'display:flex;flex-direction:column;gap:.75rem';

    wfs.forEach(w => {
      const wId = w.workflow_id || w.id;
      const clients = routingArr.filter(r => r.workflow_id === wId).length;
      const isActive = w.active !== false;

      const card = document.createElement('div');
      card.className = 'card row row--wrap';

      const av = botAvatar(w.workflow_id || w.name || 'w', 36);
      card.appendChild(av);

      const info = document.createElement('div');
      info.className = 'flex-1';
      info.style.cssText = 'min-width:120px';
      info.innerHTML = `<div class="h3">${escapeHtml(w.name || w.workflow_id || '—')}</div><div class="muted mono" style="font-size:.75rem">${escapeHtml(w.workflow_id || w.source || '')}</div><div class="subtle" style="margin-top:2px">${fmtNum(clients)} cliente${clients !== 1 ? 's' : ''} roteado${clients !== 1 ? 's' : ''}</div>`;
      card.appendChild(info);

      const badge = document.createElement('span');
      badge.className = `badge ${isActive ? 'badge--success' : 'badge--muted'}`;
      badge.textContent = isActive ? 'Ativo' : 'Inativo';
      card.appendChild(badge);

      // Badge de categoria: destaca fluxos internos e indica roteamento
      if (w.category === 'interno') {
        const catBadge = document.createElement('span');
        catBadge.className = 'badge badge--warning';
        catBadge.textContent = 'Interno';
        card.appendChild(catBadge);
      }
      const routBadge = document.createElement('span');
      routBadge.className = `badge ${w.routable ? 'badge--info' : 'badge--muted'}`;
      routBadge.textContent = w.routable ? 'Com roteamento' : 'Sem roteamento';
      card.appendChild(routBadge);

      // Toggle
      const toggleLabel = document.createElement('label');
      toggleLabel.className = 'toggle';
      toggleLabel.setAttribute('aria-label', `${isActive ? 'Desativar' : 'Ativar'} fluxo ${w.name || wId}`);
      const chk = document.createElement('input');
      chk.type = 'checkbox';
      chk.checked = isActive;
      const track = document.createElement('span');
      track.className = 'toggle__track';
      toggleLabel.appendChild(chk);
      toggleLabel.appendChild(track);
      card.appendChild(toggleLabel);

      chk.addEventListener('change', async () => {
        chk.disabled = true;
        try {
          await api(`/api/workflows/${encodeURIComponent(wId)}/active`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ active: chk.checked }),
          });
          badge.className = `badge ${chk.checked ? 'badge--success' : 'badge--muted'}`;
          badge.textContent = chk.checked ? 'Ativo' : 'Inativo';
          toast(`Fluxo ${chk.checked ? 'ativado' : 'desativado'} com sucesso.`, 'success');
        } catch (err) {
          chk.checked = !chk.checked;
          toast('Erro: ' + err.message, 'danger');
        } finally {
          chk.disabled = false;
        }
      });

      // Palavras-chave
      const kwBtn = document.createElement('button');
      kwBtn.className = 'btn btn--sm';
      kwBtn.innerHTML = `${icon('pencil', 13)} Palavras-chave`;
      kwBtn.addEventListener('click', () => openPauseKeywordsModal(wId));
      card.appendChild(kwBtn);

      wrap.appendChild(card);
    });

    content.innerHTML = '';
    content.appendChild(wrap);
  } catch (err) {
    content.innerHTML = `<div class="card"><p class="muted">${icon('alert-triangle',14)} Erro: ${escapeHtml(err.message)}</p></div>`;
  }
}

        const btn = document.getElementById('kw-save-btn');

          const resume = document.getElementById('kw-resume').value.split('\n').map(s=>s.trim()).filter(Boolean);
          await api(`/api/workflows/${encodeURIComponent(workflowId)}/pause-keywords`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ pause, resume }),
          });

          closeModal();
        } catch (err) {
          toast('Erro ao salvar: ' + err.message, 'danger');

      });
    })
    .catch(err => {
      document.getElementById('kw-loading').innerHTML = `<p class="muted">${icon('alert-triangle',14)} Erro: ${escapeHtml(err.message)}</p>`;
    });
}

/* ── Helpers de clone ───────────────────────────────────────────── */
function slugify(s) {
  return String(s || '')
    .toLowerCase()
    .normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/[^a-z0-9]+/g, '_')
    .replace(/^_+|_+$/g, '')
    .slice(0, 40) || 'clone';
}

function statusCloneBadge(status) {
  const map = {
    'rascunho':       { cls: 'badge--muted',   label: 'Rascunho',       dot: false },
    'aguardando_qr':  { cls: 'badge--warning',  label: 'Aguardando QR',  dot: true  },
    'conectado':      { cls: 'badge--success',  label: 'Conectado',      dot: true  },
    'desconectado':   { cls: 'badge--danger',   label: 'Desconectado',   dot: false },
    'falhou':         { cls: 'badge--danger',   label: 'Falhou',         dot: false },
  };
  const s = map[status] || { cls: 'badge--muted', label: escapeHtml(status || 'Desconhecido'), dot: false };
  const dotHtml = s.dot && status === 'conectado'
    ? `<span class="dot-pulse" style="margin-right:3px"></span>`
    : s.dot ? `<span class="badge--dot" style="display:inline-block;width:6px;height:6px;border-radius:50%;background:currentColor;margin-right:3px;vertical-align:middle"></span>` : '';
  return `<span class="badge ${s.cls}" style="display:inline-flex;align-items:center;gap:3px">${dotHtml}${escapeHtml(s.label)}</span>`;
}

/* ── pollQR ─────────────────────────────────────────────────────── */
let _activeQRPoll = null;

function pollQR(sessionName, onUpdate) {
  if (_activeQRPoll) { clearInterval(_activeQRPoll); _activeQRPoll = null; }
  _activeQRPoll = setInterval(async () => {
    try {
      const data = await api(`/api/sessions/${encodeURIComponent(sessionName)}/qr`);
      onUpdate(data);
    } catch (err) {
      onUpdate({ error: err.message });
    }
  }, 2000);
  return function stop() {
    if (_activeQRPoll) { clearInterval(_activeQRPoll); _activeQRPoll = null; }
  };
}

function _cloneStatusInfo(status) {
  const s = (status || '').toLowerCase();
  const map = {
    conectado:    { dot: 'bot-row__status-dot--working', cls: 'badge--success', label: 'Conectado' },
    pendente:     { dot: 'bot-row__status-dot--warning', cls: 'badge--warning', label: 'Aguardando QR' },
    aguardando_qr:{ dot: 'bot-row__status-dot--warning', cls: 'badge--warning', label: 'Aguardando QR' },
    desconectado: { dot: 'bot-row__status-dot--failed',  cls: 'badge--danger',  label: 'Desconectado' },
    falhou:       { dot: 'bot-row__status-dot--failed',  cls: 'badge--danger',  label: 'Falhou' },
    rascunho:     { dot: 'bot-row__status-dot--warning', cls: 'badge--warning', label: 'Sem sessão WAHA' },
  };
  return map[s] || { dot: '', cls: 'badge--muted', label: status || 'Sem status' };
}

function renderClonesList(clones, wrap) {
  if (!clones.length) {
    wrap.innerHTML = `

        <div class="empty-state__icon">${icon('git-branch', 48)}</div>
        <div class="empty-state__title">Nenhum clone criado</div>

  list.className = 'bot-row-list';

    const row = document.createElement('div');
    row.className = 'bot-row';
    row.style.cursor = 'default';

    titleBlock.className = 'bot-row__title';
    titleBlock.appendChild(botAvatar(c.display_name || c.matriz_slot || 'clone', 44));

    const meta = document.createElement('div');
    meta.className = 'bot-row__title-meta';
    meta.innerHTML = `
      <div class="bot-row__name">
        <span class="bot-row__name-text">${escapeHtml(c.display_name || 'Clone')}</span>
        <span class="bot-row__status-dot ${info.dot}" aria-hidden="true"></span>
        <span class="badge badge--dot ${info.cls}">${escapeHtml(info.label)}</span>
      </div>
      <div class="bot-row__sub">
        ${c.cliente_nome ? `<span class="bot-row__sub-item">${icon('users', 11)} ${escapeHtml(c.cliente_nome)}</span>` : ''}
        <span class="bot-row__sub-item">${icon('git-branch', 11)} ${escapeHtml(matrizLabel)}</span>
        ${phoneFmt ? `<span class="bot-row__sub-item">${icon('phone', 11)} ${escapeHtml(phoneFmt)}</span>` : ''}
        ${c.waha_sessao ? `<span class="bot-row__sub-item"><code>${escapeHtml(c.waha_sessao)}</code></span>` : ''}
      </div>`;
    titleBlock.appendChild(meta);
    row.appendChild(titleBlock);

    // Métricas (datas relevantes)
    const metrics = document.createElement('div');
    metrics.className = 'bot-row__metrics';
    const mItems = [];
    if (c.created_at) mItems.push({ val: escapeHtml(fmtRelative(c.created_at)), label: 'Criado', small: true });
    if (c.updated_at) mItems.push({ val: escapeHtml(fmtRelative(c.updated_at)), label: 'Atualizado', small: true });
    if (mItems.length) {
      metrics.innerHTML = mItems.map(m => `
        <div class="bot-row__metric">
          <span class="bot-row__metric-val${m.small ? ' bot-row__metric-val--sm' : ''}">${m.val}</span>
          <span class="bot-row__metric-label">${m.label}</span>
        </div>`).join('');
      row.appendChild(metrics);
    }

    // Ações
    const actions = document.createElement('div');
    actions.className = 'bot-row__actions';

    const configBtn = document.createElement('button');
    configBtn.className = 'btn btn--sm';
    configBtn.setAttribute('aria-label', `Configurar clone ${c.display_name || c.id}`);
    configBtn.innerHTML = `${icon('settings', 13)} Configurar`;
    configBtn.addEventListener('click', () => openCloneConfigModal(c));
    actions.appendChild(configBtn);

    const connectBtn = document.createElement('button');
    if (c.status === 'conectado') {
      connectBtn.className = 'btn btn--sm';
      connectBtn.innerHTML = `${icon('check-circle-2', 13)} Conectado`;
    } else {
      connectBtn.className = 'btn btn--primary btn--sm';
      connectBtn.innerHTML = `${icon('qr-code', 13)} Conectar`;
    }
    connectBtn.setAttribute('aria-label', `Conectar WhatsApp do clone ${c.display_name || c.id}`);
    connectBtn.addEventListener('click', () => openCloneQRModal(c));
    actions.appendChild(connectBtn);

    const delBtn = document.createElement('button');
    delBtn.className = 'btn btn--sm btn--ghost btn--icon';
    delBtn.setAttribute('aria-label', `Excluir clone ${c.display_name || c.id}`);
    delBtn.style.color = 'var(--danger)';
    delBtn.innerHTML = icon('trash-2', 14);
    delBtn.addEventListener('click', () => confirmDeleteClone(c));
    actions.appendChild(delBtn);

    row.appendChild(actions);
    list.appendChild(row);
  });

  wrap.innerHTML = '';
  wrap.appendChild(list);
}

async function confirmDeleteClone(c) {
  if (!confirm(`Excluir clone "${c.display_name || c.id}"? Esta ação não pode ser desfeita.`)) return;
  try {
    await api(`/api/clones/${c.id}`, { method: 'DELETE' });
    toast('Clone excluído.', 'success');
    _rendered['bots'] = false;
    renderBots();
  } catch (err) {
    toast('Erro ao excluir: ' + err.message, 'danger');
  }
}

      telefone_contato: '',
      endereco: '',
      instagram: '',
    },
    sessao_name: '',
    waha_option: 'nova',
    cloneId: null,
    stopQR: null,
    modelo_ia: '',      // '' = herdar da matriz
    modelo_ia_label: '', // label do modelo selecionado
  };
  if (preSelectMatriz) _wizardState.step = 2;
  renderWizardStep();
}

function renderWizardStep() {
  const s = _wizardState;
  const stepCount = 4;

  function stepCircles() {
    const segs = [];
    for (let i = 1; i <= stepCount; i++) {
      const cls = i < s.step ? 'done' : i === s.step ? 'active' : '';
      const label = i < s.step ? icon('check-circle-2', 14) : String(i);
      segs.push(`<div class="wizard-step ${cls}" aria-current="${i === s.step ? 'step' : 'false'}">${label}</div>`);
      if (i < stepCount) {
        segs.push(`<div class="wizard-step-sep ${i < s.step ? 'done' : ''}"></div>`);
      }
    }
    return segs.join('');
  }

  let bodyHtml = '';
  let footerHtml = '';

  if (s.step === 1) {
    const cards = MATRIZ_OPTS.map(m => `
      <div class="matrix-card ${s.matriz_slot === m.slot ? 'selected' : ''}" data-slot="${m.slot}" role="button" tabindex="0" aria-pressed="${s.matriz_slot === m.slot}">
        <div class="matrix-card__icon">${icon('git-branch', 28)}</div>
        <div class="matrix-card__name">${escapeHtml(m.name)}</div>
        <div class="matrix-card__desc">${escapeHtml(m.desc)}</div>
      </div>`).join('');
    bodyHtml = `
      <p class="muted" style="margin-bottom:1rem">Escolha qual fluxo vai servir de base para este clone:</p>
      <div class="matrix-cards" id="wizard-matrix-cards">${cards}</div>`;
    footerHtml = `
      <div></div>
      <button class="btn btn--primary" id="wizard-next-btn" ${!s.matriz_slot ? 'disabled' : ''}>Continuar ${icon('chevron-right', 14)}</button>`;

  } else if (s.step === 2) {
    // Constrói opções do select de modelo no wizard (usa cache se disponível)
    const wModels = _modelsCache || [];
    const wModelOpts = wModels.length
      ? wModels.map(m => `<option value="${escapeHtml(m.id)}" ${s.modelo_ia === m.id ? 'selected' : ''}>${escapeHtml(modelOptionLabel(m))}</option>`).join('')
      : '';
    const wMatrizLabel = s.matriz_slot ? s.matriz_slot.replace('teste_','').replace(/_/g,' ') : 'matriz';
    bodyHtml = `
      <div style="display:flex;flex-direction:column;gap:.875rem">
        <div class="field">
          <label for="wz-display-name">Nome do clone <span style="color:var(--danger)">*</span></label>
          <input id="wz-display-name" type="text" placeholder="Ex: Barbearia do João — São Paulo" value="${escapeHtml(s.display_name)}" maxlength="120" />
        </div>
        <div class="field">
          <label for="wz-cliente-nome">Nome do operador</label>
          <input id="wz-cliente-nome" type="text" placeholder="Ex: João Silva (substitui [Ricardo] no prompt)" value="${escapeHtml(s.cliente_nome)}" maxlength="80" />
        </div>
        <div class="field">
          <label for="wz-cliente-tel">Telefone do cliente (opcional)</label>
          <input id="wz-cliente-tel" type="tel" placeholder="55119..." value="${escapeHtml(s.cliente_telefone)}" maxlength="20" />
        </div>
        <div class="field">
          <label for="wz-modelo-ia">Modelo IA</label>
          <select id="wz-modelo-ia" ${wModels.length === 0 ? 'disabled' : ''}>
            <option value="" ${!s.modelo_ia ? 'selected' : ''}>Mesmo da ${escapeHtml(wMatrizLabel)} (padrão)</option>
            ${wModelOpts}
          </select>
          ${wModels.length === 0 ? `<span class="field-hint" id="wz-model-loading">${icon('loader',11)} Carregando modelos...</span>` : '<span class="field-hint">Modelo mais inteligente = melhor resposta, mas custo maior</span>'}
        </div>
      </div>`;
    footerHtml = `
      <button class="btn" id="wizard-back-btn">${icon('chevron-left', 14)} Voltar</button>
      <button class="btn btn--primary" id="wizard-next-btn">Continuar ${icon('chevron-right', 14)}</button>`;

  } else if (s.step === 3) {
    const kvRows = Object.entries(s.personalizacao).map(([k, v]) => `
      <div class="kv-row" data-kv>
        <input type="text" class="kv-key" placeholder="chave" value="${escapeHtml(k)}" style="flex:0 0 130px" />
        <input type="text" class="kv-val" placeholder="valor" value="${escapeHtml(v)}" />
        <button type="button" class="btn btn--ghost btn--sm btn--icon kv-del" aria-label="Remover campo" style="color:var(--danger)">${icon('trash-2', 13)}</button>
      </div>`).join('');
    bodyHtml = `
      <p class="muted" style="margin-bottom:.875rem">Você pode personalizar dados que aparecem no prompt. Deixe em branco se quiser usar os valores padrão da matriz.</p>
      <div id="kv-list">${kvRows}</div>
      <button type="button" class="btn btn--sm" id="btn-add-kv" style="margin-top:.5rem">${icon('plus', 13)} Adicionar campo</button>`;
    footerHtml = `
      <button class="btn" id="wizard-back-btn">${icon('chevron-left', 14)} Voltar</button>
      <button class="btn btn--primary" id="wizard-next-btn">Continuar ${icon('chevron-right', 14)}</button>`;

  } else if (s.step === 4) {
    const suggestedName = 'clone_' + slugify(s.display_name);
    if (!s.sessao_name) s.sessao_name = suggestedName;
    const activeOption = s.waha_option || 'nova';
    bodyHtml = `
      <div style="display:flex;flex-direction:column;gap:1rem">
        <p class="muted" style="margin-bottom:.25rem">Em qual WhatsApp este clone vai funcionar?</p>

        <div class="wz-sessao-opts" role="group" aria-label="Como vincular o WhatsApp">
          <label class="wz-sessao-opt${activeOption === 'nova' ? ' active' : ''}" data-opt="nova">
            <span class="wz-opt-radio" aria-hidden="true"></span>
            <span class="wz-opt-body">
              <strong>Criar nova sessão WAHA</strong>
              <span class="wz-opt-desc">Gera um QR code para conectar um WhatsApp novo</span>
            </span>
          </label>
          <label class="wz-sessao-opt${activeOption === 'existente' ? ' active' : ''}" data-opt="existente">
            <span class="wz-opt-radio" aria-hidden="true"></span>
            <span class="wz-opt-body">
              <strong>Vincular sessão existente</strong>
              <span class="wz-opt-desc">Escolha um WhatsApp já conectado no servidor</span>
            </span>
          </label>
          <label class="wz-sessao-opt${activeOption === 'pular' ? ' active' : ''}" data-opt="pular">
            <span class="wz-opt-radio" aria-hidden="true"></span>
            <span class="wz-opt-body">
              <strong>Finalizar sem sessão</strong>
              <span class="wz-opt-desc">Clone fica em rascunho — vincule um WhatsApp depois</span>
            </span>
          </label>
        </div>

        <div id="wz-opt-nova" class="wz-opt-panel${activeOption === 'nova' ? '' : ' hidden'}">
          <div class="field">
            <label for="wz-sessao-name">Nome da sessão WAHA</label>
            <input id="wz-sessao-name" type="text" value="${escapeHtml(s.sessao_name)}" maxlength="60" placeholder="clone_nome_cliente" autocomplete="off" />
            <span class="field-hint">Use apenas letras, números, _ e -</span>
          </div>
          <div id="wizard-qr-area"></div>
        </div>

        <div id="wz-opt-existente" class="wz-opt-panel${activeOption === 'existente' ? '' : ' hidden'}">
          <div class="field">
            <label for="wz-sessao-select">Sessão disponível</label>
            <select id="wz-sessao-select">
              <option value="">Carregando sessões...</option>
            </select>
          </div>
          <div id="wz-bind-status"></div>
        </div>

        <div id="wz-opt-pular" class="wz-opt-panel${activeOption === 'pular' ? '' : ' hidden'}">
          <div class="wz-pular-info">
            ${icon('alert-triangle', 16)}
            <span>O clone será criado sem WhatsApp vinculado. Você poderá vincular depois na aba <strong>Sessão WAHA</strong> do clone.</span>
          </div>
        </div>
      </div>`;
    footerHtml = `
      <button class="btn" id="wizard-back-btn">${icon('chevron-left', 14)} Voltar</button>
      <button class="btn btn--primary" id="wizard-create-btn" data-opt="${activeOption}">
        ${activeOption === 'nova' ? icon('qr-code', 14) + ' Criar sessão e mostrar QR' : activeOption === 'existente' ? icon('link', 14) + ' Vincular sessão' : icon('check', 14) + ' Finalizar sem sessão'}
      </button>`;
  }

  const modalHtml = `
    <div class="modal__header">
      <span class="modal__title">Clonar fluxo matriz — Passo ${s.step} de ${stepCount}</span>
      <button class="btn btn--ghost btn--icon" id="wizard-close-btn" aria-label="Fechar">${icon('x', 16)}</button>
    </div>
    <div class="wizard-steps">${stepCircles()}</div>
    <div class="wizard-body" id="wizard-body">${bodyHtml}</div>
    <div class="wizard-footer">${footerHtml}</div>`;

  // Ensure modal is large
  const modalEl = document.getElementById('modal-content');
  modalEl.classList.add('modal--lg');
  openModal(modalHtml);

  // Wire close
  document.getElementById('wizard-close-btn')?.addEventListener('click', () => closeModal());

  // Wire step-specific events
  if (s.step === 1) {
    document.querySelectorAll('.matrix-card').forEach(card => {
      card.addEventListener('click', () => {
        _wizardState.matriz_slot = card.dataset.slot;
        document.querySelectorAll('.matrix-card').forEach(c => { c.classList.toggle('selected', c.dataset.slot === _wizardState.matriz_slot); c.setAttribute('aria-pressed', c.dataset.slot === _wizardState.matriz_slot); });
        const nextBtn = document.getElementById('wizard-next-btn');
        if (nextBtn) nextBtn.disabled = false;
      });
      card.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') card.click(); });
    });
  }

  if (s.step === 2) {
    // Carrega modelos se ainda não estão em cache e preenche o select
    const wzModelSel = document.getElementById('wz-modelo-ia');
    if (wzModelSel && !_modelsCache) {
      loadModels().then(models => {
        if (!wzModelSel.isConnected) return; // modal pode ter fechado
        const matrizLabel = (_wizardState.matriz_slot || 'matriz').replace('teste_','').replace(/_/g,' ');
        wzModelSel.innerHTML = `<option value="">Mesmo da ${escapeHtml(matrizLabel)} (padrão)</option>`
          + models.map(m => `<option value="${escapeHtml(m.id)}" ${_wizardState.modelo_ia === m.id ? 'selected' : ''}>${escapeHtml(modelOptionLabel(m))}</option>`).join('');
        wzModelSel.disabled = false;
        const hint = document.getElementById('wz-model-loading');
        if (hint) hint.textContent = 'Modelo mais inteligente = melhor resposta, mas custo maior';
      });
    }
  }

  if (s.step === 3) {
    document.getElementById('btn-add-kv')?.addEventListener('click', () => {
      const row = document.createElement('div');
      row.className = 'kv-row';
      row.setAttribute('data-kv', '');
      row.innerHTML = `
        <input type="text" class="kv-key" placeholder="chave" style="flex:0 0 130px" />
        <input type="text" class="kv-val" placeholder="valor" />
        <button type="button" class="btn btn--ghost btn--sm btn--icon kv-del" aria-label="Remover campo" style="color:var(--danger)">${icon('trash-2', 13)}</button>`;
      row.querySelector('.kv-del').addEventListener('click', () => row.remove());
      document.getElementById('kv-list').appendChild(row);
    });

    document.querySelectorAll('.kv-del').forEach(btn => {
      btn.addEventListener('click', () => btn.closest('[data-kv]').remove());
    });
  }

  if (s.step === 4) {
    // Chaveamento entre as 3 opções de sessão
    document.querySelectorAll('.wz-sessao-opt').forEach(label => {
      label.addEventListener('click', () => {
        const opt = label.dataset.opt;
        _wizardState.waha_option = opt;
        document.querySelectorAll('.wz-sessao-opt').forEach(l => l.classList.toggle('active', l.dataset.opt === opt));
        document.querySelectorAll('.wz-opt-panel').forEach(p => p.classList.add('hidden'));
        const panel = document.getElementById(`wz-opt-${opt}`);
        if (panel) panel.classList.remove('hidden');
        // Atualiza label/ícone do botão principal
        const createBtn = document.getElementById('wizard-create-btn');
        if (createBtn) {
          createBtn.dataset.opt = opt;
          if (opt === 'nova') createBtn.innerHTML = `${icon('qr-code', 14)} Criar sessão e mostrar QR`;
          else if (opt === 'existente') createBtn.innerHTML = `${icon('link', 14)} Vincular sessão`;
          else createBtn.innerHTML = `${icon('check', 14)} Finalizar sem sessão`;
        }
        // Ao selecionar "existente", carrega lista de sessões
        if (opt === 'existente') wizardLoadAvailableSessions();
      });
    });

    // Carrega sessões disponíveis se opção "existente" já estiver ativa
    if ((_wizardState.waha_option || 'nova') === 'existente') wizardLoadAvailableSessions();

    document.getElementById('wizard-create-btn')?.addEventListener('click', () => {
      const opt = _wizardState.waha_option || 'nova';
      if (opt === 'nova') wizardStep4Create();
      else if (opt === 'existente') wizardStep4BindExisting();
      else wizardStep4Skip();
    });
  }

  // Back — step 1 não tem wizard-back-btn no DOM; guard evita decremento abaixo de 1
  document.getElementById('wizard-back-btn')?.addEventListener('click', () => {
    if (_wizardState.step <= 1) return;
    wizardCollectStep();
    _wizardState.step--;
    renderWizardStep();
  });

  // Next
  document.getElementById('wizard-next-btn')?.addEventListener('click', () => {
    if (!wizardValidateStep()) return;
    wizardCollectStep();
    _wizardState.step++;
    renderWizardStep();
  });
}

function wizardCollectStep() {
  const s = _wizardState;
  if (s.step === 2) {
    s.display_name     = (document.getElementById('wz-display-name')?.value || '').trim();
    s.cliente_nome     = (document.getElementById('wz-cliente-nome')?.value || '').trim();
    s.cliente_telefone = (document.getElementById('wz-cliente-tel')?.value || '').trim();
    const wzMdl = document.getElementById('wz-modelo-ia');
    s.modelo_ia = wzMdl ? (wzMdl.value || '') : '';
    if (wzMdl && s.modelo_ia) {
      const opt = wzMdl.options[wzMdl.selectedIndex];
      s.modelo_ia_label = opt ? opt.textContent : s.modelo_ia;
    } else {
      s.modelo_ia_label = '';
    }
  } else if (s.step === 3) {
    s.personalizacao = {};
    document.querySelectorAll('[data-kv]').forEach(row => {
      const k = (row.querySelector('.kv-key')?.value || '').trim();
      const v = (row.querySelector('.kv-val')?.value || '').trim();
      if (k) s.personalizacao[k] = v;
    });
  } else if (s.step === 4) {
    s.sessao_name = (document.getElementById('wz-sessao-name')?.value || '').trim() || 'clone_' + slugify(s.display_name);
  }
}

function wizardValidateStep() {
  const s = _wizardState;
  if (s.step === 1 && !s.matriz_slot) { toast('Selecione um fluxo matriz.', 'warning'); return false; }
  if (s.step === 2) {
    const name = (document.getElementById('wz-display-name')?.value || '').trim();
    if (!name) { toast('O nome do clone é obrigatório.', 'warning'); document.getElementById('wz-display-name')?.focus(); return false; }
  }
  return true;
}

/* ── Aplica modelo IA ao clone (se escolhido no wizard) ─────────── */
async function wizardApplyModelToClone(cloneId, model) {
  if (!model || !cloneId) return;
  try {
    await api(`/api/clones/${cloneId}/model`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model }),
    });
  } catch (_e) {
    // não-crítico: clone já foi criado; avisa mas não bloqueia
    toast('Clone criado, mas não foi possível salvar o modelo IA. Configure depois na aba Configuração IA.', 'warning');
  }
}

/* ── Opção A: Criar nova sessão WAHA + QR ───────────────────────── */
async function wizardStep4Create() {
  const s = _wizardState;
  s.sessao_name = (document.getElementById('wz-sessao-name')?.value || '').trim() || 'clone_' + slugify(s.display_name);

  const createBtn = document.getElementById('wizard-create-btn');
  if (createBtn) { createBtn.disabled = true; createBtn.innerHTML = `<div class="spinner" style="width:16px;height:16px"></div> Criando...`; }

  const qrArea = document.getElementById('wizard-qr-area');

  try {
    // Passo 1: criar clone (rascunho) — idempotente: só cria se ainda não tem cloneId
    if (!s.cloneId) {
      const clone = await api('/api/clones', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          matriz_slot:      s.matriz_slot,
          display_name:     s.display_name,
          cliente_nome:     s.cliente_nome || undefined,
          cliente_telefone: s.cliente_telefone || undefined,
          personalizacao:   Object.keys(s.personalizacao).length ? s.personalizacao : undefined,
        }),
      });
      s.cloneId = clone.id;
      if (s.modelo_ia) await wizardApplyModelToClone(s.cloneId, s.modelo_ia);
    }

    // Passo 2: criar sessão WAHA via endpoint correto (com webhook automático)
    let sessaoOk = false;
    try {
      await api('/api/sessions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: s.sessao_name }),
      });
      sessaoOk = true;
    } catch (e) {
      // 409 = sessão já existe — reutilizamos sem erro
      if (e.status === 409 || (e.message && e.message.includes('409'))) {
        sessaoOk = true;
      } else {
        throw new Error('Não foi possível criar a sessão WAHA: ' + e.message);
      }
    }

    if (!sessaoOk) throw new Error('Falha desconhecida ao criar sessão WAHA.');

    // Passo 3: bind-session (vincula sessão ao clone no banco)
    await api(`/api/clones/${s.cloneId}/bind-session`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sessao_name: s.sessao_name, telefone: s.cliente_telefone || undefined }),
    });

    // Mostrar QR com polling
    if (qrArea) qrArea.innerHTML = `<div class="qr-wrap"><div class="skeleton-block" style="width:200px;height:200px;border-radius:var(--radius-md)"></div><p class="muted">Carregando QR...</p></div>`;

    if (createBtn) createBtn.style.display = 'none';
    const backBtn = document.getElementById('wizard-back-btn');
    if (backBtn) backBtn.textContent = 'Cancelar e voltar';

    s.stopQR = pollQR(s.sessao_name, (data) => {
      if (data.connected || data.qr === null) {
        if (s.stopQR) { s.stopQR(); s.stopQR = null; }
        if (qrArea) qrArea.innerHTML = `
          <div class="qr-connected">
            <div>${icon('check-circle-2', 56)}</div>
            <div style="font-weight:700;font-size:1.125rem">WhatsApp conectado!</div>
            <button class="btn btn--primary" id="wizard-finish-btn">${icon('check-circle-2', 14)} Concluir</button>
          </div>`;
        document.getElementById('wizard-finish-btn')?.addEventListener('click', () => {
          closeModal();
          toast('Clone criado e conectado com sucesso!', 'success');
          _rendered['bots'] = false;
          renderBots();
        });
      } else if (data.qr) {
        if (qrArea) qrArea.innerHTML = `
          <div class="qr-wrap">
            <img src="${data.qr}" alt="QR Code para conectar WhatsApp" />
            <p class="muted" style="text-align:center;font-size:.8125rem">Escaneie no WhatsApp do cliente</p>
          </div>`;
      } else if (data.error) {
        if (qrArea) qrArea.innerHTML = `<p class="muted" style="color:var(--danger)">${icon('alert-triangle',14)} ${escapeHtml(data.error)}</p>
          <button class="btn btn--sm" id="wizard-retry-qr-btn">${icon('refresh-cw',14)} Tentar novamente</button>`;
        document.getElementById('wizard-retry-qr-btn')?.addEventListener('click', wizardStep4Create);
      }
    });

  } catch (err) {
    if (qrArea) qrArea.innerHTML = `<p class="muted" style="color:var(--danger)">${icon('alert-triangle',14)} ${escapeHtml(err.message)}</p>`;
    if (createBtn) { createBtn.disabled = false; createBtn.innerHTML = `${icon('qr-code',14)} Criar sessão e mostrar QR`; }
    toast('Erro ao criar clone: ' + err.message, 'danger');
  }
}

/* ── Carrega sessões disponíveis para o dropdown (Opção B) ──────── */
async function wizardLoadAvailableSessions() {
  const select = document.getElementById('wz-sessao-select');
  if (!select) return;
  select.innerHTML = `<option value="">Carregando...</option>`;
  select.disabled = true;
  try {
    const sessions = await api('/api/sessions/available');
    if (!Array.isArray(sessions) || sessions.length === 0) {
      select.innerHTML = `<option value="">Nenhuma sessão disponível</option>`;
      return;
    }
    select.innerHTML = sessions.map(s => {
      const label = s.me ? `${escapeHtml(s.name)} (${escapeHtml(s.me)})` : escapeHtml(s.name);
      const statusLabel = s.status === 'WORKING' ? ' — conectado' : s.status ? ` — ${escapeHtml(s.status)}` : '';
      return `<option value="${escapeHtml(s.name)}">${label}${statusLabel}</option>`;
    }).join('');
  } catch (e) {
    select.innerHTML = `<option value="">Erro ao carregar sessões</option>`;
    toast('Não foi possível listar sessões WAHA.', 'warning');
  } finally {
    select.disabled = false;
  }
}

/* ── Opção B: Vincular sessão WAHA existente ───────────────────── */
async function wizardStep4BindExisting() {
  const s = _wizardState;
  const select = document.getElementById('wz-sessao-select');
  const chosen = select?.value?.trim();
  if (!chosen) { toast('Selecione uma sessão WAHA.', 'warning'); return; }

  const createBtn = document.getElementById('wizard-create-btn');
  const statusDiv = document.getElementById('wz-bind-status');
  if (createBtn) { createBtn.disabled = true; createBtn.innerHTML = `<div class="spinner" style="width:16px;height:16px"></div> Vinculando...`; }

  try {
    // Passo 1: criar clone se ainda não existe
    if (!s.cloneId) {
      const clone = await api('/api/clones', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          matriz_slot:      s.matriz_slot,
          display_name:     s.display_name,
          cliente_nome:     s.cliente_nome || undefined,
          cliente_telefone: s.cliente_telefone || undefined,
          personalizacao:   Object.keys(s.personalizacao).length ? s.personalizacao : undefined,
        }),
      });
      s.cloneId = clone.id;
      if (s.modelo_ia) await wizardApplyModelToClone(s.cloneId, s.modelo_ia);
    }

    // Passo 2: bind-session direto (sessão já existe e está conectada)
    await api(`/api/clones/${s.cloneId}/bind-session`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sessao_name: chosen, telefone: s.cliente_telefone || undefined }),
    });

    closeModal();
    toast(`Clone criado e vinculado à sessão "${chosen}" com sucesso!`, 'success');
    _rendered['bots'] = false;
    renderBots();
  } catch (err) {
    if (statusDiv) statusDiv.innerHTML = `<p class="muted" style="color:var(--danger);margin-top:.5rem">${icon('alert-triangle',14)} ${escapeHtml(err.message)}</p>`;
    if (createBtn) { createBtn.disabled = false; createBtn.innerHTML = `${icon('link',14)} Vincular sessão`; }
    toast('Erro ao vincular sessão: ' + err.message, 'danger');
  }
}

/* ── Opção C: Finalizar sem sessão WAHA (rascunho) ─────────────── */
async function wizardStep4Skip() {
  const s = _wizardState;
  const createBtn = document.getElementById('wizard-create-btn');
  if (createBtn) { createBtn.disabled = true; createBtn.innerHTML = `<div class="spinner" style="width:16px;height:16px"></div> Criando...`; }

  try {
    // Só cria o clone — sem criar sessão, sem bind-session
    if (!s.cloneId) {
      const clone = await api('/api/clones', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          matriz_slot:      s.matriz_slot,
          display_name:     s.display_name,
          cliente_nome:     s.cliente_nome || undefined,
          cliente_telefone: s.cliente_telefone || undefined,
          personalizacao:   Object.keys(s.personalizacao).length ? s.personalizacao : undefined,
        }),
      });
      s.cloneId = clone.id;
      if (s.modelo_ia) await wizardApplyModelToClone(s.cloneId, s.modelo_ia);
    }

    closeModal();
    toast('Clone criado. Vincule uma sessão WAHA depois pela aba Sessão.', 'info');
    _rendered['bots'] = false;
    renderBots();
  } catch (err) {
    if (createBtn) { createBtn.disabled = false; createBtn.innerHTML = `${icon('check',14)} Finalizar sem sessão`; }
    toast('Erro ao criar clone: ' + err.message, 'danger');
  }
}

/* ══ HELPER PAUSA (clone + matriz) ═══════════════════════════════
 *  Renderiza aba Pausa dentro de qualquer container DOM.
 *  Usa data-role em vez de id+slot para evitar duplicatas.
 *  slot — valor do slot do bot (ex: "startap", "teste_barbearia")
 * ================================================================ */
async function _renderPauseTab(container, slot) {
  container.innerHTML = `<div style="padding:1rem 0;display:flex;justify-content:center"><div class="spinner"></div></div>`;
  let data;
  try {
    data = await api(`/api/bots/${encodeURIComponent(slot)}/pause-keywords`);
  } catch (err) {
    container.innerHTML = `
      <div class="card" style="margin-top:.75rem">
        <p class="muted">${icon('alert-triangle', 14)} Erro ao carregar: ${escapeHtml(err.message)}</p>
        <button class="btn btn--sm" id="pause-retry-btn" style="margin-top:.5rem">${icon('refresh-cw', 13)} Tentar novamente</button>
      </div>`;
    container.querySelector('#pause-retry-btn').addEventListener('click', () => _renderPauseTab(container, slot));
    return;
  }

  container.innerHTML = `
    <div style="padding-top:.5rem;display:flex;flex-direction:column;gap:.875rem">
      <p class="muted">Quando alguém manda uma das frases abaixo neste chat, o bot pausa de responder para esse cliente. Uma frase de retomada ativa o bot de novo.</p>

      <details class="pause-help-block">
        <summary>${icon('help-circle', 14)} Como funciona?</summary>
        <div class="pause-help-block__body">
          <ol>
            <li>Cliente ou atendente envia uma das frases de <strong>Pausar</strong> no WhatsApp do bot.</li>
            <li>O bot para de responder para <em>esse cliente específico</em> — não afeta outros chats.</li>
            <li>Para retomar, alguém manda uma das frases de <strong>Retomar</strong>.</li>
            <li>As frases não diferenciam maiúsculas/minúsculas nem acentos. Uma frase por linha.</li>
          </ol>
        </div>
      </details>

      <div class="field">
        <label>Pausar (uma por linha)</label>
        <textarea data-role="pause-pause" rows="5" placeholder="startap aqui!!&#10;atendente aqui!!"></textarea>
      </div>

      <div class="field">
        <label>Retomar (uma por linha)</label>
        <textarea data-role="pause-resume" rows="5" placeholder="startap voltar!!&#10;ia voltar!!"></textarea>
      </div>

      <button class="btn btn--primary" data-role="pause-save">${icon('check-circle-2', 14)} Salvar palavras-chave</button>
    </div>`;

  const pauseTa  = container.querySelector('[data-role="pause-pause"]');
  const resumeTa = container.querySelector('[data-role="pause-resume"]');
  pauseTa.value  = (data?.pause  || []).join('\n');
  resumeTa.value = (data?.resume || []).join('\n');

  container.querySelector('[data-role="pause-save"]').addEventListener('click', async () => {
    const btn = container.querySelector('[data-role="pause-save"]');
    btn.disabled = true;
    try {
      const pause  = pauseTa.value.split('\n').map(s => s.trim()).filter(Boolean);
      const resume = resumeTa.value.split('\n').map(s => s.trim()).filter(Boolean);
      await api(`/api/bots/${encodeURIComponent(slot)}/pause-keywords`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ pause, resume }),
      });
      toast('Palavras-chave salvas!', 'success');
    } catch (err) {
      toast('Erro: ' + err.message, 'danger');
    } finally {
      btn.disabled = false;
    }
  });
}

                Com o projeto selecionado, abra <a href="https://console.cloud.google.com/apis/library/calendar-json.googleapis.com" target="_blank" rel="noopener">console.cloud.google.com → APIs → Google Calendar API</a> e clique em <strong>Ativar / Enable</strong>. Espere ~1 minuto pra propagar.
              </div>
            </li>
            <li>
              <div>
                <strong>Criar a Service Account</strong><br>
                Vá em <a href="https://console.cloud.google.com/iam-admin/serviceaccounts" target="_blank" rel="noopener">IAM e Admin → Contas de serviço</a> (com o projeto certo selecionado no topo).

              </div>
            </li>
            <li>
              <div>
                <strong>Baixar a chave JSON</strong><br>
                Na lista de contas de serviço, clique na conta criada → aba <strong>Chaves</strong> → <strong>Adicionar chave</strong> → <strong>Criar nova chave</strong>.

            <li>
              <div>
                <strong>Compartilhar a agenda do cliente com a Service Account</strong><br>
                <span style="color:var(--danger,#ef4444);font-weight:600">⚠ Sem este passo o teste falha com erro 404 (<code>Calendar not found</code>).</span><br>
                Acesse <a href="https://calendar.google.com" target="_blank" rel="noopener">calendar.google.com</a> <strong>logado na conta Gmail dona da agenda do cliente</strong> e:
                <ol style="margin:.375rem 0 0 1rem;padding:0;font-size:.85rem">
                  <li>Passe o mouse sobre a agenda na lista lateral → clique nos 3 pontinhos → <strong>Configurações e compartilhamento</strong>.</li>
                  <li>Role até <strong>Compartilhar com pessoas e grupos específicos</strong> → <strong>+ Adicionar pessoas e grupos</strong>.</li>
