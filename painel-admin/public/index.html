                </ol>
              </div>
            </li>
            <li>
              <div>
                <strong>Pegar o ID da agenda e conectar aqui</strong><br>
                Na mesma tela <em>Configurações e compartilhamento</em>, role até <strong>Integrar agenda</strong> e copie o <strong>ID da agenda</strong> (geralmente um e-mail).
                Volte aqui, cole o conteúdo do JSON do passo 4 no campo abaixo e o ID da agenda no segundo campo. Clique em <strong>Conectar</strong>.
              </div>
            </li>
          </ol>
        </div>
      </details>`;
  }

  function _showForm(data, isEdit) {
    const calId = escapeHtml(data.gcal_calendar_id || '');
    const editHintHtml = isEdit ? `
      <div class="gcal-edit-hint">
        ${icon('info', 13)} Cole um novo JSON da Service Account para substituir o atual.
        Para manter o JSON, altere apenas o ID da agenda — neste caso você precisa colar o JSON novamente (não armazenamos no formulário).
      </div>` : '';
    const descText = isEdit
      ? `Atualize as credenciais desta ${entityLabel}.`
      : `Configure uma Service Account para que esta ${entityLabel} use sua própria agenda.`;
    const btnLabel = isEdit ? `${icon('save', 14)} Salvar alterações` : `${icon('link-2', 14)} Conectar`;

    const currentBindingHtml = (isEdit && data.gcal_client_email) ? (() => {
      const statusLabel = data.gcal_status === 'active' ? 'Conectado' : data.gcal_status === 'invalid' ? 'Inválido' : 'Pendente';
      const connDate = data.gcal_connected_at ? new Date(data.gcal_connected_at).toLocaleString('pt-BR', { timeZone: 'America/Sao_Paulo' }) : '—';
      const lastCheck = data.gcal_last_check_at ? new Date(data.gcal_last_check_at).toLocaleString('pt-BR', { timeZone: 'America/Sao_Paulo' }) : '—';
      return `
      <div style="padding:.75rem 1rem;background:var(--surface-2,#f5f5f5);border:1px solid var(--info,#3b82f6);border-radius:var(--radius-md);display:flex;gap:.75rem;align-items:flex-start">
        <span style="color:var(--info,#3b82f6);flex-shrink:0">${icon('link-2', 20)}</span>
        <div>
          <div style="font-weight:600;margin-bottom:.25rem">Atualmente vinculado</div>
          <div class="muted" style="font-size:.8125rem">E-mail SA: <code>${escapeHtml(data.gcal_client_email)}</code></div>
          <div class="muted" style="font-size:.8125rem">Agenda: <code>${escapeHtml(data.gcal_calendar_id || '—')}</code></div>
          <div class="muted" style="font-size:.8125rem">Status: ${escapeHtml(statusLabel)}</div>
          <div class="muted" style="font-size:.8125rem">Conectado em: ${escapeHtml(connDate)}</div>
          <div class="muted" style="font-size:.8125rem">Último teste: ${escapeHtml(lastCheck)}</div>
        </div>
      </div>`;
    })() : '';

    container.innerHTML = `
      <div style="padding-top:.75rem;display:flex;flex-direction:column;gap:.875rem">
        <p class="muted">${escapeHtml(descText)}</p>
        ${currentBindingHtml}
        ${_gcalInstructionsHtml()}
        ${editHintHtml}
        <div class="field">
          <label for="gcal-json-file">JSON da Service Account</label>
          <input type="file" id="gcal-json-file" accept=".json" style="margin-bottom:.375rem" />
          <textarea id="gcal-json-text" rows="5" placeholder="Ou cole o JSON aqui" style="font-size:.8125rem;font-family:var(--font-mono,monospace)"></textarea>
        </div>
        <div class="field">
          <label for="gcal-calendar-id">ID da agenda</label>
          <input type="text" id="gcal-calendar-id" placeholder="ex: fulano@gmail.com" value="${calId}" />
          <span class="field__hint muted" style="font-size:.75rem">Encontre em calendar.google.com → Configurações → ID da agenda</span>
        </div>
        <div style="display:flex;gap:.625rem;flex-wrap:wrap">
          <button class="btn btn--primary" id="gcal-connect-btn">${btnLabel}</button>
          ${isEdit ? `<button class="btn btn--ghost" id="gcal-cancel-edit-btn">${icon('x', 14)} Cancelar</button>` : ''}
        </div>
      </div>`;

    container.querySelector('#gcal-json-file').addEventListener('change', (ev) => {
      const file = ev.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => { container.querySelector('#gcal-json-text').value = e.target.result; };
      reader.readAsText(file);
    });

    container.querySelector('#gcal-connect-btn').addEventListener('click', async () => {
      const btn = container.querySelector('#gcal-connect-btn');
      const jsonText = (container.querySelector('#gcal-json-text')?.value || '').trim();
      const calendarId = (container.querySelector('#gcal-calendar-id')?.value || '').trim();
      if (!jsonText) { toast('Cole o JSON da Service Account.', 'warning'); return; }
      if (!calendarId) { toast('Informe o ID da agenda.', 'warning'); return; }
      btn.disabled = true;
      try {
        const result = await api(`${baseUrl}/gcal`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ credentials_json: jsonText, calendar_id: calendarId }),
        });
        toast('Credenciais salvas! Clique em "Testar conexão" para validar.', 'success');
        render({ gcal_client_email: result.gcal_client_email, gcal_calendar_id: result.gcal_calendar_id, gcal_status: 'pending', gcal_connected_at: null, gcal_last_check_at: null });
      } catch (err) {
        toast('Erro: ' + err.message, 'danger');
        btn.disabled = false;
      }
    });

    if (isEdit) {
      container.querySelector('#gcal-cancel-edit-btn').addEventListener('click', loadTab);
    }

    /* bloco de instrução pós-PUT se já temos client_email mas ainda pending */
    if (data.gcal_client_email && data.gcal_status === 'pending') {
      const hint = document.createElement('div');
      hint.style.cssText = 'padding:.75rem;background:var(--surface-2,#f5f5f5);border-radius:var(--radius-sm);margin-top:.25rem';
      hint.innerHTML = `
        <p style="margin:0 0 .5rem;font-weight:600">${icon('info', 14)} Credenciais salvas</p>
        <p class="muted" style="margin:0 0 .5rem;font-size:.85rem">Email: <code>${escapeHtml(data.gcal_client_email)}</code></p>
        <p class="muted" style="margin:0 0 .75rem;font-size:.85rem">Compartilhe a agenda <strong>${escapeHtml(data.gcal_calendar_id || '')}</strong> com este e-mail no Google Calendar (permissão "Fazer alterações nos eventos").</p>
        <button class="btn btn--sm" id="gcal-test-pending-btn">${icon('zap', 13)} Testar conexão</button>`;
      container.appendChild(hint);
      hint.querySelector('#gcal-test-pending-btn').addEventListener('click', () => runTest());
    }
  }

  function render(data) {
    const status = data.gcal_status;

    if (!data.gcal_client_email || !status || status === 'pending') {
      _showForm(data, false);

    } else if (status === 'active') {
      const connDate = data.gcal_connected_at ? new Date(data.gcal_connected_at).toLocaleString('pt-BR', { timeZone: 'America/Sao_Paulo' }) : '—';
      const lastCheck = data.gcal_last_check_at ? new Date(data.gcal_last_check_at).toLocaleString('pt-BR', { timeZone: 'America/Sao_Paulo' }) : '—';
      container.innerHTML = `
        <div style="padding-top:.75rem;display:flex;flex-direction:column;gap:.875rem">
          <div style="padding:.75rem 1rem;background:var(--success-bg,#ecfdf5);border:1px solid var(--success,#22c55e);border-radius:var(--radius-md);display:flex;gap:.75rem;align-items:flex-start">
            <span style="color:var(--success,#22c55e);flex-shrink:0">${icon('check-circle-2', 22)}</span>
            <div>
              <div style="font-weight:600;margin-bottom:.25rem">Conectado</div>
              <div class="muted" style="font-size:.8125rem">Email: <code>${escapeHtml(data.gcal_client_email)}</code></div>
              <div class="muted" style="font-size:.8125rem">Agenda: <code>${escapeHtml(data.gcal_calendar_id)}</code></div>
              <div class="muted" style="font-size:.8125rem">Conectado em: ${escapeHtml(connDate)}</div>
              <div class="muted" style="font-size:.8125rem">Último teste: ${escapeHtml(lastCheck)}</div>
            </div>
          </div>
          <div style="display:flex;gap:.625rem;flex-wrap:wrap">
            <button class="btn btn--sm" id="gcal-retest-btn">${icon('refresh-cw', 13)} Testar de novo</button>
            <button class="btn btn--sm btn--ghost" id="gcal-edit-btn">${icon('edit-2', 13)} Editar</button>
            <button class="btn btn--sm btn--ghost" id="gcal-disconnect-btn" style="color:var(--danger)">${icon('trash-2', 13)} Desconectar</button>
          </div>
        </div>`;
      container.querySelector('#gcal-retest-btn').addEventListener('click', () => runTest());
      container.querySelector('#gcal-edit-btn').addEventListener('click', () => _showForm(data, true));
      container.querySelector('#gcal-disconnect-btn').addEventListener('click', () => runDisconnect());

    } else if (status === 'invalid') {
      container.innerHTML = `
        <div style="padding-top:.75rem;display:flex;flex-direction:column;gap:.875rem">
          <div style="padding:.75rem 1rem;background:var(--danger-bg,#fef2f2);border:1px solid var(--danger,#ef4444);border-radius:var(--radius-md);display:flex;gap:.75rem;align-items:flex-start">
            <span style="color:var(--danger,#ef4444);flex-shrink:0">${icon('x-circle', 22)}</span>
            <div>
              <div style="font-weight:600;margin-bottom:.25rem">Credenciais inválidas</div>
              <div class="muted" style="font-size:.8125rem">Email: <code>${escapeHtml(data.gcal_client_email || '—')}</code></div>
              <div class="muted" style="font-size:.8125rem">Agenda: <code>${escapeHtml(data.gcal_calendar_id || '—')}</code></div>
              <div class="muted gcal-error-detail">${data.error ? escapeHtml(data.error) : 'Verifique se a agenda foi compartilhada com o e-mail da Service Account.'}</div>
            </div>
          </div>
          <div style="display:flex;gap:.625rem;flex-wrap:wrap">
            <button class="btn btn--sm btn--primary" id="gcal-retest-btn">${icon('refresh-cw', 13)} Re-testar</button>
            <button class="btn btn--sm btn--ghost" id="gcal-edit-btn">${icon('edit-2', 13)} Editar</button>
            <button class="btn btn--sm btn--ghost" id="gcal-disconnect-btn" style="color:var(--danger)">${icon('trash-2', 13)} Desconectar</button>
          </div>
        </div>`;
      container.querySelector('#gcal-retest-btn').addEventListener('click', () => runTest());
      container.querySelector('#gcal-edit-btn').addEventListener('click', () => _showForm(data, true));
      container.querySelector('#gcal-disconnect-btn').addEventListener('click', () => runDisconnect());
    }
  }

  async function runTest() {
    const testBtn = container.querySelector('#gcal-retest-btn') || container.querySelector('#gcal-test-pending-btn');
    if (testBtn) testBtn.disabled = true;
    try {
      const result = await api(`${baseUrl}/gcal/test`, { method: 'POST' });
      if (result.ok) {
        toast('Conexão com Google Calendar OK!', 'success');
        loadTab();
      } else if (result.errorHint) {
        // Diagnóstico acionável: mostra hint + link clicável em alerta inline
        toast('Falha na conexão. Veja a instrução abaixo pra resolver.', 'danger');
        loadTab();
        setTimeout(() => {
          const host = container;
          const existing = host.querySelector('#gcal-error-hint');
          if (existing) existing.remove();
          const linkHtml = result.errorLink
            ? `<a href="${escapeHtml(result.errorLink)}" target="_blank" rel="noopener" class="btn btn--sm" style="margin-top:.5rem;display:inline-block">${icon('external-link', 13)} Abrir no Google Cloud</a>`
            : '';
          const codeLabel = result.errorCode ? `<code style="font-size:.7rem;background:var(--surface-2);padding:.0625rem .25rem;border-radius:3px;margin-left:.375rem">${escapeHtml(result.errorCode)}</code>` : '';
          const hintBlock = document.createElement('div');
          hintBlock.id = 'gcal-error-hint';
          hintBlock.style.cssText = 'margin-top:.75rem;padding:.75rem 1rem;background:rgba(239,68,68,.08);border-left:3px solid var(--danger,#ef4444);border-radius:var(--radius-sm)';
          hintBlock.innerHTML = `
            <div style="font-weight:600;margin-bottom:.375rem;color:var(--danger,#ef4444)">${icon('alert-triangle', 14)} Como resolver${codeLabel}</div>
            <p style="margin:0;font-size:.85rem;line-height:1.5">${escapeHtml(result.errorHint)}</p>
            ${linkHtml}
            <details style="margin-top:.5rem"><summary class="muted" style="font-size:.75rem;cursor:pointer">Ver erro técnico</summary><div class="gcal-error-detail">${escapeHtml(result.error || '')}</div></details>`;
          host.appendChild(hintBlock);
        }, 50);
      } else {
        toast('Falha na conexão: ' + (result.error || 'erro desconhecido'), 'danger');
        loadTab();
      }
    } catch (err) {
      toast('Erro ao testar: ' + err.message, 'danger');
      if (testBtn) testBtn.disabled = false;
    }
  }

  async function runDisconnect() {
    if (!confirm(`Remover credenciais Google Calendar desta ${entityLabel}?`)) return;
    try {
      await api(`${baseUrl}/gcal`, { method: 'DELETE' });
      toast('Credenciais removidas.', 'success');
      loadTab();
    } catch (err) {
      toast('Erro: ' + err.message, 'danger');
    }
  }

  loadTab();
}

/* ══ MODAL DE CONFIGURAÇÃO DO CLONE ═══════════════════════════════ */
function openCloneConfigModal(clone) {
  let _cfgCloneTab = 'dados';

  function renderConfigModal() {
    const tabNames = ['dados', 'personalizacao', 'horarios', 'servicos', 'cursos', 'media', 'prompt', 'ia', 'sessao', 'gcal', 'pausa'];
    const tabLabels = { dados: 'Dados', personalizacao: 'Personalização', horarios: 'Horários', servicos: 'Serviços', cursos: 'Cursos', media: 'Mídias', prompt: 'Prompt', ia: 'Modelo & IA', sessao: 'Sessão WAHA', gcal: 'Google Calendar', pausa: 'Pausa' };

    const tabsHtml = tabNames.map(t =>
      `<button class="tab-btn${_cfgCloneTab === t ? ' active' : ''}" data-tab="${t}">${escapeHtml(tabLabels[t])}</button>`
    ).join('');

    const modalHtml = `
      <div class="modal__header">
        <span class="modal__title">Configurar — ${escapeHtml(clone.display_name || 'Clone')}</span>
        <button class="btn btn--ghost btn--icon" onclick="closeModal()" aria-label="Fechar">${icon('x', 16)}</button>
      </div>
      <div class="tabs" id="cfg-clone-tabs" style="margin-bottom:0">${tabsHtml}</div>
      <div class="clone-config-tab-content" id="cfg-clone-tab-content"></div>`;

    const modalEl = document.getElementById('modal-content');
    modalEl.classList.add('modal--lg');
    openModal(modalHtml);

    document.getElementById('cfg-clone-tabs')?.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        if (_clonePromptDirty && btn.dataset.tab !== 'prompt') {
          if (!window.confirm('O prompt foi editado mas não salvo. Deseja sair mesmo assim?')) return;
          _clonePromptDirty = false;
        }
        _cfgCloneTab = btn.dataset.tab;
        document.querySelectorAll('#cfg-clone-tabs .tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === _cfgCloneTab));
        loadCloneConfigTab(_cfgCloneTab, clone);
      });
    });

    loadCloneConfigTab(_cfgCloneTab, clone);
  }

  renderConfigModal();
}

/**
 * Helper reusavel: renderiza form de horarios de funcionamento (Seg-Dom) e
 * salva via PATCH/PUT no savePath. Usado pela aba "Horarios" do clone e da
 * matriz (bot_config.horarios_funcionamento).
 *
 * opts:
 *   container: HTMLElement onde renderizar
 *   entity:    objeto com .horarios_funcionamento (clone ou bot)
 *   savePath:  URL pra fetch (ex: '/api/clones/123' ou '/api/bots/teste_barbearia')
 *   method:    'PATCH' | 'PUT'
 *   onSaved:   callback(updated) — recebe payload de resposta
 */
function _renderHorariosTab(opts) {
  const { container, entity, savePath, method, onSaved } = opts;
  const DIAS = [
    ['segunda', 'Segunda'],
    ['terca',   'Terça'],
    ['quarta',  'Quarta'],
    ['quinta',  'Quinta'],
    ['sexta',   'Sexta'],
    ['sabado',  'Sábado'],
    ['domingo', 'Domingo'],
  ];
  const horarios = entity.horarios_funcionamento || {};
  const linhas = DIAS.map(([k, label]) => {
    const d = horarios[k] || {};
    const fechado = d.fechado === true;
    const abre = d.abre || '09:00';
    const fecha = d.fecha || '18:00';
    return `
      <div class="hf-row" data-day="${k}" style="display:grid;grid-template-columns:110px 1fr auto;gap:.75rem;align-items:center;padding:.5rem .25rem;border-bottom:1px solid var(--border)">
        <span style="font-weight:600">${escapeHtml(label)}</span>
        <div style="display:flex;gap:.5rem;align-items:center;flex-wrap:wrap">
          <input type="time" class="hf-abre" value="${escapeHtml(abre)}" ${fechado ? 'disabled' : ''} style="width:6.5rem" />
          <span class="muted">às</span>
          <input type="time" class="hf-fecha" value="${escapeHtml(fecha)}" ${fechado ? 'disabled' : ''} style="width:6.5rem" />
        </div>
        <label style="display:flex;gap:.375rem;align-items:center;font-size:.85rem;cursor:pointer">
          <input type="checkbox" class="hf-fechado" ${fechado ? 'checked' : ''} />
          <span>Fechado</span>
        </label>
      </div>`;
  }).join('');

  container.innerHTML = `
    <div style="padding-top:.5rem;display:flex;flex-direction:column;gap:.875rem">
      <p class="muted">Horários de atendimento da semana. Esses valores são usados no prompt da IA para que ela só ofereça slots dentro do funcionamento.</p>
      <div id="hf-list" style="border:1px solid var(--border);border-radius:var(--radius-md);padding:.25rem .5rem">${linhas}</div>
      <div style="display:flex;gap:.5rem;flex-wrap:wrap">
        <button id="btn-salvar-horarios" class="btn btn--primary">${icon('check-circle-2', 14)} Salvar horários</button>
      </div>
    </div>`;

  container.querySelectorAll('.hf-row').forEach(row => {
    const cb = row.querySelector('.hf-fechado');
    cb.addEventListener('change', () => {
      row.querySelector('.hf-abre').disabled = cb.checked;
      row.querySelector('.hf-fecha').disabled = cb.checked;
    });
  });

  container.querySelector('#btn-salvar-horarios').addEventListener('click', async (ev) => {
    const btn = ev.currentTarget;
    btn.disabled = true;
    const novo = {};
    let erro = null;
    container.querySelectorAll('.hf-row').forEach(row => {
      const dia = row.dataset.day;
      const fechado = row.querySelector('.hf-fechado').checked;
      const abre = row.querySelector('.hf-abre').value;
      const fecha = row.querySelector('.hf-fecha').value;
      if (!fechado && abre && fecha && abre >= fecha) {
        erro = erro || `${dia}: horário de abertura precisa ser antes do fechamento`;
      }
      novo[dia] = fechado
        ? { abre: null, fecha: null, fechado: true }
        : { abre: abre || null, fecha: fecha || null, fechado: false };
    });
    if (erro) { toast(erro, 'warning'); btn.disabled = false; return; }
    try {
      const updated = await api(savePath, {
        method: method || 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ horarios_funcionamento: novo }),
      });
      if (typeof onSaved === 'function') onSaved(updated);
      toast('Horários salvos!', 'success');
      _rendered['bots'] = false;
    } catch (err) {
      toast('Erro: ' + err.message, 'danger');
    } finally { btn.disabled = false; }
  });
}

/**
 * Helper reusavel: renderiza tabela editavel de servicos (nome/preco/duracao).
 * Usado pela aba "Servicos" do clone e da matriz.
 *
 * opts (mesmo formato de _renderHorariosTab):
 *   entity precisa ter .servicos (array)
 */
function _renderServicosTab(opts) {
  const { container, entity, savePath, method, onSaved } = opts;
  const servicos = Array.isArray(entity.servicos) ? entity.servicos : [];

  function renderLinha(s, idx) {
    const nome = s?.nome || '';
    const preco = Number.isFinite(Number(s?.preco_cents)) ? (Number(s.preco_cents) / 100).toFixed(2) : '';
    const dur = Number.isFinite(Number(s?.duracao_min)) ? Number(s.duracao_min) : '';
    return `
      <div class="sv-row" data-idx="${idx}" style="display:grid;grid-template-columns:1fr 110px 110px auto;gap:.5rem;align-items:center;padding:.4rem .25rem;border-bottom:1px solid var(--border)">
        <input type="text" class="sv-nome" placeholder="Ex: Corte" value="${escapeHtml(nome)}" maxlength="60" />
        <input type="number" class="sv-preco" placeholder="R$ 0,00" value="${preco}" step="0.01" min="0" />
        <input type="number" class="sv-dur" placeholder="min" value="${dur}" step="1" min="1" max="600" />
        <button type="button" class="btn btn--ghost btn--sm btn--icon sv-del" aria-label="Remover" style="color:var(--danger)">${icon('trash-2', 13)}</button>
      </div>`;
  }
  const linhasSv = servicos.length > 0
    ? servicos.map((s, i) => renderLinha(s, i)).join('')
    : renderLinha({}, 0);

  container.innerHTML = `
    <div style="padding-top:.5rem;display:flex;flex-direction:column;gap:.875rem">
      <p class="muted">Serviços que o bot vai oferecer. Cada linha vira uma entrada em [SERVICOS E PRECOS] do prompt.</p>
      <div style="display:grid;grid-template-columns:1fr 110px 110px auto;gap:.5rem;padding:.25rem;font-size:.75rem;color:var(--text-muted);font-weight:600">
        <span>Nome</span>
        <span>Preço (R$)</span>
        <span>Duração (min)</span>
        <span></span>
      </div>
      <div id="sv-list" style="border:1px solid var(--border);border-radius:var(--radius-md);padding:.25rem .5rem">${linhasSv}</div>
      <div style="display:flex;gap:.5rem;flex-wrap:wrap">
        <button type="button" id="btn-add-servico" class="btn">${icon('plus', 13)} Adicionar serviço</button>
        <button type="button" id="btn-salvar-servicos" class="btn btn--primary">${icon('check-circle-2', 14)} Salvar serviços</button>
      </div>
    </div>`;

  function wireRow(row) {
    row.querySelector('.sv-del').addEventListener('click', () => {
      row.remove();
      if (container.querySelectorAll('.sv-row').length === 0) {
        const novoIdx = 0;
        container.querySelector('#sv-list').insertAdjacentHTML('beforeend', renderLinha({}, novoIdx));
        wireRow(container.querySelector(`.sv-row[data-idx="${novoIdx}"]`));
      }
    });
  }
  container.querySelectorAll('.sv-row').forEach(wireRow);

  container.querySelector('#btn-add-servico').addEventListener('click', () => {
    const novoIdx = container.querySelectorAll('.sv-row').length;
    container.querySelector('#sv-list').insertAdjacentHTML('beforeend', renderLinha({}, novoIdx));
    const novaRow = container.querySelector(`.sv-row[data-idx="${novoIdx}"]`);
    wireRow(novaRow);
    novaRow.querySelector('.sv-nome')?.focus();
  });

  container.querySelector('#btn-salvar-servicos').addEventListener('click', async (ev) => {
    const btn = ev.currentTarget;
    btn.disabled = true;
    const novo = [];
    let erro = null;
    container.querySelectorAll('.sv-row').forEach(row => {
      const nome = (row.querySelector('.sv-nome').value || '').trim();
      const precoStr = (row.querySelector('.sv-preco').value || '').trim();
      const durStr = (row.querySelector('.sv-dur').value || '').trim();
      if (!nome && !precoStr && !durStr) return; // linha vazia: ignora
      if (!nome) { erro = erro || 'Cada serviço precisa de um nome.'; return; }
      const precoReais = Number(precoStr);
      const dur = Number(durStr);
      novo.push({
        nome,
        preco_cents: Number.isFinite(precoReais) && precoReais >= 0 ? Math.round(precoReais * 100) : 0,
        duracao_min: Number.isFinite(dur) && dur > 0 ? Math.round(dur) : 30,
      });
    });
    if (erro) { toast(erro, 'warning'); btn.disabled = false; return; }
    try {
      const updated = await api(savePath, {
        method: method || 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ servicos: novo }),
      });
      if (typeof onSaved === 'function') onSaved(updated);
      toast('Serviços salvos!', 'success');
      _rendered['bots'] = false;
    } catch (err) {
      toast('Erro: ' + err.message, 'danger');
    } finally { btn.disabled = false; }
  });
}

function loadCloneConfigTab(tab, clone) {
  const content = document.getElementById('cfg-clone-tab-content');
  if (!content) return;

  if (tab === 'dados') {
    content.innerHTML = `
      <form id="clone-dados-form" style="display:flex;flex-direction:column;gap:.875rem;padding-top:.5rem">
        <div class="field">
          <label for="cd-display-name">Nome do clone</label>
          <input id="cd-display-name" type="text" value="${escapeHtml(clone.display_name || '')}" maxlength="120" />
        </div>
        <div class="field">
          <label for="cd-cliente-nome">Nome do operador</label>
          <input id="cd-cliente-nome" type="text" value="${escapeHtml(clone.cliente_nome || '')}" maxlength="80" />
        </div>
        <div class="field">
          <label for="cd-cliente-tel">Telefone do cliente</label>
          <input id="cd-cliente-tel" type="tel" value="${escapeHtml(clone.cliente_telefone || '')}" maxlength="20" />
        </div>
        <button type="submit" class="btn btn--primary">${icon('check-circle-2', 14)} Salvar</button>
      </form>`;

    content.querySelector('#clone-dados-form').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const btn = ev.target.querySelector('[type=submit]');
      btn.disabled = true;
      try {
        const updated = await api(`/api/clones/${clone.id}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            display_name:     (content.querySelector('#cd-display-name')?.value || '').trim() || undefined,
            cliente_nome:     (content.querySelector('#cd-cliente-nome')?.value || '').trim() || undefined,
            cliente_telefone: (content.querySelector('#cd-cliente-tel')?.value || '').trim() || undefined,
          }),
        });
        Object.assign(clone, updated);
        toast('Clone atualizado!', 'success');
        _rendered['bots'] = false;
      } catch (err) {
        toast('Erro: ' + err.message, 'danger');
      } finally { btn.disabled = false; }
    });

  } else if (tab === 'personalizacao') {
    const pers = clone.personalizacao || {};
    const DEFAULT_KEYS = ['nome_negocio', 'telefone_contato', 'endereco', 'instagram'];
    const allKeys = Array.from(new Set([...DEFAULT_KEYS, ...Object.keys(pers)]));
    const kvRows = allKeys.map(k => `
      <div class="kv-row" data-kv>
        <input type="text" class="kv-key" placeholder="chave" value="${escapeHtml(k)}" style="flex:0 0 130px" />
        <input type="text" class="kv-val" placeholder="valor" value="${escapeHtml(pers[k] || '')}" />
        <button type="button" class="btn btn--ghost btn--sm btn--icon kv-del" aria-label="Remover campo" style="color:var(--danger)">${icon('trash-2', 13)}</button>
      </div>`).join('');

    content.innerHTML = `
      <div style="padding-top:.5rem">
        <p class="muted" style="margin-bottom:.875rem">Valores que substituem <code>{{chave}}</code> no prompt do clone.</p>
        <div id="cfg-kv-list">${kvRows}</div>
        <button type="button" class="btn btn--sm" id="cfg-btn-add-kv" style="margin-top:.5rem">${icon('plus', 13)} Adicionar campo</button>
        <div style="margin-top:1rem">
          <button class="btn btn--primary" id="cfg-save-pers-btn">${icon('check-circle-2', 14)} Salvar personalização</button>
        </div>
      </div>`;

    content.querySelectorAll('.kv-del').forEach(btn => btn.addEventListener('click', () => btn.closest('[data-kv]').remove()));
    content.querySelector('#cfg-btn-add-kv').addEventListener('click', () => {
      const row = document.createElement('div');
      row.className = 'kv-row'; row.setAttribute('data-kv', '');
      row.innerHTML = `
        <input type="text" class="kv-key" placeholder="chave" style="flex:0 0 130px" />
        <input type="text" class="kv-val" placeholder="valor" />
        <button type="button" class="btn btn--ghost btn--sm btn--icon kv-del" aria-label="Remover campo" style="color:var(--danger)">${icon('trash-2', 13)}</button>`;
      row.querySelector('.kv-del').addEventListener('click', () => row.remove());
      content.querySelector('#cfg-kv-list').appendChild(row);
    });

    content.querySelector('#cfg-save-pers-btn').addEventListener('click', async () => {
      const btn = content.querySelector('#cfg-save-pers-btn');
      btn.disabled = true;
      try {
        const newPers = {};
        content.querySelectorAll('[data-kv]').forEach(row => {
          const k = (row.querySelector('.kv-key')?.value || '').trim();
          const v = (row.querySelector('.kv-val')?.value || '').trim();
          if (k) newPers[k] = v;
        });
        const updated = await api(`/api/clones/${clone.id}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ personalizacao: newPers }),
        });
        Object.assign(clone, updated);
        toast('Personalização salva!', 'success');
        _rendered['bots'] = false;
      } catch (err) {
        toast('Erro: ' + err.message, 'danger');
      } finally { btn.disabled = false; }
    });

  } else if (tab === 'horarios') {
    _renderHorariosTab({
      container: content,
      entity: clone,
      savePath: `/api/clones/${clone.id}`,
      method: 'PATCH',
      onSaved: (updated) => Object.assign(clone, updated),
    });

  } else if (tab === 'servicos') {
    _renderServicosTab({
      container: content,
      entity: clone,
      savePath: `/api/clones/${clone.id}`,
      method: 'PATCH',
      onSaved: (updated) => Object.assign(clone, updated),
    });

  } else if (tab === 'cursos') {
    content.innerHTML = `<div style="padding:1rem 0;display:flex;justify-content:center"><div class="spinner"></div></div>`;
    renderCloneCourses(clone, content);

  } else if (tab === 'media') {
    content.innerHTML = `<div style="padding:1rem 0;display:flex;justify-content:center"><div class="spinner"></div></div>`;
    renderBotMedia(clone.slot, content);

  } else if (tab === 'prompt') {
    _clonePromptDirty = false;
    content.innerHTML = `<div style="padding:1rem 0;display:flex;justify-content:center"><div class="spinner"></div></div>`;
    (async () => {
      try {
        const data = await api(`/api/bots/${encodeURIComponent(clone.slot)}/prompt`);
        const promptText = data?.prompt || data?.content || data?.system_prompt || '';
        content.innerHTML = `
          <div style="padding-top:.5rem">
            <p class="muted" style="margin-bottom:.75rem;display:flex;align-items:flex-start;gap:.375rem">
              ${icon('info', 14)} Você pode editar o prompt do clone diretamente — suas edições ficam salvas. Horários, serviços e personalização são lidos do clone em runtime e <em>não</em> precisam estar no prompt. Para resetar pro template da matriz, use o botão <strong>Regerar Prompt</strong>.
            </p>
            <div class="field">
              <label for="clone-prompt-ta">Prompt do sistema</label>
              <textarea id="clone-prompt-ta" rows="16" placeholder="Prompt do clone...">${escapeHtml(promptText)}</textarea>
              <div class="char-count"><span id="clone-prompt-count">${promptText.length}</span> caracteres</div>
            </div>
            <button class="btn btn--primary" id="btn-save-clone-prompt" style="margin-top:.75rem">${icon('check-circle-2', 14)} Salvar prompt</button>
          </div>`;

        const ta = content.querySelector('#clone-prompt-ta');
        const countEl = content.querySelector('#clone-prompt-count');
        ta.addEventListener('input', () => {
          countEl.textContent = ta.value.length;
          _clonePromptDirty = true;
        });

        content.querySelector('#btn-save-clone-prompt').addEventListener('click', async () => {
          const btn = content.querySelector('#btn-save-clone-prompt');
          btn.disabled = true;
          try {
            await api(`/api/bots/${encodeURIComponent(clone.slot)}/prompt`, {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ prompt: ta.value }),
            });
            _clonePromptDirty = false;
            toast('Prompt do clone salvo!', 'success');
          } catch (err) {
            toast('Erro ao salvar prompt: ' + err.message, 'danger');
          } finally {
            btn.disabled = false;
          }
        });
      } catch (err) {
        content.innerHTML = `
          <div style="padding-top:.5rem">
            <p class="muted">${icon('alert-triangle', 14)} Erro ao carregar prompt: ${escapeHtml(err.message)}</p>
            <button class="btn btn--sm" id="btn-retry-clone-prompt" style="margin-top:.5rem">${icon('refresh-cw', 14)} Tentar novamente</button>
          </div>`;
        content.querySelector('#btn-retry-clone-prompt').addEventListener('click', () => loadCloneConfigTab('prompt', clone));
      }
    })();

  } else if (tab === 'ia') {
    renderBotConfigIA(clone.slot, content);

  } else if (tab === 'sessao') {
    const sessao = clone.waha_sessao;
    if (!sessao) {
      content.innerHTML = `
        <div style="padding-top:.75rem;display:flex;flex-direction:column;gap:.875rem">
          <p class="muted">Nenhuma sessão WAHA vinculada ainda.</p>
          <button class="btn btn--primary" id="cfg-connect-now-btn">${icon('qr-code', 14)} Conectar agora</button>
        </div>`;
      content.querySelector('#cfg-connect-now-btn').addEventListener('click', () => {
        closeModal();
        openCloneQRModal(clone);
      });
    } else {
      content.innerHTML = `
        <div style="padding-top:.75rem;display:flex;flex-direction:column;gap:.875rem">
          <div class="field"><label>Nome da sessão</label><div class="mono">${escapeHtml(sessao)}</div></div>
          <div class="field"><label>Status</label>${statusCloneBadge(clone.status)}</div>
          <div style="display:flex;gap:.625rem;flex-wrap:wrap">
            <button class="btn" id="cfg-reconect-btn">${icon('refresh-cw', 13)} Reconectar</button>
            <button class="btn btn--danger" id="cfg-disconnect-btn">${icon('unlink', 13)} Desconectar</button>
          </div>
          <div id="cfg-sessao-qr"></div>
        </div>`;

      content.querySelector('#cfg-reconect-btn').addEventListener('click', () => {
        const qrArea = content.querySelector('#cfg-sessao-qr');
        qrArea.innerHTML = `<div class="qr-wrap"><div class="skeleton-block" style="width:200px;height:200px;border-radius:var(--radius-md)"></div><p class="muted">Carregando QR...</p></div>`;
        _activeQRPoll && clearInterval(_activeQRPoll);
        _activeQRPoll = null;
        pollQR(sessao, (data) => {
          if (data.connected || data.qr === null) {
            if (_activeQRPoll) { clearInterval(_activeQRPoll); _activeQRPoll = null; }
            qrArea.innerHTML = `<div class="qr-connected">${icon('check-circle-2', 40)}<div style="font-weight:600">Conectado!</div></div>`;
            toast('WhatsApp reconectado!', 'success');
            clone.status = 'conectado';
            _rendered['bots'] = false;
          } else if (data.qr) {
            qrArea.innerHTML = `<div class="qr-wrap"><img src="${data.qr}" alt="QR Code" /><p class="muted" style="font-size:.8125rem">Escaneie no WhatsApp do cliente</p></div>`;
          }
        });
      });

      content.querySelector('#cfg-disconnect-btn').addEventListener('click', async () => {
        if (!confirm('Desconectar a sessão WAHA deste clone?')) return;
        try {
          await api(`/api/sessions/${encodeURIComponent(sessao)}/stop`, { method: 'POST' });
          toast('Sessão desconectada.', 'success');
          clone.status = 'desconectado';
          _rendered['bots'] = false;
          loadCloneConfigTab('sessao', clone);
        } catch (err) {
          toast('Erro: ' + err.message, 'danger');
        }
      });
    }

  } else if (tab === 'gcal') {
    /* ── Google Calendar (Service Account por clone) — usa helper _renderGcalTab ── */
    _renderGcalTab({
      baseUrl: `/api/clones/${clone.id}`,
      entityLabel: 'clone',
      container: content,
      reloadFn: null,
    });
  } else if (tab === 'pausa') {
    /* ── Palavras-chave de pausa/retomada do clone ── */
    _renderPauseTab(content, clone.slot);
  }
}

/* ══ ABA CURSOS — MODAL DE CLONE ════════════════════════════════
 *  renderCloneCourses(clone, container)
 *  — Lista cursos do clone via GET /api/bots/<slot>/courses
 *  — Toggle global "vídeo aleatório no interesse" em personalizacao jsonb
 *  — Abre modais de add/edit com campo details_for_llm
 *  — Subview de mídias vinculadas (link/unlink) reutiliza openLinkMediaModal
 * ================================================================ */
async function renderCloneCourses(clone, el) {
  const slot = clone.slot;
  try {
    const [coursesRes, mediasRes] = await Promise.all([
      api(`/api/bots/${encodeURIComponent(slot)}/courses`),
      api(`/api/bots/${encodeURIComponent(slot)}/media`),
    ]);
    const courses = Array.isArray(coursesRes) ? coursesRes : (coursesRes.courses || coursesRes.items || []);
    const medias  = Array.isArray(mediasRes)  ? mediasRes  : (mediasRes.media  || mediasRes.items  || []);

    // Toggle global: curso_video_aleatorio_no_interesse
    const pers = (typeof clone.personalizacao === 'object' && clone.personalizacao !== null)
      ? clone.personalizacao : {};
    const toggleChecked = pers.curso_video_aleatorio_no_interesse === true ? 'checked' : '';

    const toggleHtml = `
      <div style="display:flex;align-items:center;gap:.625rem;padding:.625rem .875rem;background:var(--surface-2);border-radius:var(--radius-md);margin-bottom:.875rem">
        <label class="toggle" style="margin:0">
          <input type="checkbox" id="clone-curso-video-toggle" ${toggleChecked}>
          <span class="toggle__track"></span>
        </label>
        <div>
          <div style="font-size:.8125rem;font-weight:500">Enviar vídeo aleatório ao detectar interesse no curso</div>
          <div class="muted" style="font-size:.75rem">Quando ativado, o bot sorteia um vídeo vinculado ao curso demonstrado pelo cliente.</div>
        </div>
      </div>`;

    const header = `
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem">
        <span class="muted" style="font-size:.8125rem">${courses.length} curso${courses.length !== 1 ? 's' : ''}</span>
        <button class="btn btn--primary btn--sm" id="btn-add-clone-course">${icon('plus',13)} Adicionar curso</button>
      </div>`;

    if (!courses.length) {
      el.innerHTML = `${toggleHtml}${header}<div class="empty-state">${icon('book-open',36)}<div class="empty-state__title">Sem cursos</div><p class="empty-state__text">Nenhum curso cadastrado para este clone ainda.</p></div>`;
    } else {
      const rows = courses.map(c => {
        const linked      = medias.filter(m => m.course_slug === c.course_slug);
        const intro       = linked.find(m => m.is_course_intro === true || m.is_course_intro === 1);
        const count       = linked.length;
        const noIntroWarn = count > 0 && !intro
          ? `<span class="badge badge--warning" style="margin-left:.25rem;font-size:.7rem">sem intro</span>`
          : '';
        const priceDisplay    = (c.price != null && c.price >= 0) ? fmtBRL(c.price / 100) : '—';
        const durationDisplay = c.duration ? escapeHtml(c.duration) : '—';
        const hasDetails      = c.details_for_llm && c.details_for_llm.trim().length > 0;
        const detailsBadge    = hasDetails
          ? `<span class="course-slug-badge" style="font-size:.7rem;margin-left:.25rem" title="Detalhes para o bot preenchidos">${icon('cpu',10)} bot</span>`
          : `<span class="course-slug-badge badge--warning" style="font-size:.7rem;margin-left:.25rem;opacity:.7" title="Detalhes para o bot vazios — o bot saberá menos sobre este curso">${icon('alert-triangle',10)} sem detalhes</span>`;

        return `<tr data-id="${c.id}" data-slug="${escapeHtml(c.course_slug)}">
          <td>
            <button class="btn btn--ghost btn--sm js-clone-course-edit" data-id="${c.id}" style="font-weight:600;color:var(--text)">${escapeHtml(c.name)}</button>
            ${detailsBadge}
          </td>
          <td style="color:var(--text-muted);font-size:.8125rem">${priceDisplay}</td>
          <td style="color:var(--text-muted);font-size:.8125rem">${durationDisplay}</td>
          <td title="${count} de 5 mídias máximas"><span>${count}/5</span>${noIntroWarn}</td>
          <td>
            <label class="toggle">
              <input type="checkbox" class="js-clone-course-toggle" data-id="${c.id}" data-slug="${escapeHtml(c.course_slug)}" ${c.enabled ? 'checked' : ''}>
              <span class="toggle__track"></span>
            </label>
          </td>
          <td style="text-align:right;white-space:nowrap">
            <div class="media-actions-wrap">
              <button class="btn btn--ghost btn--sm btn--icon js-clone-course-menu" aria-label="Ações">${icon('more-horizontal',14)}</button>
              <div class="media-actions-menu" data-menu-id="cc-${c.id}">
                <button class="js-clone-course-edit" data-id="${c.id}">${icon('edit-2',13)} Editar</button>
                <button class="js-clone-course-link" data-id="${c.id}" data-slug="${escapeHtml(c.course_slug)}">${icon('link',13)} Mídias</button>
                <button class="js-clone-course-del danger" data-id="${c.id}" data-slug="${escapeHtml(c.course_slug)}" data-name="${escapeHtml(c.name)}">${icon('trash-2',13)} Excluir</button>
              </div>
            </div>
          </td>
        </tr>`;
      }).join('');

      el.innerHTML = `${toggleHtml}${header}<div style="overflow-x:auto"><table class="course-table">
        <thead><tr>
          <th>Nome</th>
          <th>Preço</th>
          <th>Duração</th>
          <th>Mídias</th>
          <th>Ativo</th>
          <th style="width:48px"></th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table></div>`;
    }

    // ── toggle global vídeo aleatório ──
    el.querySelector('#clone-curso-video-toggle').addEventListener('change', async (ev) => {
      const chk = ev.currentTarget;
      chk.disabled = true;
      try {
        const newPers = Object.assign({}, clone.personalizacao || {}, { curso_video_aleatorio_no_interesse: chk.checked });
        const updated = await api(`/api/clones/${clone.id}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ personalizacao: newPers }),
        });
        Object.assign(clone, updated);
        toast(chk.checked ? 'Vídeo aleatório ativado.' : 'Vídeo aleatório desativado.', 'success');
      } catch (err) {
        chk.checked = !chk.checked;
        toast('Erro ao salvar: ' + err.message, 'danger');
      } finally {
        chk.disabled = false;
      }
    });

    el.querySelector('#btn-add-clone-course')?.addEventListener('click', () => {
      openCloneCourseModal(slot, null, el, clone);
    });

    // menu dropdown
    el.querySelectorAll('.js-clone-course-menu').forEach(btn => {
      btn.addEventListener('click', e => {
        e.stopPropagation();
        const wrap = btn.closest('.media-actions-wrap');
        const menu = wrap.querySelector('.media-actions-menu');
        const wasOpen = menu.classList.contains('open');
        document.querySelectorAll('.media-actions-menu.open').forEach(m => m.classList.remove('open'));
        if (!wasOpen) menu.classList.add('open');
      });
    });

    // editar (nome clicável + menu)
    el.querySelectorAll('.js-clone-course-edit').forEach(btn => {
      btn.addEventListener('click', () => {
        const c = courses.find(x => String(x.id) === String(btn.dataset.id));
        if (c) openCloneCourseModal(slot, c, el, clone);
      });
    });

    // mídias
    el.querySelectorAll('.js-clone-course-link').forEach(btn => {
      btn.addEventListener('click', () => {
        openLinkMediaModal(slot, btn.dataset.slug, medias, el);
      });
    });

    // toggle ativo
    el.querySelectorAll('.js-clone-course-toggle').forEach(chk => {
      chk.addEventListener('change', async () => {
        const orig = !chk.checked;
        chk.disabled = true;
        try {
          await api(`/api/bots/${encodeURIComponent(slot)}/courses/${encodeURIComponent(chk.dataset.slug)}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ enabled: chk.checked }),
          });
          toast(chk.checked ? 'Curso ativado.' : 'Curso desativado.', 'success');
        } catch (err) {
          chk.checked = orig;
          toast('Erro: ' + err.message, 'danger');
        } finally { chk.disabled = false; }
      });
    });

    // excluir
    el.querySelectorAll('.js-clone-course-del').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (!confirm(`Excluir curso "${btn.dataset.name}"?`)) return;
        btn.disabled = true;
        try {
          await api(`/api/bots/${encodeURIComponent(slot)}/courses/${encodeURIComponent(btn.dataset.slug)}`, { method: 'DELETE' });
          toast('Curso excluído.', 'success');
          await renderCloneCourses(clone, el);
        } catch (err) {
          toast('Erro ao excluir: ' + err.message, 'danger');
          btn.disabled = false;
        }
      });
    });

  } catch (err) {
    el.innerHTML = `<p class="muted">${icon('alert-triangle',14)} Erro ao carregar cursos: ${escapeHtml(err.message)}</p>
      <button class="btn btn--sm" id="clone-courses-retry">${icon('refresh-cw',14)} Tentar novamente</button>`;
    el.querySelector('#clone-courses-retry').addEventListener('click', () => renderCloneCourses(clone, el));
  }
}

/* ── form de curso do clone (add/edit) com details_for_llm ── */
