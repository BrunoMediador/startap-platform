let _wizardState = {};

function openCloneWizard(preSelectMatriz) {
  _wizardState = {
    step: 1,
    matriz_slot: preSelectMatriz || null,
    display_name: '',
    cliente_nome: '',
    cliente_telefone: '',
    personalizacao: {
      nome_negocio: '',
      telefone_contato: '',
      endereco: '',
      instagram: '',
    },
    sessao_name: '',
    cloneId: null,
    stopQR: null,
  };
  if (preSelectMatriz) _wizardState.step = 2;
  renderWizardStep();
}

function renderWizardStep() {
  const s = _wizardState;
  const stepCount = 4;

  function stepCircles() {
    const segs = [];
    for (let i = 1; i <= stepCount; i++) {
      const cls = i < s.step ? 'done' : i === s.step ? 'active' : '';
      const label = i < s.step ? icon('check-circle-2', 14) : String(i);
      segs.push(`<div class="wizard-step ${cls}" aria-current="${i === s.step ? 'step' : 'false'}">${label}</div>`);
      if (i < stepCount) {
        segs.push(`<div class="wizard-step-sep ${i < s.step ? 'done' : ''}"></div>`);
      }
    }
    return segs.join('');
  }

  let bodyHtml = '';
  let footerHtml = '';

  if (s.step === 1) {
    const cards = MATRIZ_OPTS.map(m => `
      <div class="matrix-card ${s.matriz_slot === m.slot ? 'selected' : ''}" data-slot="${m.slot}" role="button" tabindex="0" aria-pressed="${s.matriz_slot === m.slot}">
        <div class="matrix-card__icon">${icon('git-branch', 28)}</div>
        <div class="matrix-card__name">${escapeHtml(m.name)}</div>
        <div class="matrix-card__desc">${escapeHtml(m.desc)}</div>
      </div>`).join('');
    bodyHtml = `
      <p class="muted" style="margin-bottom:1rem">Escolha qual fluxo vai servir de base para este clone:</p>
      <div class="matrix-cards" id="wizard-matrix-cards">${cards}</div>`;
    footerHtml = `
      <div></div>
      <button class="btn btn--primary" id="wizard-next-btn" ${!s.matriz_slot ? 'disabled' : ''}>Continuar ${icon('chevron-right', 14)}</button>`;

  } else if (s.step === 2) {
    bodyHtml = `
      <div style="display:flex;flex-direction:column;gap:.875rem">
        <div class="field">
          <label for="wz-display-name">Nome do clone <span style="color:var(--danger)">*</span></label>
          <input id="wz-display-name" type="text" placeholder="Ex: Barbearia do João — São Paulo" value="${escapeHtml(s.display_name)}" maxlength="120" />
        </div>
        <div class="field">
          <label for="wz-cliente-nome">Nome do operador</label>
          <input id="wz-cliente-nome" type="text" placeholder="Ex: João Silva (substitui [Ricardo] no prompt)" value="${escapeHtml(s.cliente_nome)}" maxlength="80" />
        </div>
        <div class="field">
          <label for="wz-cliente-tel">Telefone do cliente (opcional)</label>
          <input id="wz-cliente-tel" type="tel" placeholder="55119..." value="${escapeHtml(s.cliente_telefone)}" maxlength="20" />
        </div>
      </div>`;
    footerHtml = `
      <button class="btn" id="wizard-back-btn">${icon('chevron-right', 14, true)} Voltar</button>
      <button class="btn btn--primary" id="wizard-next-btn">Continuar ${icon('chevron-right', 14)}</button>`;

  } else if (s.step === 3) {
    const kvRows = Object.entries(s.personalizacao).map(([k, v]) => `
      <div class="kv-row" data-kv>
        <input type="text" class="kv-key" placeholder="chave" value="${escapeHtml(k)}" style="flex:0 0 130px" />
        <input type="text" class="kv-val" placeholder="valor" value="${escapeHtml(v)}" />
        <button type="button" class="btn btn--ghost btn--sm btn--icon kv-del" aria-label="Remover campo" style="color:var(--danger)">${icon('trash-2', 13)}</button>
      </div>`).join('');
    bodyHtml = `
      <p class="muted" style="margin-bottom:.875rem">Você pode personalizar dados que aparecem no prompt. Deixe em branco se quiser usar os valores padrão da matriz.</p>
      <div id="kv-list">${kvRows}</div>
      <button type="button" class="btn btn--sm" id="btn-add-kv" style="margin-top:.5rem">${icon('plus', 13)} Adicionar campo</button>`;
    footerHtml = `
      <button class="btn" id="wizard-back-btn">${icon('chevron-right', 14)} Voltar</button>
      <button class="btn btn--primary" id="wizard-next-btn">Continuar ${icon('chevron-right', 14)}</button>`;

  } else if (s.step === 4) {
    const suggestedName = 'clone_' + slugify(s.display_name);
    if (!s.sessao_name) s.sessao_name = suggestedName;
    bodyHtml = `
      <div style="display:flex;flex-direction:column;gap:.875rem">
        <p class="muted">Em qual WhatsApp este clone vai funcionar?</p>
        <div class="field">
          <label for="wz-sessao-name">Nome da sessão WAHA</label>
          <input id="wz-sessao-name" type="text" value="${escapeHtml(s.sessao_name)}" maxlength="60" placeholder="clone_nome_cliente" />
        </div>
        <div id="wizard-qr-area"></div>
      </div>`;
    footerHtml = `
      <button class="btn" id="wizard-back-btn">${icon('chevron-right', 14)} Voltar</button>
      <button class="btn btn--primary" id="wizard-create-btn">${icon('qr-code', 14)} Criar sessão e mostrar QR</button>`;
  }

  const modalHtml = `
    <div class="modal__header">
      <span class="modal__title">Clonar fluxo matriz — Passo ${s.step} de ${stepCount}</span>
      <button class="btn btn--ghost btn--icon" id="wizard-close-btn" aria-label="Fechar">${icon('x', 16)}</button>
    </div>
    <div class="wizard-steps">${stepCircles()}</div>
    <div class="wizard-body" id="wizard-body">${bodyHtml}</div>
    <div class="wizard-footer">${footerHtml}</div>`;

  // Ensure modal is large
  const modalEl = document.getElementById('modal-content');
  modalEl.classList.add('modal--lg');
  openModal(modalHtml);

  // Wire close
  document.getElementById('wizard-close-btn')?.addEventListener('click', () => closeModal());

  // Wire step-specific events
  if (s.step === 1) {
    document.querySelectorAll('.matrix-card').forEach(card => {
      card.addEventListener('click', () => {
        _wizardState.matriz_slot = card.dataset.slot;
        document.querySelectorAll('.matrix-card').forEach(c => { c.classList.toggle('selected', c.dataset.slot === _wizardState.matriz_slot); c.setAttribute('aria-pressed', c.dataset.slot === _wizardState.matriz_slot); });
        const nextBtn = document.getElementById('wizard-next-btn');
        if (nextBtn) nextBtn.disabled = false;
      });
      card.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') card.click(); });
    });
  }

  if (s.step === 3) {
    document.getElementById('btn-add-kv')?.addEventListener('click', () => {
      const row = document.createElement('div');
      row.className = 'kv-row';
      row.setAttribute('data-kv', '');
      row.innerHTML = `
        <input type="text" class="kv-key" placeholder="chave" style="flex:0 0 130px" />
        <input type="text" class="kv-val" placeholder="valor" />
        <button type="button" class="btn btn--ghost btn--sm btn--icon kv-del" aria-label="Remover campo" style="color:var(--danger)">${icon('trash-2', 13)}</button>`;
      row.querySelector('.kv-del').addEventListener('click', () => row.remove());
      document.getElementById('kv-list').appendChild(row);
    });

    document.querySelectorAll('.kv-del').forEach(btn => {
      btn.addEventListener('click', () => btn.closest('[data-kv]').remove());
    });
  }

  if (s.step === 4) {
    document.getElementById('wizard-create-btn')?.addEventListener('click', () => wizardStep4Create());
  }

  // Back — step 1 não tem wizard-back-btn no DOM; guard evita decremento abaixo de 1
  document.getElementById('wizard-back-btn')?.addEventListener('click', () => {
    if (_wizardState.step <= 1) return;
    wizardCollectStep();
    _wizardState.step--;
    renderWizardStep();
  });

  // Next
  document.getElementById('wizard-next-btn')?.addEventListener('click', () => {
    if (!wizardValidateStep()) return;
    wizardCollectStep();
    _wizardState.step++;
    renderWizardStep();
  });
}

function wizardCollectStep() {
  const s = _wizardState;
  if (s.step === 2) {
    s.display_name     = (document.getElementById('wz-display-name')?.value || '').trim();
    s.cliente_nome     = (document.getElementById('wz-cliente-nome')?.value || '').trim();
    s.cliente_telefone = (document.getElementById('wz-cliente-tel')?.value || '').trim();
  } else if (s.step === 3) {
    s.personalizacao = {};
    document.querySelectorAll('[data-kv]').forEach(row => {
      const k = (row.querySelector('.kv-key')?.value || '').trim();
      const v = (row.querySelector('.kv-val')?.value || '').trim();
      if (k) s.personalizacao[k] = v;
    });
  } else if (s.step === 4) {
    s.sessao_name = (document.getElementById('wz-sessao-name')?.value || '').trim() || 'clone_' + slugify(s.display_name);
  }
}

function wizardValidateStep() {
  const s = _wizardState;
  if (s.step === 1 && !s.matriz_slot) { toast('Selecione um fluxo matriz.', 'warning'); return false; }
  if (s.step === 2) {
    const name = (document.getElementById('wz-display-name')?.value || '').trim();
    if (!name) { toast('O nome do clone é obrigatório.', 'warning'); document.getElementById('wz-display-name')?.focus(); return false; }
  }
  return true;
}

async function wizardStep4Create() {
  const s = _wizardState;
  s.sessao_name = (document.getElementById('wz-sessao-name')?.value || '').trim() || 'clone_' + slugify(s.display_name);

  const createBtn = document.getElementById('wizard-create-btn');
  if (createBtn) { createBtn.disabled = true; createBtn.innerHTML = `<div class="spinner" style="width:16px;height:16px"></div> Criando...`; }

  const qrArea = document.getElementById('wizard-qr-area');

  try {
    // Passo 1: criar clone (rascunho)
    if (!s.cloneId) {
      const clone = await api('/api/clones', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          matriz_slot:    s.matriz_slot,
          display_name:   s.display_name,
          cliente_nome:   s.cliente_nome || undefined,
          cliente_telefone: s.cliente_telefone || undefined,
          personalizacao: Object.keys(s.personalizacao).length ? s.personalizacao : undefined,
        }),
      });
      s.cloneId = clone.id;
    }

    // Passo 2: criar sessão WAHA
    try {
      await api('/api/sessions/create', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: s.sessao_name }),
      });
    } catch (e) {
      // Sessão pode já existir — ignora erro
    }

    // Passo 3: bind-session
    await api(`/api/clones/${s.cloneId}/bind-session`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sessao_name: s.sessao_name, telefone: s.cliente_telefone || undefined }),
    });

    // Mostrar QR com polling
    qrArea.innerHTML = `<div class="qr-wrap"><div class="skeleton-block" style="width:200px;height:200px;border-radius:var(--radius-md)"></div><p class="muted">Carregando QR...</p></div>`;

    if (createBtn) createBtn.style.display = 'none';
    const backBtn = document.getElementById('wizard-back-btn');
    if (backBtn) { backBtn.textContent = 'Cancelar e voltar'; }

    s.stopQR = pollQR(s.sessao_name, (data) => {
      if (data.connected || data.qr === null) {
        if (s.stopQR) { s.stopQR(); s.stopQR = null; }
        qrArea.innerHTML = `
          <div class="qr-connected">
            <div style="font-size:3rem">${icon('check-circle-2', 56)}</div>
            <div style="font-weight:700;font-size:1.125rem">WhatsApp conectado!</div>
            <button class="btn btn--primary" id="wizard-finish-btn">${icon('check-circle-2', 14)} Concluir</button>
          </div>`;
        document.getElementById('wizard-finish-btn')?.addEventListener('click', () => {
          closeModal();
          toast('Clone criado e conectado com sucesso!', 'success');
          _rendered['bots'] = false;
          renderBots();
        });
      } else if (data.qr) {
        qrArea.innerHTML = `
          <div class="qr-wrap">
            <img src="${data.qr}" alt="QR Code para conectar WhatsApp" />
            <p class="muted" style="text-align:center;font-size:.8125rem">Escaneie no WhatsApp do cliente</p>
          </div>`;
      } else if (data.error) {
        qrArea.innerHTML = `<p class="muted" style="color:var(--danger)">${icon('alert-triangle',14)} ${escapeHtml(data.error)}</p>
          <button class="btn btn--sm" id="wizard-retry-qr-btn">${icon('refresh-cw',14)} Tentar novamente</button>`;
        document.getElementById('wizard-retry-qr-btn')?.addEventListener('click', wizardStep4Create);
      }
    });

  } catch (err) {
    if (qrArea) qrArea.innerHTML = `<p class="muted" style="color:var(--danger)">${icon('alert-triangle',14)} ${escapeHtml(err.message)}</p>`;
    if (createBtn) { createBtn.disabled = false; createBtn.innerHTML = `${icon('qr-code',14)} Tentar novamente`; }
    toast('Erro ao criar clone: ' + err.message, 'danger');
  }
}

/* ══ MODAL DE CONFIGURAÇÃO DO CLONE ═══════════════════════════════ */
function openCloneConfigModal(clone) {
  let _cfgCloneTab = 'dados';

  function renderConfigModal() {
    const tabNames = ['dados', 'personalizacao', 'prompt', 'sessao', 'gcal'];
    const tabLabels = { dados: 'Dados', personalizacao: 'Personalização', prompt: 'Prompt', sessao: 'Sessão WAHA', gcal: 'Google Calendar' };

    const tabsHtml = tabNames.map(t =>
      `<button class="tab-btn${_cfgCloneTab === t ? ' active' : ''}" data-tab="${t}">${escapeHtml(tabLabels[t])}</button>`
    ).join('');

    const modalHtml = `
      <div class="modal__header">
        <span class="modal__title">Configurar — ${escapeHtml(clone.display_name || 'Clone')}</span>
        <button class="btn btn--ghost btn--icon" onclick="closeModal()" aria-label="Fechar">${icon('x', 16)}</button>
      </div>
      <div class="tabs" id="cfg-clone-tabs" style="margin-bottom:0">${tabsHtml}</div>
      <div class="clone-config-tab-content" id="cfg-clone-tab-content"></div>`;

    const modalEl = document.getElementById('modal-content');
    modalEl.classList.add('modal--lg');
    openModal(modalHtml);

    document.getElementById('cfg-clone-tabs')?.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        _cfgCloneTab = btn.dataset.tab;
        document.querySelectorAll('#cfg-clone-tabs .tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === _cfgCloneTab));
        loadCloneConfigTab(_cfgCloneTab, clone);
      });
    });

    loadCloneConfigTab(_cfgCloneTab, clone);
  }

  renderConfigModal();
}

function loadCloneConfigTab(tab, clone) {
  const content = document.getElementById('cfg-clone-tab-content');
  if (!content) return;

  if (tab === 'dados') {
    content.innerHTML = `
      <form id="clone-dados-form" style="display:flex;flex-direction:column;gap:.875rem;padding-top:.5rem">
        <div class="field">
          <label for="cd-display-name">Nome do clone</label>
          <input id="cd-display-name" type="text" value="${escapeHtml(clone.display_name || '')}" maxlength="120" />
        </div>
        <div class="field">
          <label for="cd-cliente-nome">Nome do operador</label>
          <input id="cd-cliente-nome" type="text" value="${escapeHtml(clone.cliente_nome || '')}" maxlength="80" />
        </div>
        <div class="field">
          <label for="cd-cliente-tel">Telefone do cliente</label>
          <input id="cd-cliente-tel" type="tel" value="${escapeHtml(clone.cliente_telefone || '')}" maxlength="20" />
        </div>
        <button type="submit" class="btn btn--primary">${icon('check-circle-2', 14)} Salvar</button>
      </form>`;

    content.querySelector('#clone-dados-form').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const btn = ev.target.querySelector('[type=submit]');
      btn.disabled = true;
      try {
        const updated = await api(`/api/clones/${clone.id}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            display_name:     (content.querySelector('#cd-display-name')?.value || '').trim() || undefined,
            cliente_nome:     (content.querySelector('#cd-cliente-nome')?.value || '').trim() || undefined,
            cliente_telefone: (content.querySelector('#cd-cliente-tel')?.value || '').trim() || undefined,
          }),
        });
        Object.assign(clone, updated);
        toast('Clone atualizado!', 'success');
        _rendered['bots'] = false;
      } catch (err) {
        toast('Erro: ' + err.message, 'danger');
      } finally { btn.disabled = false; }
    });

  } else if (tab === 'personalizacao') {
    const pers = clone.personalizacao || {};
    const DEFAULT_KEYS = ['nome_negocio', 'telefone_contato', 'endereco', 'instagram'];
    const allKeys = Array.from(new Set([...DEFAULT_KEYS, ...Object.keys(pers)]));
    const kvRows = allKeys.map(k => `
      <div class="kv-row" data-kv>
        <input type="text" class="kv-key" placeholder="chave" value="${escapeHtml(k)}" style="flex:0 0 130px" />
        <input type="text" class="kv-val" placeholder="valor" value="${escapeHtml(pers[k] || '')}" />
        <button type="button" class="btn btn--ghost btn--sm btn--icon kv-del" aria-label="Remover campo" style="color:var(--danger)">${icon('trash-2', 13)}</button>
      </div>`).join('');

    content.innerHTML = `
      <div style="padding-top:.5rem">
        <p class="muted" style="margin-bottom:.875rem">Valores que substituem <code>{{chave}}</code> no prompt do clone.</p>
        <div id="cfg-kv-list">${kvRows}</div>
        <button type="button" class="btn btn--sm" id="cfg-btn-add-kv" style="margin-top:.5rem">${icon('plus', 13)} Adicionar campo</button>
        <div style="margin-top:1rem">
          <button class="btn btn--primary" id="cfg-save-pers-btn">${icon('check-circle-2', 14)} Salvar personalização</button>
        </div>
      </div>`;

    content.querySelectorAll('.kv-del').forEach(btn => btn.addEventListener('click', () => btn.closest('[data-kv]').remove()));
    content.querySelector('#cfg-btn-add-kv').addEventListener('click', () => {
      const row = document.createElement('div');
      row.className = 'kv-row'; row.setAttribute('data-kv', '');
      row.innerHTML = `
        <input type="text" class="kv-key" placeholder="chave" style="flex:0 0 130px" />
        <input type="text" class="kv-val" placeholder="valor" />
        <button type="button" class="btn btn--ghost btn--sm btn--icon kv-del" aria-label="Remover campo" style="color:var(--danger)">${icon('trash-2', 13)}</button>`;
      row.querySelector('.kv-del').addEventListener('click', () => row.remove());
      content.querySelector('#cfg-kv-list').appendChild(row);
    });

    content.querySelector('#cfg-save-pers-btn').addEventListener('click', async () => {
      const btn = content.querySelector('#cfg-save-pers-btn');
      btn.disabled = true;
      try {
        const newPers = {};
        content.querySelectorAll('[data-kv]').forEach(row => {
          const k = (row.querySelector('.kv-key')?.value || '').trim();
          const v = (row.querySelector('.kv-val')?.value || '').trim();
          if (k) newPers[k] = v;
        });
        const updated = await api(`/api/clones/${clone.id}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ personalizacao: newPers }),
        });
        Object.assign(clone, updated);
        toast('Personalização salva!', 'success');
        _rendered['bots'] = false;
      } catch (err) {
        toast('Erro: ' + err.message, 'danger');
      } finally { btn.disabled = false; }
    });

  } else if (tab === 'prompt') {
    const promptText = clone.prompt || clone.system_prompt || '';
    content.innerHTML = `
      <div style="padding-top:.5rem">
        <p class="muted" style="margin-bottom:.75rem;display:flex;align-items:center;gap:.375rem">
          ${icon('alert-triangle', 14)} Para editar, ajuste a personalização — o prompt é regenerado da matriz automaticamente.
        </p>
        <textarea rows="16" readonly style="opacity:.7;cursor:default">${escapeHtml(promptText)}</textarea>
      </div>`;

  } else if (tab === 'sessao') {
    const sessao = clone.waha_sessao;
    if (!sessao) {
      content.innerHTML = `
        <div style="padding-top:.75rem;display:flex;flex-direction:column;gap:.875rem">
          <p class="muted">Nenhuma sessão WAHA vinculada ainda.</p>
          <button class="btn btn--primary" id="cfg-connect-now-btn">${icon('qr-code', 14)} Conectar agora</button>
        </div>`;
      content.querySelector('#cfg-connect-now-btn').addEventListener('click', () => {
        closeModal();
        openCloneQRModal(clone);
      });
    } else {
      content.innerHTML = `
        <div style="padding-top:.75rem;display:flex;flex-direction:column;gap:.875rem">
          <div class="field"><label>Nome da sessão</label><div class="mono">${escapeHtml(sessao)}</div></div>
          <div class="field"><label>Status</label>${statusCloneBadge(clone.status)}</div>
          <div style="display:flex;gap:.625rem;flex-wrap:wrap">
            <button class="btn" id="cfg-reconect-btn">${icon('refresh-cw', 13)} Reconectar</button>
            <button class="btn btn--danger" id="cfg-disconnect-btn">${icon('unlink', 13)} Desconectar</button>
          </div>
          <div id="cfg-sessao-qr"></div>
        </div>`;

      content.querySelector('#cfg-reconect-btn').addEventListener('click', () => {
        const qrArea = content.querySelector('#cfg-sessao-qr');
        qrArea.innerHTML = `<div class="qr-wrap"><div class="skeleton-block" style="width:200px;height:200px;border-radius:var(--radius-md)"></div><p class="muted">Carregando QR...</p></div>`;
        _activeQRPoll && clearInterval(_activeQRPoll);
        _activeQRPoll = null;
        pollQR(sessao, (data) => {
          if (data.connected || data.qr === null) {
            if (_activeQRPoll) { clearInterval(_activeQRPoll); _activeQRPoll = null; }
            qrArea.innerHTML = `<div class="qr-connected">${icon('check-circle-2', 40)}<div style="font-weight:600">Conectado!</div></div>`;
            toast('WhatsApp reconectado!', 'success');
            clone.status = 'conectado';
            _rendered['bots'] = false;
          } else if (data.qr) {
            qrArea.innerHTML = `<div class="qr-wrap"><img src="${data.qr}" alt="QR Code" /><p class="muted" style="font-size:.8125rem">Escaneie no WhatsApp do cliente</p></div>`;
          }
        });
      });

      content.querySelector('#cfg-disconnect-btn').addEventListener('click', async () => {
        if (!confirm('Desconectar a sessão WAHA deste clone?')) return;
        try {
          await api(`/api/sessions/${encodeURIComponent(sessao)}/stop`, { method: 'POST' });
          toast('Sessão desconectada.', 'success');
          clone.status = 'desconectado';
          _rendered['bots'] = false;
          loadCloneConfigTab('sessao', clone);
        } catch (err) {
          toast('Erro: ' + err.message, 'danger');
        }
      });
    }

  } else if (tab === 'gcal') {
    /* ── Google Calendar (Service Account por clone) ── */
    async function loadGcalTab() {
      content.innerHTML = `<div style="padding-top:.75rem;display:flex;justify-content:center"><div class="spinner"></div></div>`;
      let gcalData;
      try {
        gcalData = await api(`/api/clones/${clone.id}/gcal/status`);
      } catch (err) {
        content.innerHTML = `<p class="muted" style="padding-top:.75rem">Erro ao carregar status: ${escapeHtml(err.message)}</p>`;
        return;
      }
      renderGcalContent(gcalData);
    }

    function renderGcalContent(data) {
      const status = data.gcal_status;

      if (!data.gcal_client_email || !status || status === 'pending') {
        /* ── sem credenciais ou pendente: mostrar form ── */
        content.innerHTML = `
          <div style="padding-top:.75rem;display:flex;flex-direction:column;gap:.875rem">
            <p class="muted">Configure uma Service Account para que este clone use sua própria agenda.</p>
            <div class="field">
              <label for="gcal-json-file">JSON da Service Account</label>
              <input type="file" id="gcal-json-file" accept=".json" style="margin-bottom:.375rem" />
              <textarea id="gcal-json-text" rows="5" placeholder="Ou cole o JSON aqui" style="font-size:.8125rem;font-family:var(--font-mono,monospace)"></textarea>
            </div>
            <div class="field">
              <label for="gcal-calendar-id">ID da agenda</label>
              <input type="text" id="gcal-calendar-id" placeholder="ex: fulano@gmail.com" value="${escapeHtml(data.gcal_calendar_id || '')}" />
              <span class="field__hint muted" style="font-size:.75rem">Encontre em calendar.google.com → Configurações → ID da agenda</span>
            </div>
            <button class="btn btn--primary" id="gcal-connect-btn">${icon('link-2', 14)} Conectar</button>
          </div>`;

        content.querySelector('#gcal-json-file').addEventListener('change', (ev) => {
          const file = ev.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = (e) => { content.querySelector('#gcal-json-text').value = e.target.result; };
          reader.readAsText(file);
        });

        content.querySelector('#gcal-connect-btn').addEventListener('click', async () => {
          const btn = content.querySelector('#gcal-connect-btn');
          const jsonText = (content.querySelector('#gcal-json-text')?.value || '').trim();
          const calId = (content.querySelector('#gcal-calendar-id')?.value || '').trim();
          if (!jsonText) { toast('Cole o JSON da Service Account.', 'warning'); return; }
          if (!calId) { toast('Informe o ID da agenda.', 'warning'); return; }
          btn.disabled = true;
          try {
            const result = await api(`/api/clones/${clone.id}/gcal`, {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ credentials_json: jsonText, calendar_id: calId }),
            });
            toast('Credenciais salvas! Clique em "Testar conexão" para validar.', 'success');
            Object.assign(clone, { gcal_client_email: result.gcal_client_email, gcal_calendar_id: result.gcal_calendar_id, gcal_status: 'pending' });
            renderGcalContent({ gcal_client_email: result.gcal_client_email, gcal_calendar_id: result.gcal_calendar_id, gcal_status: 'pending', gcal_connected_at: null, gcal_last_check_at: null });
          } catch (err) {
            toast('Erro: ' + err.message, 'danger');
            btn.disabled = false;
          }
        });

        /* mostra bloco de instrução pós-PUT se já temos client_email mas ainda pending */
        if (data.gcal_client_email && status === 'pending') {
          const hint = document.createElement('div');
          hint.style.cssText = 'padding:.75rem;background:var(--surface-2,#f5f5f5);border-radius:var(--radius-sm);margin-top:.25rem';
          hint.innerHTML = `
            <p style="margin:0 0 .5rem;font-weight:600">${icon('info', 14)} Credenciais salvas</p>
            <p class="muted" style="margin:0 0 .5rem;font-size:.85rem">Email: <code>${escapeHtml(data.gcal_client_email)}</code></p>
            <p class="muted" style="margin:0 0 .75rem;font-size:.85rem">Compartilhe a agenda <strong>${escapeHtml(data.gcal_calendar_id || '')}</strong> com este e-mail no Google Calendar (permissão "Fazer alterações nos eventos").</p>
            <button class="btn btn--sm" id="gcal-test-pending-btn">${icon('zap', 13)} Testar conexão</button>`;
          content.appendChild(hint);
          hint.querySelector('#gcal-test-pending-btn').addEventListener('click', () => runGcalTest());
        }

      } else if (status === 'active') {
        /* ── ativo ── */
        const connDate = data.gcal_connected_at ? new Date(data.gcal_connected_at).toLocaleString('pt-BR') : '—';
        const lastCheck = data.gcal_last_check_at ? new Date(data.gcal_last_check_at).toLocaleString('pt-BR') : '—';
        content.innerHTML = `
          <div style="padding-top:.75rem;display:flex;flex-direction:column;gap:.875rem">
            <div style="padding:.75rem 1rem;background:var(--success-bg,#ecfdf5);border:1px solid var(--success,#22c55e);border-radius:var(--radius-md);display:flex;gap:.75rem;align-items:flex-start">
              <span style="color:var(--success,#22c55e);flex-shrink:0">${icon('check-circle-2', 22)}</span>
              <div>
                <div style="font-weight:600;margin-bottom:.25rem">Conectado</div>
                <div class="muted" style="font-size:.8125rem">Email: <code>${escapeHtml(data.gcal_client_email)}</code></div>
                <div class="muted" style="font-size:.8125rem">Agenda: <code>${escapeHtml(data.gcal_calendar_id)}</code></div>
                <div class="muted" style="font-size:.8125rem">Conectado em: ${escapeHtml(connDate)}</div>
                <div class="muted" style="font-size:.8125rem">Último teste: ${escapeHtml(lastCheck)}</div>
              </div>
            </div>
            <div style="display:flex;gap:.625rem;flex-wrap:wrap">
              <button class="btn btn--sm" id="gcal-retest-btn">${icon('refresh-cw', 13)} Testar de novo</button>
              <button class="btn btn--sm btn--ghost" id="gcal-disconnect-btn" style="color:var(--danger)">${icon('trash-2', 13)} Desconectar</button>
            </div>
          </div>`;
        content.querySelector('#gcal-retest-btn').addEventListener('click', () => runGcalTest());
        content.querySelector('#gcal-disconnect-btn').addEventListener('click', () => runGcalDisconnect());

      } else if (status === 'invalid') {
        /* ── inválido ── */
        content.innerHTML = `
          <div style="padding-top:.75rem;display:flex;flex-direction:column;gap:.875rem">
            <div style="padding:.75rem 1rem;background:var(--danger-bg,#fef2f2);border:1px solid var(--danger,#ef4444);border-radius:var(--radius-md);display:flex;gap:.75rem;align-items:flex-start">
              <span style="color:var(--danger,#ef4444);flex-shrink:0">${icon('x-circle', 22)}</span>
              <div>
                <div style="font-weight:600;margin-bottom:.25rem">Credenciais inválidas</div>
                <div class="muted" style="font-size:.8125rem">Email: <code>${escapeHtml(data.gcal_client_email || '—')}</code></div>
                <div class="muted" style="font-size:.8125rem">Verifique se a agenda foi compartilhada com este e-mail.</div>
              </div>
            </div>
            <div style="display:flex;gap:.625rem;flex-wrap:wrap">
              <button class="btn btn--sm btn--primary" id="gcal-retest-btn">${icon('refresh-cw', 13)} Re-testar</button>
              <button class="btn btn--sm btn--ghost" id="gcal-disconnect-btn" style="color:var(--danger)">${icon('trash-2', 13)} Desconectar</button>
            </div>
          </div>`;
        content.querySelector('#gcal-retest-btn').addEventListener('click', () => runGcalTest());
        content.querySelector('#gcal-disconnect-btn').addEventListener('click', () => runGcalDisconnect());
      }
    }

    async function runGcalTest() {
      const testBtn = content.querySelector('#gcal-retest-btn') || content.querySelector('#gcal-test-pending-btn');
      if (testBtn) testBtn.disabled = true;
      try {
        const result = await api(`/api/clones/${clone.id}/gcal/test`, { method: 'POST' });
        if (result.ok) {
          toast('Conexão com Google Calendar OK!', 'success');
        } else {
          toast('Falha na conexão: ' + (result.error || 'erro desconhecido'), 'danger');
        }
        loadGcalTab();
      } catch (err) {
        toast('Erro ao testar: ' + err.message, 'danger');
        if (testBtn) testBtn.disabled = false;
      }
    }

    async function runGcalDisconnect() {
      if (!confirm('Remover credenciais Google Calendar deste clone?')) return;
      try {
        await api(`/api/clones/${clone.id}/gcal`, { method: 'DELETE' });
        toast('Credenciais removidas.', 'success');
        Object.assign(clone, { gcal_client_email: null, gcal_calendar_id: null, gcal_status: null });
        loadGcalTab();
      } catch (err) {
        toast('Erro: ' + err.message, 'danger');
      }
    }

    loadGcalTab();
  }
}

/* ══ MODAL QR ISOLADO ════════════════════════════════════════════= */
function openCloneQRModal(clone) {
  if (clone.status === 'conectado') {
    openModal(`
      <div class="modal__header">
        <span class="modal__title">WhatsApp — ${escapeHtml(clone.display_name || 'Clone')}</span>
        <button class="btn btn--ghost btn--icon" onclick="closeModal()" aria-label="Fechar">${icon('x', 16)}</button>
      </div>
      <div class="qr-connected" style="padding:1.5rem 0">
        ${icon('check-circle-2', 48)}
        <div style="font-weight:700">Já conectado</div>
        <p class="muted">Esta sessão está ativa.</p>
        <button class="btn btn--danger" id="qr-modal-disconnect">${icon('unlink',13)} Desconectar</button>
      </div>`);
    document.getElementById('qr-modal-disconnect')?.addEventListener('click', async () => {
      try {
        await api(`/api/sessions/${encodeURIComponent(clone.waha_sessao)}/stop`, { method: 'POST' });
        toast('Sessão desconectada.', 'success');
        clone.status = 'desconectado';
        _rendered['bots'] = false;
        closeModal();
        renderBots();
      } catch (err) { toast('Erro: ' + err.message, 'danger'); }
    });
    return;
  }

  // Sem sessão vinculada: cria nova
  if (!clone.waha_sessao) {
    _wizardState = {
      step: 4,
      matriz_slot:      clone.matriz_slot,
      display_name:     clone.display_name || '',
      cliente_nome:     clone.cliente_nome || '',
      cliente_telefone: clone.cliente_telefone || '',
      personalizacao:   clone.personalizacao || {},
      sessao_name:      'clone_' + slugify(clone.display_name || String(clone.id)),
      cloneId:          clone.id,
      stopQR:           null,
    };
    renderWizardStep();
    return;
  }

  // Tem sessão mas não conectada: abre QR direto
  openModal(`
    <div class="modal__header">
      <span class="modal__title">Conectar WhatsApp — ${escapeHtml(clone.display_name || 'Clone')}</span>
      <button class="btn btn--ghost btn--icon" onclick="closeModal()" aria-label="Fechar">${icon('x', 16)}</button>
    </div>
    <div id="standalone-qr-area" style="padding:.5rem 0">
      <div class="qr-wrap">
        <div class="skeleton-block" style="width:200px;height:200px;border-radius:var(--radius-md)"></div>
        <p class="muted">Carregando QR Code...</p>
      </div>
    </div>`);

  document.getElementById('modal-content').classList.add('modal--lg');

  pollQR(clone.waha_sessao, (data) => {
    const area = document.getElementById('standalone-qr-area');
    if (!area) { if (_activeQRPoll) { clearInterval(_activeQRPoll); _activeQRPoll = null; } return; }
    if (data.connected || data.qr === null) {
      if (_activeQRPoll) { clearInterval(_activeQRPoll); _activeQRPoll = null; }
      area.innerHTML = `<div class="qr-connected">${icon('check-circle-2', 48)}<div style="font-weight:700">WhatsApp conectado!</div><button class="btn btn--primary" onclick="closeModal();renderBots()">Concluir</button></div>`;
      toast('WhatsApp conectado!', 'success');
      clone.status = 'conectado';
      _rendered['bots'] = false;
    } else if (data.qr) {
      area.innerHTML = `<div class="qr-wrap"><img src="${data.qr}" alt="QR Code" /><p class="muted" style="font-size:.8125rem">Escaneie no WhatsApp do cliente</p></div>`;
    } else if (data.error) {
      area.innerHTML = `<p class="muted" style="color:var(--danger)">${icon('alert-triangle',14)} ${escapeHtml(data.error)}</p>`;
    }
  });
}

/* ══════════════════════════════════════════════════════════════════
   ROTEAMENTO — seção de primeiro nível (003-D: placeholder)
   Implementação completa em 003-F: extrai de dentro de Bots.
   Por ora delega para renderConfig com a aba de fluxos/roteamento.
   ══════════════════════════════════════════════════════════════════ */
async function renderRoteamento() {
  const sec = document.querySelector('#sec-roteamento');
  if (!sec) return;

  sec.innerHTML = `
    <div class="section-header">
      <div class="section-header__left">
        <h1 class="h1">Roteamento</h1>
        <p class="muted">Regras globais de roteamento WAHA por número de telefone</p>
      </div>
    </div>
    <div id="routing-content"><div class="skeleton-block" style="height:240px"></div></div>`;

  try {
    const routingRaw = await api('/api/routing');
    const routingArr = Array.isArray(routingRaw) ? routingRaw : (routingRaw.routes || routingRaw.rules || []);

    if (!routingArr.length) {
      document.getElementById('routing-content').innerHTML = `
        <div class="empty-state">
          ${icon('git-branch', 36)}
          <div class="empty-state__title">Sem regras de roteamento</div>
          <p class="empty-state__text">Nenhuma regra cadastrada. Acesse a aba de configurações para gerenciar.</p>
          <button class="btn btn--primary btn--sm empty-state__action" onclick="navigateTo('configuracoes')">${icon('settings',14)} Ir para Configurações</button>
        </div>`;
      return;
    }

    const rows = routingArr.map(r => {
      const pattern = escapeHtml(r.pattern || r.phone_prefix || r.prefixo || '—');
      const target  = escapeHtml(r.bot_slot || r.workflow_id || r.target || '—');
      const criado  = r.created_at ? fmtDate(r.created_at) : '—';
      return `<tr>
        <td class="mono">${pattern}</td>
        <td>${target}</td>
        <td class="muted">${escapeHtml(criado)}</td>
        <td><a href="#" class="btn btn--ghost btn--sm" onclick="navigateTo('configuracoes');event.preventDefault()">${icon('pencil',13)} Editar</a></td>
      </tr>`;
    }).join('');

    document.getElementById('routing-content').innerHTML = `
      <div class="alert--danger" style="background:var(--warning-bg);border-color:var(--warning);color:var(--warning);margin-bottom:1rem">
        ${icon('alert-triangle',14)} Gestão completa de roteamento estará disponível em 003-F. Por ora, edite via Configurações.
      </div>
      <div class="table-wrap">
        <table class="table">
          <thead><tr><th>Prefixo (telefone)</th><th>Bot alvo</th><th>Criado em</th><th>Ações</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>`;
  } catch (err) {
    document.getElementById('routing-content').innerHTML = `<div class="alert--danger">${icon('alert-triangle',14)} Erro ao carregar roteamento: ${escapeHtml(err.message)}</div>`;
  }
}

/* ══════════════════════════════════════════════════════════════════
   NAVIGATION — sidebar agrupada (003-D2)
   ══════════════════════════════════════════════════════════════════ */
const NAV_GROUPS = [
  {
    id: 'grp-dashboard',
    label: 'Dashboard',
    items: [
      { id: 'dashboard', label: 'Visão geral', render: renderDashboard },
    ],
  },
  {
    id: 'grp-operacao',
    label: 'Operação',
    items: [
      { id: 'bots',       label: 'Bots',          render: renderBots },
      { id: 'sessoes',    label: 'Sessões WAHA',   render: renderSessoes },
      { id: 'leads',      label: 'Leads',          render: renderLeadsStub },
      { id: 'roteamento', label: 'Roteamento',     render: renderRoteamento },
      { id: 'execucoes',  label: 'Execuções',      render: renderExecucoes },
    ],
  },
  {
    id: 'grp-configuracao',
    label: 'Configuração',
    items: [
      { id: 'configuracoes', label: 'Configurações', render: renderConfig },
      { id: 'relatorios',    label: 'Relatórios',    render: renderRelatorios },
    ],
  },
];

/* Flat map de id → item para lookup rápido */
const NAV_ITEMS_MAP = {};
NAV_GROUPS.forEach(g => g.items.forEach(i => { NAV_ITEMS_MAP[i.id] = i; }));

/* Estado de colapso dos grupos — persiste no localStorage */
function _loadGroupState() {
  try { return JSON.parse(localStorage.getItem('paineladmin:nav-groups') || '{}'); } catch { return {}; }
}
function _saveGroupState(st) {
  try { localStorage.setItem('paineladmin:nav-groups', JSON.stringify(st)); } catch {}
}

let _groupState = _loadGroupState();

let _savedSection = localStorage.getItem('paineladmin:section') || 'dashboard';
if (_savedSection === 'clones') { _savedSection = 'bots'; localStorage.setItem('paineladmin:section', 'bots'); }
let _activeSection = _savedSection;
let _rendered = {};

function buildNav() {
  const nav = document.getElementById('sidebar-nav');
  nav.innerHTML = '';

  NAV_GROUPS.forEach(grp => {
    const isCollapsed = _groupState[grp.id] === true;
    const grpEl = document.createElement('div');
    grpEl.className = 'nav-group' + (isCollapsed ? ' collapsed' : '');
    grpEl.dataset.group = grp.id;

    /* Cabeçalho do grupo */
    const hdr = document.createElement('div');
    hdr.className = 'nav-group__header';
    hdr.setAttribute('role', 'button');
    hdr.setAttribute('aria-expanded', String(!isCollapsed));
    hdr.setAttribute('tabindex', '0');
    hdr.innerHTML = `<span>${grp.label}</span><span class="nav-group__chevron">${icon('chevron-down', 12)}</span>`;
    hdr.addEventListener('click', () => toggleNavGroup(grp.id, grpEl, hdr));
    hdr.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleNavGroup(grp.id, grpEl, hdr); } });

    /* Itens */
    const itemsEl = document.createElement('div');
    itemsEl.className = 'nav-group__items';

    grp.items.forEach(item => {
      const btn = document.createElement('button');
      btn.className = 'nav-item' + (_activeSection === item.id ? ' active' : '');
      btn.dataset.section = item.id;
      btn.setAttribute('aria-current', _activeSection === item.id ? 'page' : 'false');
      btn.innerHTML = `<span class="nav-dot"></span><span>${item.label}</span>`;
      btn.addEventListener('click', () => navigateTo(item.id));
      itemsEl.appendChild(btn);
    });

    grpEl.appendChild(hdr);
    grpEl.appendChild(itemsEl);
    nav.appendChild(grpEl);
  });
}

function toggleNavGroup(groupId, grpEl, hdr) {
  const isNowCollapsed = !grpEl.classList.contains('collapsed');
  grpEl.classList.toggle('collapsed', isNowCollapsed);
  hdr.setAttribute('aria-expanded', String(!isNowCollapsed));
  _groupState[groupId] = isNowCollapsed;
  _saveGroupState(_groupState);
}

function navigateTo(sectionId) {
  _activeSection = sectionId;
  localStorage.setItem('paineladmin:section', sectionId);

  // Update sections visibility
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  const target = document.getElementById(`sec-${sectionId}`);
  if (target) target.classList.add('active');

  // Update nav active state
  document.querySelectorAll('.nav-item').forEach(btn => {
    const isActive = btn.dataset.section === sectionId;
    btn.classList.toggle('active', isActive);
    btn.setAttribute('aria-current', isActive ? 'page' : 'false');
  });

  // Close mobile sidebar
  closeSidebar();

  // Fecha SSE se sair da seção execuções
  if (sectionId !== 'execucoes' && _execSSE) {
    const liveBtn = document.querySelector('#exec-live-btn');
    if (liveBtn) stopExecSSE(liveBtn); else { _execSSE.close(); _execSSE = null; }
  }

  // Para polling de atividade do dashboard ao sair
  if (sectionId !== 'dashboard' && _dashActivityInterval) {
    clearInterval(_dashActivityInterval);
    _dashActivityInterval = null;
  }

  // Render if not yet rendered (or always re-render dashboard for freshness)
  const item = NAV_ITEMS_MAP[sectionId];
  if (item && (sectionId === 'dashboard' || !_rendered[sectionId])) {
    _rendered[sectionId] = true;
    item.render();
  }
}

/* ── Mobile sidebar ─────────────────────────────────────────────── */
function openSidebar() {
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('sidebar-backdrop').classList.add('open');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebar-backdrop').classList.remove('open');
}

/* ══════════════════════════════════════════════════════════════════
   BOOTSTRAP
   ══════════════════════════════════════════════════════════════════ */
(function init() {
  // Hamburger icon
  const hambBtn = document.getElementById('btn-hamburger');
  if (hambBtn) {
    hambBtn.innerHTML = icon('menu', 20);
    hambBtn.addEventListener('click', openSidebar);
  }

  // Backdrop click to close
  document.getElementById('sidebar-backdrop').addEventListener('click', closeSidebar);

  // Modal close on backdrop click
  document.getElementById('modal-backdrop').addEventListener('click', (e) => {
    if (e.target === e.currentTarget) closeModal();
  });

  // Lightbox close
  document.getElementById('lightbox-close').addEventListener('click', closeLightbox);
  document.getElementById('lightbox').addEventListener('click', (e) => {
    if (e.target === e.currentTarget) closeLightbox();
  });

  // Build navigation
  buildNav();

  // Activate stored or default section
  document.getElementById(`sec-${_activeSection}`)?.classList.add('active');
  const initItem = NAV_ITEMS_MAP[_activeSection];
  if (initItem) {
    _rendered[_activeSection] = true;
    initItem.render();
  }

  // Keyboard ESC closes modal / lightbox / drawer
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      closeModal();
      closeLightbox();
      closeDrawer();
    }
  });

  // Fechar SSE e polling antes de sair da página
  window.addEventListener('beforeunload', () => {
    if (_execSSE) { _execSSE.close(); _execSSE = null; }
    if (_dashActivityInterval) { clearInterval(_dashActivityInterval); _dashActivityInterval = null; }
  });
})();
</script>
