<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Startap — Painel</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
/* ── Tokens — ADR 0005 Opção C (Linear-like operacional) ─────────── */
:root {
  /* Backgrounds */
  --bg:            #0a0a0a;
  --bg-2:          #111111;
  /* Surfaces */
  --surface:       #111827;
  --surface-2:     #1e293b;
  --surface-3:     #253347;
  /* Borders */
  --border:        #1e3a5f;
  --border-light:  #2d4a6e;
  /* Text */
  --text:          #f1f5f9;
  --text-muted:    #94a3b8;
  --text-subtle:   #64748b;
  /* Primary */
  --primary:       #3b82f6;
  --primary-hover: #2563eb;
  --primary-glow:  rgba(59,130,246,0.15);
  /* Semantic */
  --success:       #10b981;
  --success-bg:    rgba(16,185,129,0.12);
  --danger:        #ef4444;
  --danger-bg:     rgba(239,68,68,0.12);
  --warning:       #f59e0b;
  --warning-bg:    rgba(245,158,11,0.12);
  --info:          #38bdf8;
  --info-bg:       rgba(56,189,248,0.12);
  /* Radius */
  --radius-sm:     4px;
  --radius-md:     8px;
  --radius-lg:     10px;
  --radius-xl:     14px;
  --radius-full:   9999px;
  /* Shadows */
  --shadow-xs:     0 1px 2px rgba(0,0,0,0.5);
  --shadow-sm:     0 2px 4px rgba(0,0,0,0.4);
  --shadow-md:     0 4px 12px rgba(0,0,0,0.3);
  --shadow-lg:     0 8px 32px rgba(0,0,0,0.4);
  /* Spacing (escala 4px) */
  --space-1:  .25rem;
  --space-2:  .5rem;
  --space-3:  .75rem;
  --space-4:  1rem;
  --space-5:  1.25rem;
  --space-6:  1.5rem;
  --space-8:  2rem;
  --space-10: 2.5rem;
  --space-12: 3rem;
  /* Typography */
  --text-xs:   .6875rem;
  --text-sm:   .8125rem;
  --text-base: .875rem;
  --text-md:   1rem;
  --text-lg:   1.25rem;
  --text-xl:   1.75rem;
  /* Layout */
  --sidebar-w: 240px;
  --header-h:  56px;
  --transition:.15s ease;
  --font-mono: 'JetBrains Mono', ui-monospace, monospace;
}
/* ── Reset ──────────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; }
html { font-size: 14px; }
body {
  margin: 0;
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  line-height: 1.5;
}
a { color: var(--primary); text-decoration: none; }
a:hover { text-decoration: underline; }
img, video, audio { max-width: 100%; display: block; }
button { font-family: inherit; cursor: pointer; }
textarea, input, select { font-family: inherit; }
/* ── Typography ─────────────────────────────────────────────────────── */
.h1  { font-size: 1.5rem;   font-weight: 700; margin: 0 0 .5rem; line-height: 1.2; }
.h2  { font-size: 1.125rem; font-weight: 600; margin: 0 0 .5rem; }
.h3  { font-size: 1rem;     font-weight: 600; margin: 0; }
.muted   { color: var(--text-muted); font-size: .8125rem; }
.subtle  { color: var(--text-subtle); font-size: .75rem; }
.mono    { font-family: var(--font-mono); font-size: .8125rem; }
.label   { font-size: .75rem; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--text-muted); }
/* ── Layout shell ───────────────────────────────────────────────────── */
.shell { display: flex; min-height: 100vh; }
/* ── Sidebar ────────────────────────────────────────────────────────── */
.sidebar {
  width: var(--sidebar-w);
  background: var(--bg-2);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  position: fixed;
  top: 0; left: 0; bottom: 0;
  z-index: 200;
  transition: transform var(--transition);
}
.sidebar__logo {
  display: flex;
  align-items: center;
  gap: .625rem;
  padding: 1.125rem 1rem;
  border-bottom: 1px solid var(--border);
  text-decoration: none;
}
.sidebar__logo-icon {
  width: 32px; height: 32px;
  background: var(--primary);
  border-radius: var(--radius-md);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.sidebar__logo-wordmark {
  font-size: .9375rem;
  font-weight: 700;
  color: var(--text);
  letter-spacing: -.01em;
}
.sidebar__logo-sub {
  font-size: .6875rem;
  color: var(--text-muted);
  font-weight: 400;
  display: block;
  margin-top: -2px;
}
.sidebar__nav {
  flex: 1;
  overflow-y: auto;
  padding: .75rem .5rem;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: .625rem;
  padding: .5rem .75rem;
  border-radius: var(--radius-md);
  color: var(--text-muted);
  font-size: .875rem;
  font-weight: 500;
  cursor: pointer;
  border: none;
  background: transparent;
  width: 100%;
  text-align: left;
  transition: background var(--transition), color var(--transition);
  margin-bottom: 2px;
}
.nav-item:hover { background: var(--surface); color: var(--text); }
.nav-item.active {
  background: var(--primary-glow);
  color: var(--primary);
  border: 1px solid rgba(59,130,246,0.2);
}
.nav-item .nav-icon { flex-shrink: 0; opacity: .8; }
.nav-item.active .nav-icon { opacity: 1; }
.sidebar__footer {
  padding: .75rem 1rem;
  border-top: 1px solid var(--border);
  font-size: .75rem;
  color: var(--text-subtle);
}
/* ── Mobile header ──────────────────────────────────────────────────── */
.mobile-header {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0;
  height: var(--header-h);
  background: var(--bg-2);
  border-bottom: 1px solid var(--border);
  align-items: center;
  padding: 0 1rem;
  z-index: 100;
  gap: .75rem;
}
.mobile-header__brand { font-weight: 700; font-size: .9375rem; }
.sidebar-backdrop {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.6);
  z-index: 150;
}
/* ── Main content ───────────────────────────────────────────────────── */
.main {
  flex: 1;
  margin-left: var(--sidebar-w);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
.section {
  display: none;
  padding: 1.5rem;
  flex: 1;
}
.section.active { display: block; }
.section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1.5rem;
  gap: 1rem;
  flex-wrap: wrap;
}
.section-header__left { display: flex; flex-direction: column; gap: .125rem; }
/* ── Cards ──────────────────────────────────────────────────────────── */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 1rem;
}
.card-flat {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
}
.card--hover { transition: border-color var(--transition), box-shadow var(--transition); cursor: pointer; }
.card--hover:hover { border-color: var(--border-light); box-shadow: var(--shadow-md); }
/* ── KPI Grid ───────────────────────────────────────────────────────── */
.kpi-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 1rem;
  margin-bottom: 1.5rem;
}
.kpi-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 1rem;
  display: flex;
  flex-direction: column;
  gap: .375rem;
}
.kpi-card__icon {
  width: 36px; height: 36px;
  border-radius: var(--radius-md);
  display: flex; align-items: center; justify-content: center;
  margin-bottom: .25rem;
  flex-shrink: 0;
}
.kpi-card__value { font-size: 1.75rem; font-weight: 700; line-height: 1; }
.kpi-card__label { font-size: .75rem; color: var(--text-muted); font-weight: 500; }
.kpi-card__delta {
  display: inline-flex; align-items: center; gap: .25rem;
  font-size: .75rem; font-weight: 500; margin-top: .125rem;
}
.kpi-card__delta--up   { color: var(--success); }
.kpi-card__delta--down { color: var(--danger); }
/* ── Buttons ────────────────────────────────────────────────────────── */
.btn {
  display: inline-flex; align-items: center; gap: .375rem;
  padding: .4375rem .875rem;
  border-radius: var(--radius-md);
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  font-size: .875rem;
  font-weight: 500;
  cursor: pointer;
  transition: all var(--transition);
  white-space: nowrap;
  line-height: 1;
  text-decoration: none;
}
.btn:hover { background: var(--surface-2); border-color: var(--border-light); }
.btn:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.btn--primary { background: var(--primary); border-color: var(--primary); color: #fff; }
.btn--primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
.btn--danger  { background: var(--danger);  border-color: var(--danger);  color: #fff; }
.btn--danger:hover  { background: #dc2626;  border-color: #dc2626; }
.btn--success { background: var(--success); border-color: var(--success); color: #fff; }
.btn--ghost   { background: transparent; border-color: transparent; }
.btn--ghost:hover { background: var(--surface-2); }
.btn--sm { padding: .25rem .625rem; font-size: .8125rem; border-radius: var(--radius-sm); }
.btn--icon { padding: .375rem; border-radius: var(--radius-md); }
.btn[disabled] { opacity: .5; cursor: not-allowed; pointer-events: none; }
/* ── Badges ─────────────────────────────────────────────────────────── */
.badge {
  display: inline-flex; align-items: center; gap: .25rem;
  padding: 2px 8px; border-radius: var(--radius-full);
  font-size: .6875rem; font-weight: 600;
}
.badge--success { background: var(--success-bg); color: var(--success); }
.badge--danger  { background: var(--danger-bg);  color: var(--danger); }
.badge--warning { background: var(--warning-bg); color: var(--warning); }
.badge--info    { background: var(--info-bg);    color: var(--info); }
.badge--muted   { background: var(--surface-3);  color: var(--text-muted); }
.badge--dot::before {
  content: '';
  display: inline-block;
  width: 6px; height: 6px;
  border-radius: 50%;
  background: currentColor;
  flex-shrink: 0;
}
/* ── Skeleton ───────────────────────────────────────────────────────── */
.skeleton {
  background: linear-gradient(90deg, var(--surface) 25%, var(--surface-2) 50%, var(--surface) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.5s infinite;
  border-radius: var(--radius-md);
  height: 1.125em;
}
@keyframes shimmer {
  0%   { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}
.skeleton-block { border-radius: var(--radius-lg); animation: shimmer 1.5s infinite;
  background: linear-gradient(90deg, var(--surface) 25%, var(--surface-2) 50%, var(--surface) 75%);
  background-size: 200% 100%;
}
/* ── Empty state ────────────────────────────────────────────────────── */
.empty-state {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: .75rem;
  padding: 3rem 1.5rem;
  text-align: center; color: var(--text-muted);
}
.empty-state__icon { opacity: .4; }
.empty-state__title { font-weight: 600; font-size: 1rem; color: var(--text); }
.empty-state__text  { font-size: .875rem; max-width: 28ch; }
/* ── Table ──────────────────────────────────────────────────────────── */
.table-wrap { overflow-x: auto; border-radius: var(--radius-lg); border: 1px solid var(--border); }
.table { width: 100%; border-collapse: collapse; font-size: .875rem; }
.table th, .table td { padding: .5rem .875rem; text-align: left; border-bottom: 1px solid var(--border); }
.table th {
  font-weight: 600; color: var(--text-muted); font-size: .6875rem;
  text-transform: uppercase; letter-spacing: .06em;
  background: rgba(0,0,0,.2); white-space: nowrap;
}
.table tr:last-child td { border-bottom: none; }
.table tbody tr:hover td { background: rgba(255,255,255,.02); }
.table td.mono { font-family: var(--font-mono); font-size: .8rem; }
/* ── Forms ──────────────────────────────────────────────────────────── */
.field { display: flex; flex-direction: column; gap: .375rem; }
.field label { font-size: .75rem; font-weight: 600; color: var(--text-muted); }
input, select, textarea {
  background: var(--bg);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: .4375rem .75rem;
  font-size: .875rem;
  font-family: inherit;
  width: 100%;
  transition: border-color var(--transition), box-shadow var(--transition);
}
input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 3px var(--primary-glow);
}
input::placeholder, textarea::placeholder { color: var(--text-subtle); }
textarea { resize: vertical; min-height: 120px; font-family: var(--font-mono); font-size: .8125rem; }
.char-count { font-size: .75rem; color: var(--text-subtle); text-align: right; }
/* ── Tabs (pill) ────────────────────────────────────────────────────── */
.tabs {
  display: flex; gap: .25rem;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  padding: .25rem;
  width: fit-content;
  flex-wrap: wrap;
  margin-bottom: 1.25rem;
}
.tab-btn {
  padding: .3125rem .875rem;
  border-radius: var(--radius-full);
  border: none;
  background: transparent;
  color: var(--text-muted);
  font-size: .8125rem;
  font-weight: 500;
  cursor: pointer;
  transition: all var(--transition);
  white-space: nowrap;
}
.tab-btn:hover { color: var(--text); }
.tab-btn.active { background: var(--primary); color: #fff; }
/* ── Bot avatar ─────────────────────────────────────────────────────── */
.bot-avatar {
  border-radius: var(--radius-md);
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; color: #fff;
  flex-shrink: 0;
  font-size: .875rem;
  text-transform: uppercase;
}
/* ── Bot cards grid ──────────────────────────────────────────────────── */
.bots-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 1rem;
  margin-bottom: 1.5rem;
}
.bot-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 1rem;
  cursor: pointer;
  transition: border-color var(--transition), box-shadow var(--transition);
  display: flex; flex-direction: column; gap: .75rem;
}
.bot-card:hover { border-color: var(--border-light); box-shadow: var(--shadow-md); }
.bot-card.selected { border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary-glow); }
.bot-card__header { display: flex; align-items: center; gap: .75rem; }
.bot-card__name   { font-weight: 600; font-size: .9375rem; }
.bot-card__slug   { font-size: .75rem; color: var(--text-muted); font-family: var(--font-mono); }
/* ── Bot detail ─────────────────────────────────────────────────────── */
.bot-detail {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 1.25rem;
}
.bot-detail__header {
  display: flex; align-items: center; gap: 1rem;
  margin-bottom: 1.25rem; padding-bottom: 1rem;
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
}
.bot-detail__title { font-size: 1.125rem; font-weight: 700; }
.bot-detail__meta  { font-size: .8125rem; color: var(--text-muted); }
/* ── Media cards ─────────────────────────────────────────────────────── */
.media-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 1rem;
}
.media-card {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  overflow: hidden;
  display: flex; flex-direction: column;
}
.media-card__preview {
  background: var(--bg-2);
  min-height: 140px;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
  position: relative;
}
.media-card__preview video,
.media-card__preview audio { width: 100%; }
.media-card__preview .media-img {
  width: 100%; height: 160px; object-fit: cover; cursor: zoom-in;
  transition: transform .2s;
}
.media-card__preview .media-img:hover { transform: scale(1.03); }
.media-card__info {
  padding: .625rem .75rem;
  display: flex; align-items: center; justify-content: space-between; gap: .5rem;
  border-top: 1px solid var(--border);
}
.media-card__name { font-size: .8125rem; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
/* ── Lightbox ────────────────────────────────────────────────────────── */
.lightbox {
  display: none;
  position: fixed; inset: 0; z-index: 1000;
  background: rgba(0,0,0,.92);
  align-items: center; justify-content: center;
  padding: 1rem;
}
.lightbox.open { display: flex; }
.lightbox img { max-height: 90vh; max-width: 90vw; border-radius: var(--radius-md); }
.lightbox__close {
  position: absolute; top: 1rem; right: 1rem;
  background: rgba(255,255,255,.1); border: none;
  border-radius: var(--radius-full);
  color: #fff; width: 36px; height: 36px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; font-size: 1.25rem;
  transition: background var(--transition);
}
.lightbox__close:hover { background: rgba(255,255,255,.2); }
/* ── WAHA session cards ───────────────────────────────────────────────── */
.sessions-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 1rem;
  margin-bottom: 1.5rem;
}
.session-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 1rem;
  display: flex; flex-direction: column; gap: .5rem;
}
.session-card__name { font-weight: 600; font-size: .9375rem; }
/* ── Toast ──────────────────────────────────────────────────────────── */
#toast-container {
  position: fixed; bottom: 1.25rem; right: 1.25rem;
  display: flex; flex-direction: column; gap: .5rem;
  z-index: 9999;
  max-width: min(360px, calc(100vw - 2.5rem));
}
.toast {
  padding: .75rem 1rem;
  border-radius: var(--radius-lg);
  font-size: .875rem; font-weight: 500;
  display: flex; align-items: center; gap: .5rem;
  box-shadow: var(--shadow-lg);
  animation: toast-in .2s ease forwards;
  border: 1px solid transparent;
}
.toast--success { background: var(--success-bg); border-color: var(--success); color: var(--success); }
.toast--danger  { background: var(--danger-bg);  border-color: var(--danger);  color: var(--danger); }
.toast--info    { background: var(--info-bg);    border-color: var(--info);    color: var(--info); }
.toast--warning { background: var(--warning-bg); border-color: var(--warning); color: var(--warning); }
@keyframes toast-in {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}
/* ── Modal ──────────────────────────────────────────────────────────── */
#modal-backdrop {
  display: none;
  position: fixed; inset: 0; z-index: 500;
  background: rgba(0,0,0,.7);
  align-items: center; justify-content: center;
  padding: 1rem;
}
#modal-backdrop.open { display: flex; }
.modal {
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-xl);
  width: 100%; max-width: 520px;
  max-height: 90vh; overflow-y: auto;
  padding: 1.5rem;
  box-shadow: var(--shadow-lg);
}
.modal__header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 1.25rem; padding-bottom: .875rem;
  border-bottom: 1px solid var(--border);
}
.modal__title { font-weight: 700; font-size: 1.0625rem; }
/* ── Upload area ────────────────────────────────────────────────────── */
.upload-area {
  border: 2px dashed var(--border-light);
  border-radius: var(--radius-lg);
  padding: 2rem;
  text-align: center;
  color: var(--text-muted);
  cursor: pointer;
  transition: border-color var(--transition), background var(--transition);
}
.upload-area:hover { border-color: var(--primary); background: var(--primary-glow); color: var(--text); }
.upload-area input[type="file"] { display: none; }
/* ── Divider ────────────────────────────────────────────────────────── */
.divider { height: 1px; background: var(--border); margin: 1.25rem 0; }
/* ── Routing table rows ─────────────────────────────────────────────── */
.routing-row { display: flex; align-items: center; gap: .75rem; padding: .625rem 0; border-bottom: 1px solid var(--border); }
.routing-row:last-child { border-bottom: none; }
.routing-row__pattern { font-family: var(--font-mono); font-size: .8125rem; flex: 1; }
.routing-row__target  { font-size: .8125rem; color: var(--text-muted); }
/* ── Dashboard grid ─────────────────────────────────────────────────── */
.dash-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1rem;
  margin-top: 1.5rem;
}
.dash-grid--full { grid-column: 1 / -1; }
/* ── Spinner ────────────────────────────────────────────────────────── */
.spinner {
  width: 20px; height: 20px;
  border: 2px solid var(--surface-3);
  border-top-color: var(--primary);
  border-radius: 50%;
  animation: spin .7s linear infinite;
  flex-shrink: 0;
}
@keyframes spin { to { transform: rotate(360deg); } }
/* ── Section status indicator row ─────────────────────────────────────── */
.status-row {
  display: flex; align-items: center; gap: .75rem;
  padding: .5rem 0; border-bottom: 1px solid var(--border);
  font-size: .875rem;
}
.status-row:last-child { border-bottom: none; }
.status-row__name { flex: 1; font-weight: 500; }
.status-row__detail { color: var(--text-muted); font-size: .8125rem; }
/* ── Drawer lateral ─────────────────────────────────────────────── */
.drawer-backdrop { position:fixed; inset:0; background:rgba(0,0,0,0.4); z-index:900; opacity:0; pointer-events:none; transition:opacity 200ms; }
.drawer-backdrop.open { opacity:1; pointer-events:auto; }
.drawer { position:fixed; top:0; right:0; bottom:0; width:min(420px, 90vw); background:var(--surface); border-left:1px solid var(--border); transform:translateX(100%); transition:transform 250ms ease-out; z-index:901; overflow-y:auto; padding:1.5rem; }
.drawer.open { transform:translateX(0); }
.drawer__header { display:flex; align-items:center; justify-content:space-between; margin-bottom:1.25rem; padding-bottom:.875rem; border-bottom:1px solid var(--border); }
.drawer__title { font-weight:700; font-size:1rem; }
.drawer__body pre { background:var(--bg); border:1px solid var(--border); border-radius:var(--radius-md); padding:.75rem; font-size:.75rem; font-family:var(--font-mono); overflow-x:auto; white-space:pre-wrap; word-break:break-all; }
/* ── Toggle switch ──────────────────────────────────────────────── */
.toggle { position:relative; display:inline-flex; align-items:center; cursor:pointer; gap:.5rem; font-size:.875rem; }
.toggle input { position:absolute; opacity:0; width:0; height:0; }
.toggle__track { width:36px; height:20px; background:var(--surface-3); border-radius:var(--radius-full); transition:background var(--transition); flex-shrink:0; position:relative; }
.toggle input:checked + .toggle__track { background:var(--success); }
.toggle__track::after { content:''; position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:#fff; transition:transform var(--transition); }
.toggle input:checked + .toggle__track::after { transform:translateX(16px); }
/* ── Filter bar ─────────────────────────────────────────────────── */
.filter-bar { display:flex; align-items:center; gap:.5rem; flex-wrap:wrap; margin-bottom:1rem; }
.filter-bar .pill-group { display:flex; gap:2px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-full); padding:2px; }
.filter-bar .pill { padding:.25rem .6rem; border-radius:var(--radius-full); border:none; background:transparent; color:var(--text-muted); font-size:.8rem; cursor:pointer; transition:all var(--transition); white-space:nowrap; }
.filter-bar .pill.active { background:var(--primary); color:#fff; }
.filter-bar select, .filter-bar input[type="text"] { width:auto; min-width:0; flex:1; }
/* ── Bar chart ──────────────────────────────────────────────────── */
.bar-chart { display:flex; align-items:flex-end; gap:4px; height:120px; }
.bar-chart__col { display:flex; flex-direction:column; align-items:center; flex:1; gap:3px; }
.bar-chart__bar { width:100%; background:var(--primary); border-radius:var(--radius-sm) var(--radius-sm) 0 0; min-height:2px; transition:opacity var(--transition); }
.bar-chart__bar:hover { opacity:.8; }
.bar-chart__val { font-size:.65rem; color:var(--text-muted); font-family:var(--font-mono); line-height:1; }
.bar-chart__lbl { font-size:.6rem; color:var(--text-subtle); white-space:nowrap; }
/* ── Live dot ───────────────────────────────────────────────────── */
.live-dot { width:8px; height:8px; border-radius:50%; background:var(--success); animation:pulse-dot 1.4s ease-in-out infinite; flex-shrink:0; }
@keyframes pulse-dot { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(.7)} }
/* ── Responsive ─────────────────────────────────────────────────────── */
@media (max-width: 768px) {
  :root { --sidebar-w: 240px; }
  .sidebar {
    transform: translateX(-100%);
    top: var(--header-h);
    bottom: 0;
    z-index: 200;
    box-shadow: var(--shadow-lg);
  }
  .sidebar.open { transform: translateX(0); }
  .sidebar-backdrop.open { display: block; }
  .mobile-header { display: flex; }
  .main { margin-left: 0; padding-top: var(--header-h); }
  .section { padding: 1rem; }
  .kpi-grid { grid-template-columns: 1fr 1fr; }
  .bots-grid { grid-template-columns: 1fr; }
  .media-grid { grid-template-columns: 1fr; }
  .sessions-grid { grid-template-columns: 1fr; }
  .dash-grid { grid-template-columns: 1fr; }
  .tabs { width: 100%; justify-content: flex-start; overflow-x: auto; }
  .section-header { flex-direction: column; align-items: flex-start; }
}
@media (max-width: 480px) {
  .kpi-grid { grid-template-columns: 1fr; }
  .kpi-card__value { font-size: 1.375rem; }
}
/* ── Accent button (atalho de clonagem) ─────────────────────────── */
.btn--accent { background: #059669; border-color: #059669; color: #fff; }
.btn--accent:hover { background: #047857; border-color: #047857; }
@media (max-width: 480px) {
  .btn--accent .btn-label { display: none; }
  .btn--accent::before { content: '+'; font-size: 1rem; }
}
/* ── Utilitários de layout ───────────────────────────────────────── */
.row { display: flex; align-items: center; gap: .75rem; }
.row--wrap { flex-wrap: wrap; }
.flex-1 { flex: 1; min-width: 0; }
/* ── Grupos da seção Bots ────────────────────────────────────────── */
.bots-group { margin-bottom: 2rem; }
.bots-group-header { margin-bottom: 1rem; padding-bottom: .625rem; border-bottom: 1px solid var(--border); }
.bots-group-header .h2 { margin-bottom: .125rem; }
.bots-group-header .label { display: block; font-size: .6875rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--text-subtle, var(--text-muted)); margin-bottom: .25rem; }
/* ── Clones ──────────────────────────────────────────────────────── */
.clones-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 1rem;
  margin-bottom: 1.5rem;
}
.clone-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 1rem;
  display: flex; flex-direction: column; gap: .75rem;
  transition: border-color var(--transition), box-shadow var(--transition);
}
.clone-card:hover { border-color: var(--border-light); box-shadow: var(--shadow-md); }
.clone-card__header { display: flex; align-items: center; gap: .75rem; }
.clone-card__info { flex: 1; min-width: 0; }
.clone-card__name { font-weight: 600; font-size: .9375rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.clone-card__sub  { font-size: .75rem; color: var(--text-muted); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.clone-card__actions { display: flex; align-items: center; gap: .375rem; flex-wrap: wrap; }
/* ── Clone wizard ────────────────────────────────────────────────── */
.modal--lg { max-width: 600px; }
.wizard-steps {
  display: flex; align-items: center; gap: .375rem;
  margin-bottom: 1.25rem;
}
.wizard-step {
  display: flex; align-items: center; justify-content: center;
  width: 28px; height: 28px;
  border-radius: 50%;
  font-size: .75rem; font-weight: 700;
  background: var(--surface-3); color: var(--text-muted);
  flex-shrink: 0;
}
.wizard-step.active { background: var(--primary); color: #fff; }
.wizard-step.done   { background: var(--success); color: #fff; }
.wizard-step-sep { flex: 1; height: 2px; background: var(--surface-3); border-radius: 1px; }
.wizard-step-sep.done { background: var(--success); }
.wizard-body { min-height: 240px; }
.wizard-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 1.25rem; gap: .75rem; }
/* ── Matrix selection cards ─────────────────────────────────────── */
.matrix-cards {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: .75rem;
}
.matrix-card {
  border: 2px solid var(--border);
  border-radius: var(--radius-lg);
  padding: .875rem;
  cursor: pointer;
  transition: border-color var(--transition), box-shadow var(--transition);
  text-align: center;
}
.matrix-card:hover { border-color: var(--border-light); }
.matrix-card.selected { border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary-glow); }
.matrix-card__icon { margin: 0 auto .5rem; opacity: .7; }
.matrix-card.selected .matrix-card__icon { opacity: 1; color: var(--primary); }
.matrix-card__name { font-weight: 600; font-size: .875rem; margin-bottom: .25rem; }
.matrix-card__desc { font-size: .75rem; color: var(--text-muted); line-height: 1.4; }
/* ── Personalization key-value list ─────────────────────────────── */
.kv-row { display: flex; align-items: center; gap: .5rem; margin-bottom: .5rem; }
.kv-row input { flex: 1; min-width: 0; }
/* ── QR display ─────────────────────────────────────────────────── */
.qr-wrap {
  display: flex; flex-direction: column; align-items: center;
  gap: 1rem; padding: 1rem 0;
}
.qr-wrap img { max-width: 280px; border-radius: var(--radius-md); border: 3px solid var(--primary); }
.qr-connected {
  display: flex; flex-direction: column; align-items: center;
  gap: .75rem; padding: 2rem 0;
  color: var(--success);
}
/* ── Clone config tabs ──────────────────────────────────────────── */
.clone-config-tab-content { padding-top: .75rem; }
/* ── Pulsing dot (connected) ────────────────────────────────────── */
.dot-pulse {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--success);
  display: inline-block;
  animation: pulse-dot 1.4s ease-in-out infinite;
  flex-shrink: 0;
}
@media (max-width: 768px) {
  .clones-grid { grid-template-columns: 1fr; }
  .matrix-cards { grid-template-columns: 1fr; }
}
/* ── Card variants (ADR 0005) ────────────────────────────────────── */
.card--highlight {
  border-color: var(--primary);
  box-shadow: 0 0 0 1px var(--primary-glow);
}
/* ── Badge variants (ADR 0005) ───────────────────────────────────── */
.badge--outline {
  background: transparent;
  border: 1px solid currentColor;
}
/* ── Tabs underline (ADR 0005) ───────────────────────────────────── */
.tabs--underline {
  display: flex; gap: 0;
  border-bottom: 1px solid var(--border);
  margin-bottom: var(--space-5);
  background: transparent;
  border-radius: 0;
  padding: 0;
  width: auto;
}
.tabs--underline .tab-btn {
  border-radius: 0;
  padding: var(--space-2) var(--space-4);
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  font-size: var(--text-base);
}
.tabs--underline .tab-btn.active {
  background: transparent;
  color: var(--text);
  border-bottom-color: var(--primary);
}
/* ── Alert banner (ADR 0005) ─────────────────────────────────────── */
.alert--danger {
  background: var(--danger-bg);
  border: 1px solid var(--danger);
  border-radius: var(--radius-md);
  padding: var(--space-3) var(--space-4);
  color: var(--danger);
  font-size: var(--text-sm);
  display: flex; align-items: center; gap: var(--space-2);
}
/* ── Empty state action ──────────────────────────────────────────── */
.empty-state__action { margin-top: var(--space-2); }
/* ── Sidebar agrupada (003-D2) ───────────────────────────────────── */
.nav-group { margin-bottom: .125rem; }
.nav-group__header {
  display: flex; align-items: center; justify-content: space-between;
  padding: .3125rem .75rem .3125rem .5rem;
  font-size: .6875rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: .1em;
  color: var(--text-subtle);
  cursor: pointer;
  border-radius: var(--radius-sm);
  user-select: none;
  gap: .375rem;
  transition: color var(--transition);
}
.nav-group__header:hover { color: var(--text-muted); }
.nav-group__chevron {
  flex-shrink: 0;
  transition: transform .15s ease;
  opacity: .5;
}
.nav-group.collapsed .nav-group__chevron { transform: rotate(-90deg); }
.nav-group__items { overflow: hidden; }
.nav-group.collapsed .nav-group__items { display: none; }
.nav-item {
  display: flex; align-items: center; gap: .5rem;
  padding: .3125rem .5rem .3125rem 1.125rem;
  border-radius: var(--radius-sm);
  color: var(--text-muted); font-size: .8125rem; font-weight: 500;
  cursor: pointer; border: none; background: transparent;
  width: 100%; text-align: left;
  transition: background var(--transition), color var(--transition);
  margin-bottom: 1px;
}
.nav-item:hover { background: rgba(255,255,255,.04); color: var(--text); }
.nav-item.active {
  background: rgba(59,130,246,.12);
  color: var(--primary);
  font-weight: 600;
}
.nav-item .nav-dot {
  width: 5px; height: 5px; border-radius: 50%;
  background: currentColor; flex-shrink: 0;
  opacity: 0;
}
.nav-item.active .nav-dot { opacity: 1; }
/* ── KPI Strip (003-D2) ──────────────────────────────────────────── */
.kpi-strip {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  overflow: hidden;
  margin-bottom: 1rem;
}
.kpi-strip__cell {
  padding: .625rem 1rem;
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column; gap: .125rem;
}
.kpi-strip__cell:last-child { border-right: none; }
.kpi-strip__label {
  font-size: .6875rem; font-weight: 700; text-transform: uppercase;
  letter-spacing: .08em; color: var(--text-subtle); white-space: nowrap;
}
.kpi-strip__value {
  font-size: 1.375rem; font-weight: 700;
  font-family: var(--font-mono); line-height: 1.1;
  color: var(--text); white-space: nowrap;
}
.kpi-strip__sub {
  font-size: .7rem; color: var(--text-subtle);
  font-family: var(--font-mono);
  display: flex; align-items: center; gap: .25rem;
  white-space: nowrap;
}
.kpi-strip__delta--up   { color: var(--success); }
.kpi-strip__delta--down { color: var(--danger); }
/* ── Dashboard denso (003-D2) ────────────────────────────────────── */
.dash-dense-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: .75rem;
  margin-bottom: .75rem;
}
.dash-block {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  overflow: hidden;
}
.dash-block__hdr {
  display: flex; align-items: center; justify-content: space-between;
  padding: .5rem .875rem;
  border-bottom: 1px solid var(--border);
  gap: .5rem;
}
.dash-block__title {
  font-size: .6875rem; font-weight: 700; text-transform: uppercase;
  letter-spacing: .08em; color: var(--text-subtle);
}
.dash-block__body { padding: 0; }
/* Tabela densa de sessões WAHA */
.sessions-table { width: 100%; border-collapse: collapse; font-size: .8rem; }
.sessions-table th {
  padding: .3125rem .75rem; text-align: left;
  font-size: .6rem; font-weight: 700; text-transform: uppercase;
  letter-spacing: .06em; color: var(--text-subtle);
  background: rgba(0,0,0,.15); border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
.sessions-table td {
  padding: .4375rem .75rem;
  border-bottom: 1px solid rgba(255,255,255,.04);
  vertical-align: middle;
}
.sessions-table tbody tr:last-child td { border-bottom: none; }
.sessions-table tbody tr:hover td { background: rgba(255,255,255,.02); }
/* Status dot inline */
.s-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; vertical-align: middle; }
.s-dot--on  { background: var(--success); box-shadow: 0 0 5px rgba(16,185,129,.5); }
.s-dot--off { background: var(--text-subtle); }
.s-dot--warn{ background: var(--warning); }
/* Dropdown stub [...] */
.more-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 24px; height: 24px; border-radius: var(--radius-sm);
  border: none; background: transparent;
  color: var(--text-muted); cursor: pointer; font-size: .9rem;
  transition: background var(--transition), color var(--transition);
  letter-spacing: .1em; line-height: 1; flex-shrink: 0;
}
.more-btn:hover { background: var(--surface-2); color: var(--text); }
/* ── Activity feed (003-D2) ──────────────────────────────────────── */
.activity-block {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  overflow: hidden;
  margin-bottom: .75rem;
}
.activity-block__hdr {
  display: flex; align-items: center; justify-content: space-between;
  padding: .5rem .875rem;
  border-bottom: 1px solid var(--border);
  gap: .5rem;
}
.activity-block__title {
  display: flex; align-items: center; gap: .5rem;
  font-size: .6875rem; font-weight: 700; text-transform: uppercase;
  letter-spacing: .08em; color: var(--text-subtle);
}
.activity-feed { padding: 0; }
.activity-row {
  display: grid;
  grid-template-columns: 3.5rem 5.5rem 1fr 6rem 2.25rem 3.5rem;
  align-items: center;
  gap: .25rem;
  padding: .3125rem .875rem;
  border-bottom: 1px solid rgba(255,255,255,.03);
  font-family: var(--font-mono);
  font-size: .75rem;
  color: var(--text-muted);
  transition: background var(--transition);
}
.activity-row:last-child { border-bottom: none; }
.activity-row:hover { background: rgba(255,255,255,.02); }
.activity-row__time  { color: var(--text-subtle); }
.activity-row__phone { color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.activity-row__bot   { color: var(--text); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.activity-row__status--ok  { color: var(--success); }
.activity-row__status--err { color: var(--danger); }
.activity-row__status--run { color: var(--warning); }
.activity-row__lat   { color: var(--text-subtle); text-align: right; }
.activity-empty { padding: 1.5rem; text-align: center; color: var(--text-subtle); font-size: .8125rem; }
/* ── Section block label (mantido do #56) ────────────────────────── */
.section-block-label {
  font-size: var(--text-xs);
  font-weight: 600; text-transform: uppercase;
  letter-spacing: .1em; color: var(--text-subtle);
  margin-bottom: var(--space-3); display: block;
}
/* ── Dash two-col (legado para seções não-dashboard) ─────────────── */
.dash-two-col {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: var(--space-4); margin-bottom: var(--space-4);
}
/* ── kpi-card__value mono (legado) ──────────────────────────────── */
.kpi-card__value { font-family: var(--font-mono); }
.kpi-card--featured { grid-column: span 2; flex-direction: row; align-items: center; gap: var(--space-6); }
.kpi-card--featured .kpi-card__value { font-size: 2.5rem; }
/* Variação badge inline */
.kpi-delta {
  display: inline-flex; align-items: center; gap: 3px;
  font-size: var(--text-xs); font-weight: 600;
  padding: 2px 7px; border-radius: var(--radius-full);
  font-family: var(--font-mono);
}
.kpi-delta--up   { background: var(--success-bg); color: var(--success); }
.kpi-delta--down { background: var(--danger-bg);  color: var(--danger); }
.kpi-delta--neutral { background: var(--surface-3); color: var(--text-muted); }
/* Tabela de leads recentes no dashboard */
.dash-leads-table td:first-child { color: var(--text); font-weight: 500; }
/* ── Metrics grid (legado KPIs em grid para seção execuções) ──────── */
.dash-metrics-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: var(--space-4); margin-bottom: var(--space-6);
}
@media (max-width: 768px) {
  .dash-two-col { grid-template-columns: 1fr; }
  .kpi-card--featured { grid-column: span 1; flex-direction: column; }
  .kpi-card--featured .kpi-card__value { font-size: 1.75rem; }
  .kpi-strip { grid-template-columns: 1fr 1fr; }
  .kpi-strip__cell { border-bottom: 1px solid var(--border); }
  .kpi-strip__cell:nth-child(even) { border-right: none; }
  .kpi-strip__cell:last-child { border-bottom: none; }
  .kpi-strip__cell:nth-last-child(2) { border-bottom: none; }
  .dash-dense-grid { grid-template-columns: 1fr; }
  .activity-row { grid-template-columns: 3.5rem 1fr 5rem 2rem; }
  .activity-row__phone { display: none; }
  .activity-row__lat   { display: none; }
}
@media (max-width: 480px) {
  .kpi-strip { grid-template-columns: 1fr 1fr; }
  .dash-metrics-grid { grid-template-columns: 1fr 1fr; }
}
</style>
</head>
<body>
<!-- ── Sidebar backdrop (mobile) ─────────────────────────────────── -->
<div class="sidebar-backdrop" id="sidebar-backdrop" aria-hidden="true"></div>
<!-- ── Mobile header ────────────────────────────────────────────── -->
<header class="mobile-header" id="mobile-header">
  <button class="btn btn--ghost btn--icon" id="btn-hamburger" aria-label="Abrir menu">
    <!-- hamburger icon set by JS -->
  </button>
  <span class="mobile-header__brand">Startap</span>
</header>
<!-- ── Shell ────────────────────────────────────────────────────── -->
<div class="shell">
  <!-- Sidebar -->
  <nav class="sidebar" id="sidebar" aria-label="Navegação principal">
    <a class="sidebar__logo" href="#" aria-label="Startap Painel">
      <div class="sidebar__logo-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2C8 2 4 5.5 4 10c0 3 1.5 5.5 4 7l4 5 4-5c2.5-1.5 4-4 4-7 0-4.5-4-8-8-8z"/>
          <circle cx="12" cy="10" r="3" fill="white" stroke="none"/>
        </svg>
      </div>
      <div>
        <span class="sidebar__logo-wordmark">Startap</span>
        <span class="sidebar__logo-sub">Painel Admin</span>
      </div>
    </a>
    <div class="sidebar__nav" id="sidebar-nav">
      <!-- items rendered by JS -->
    </div>
    <div class="sidebar__footer">
      <span id="sidebar-version">v2.0</span>

/* ── botAvatar() ────────────────────────────────────────────────── */
function botAvatar(slug, size = 40) {
  const PALETTE = ['#3b82f6','#8b5cf6','#10b981','#f59e0b','#ef4444','#ec4899','#06b6d4','#f97316'];
  let hash = 0;
  for (let i = 0; i < (slug || '').length; i++) hash = (hash * 31 + slug.charCodeAt(i)) >>> 0;
  const color = PALETTE[hash % PALETTE.length];
  const letter = (slug || '?')[0].toUpperCase();
  const el = document.createElement('div');
  el.className = 'bot-avatar';
  el.style.cssText = `width:${size}px;height:${size}px;background:${color};font-size:${Math.round(size * 0.4)}px;`;
  el.textContent = letter;
  return el;
}

/* ── renderMediaPreview() ───────────────────────────────────────── */
function renderMediaPreview(media) {
  if (!media) {
    const el = document.createElement('div');
    el.style.cssText = 'display:flex;align-items:center;justify-content:center;height:120px;color:var(--text-subtle);';
    el.innerHTML = icon('upload-cloud', 32);
    return el;
  }
  let url = media.url || media.media_url || '';
  const mtype = (media.media_type || '').toLowerCase();
  const fname = media.filename || media.name || url.split('/').pop() || 'arquivo';

  // Proxy insecure URLs
  if (url && url.startsWith('http://')) url = `/media-proxy?u=${encodeURIComponent(url)}`;

  const isVideo = mtype === 'video' || /\.(mp4|webm|mov)(\?|$)/i.test(url);
  const isAudio = mtype === 'audio' || /\.(mp3|ogg|wav|m4a)(\?|$)/i.test(url);
  const isImage = mtype === 'image' || /\.(jpe?g|png|gif|webp|svg)(\?|$)/i.test(url);

  const wrap = document.createElement('div');
  wrap.className = 'media-card__preview';

  if (!url) {
    wrap.innerHTML = `<span style="color:var(--text-subtle)">${icon('upload-cloud', 28)}</span>`;
    return wrap;
  }

  if (isVideo) {
    const v = document.createElement('video');
    v.controls = true;
    v.preload = 'metadata';
    v.src = url;
    v.style.cssText = 'width:100%;max-width:360px;aspect-ratio:16/9;border-radius:var(--radius-md);background:#000;';
    wrap.appendChild(v);
  } else if (isAudio) {
    const a = document.createElement('audio');
    a.controls = true;
    a.src = url;
    a.style.cssText = 'width:100%;padding:.5rem;';
    wrap.appendChild(a);
  } else if (isImage) {
    const img = document.createElement('img');
    img.loading = 'lazy';
    img.src = url;
    img.className = 'media-img';
    img.alt = fname;
    img.addEventListener('click', () => openLightbox(url));
    wrap.appendChild(img);
  } else {
    // file / pdf / etc
    wrap.style.flexDirection = 'column';
    wrap.style.gap = '.5rem';
    wrap.innerHTML = `
      <span style="color:var(--text-muted)">${icon('file-text', 36)}</span>
      <span class="muted" style="max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(fname)}</span>
      <a href="${url}" target="_blank" rel="noopener noreferrer" class="btn btn--sm btn--primary">Abrir</a>`;
  }
  return wrap;
}

/* ── statusBadge() ──────────────────────────────────────────────── */
function statusBadge(wahaStatus) {
  const map = {
    'WORKING':       { cls: 'badge--success', label: 'Conectado' },
    'FAILED':        { cls: 'badge--danger',  label: 'Falhou' },
    'STARTING':      { cls: 'badge--warning', label: 'Iniciando' },
    'STOPPED':       { cls: 'badge--muted',   label: 'Parado' },
    'SCAN_QR_CODE':  { cls: 'badge--info',    label: 'Aguardando QR' },
  };
  const s = map[wahaStatus] || { cls: 'badge--muted', label: wahaStatus || 'Desconhecido' };
  return `<span class="badge badge--dot ${s.cls}">${escapeHtml(s.label)}</span>`;
}

/* ── Helpers ────────────────────────────────────────────────────── */
function escapeHtml(str) {
  return String(str ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function fmtNum(n) {
  if (n == null || isNaN(n)) return '—';
  return Number(n).toLocaleString('pt-BR');
}

function fmtBRL(n) {
  if (n == null || isNaN(n)) return '—';
  return Number(n).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
}

function fmtDate(d) {
  if (!d) return '—';
  return new Date(d).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' });
}

function fmtRelative(d) {
  if (!d) return '—';
  const diff = Date.now() - new Date(d).getTime();
  const m = Math.floor(diff / 60000);
  if (m < 1)  return 'agora';
  if (m < 60) return `há ${m} min`;
  const h = Math.floor(m / 60);
  if (h < 24) return `há ${h} h`;
  const days = Math.floor(h / 24);
  return `há ${days} d`;
}

async function api(path, opts = {}) {
  const res = await fetch(path, { credentials: 'include', ...opts });
  if (!res.ok) {
    let msg = `Erro ${res.status}`;
    try { const j = await res.json(); msg = j.error || j.message || msg; } catch (_) {}
    throw new Error(msg);
  }
  return res.json();
}

/* ── Toast ─────────────────────────────────────────────────────── */
function toast(msg, type = 'info') {
  const container = document.getElementById('toast-container');
  const el = document.createElement('div');
  el.className = `toast toast--${type}`;
  const iconName = { success: 'check-circle-2', danger: 'alert-triangle', warning: 'alert-triangle', info: 'message-circle' }[type] || 'message-circle';
  el.innerHTML = `${icon(iconName, 16)}<span>${escapeHtml(msg)}</span>`;
  container.appendChild(el);
  setTimeout(() => el.remove(), 4500);
}

/* ── KPI Strip em linha única ────────────────────────────────────── */
async function renderDashKPIStrip() {
  const wrap = document.getElementById('dash-kpi-strip');
  if (!wrap) return;
  /* Skeleton: 4 células */
  wrap.innerHTML = [0,1,2,3].map(() =>
    `<div class="kpi-strip__cell"><div class="skeleton" style="width:4rem;height:.7rem;margin-bottom:.375rem"></div><div class="skeleton" style="width:3rem;height:1.4rem;margin-bottom:.25rem"></div><div class="skeleton" style="width:2.5rem;height:.7rem"></div></div>`
  ).join('');

  try {
    const [msgStatsRes, leadsRes, usageRes, statusRes] = await Promise.allSettled([
      api('/api/message-stats'),
      api('/api/leads'),
      api('/api/usage/summary?days=7'),
      api('/api/status'),
    ]);

    /* Mensagens 7d + variação */
    const msgs = msgStatsRes.status === 'fulfilled' && Array.isArray(msgStatsRes.value) ? msgStatsRes.value : [];
    const todayKey = new Date().toLocaleDateString('sv-SE', { timeZone: 'America/Sao_Paulo' });
    let msgs7d = 0, msgs7dPrev = 0, msgsToday = 0;
    const cutoff7d = Date.now() - 7 * 86400000;
    const cutoff14d = Date.now() - 14 * 86400000;
    for (const row of msgs) {
      const n = Number(row.total) || 0;
      const t = new Date(row.dia).getTime();
      if (String(row.dia).slice(0,10) === todayKey) msgsToday += n;
      if (t >= cutoff7d) msgs7d += n;
      if (t >= cutoff14d && t < cutoff7d) msgs7dPrev += n;
    }
    const msgs7dDelta = msgs7dPrev > 0 ? Math.round(((msgs7d - msgs7dPrev) / msgs7dPrev) * 100) : null;

    /* Execuções hoje */
    const statusData = statusRes.status === 'fulfilled' ? statusRes.value : {};
    const execs = statusData?.execucoes || [];
    const todayCutoff = new Date(); todayCutoff.setHours(0,0,0,0);
    const execsHj = execs.filter(e => new Date(e.created_at || e.startedAt || 0) >= todayCutoff).length;
    const execsTotal = execs.length;
    const execsOk = execs.filter(e => (e.status || '').toLowerCase() === 'success' || e.finished).length;
    const execRate = execsTotal > 0 ? Math.round((execsOk / execsTotal) * 100) : null;

    /* Leads 24h */
    const leadsArr = leadsRes.status === 'fulfilled' && Array.isArray(leadsRes.value) ? leadsRes.value : [];
    const leads24h = leadsArr.filter(l => {
      const t = new Date(l.criado_em || l.created_at || 0).getTime();
      return Number.isFinite(t) && t >= Date.now() - 86400000;
    }).length;

    /* Custo 7d */
    const usage = usageRes.status === 'fulfilled' ? usageRes.value : null;
    let cost7d = usage?.total_cost ?? usage?.cost ?? null;
    if (cost7d == null && Array.isArray(usage?.rows)) {
      cost7d = usage.rows.reduce((s, r) => s + (Number(r.cost_usd) || 0), 0);
    }

    function deltaHtml(pct) {
      if (pct == null) return '';
      const cls = pct > 0 ? 'kpi-strip__delta--up' : pct < 0 ? 'kpi-strip__delta--down' : '';
      const arrow = pct > 0 ? '▲' : pct < 0 ? '▼' : '→';
      return `<span class="${cls}">${arrow} ${Math.abs(pct)}%</span>`;
    }

    wrap.innerHTML = `

async function renderDashActivity() {
  const wrap = document.getElementById('dash-activity-block');
  if (!wrap) return;

  wrap.innerHTML = `
    <div class="activity-block">
      <div class="activity-block__hdr">
        <span class="activity-block__title">

        <div class="activity-empty">${icon('activity',20)}<br>Carregando...</div>
      </div>
    </div>`;

  wrap.querySelector('#dash-activity-refresh').addEventListener('click', _loadDashActivity);

  await _loadDashActivity();

async function _loadDashActivity() {
  const feed = document.getElementById('dash-activity-feed');
  if (!feed) { clearInterval(_dashActivityInterval); _dashActivityInterval = null; return; }

  try {
    const data = await api('/api/status');
    const execs = data?.execucoes || [];

    if (!execs.length) {
      feed.innerHTML = `<div class="activity-empty">Sem execuções recentes</div>`;
      return;
    }

    const rows = execs.slice(0, 10).map(e => {
      const timeStr = (() => {
        try {
          const d = new Date(e.created_at || e.startedAt || Date.now());
          return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
        } catch { return '??:??'; }
      })();
      const phone = maskPhone(e.telefone || e.phone || e.from || '');
      const bot = escapeHtml((e.flow_id || e.workflow_id || e.flow_name || e.workflowName || '—').slice(0, 20));
      const st = (e.status || '').toLowerCase();
      const isOk  = st === 'success' || (e.finished && !e.stoppedAt);
      const isErr = st === 'error' || (e.stoppedAt && !e.finished);
      const stCls = isOk ? 'activity-row__status--ok' : isErr ? 'activity-row__status--err' : 'activity-row__status--run';
      const stTxt = isOk ? '✓' : isErr ? '✗' : '…';
      const dur = e.duration_ms != null ? fmtDuration(e.duration_ms) : (e.duration != null ? fmtDuration(e.duration) : '—');

      return `<div class="activity-row">
        <span class="activity-row__time">${escapeHtml(timeStr)}</span>
        <span class="activity-row__phone">${escapeHtml(phone)}</span>
        <span class="activity-row__bot">→ ${bot}</span>
        <span class="${stCls}" style="font-size:.8rem">${stTxt}</span>
        <span></span>
        <span class="activity-row__lat">${escapeHtml(dur)}</span>
      </div>`;
    }).join('');

    feed.innerHTML = rows;
  } catch (err) {
    feed.innerHTML = `<div class="activity-empty" style="color:var(--danger)">${icon('alert-triangle',14)} ${escapeHtml(err.message)}</div>`;
  }
}

function _sessaoToggleMenu(btn, sessionName) {
  // Fecha qualquer menu aberto
  document.querySelectorAll('.sessao-menu').forEach(m => m.remove());

  const menu = document.createElement('div');
  menu.className = 'sessao-menu';
  menu.style.cssText = 'position:absolute;right:0;top:100%;z-index:200;min-width:160px;background:var(--bg-2);border:1px solid var(--border);border-radius:var(--radius-md);box-shadow:var(--shadow-lg);padding:.25rem 0';

  const items = [
    { label: `${icon('qr-code',14)} Ver QR / Reconectar`, action: () => _sessaoAbrirQR(sessionName) },
    { label: `${icon('refresh-cw',14)} Reiniciar`,         action: () => _sessaoReiniciar(sessionName) },
    { label: `${icon('power',14)} Derrubar`,               action: () => _sessaoDerrubar(sessionName) },
    { label: `${icon('trash-2',14)} Deletar`,              action: () => _sessaoDeletar(sessionName), danger: true },
  ];

  items.forEach(item => {
    const el = document.createElement('button');
    el.style.cssText = `display:flex;align-items:center;gap:.5rem;width:100%;padding:.4rem .75rem;background:none;border:none;cursor:pointer;font-size:.8125rem;color:${item.danger ? 'var(--danger)' : 'var(--text)'};text-align:left`;
    el.innerHTML = item.label;
    el.addEventListener('mouseenter', () => el.style.background = 'var(--bg-3)');
    el.addEventListener('mouseleave', () => el.style.background = 'none');
    el.addEventListener('click', () => { menu.remove(); item.action(); });
    menu.appendChild(el);
  });

  btn.parentElement.appendChild(menu);

  // Fecha ao clicar fora
  const close = (e) => { if (!menu.contains(e.target) && e.target !== btn) { menu.remove(); document.removeEventListener('click', close); } };
  setTimeout(() => document.addEventListener('click', close), 0);
}

function _sessaoAbrirQR(sessionName) {
  openModal(`
    <div class="modal__header">
      <span class="modal__title">${icon('qr-code',18)} QR — <span class="mono">${escapeHtml(sessionName)}</span></span>
      <button class="btn btn--sm btn--ghost" onclick="closeModal()" aria-label="Fechar">✕</button>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:1rem;padding:1rem 0">
      <div id="sessao-qr-status"></div>
      <div id="sessao-qr-area" style="width:220px;height:220px;display:flex;align-items:center;justify-content:center">
        <div class="skeleton" style="width:220px;height:220px;border-radius:var(--radius-md)"></div>
      </div>
      <p class="muted" style="font-size:.8125rem;text-align:center">Aponte o WhatsApp para o QR code.<br>A tela atualiza automaticamente.</p>
    </div>
  `);

  pollQR(sessionName, (data) => {
    const area = document.getElementById('sessao-qr-area');
    const statusEl = document.getElementById('sessao-qr-status');
    if (!area) { if (_activeQRPoll) { clearInterval(_activeQRPoll); _activeQRPoll = null; } return; }

    if (data.connected || data.qr === null) {
      if (_activeQRPoll) { clearInterval(_activeQRPoll); _activeQRPoll = null; }
      if (statusEl) statusEl.innerHTML = `<span class="badge badge--dot badge--success">${icon('check-circle-2',14)} Conectado</span>`;
      area.innerHTML = `<div style="display:flex;flex-direction:column;align-items:center;gap:.5rem;color:var(--success)">${icon('check-circle-2',48)}<span style="font-weight:600">WhatsApp conectado!</span></div>`;
      toast(`Sessão ${sessionName} conectada!`, 'success');
      _sessaoLoadTable();
      setTimeout(closeModal, 2500);
      return;
    }

    if (data.qr) {
      if (statusEl) statusEl.innerHTML = `<span class="badge badge--dot badge--info">${icon('qr-code',14)} Aguardando scan</span>`;
      area.innerHTML = `<img src="${escapeHtml(data.qr)}" style="width:220px;height:220px;border-radius:var(--radius-md);image-rendering:pixelated" alt="QR Code">`;
    }
  });
}

async function _sessaoReiniciar(sessionName) {
  if (!confirm(`Reiniciar sessão "${sessionName}"?`)) return;
  try {
    await api(`/api/sessions/${encodeURIComponent(sessionName)}/restart`, { method: 'POST' });
    toast(`Sessão ${sessionName} reiniciada`, 'success');
    await _sessaoLoadTable();
  } catch (err) {
    toast(`Erro ao reiniciar: ${err.message}`, 'danger');

}

async function _sessaoDerrubar(sessionName) {
  if (!confirm(`Derrubar sessão "${sessionName}"? (pode ser reiniciada depois)`)) return;
  try {
    await api(`/api/sessions/${encodeURIComponent(sessionName)}/stop`, { method: 'POST' });
    toast(`Sessão ${sessionName} derrubada`, 'info');
    await _sessaoLoadTable();
  } catch (err) {
    toast(`Erro ao derrubar: ${err.message}`, 'danger');
  }
}

async function _sessaoDeletar(sessionName) {
  if (!confirm(`DELETAR sessão "${sessionName}"? Esta ação é irreversível.`)) return;
  if (!confirm(`Confirmar: deletar "${sessionName}" permanentemente?`)) return;
  try {
    await api(`/api/sessions/${encodeURIComponent(sessionName)}`, { method: 'DELETE' });
    toast(`Sessão ${sessionName} deletada`, 'success');

    toast(`Erro ao deletar: ${err.message}`, 'danger');

async function _sessaoCriarConfirm() {
  const inp = document.getElementById('nova-sessao-nome');
  const btn = document.getElementById('btn-criar-sessao-confirm');
  if (!inp) return;
  const name = inp.value.trim();

  if (!/^[a-zA-Z0-9_-]{1,64}$/.test(name)) {
    toast('Nome inválido — use apenas letras, números, _ e -', 'warning');
    inp.focus();
    return;

  if (btn) { btn.disabled = true; btn.textContent = 'Criando…'; }
  try {
    await api('/api/sessions', {

    toast(`Sessão "${name}" criada`, 'success');
