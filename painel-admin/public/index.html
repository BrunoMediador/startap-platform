<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Startap — Painel</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
/* ── Tokens — ADR 0005 Opção C (Linear-like operacional) ─────────── */
:root {
  /* Backgrounds */
  --bg:            #0a0a0a;
  --bg-2:          #111111;
  /* Surfaces */
  --surface:       #111827;
  --surface-2:     #1e293b;
  --surface-3:     #253347;
  /* Borders */
  --border:        #1e3a5f;
  --border-light:  #2d4a6e;
  /* Text */
  --text:          #f1f5f9;
  --text-muted:    #94a3b8;
  --text-subtle:   #64748b;
  /* Primary */
  --primary:       #3b82f6;
  --primary-hover: #2563eb;
  --primary-glow:  rgba(59,130,246,0.15);
  /* Semantic */
  --success:       #10b981;
  --success-bg:    rgba(16,185,129,0.12);
  --danger:        #ef4444;
  --danger-bg:     rgba(239,68,68,0.12);
  --warning:       #f59e0b;
  --warning-bg:    rgba(245,158,11,0.12);
  --info:          #38bdf8;
  --info-bg:       rgba(56,189,248,0.12);
  /* Radius */
  --radius-sm:     4px;
  --radius-md:     8px;
  --radius-lg:     10px;
  --radius-xl:     14px;
  --radius-full:   9999px;
  /* Shadows */
  --shadow-xs:     0 1px 2px rgba(0,0,0,0.5);
  --shadow-sm:     0 2px 4px rgba(0,0,0,0.4);
  --shadow-md:     0 4px 12px rgba(0,0,0,0.3);
  --shadow-lg:     0 8px 32px rgba(0,0,0,0.4);
  /* Spacing (escala 4px) */
  --space-1:  .25rem;
  --space-2:  .5rem;
  --space-3:  .75rem;
  --space-4:  1rem;
  --space-5:  1.25rem;
  --space-6:  1.5rem;
  --space-8:  2rem;
  --space-10: 2.5rem;
  --space-12: 3rem;
  /* Typography */
  --text-xs:   .6875rem;
  --text-sm:   .8125rem;
  --text-base: .875rem;
  --text-md:   1rem;
  --text-lg:   1.25rem;
  --text-xl:   1.75rem;
  /* Layout */
  --sidebar-w: 240px;
  --header-h:  56px;
  --transition:.15s ease;
  --font-mono: 'JetBrains Mono', ui-monospace, monospace;
}
/* ── Reset ──────────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; }
html { font-size: 14px; }
body {
  margin: 0;
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  line-height: 1.5;
}
a { color: var(--primary); text-decoration: none; }
a:hover { text-decoration: underline; }
img, video, audio { max-width: 100%; display: block; }
button { font-family: inherit; cursor: pointer; }
textarea, input, select { font-family: inherit; }
/* ── Typography ─────────────────────────────────────────────────────── */
.h1  { font-size: 1.5rem;   font-weight: 700; margin: 0 0 .5rem; line-height: 1.2; }
.h2  { font-size: 1.125rem; font-weight: 600; margin: 0 0 .5rem; }
.h3  { font-size: 1rem;     font-weight: 600; margin: 0; }
.muted   { color: var(--text-muted); font-size: .8125rem; }
.subtle  { color: var(--text-subtle); font-size: .75rem; }
.gcal-error-detail { margin-top: .375rem; font-family: var(--font-mono, monospace); font-size: .75rem; word-break: break-all; color: var(--danger, #ef4444); }
/* ── Google Calendar — bloco de ajuda e instruções ── */
.gcal-help-block { border: 1px solid var(--border); border-radius: var(--radius-md); overflow: hidden; margin-bottom: .875rem; }
.gcal-help-block summary {
  padding: .625rem .875rem;
  font-size: .8125rem;
  font-weight: 600;
  cursor: pointer;
  user-select: none;
  display: flex;
  align-items: center;
  gap: .375rem;
  background: var(--surface-2);
  list-style: none;
  color: var(--text);
}
.gcal-help-block summary::-webkit-details-marker { display: none; }
.gcal-help-block summary::before {
  content: '▶';
  font-size: .625rem;
  transition: transform .2s;
  color: var(--text-muted);
  flex-shrink: 0;
}
.gcal-help-block[open] summary::before { transform: rotate(90deg); }
.gcal-help-block__body { padding: .875rem; background: var(--bg-2); }
.gcal-instructions { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: .75rem; counter-reset: gcal-step; }
.gcal-instructions li { display: flex; gap: .625rem; font-size: .8125rem; line-height: 1.5; counter-increment: gcal-step; }
.gcal-instructions li::before {
  content: counter(gcal-step);
  min-width: 1.375rem;
  height: 1.375rem;
  background: var(--primary);
  color: #fff;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: .6875rem;
  font-weight: 700;
  flex-shrink: 0;
  margin-top: .0625rem;
}
.gcal-instructions li strong { color: var(--text); }
.gcal-instructions li a { color: var(--primary); text-decoration: none; }
.gcal-instructions li a:hover { text-decoration: underline; }
.gcal-instructions li code { font-family: var(--font-mono, monospace); font-size: .75rem; background: var(--surface-2); padding: .0625rem .25rem; border-radius: 3px; }
.gcal-edit-hint { padding: .625rem .75rem; background: var(--surface-2); border-radius: var(--radius-sm); font-size: .8125rem; color: var(--text-muted); margin-bottom: .5rem; border-left: 3px solid var(--primary); }
.pause-help-block { border: 1px solid var(--border); border-radius: var(--radius-md); overflow: hidden; }
.pause-help-block summary { display: flex; align-items: center; gap: .375rem; padding: .625rem .875rem; font-size: .8125rem; font-weight: 600; cursor: pointer; user-select: none; background: var(--surface-2); list-style: none; color: var(--text); }
.pause-help-block summary::-webkit-details-marker { display: none; }
.pause-help-block summary::before { content: '▶'; font-size: .625rem; transition: transform .2s; color: var(--text-muted); flex-shrink: 0; }
.pause-help-block[open] summary::before { transform: rotate(90deg); }
.pause-help-block__body { padding: .875rem; background: var(--bg-2); }
.pause-help-block__body ol { margin: 0; padding-left: 1.25rem; display: flex; flex-direction: column; gap: .5rem; font-size: .8125rem; line-height: 1.5; }
.pause-help-block__body li strong { color: var(--text); }
.pause-help-block__body li em { font-style: italic; }
.mono    { font-family: var(--font-mono); font-size: .8125rem; }
.label   { font-size: .75rem; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--text-muted); }
/* ── Layout shell ───────────────────────────────────────────────────── */
.shell { display: flex; min-height: 100vh; }
/* ── Sidebar ────────────────────────────────────────────────────────── */
.sidebar {
  width: var(--sidebar-w);
  background: var(--bg-2);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  position: fixed;
  top: 0; left: 0; bottom: 0;
  z-index: 200;
  transition: transform var(--transition);
}
.sidebar__logo {
  display: flex;
  align-items: center;
  gap: .625rem;
  padding: 1.125rem 1rem;
  border-bottom: 1px solid var(--border);
  text-decoration: none;
}
.sidebar__logo-icon {
  width: 32px; height: 32px;
  background: var(--primary);
  border-radius: var(--radius-md);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.sidebar__logo-wordmark {
  font-size: .9375rem;
  font-weight: 700;
  color: var(--text);
  letter-spacing: -.01em;
}
.sidebar__logo-sub {
  font-size: .6875rem;
  color: var(--text-muted);
  font-weight: 400;
  display: block;
  margin-top: -2px;
}
.sidebar__nav {
  flex: 1;
  overflow-y: auto;
  padding: .75rem .5rem;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: .625rem;
  padding: .5rem .75rem;
  border-radius: var(--radius-md);
  color: var(--text-muted);
  font-size: .875rem;
  font-weight: 500;
  cursor: pointer;
  border: none;
  background: transparent;
  width: 100%;
  text-align: left;
  transition: background var(--transition), color var(--transition);
  margin-bottom: 2px;
}
.nav-item:hover { background: var(--surface); color: var(--text); }
.nav-item.active {
  background: var(--primary-glow);
  color: var(--primary);
  border: 1px solid rgba(59,130,246,0.2);
}
.nav-item .nav-icon { flex-shrink: 0; opacity: .8; }
.nav-item.active .nav-icon { opacity: 1; }
.sidebar__footer {
  padding: .75rem 1rem;
  border-top: 1px solid var(--border);
  font-size: .75rem;
  color: var(--text-subtle);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: .5rem;
}
.sidebar__logout-btn {
  display: inline-flex;
  align-items: center;
  gap: .35rem;
  font-size: .7rem;
  padding: .25rem .5rem;
  color: var(--text-subtle);
  opacity: .75;
  transition: opacity .15s, color .15s;
}
.sidebar__logout-btn:hover {
  opacity: 1;
  color: var(--danger, #ef4444);
}
/* ── Mobile header ──────────────────────────────────────────────────── */
.mobile-header {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0;
  height: var(--header-h);
  background: var(--bg-2);
  border-bottom: 1px solid var(--border);
  align-items: center;
  padding: 0 1rem;
  z-index: 100;
  gap: .75rem;
}
.mobile-header__brand { font-weight: 700; font-size: .9375rem; }
.sidebar-backdrop {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.6);
  z-index: 150;
}
/* ── Main content ───────────────────────────────────────────────────── */
.main {
  flex: 1;
  margin-left: var(--sidebar-w);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
.section {
  display: none;
  padding: 1.5rem;
  flex: 1;
}
.section.active { display: block; }
.section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1.5rem;
  gap: 1rem;
  flex-wrap: wrap;
}
.section-header__left { display: flex; flex-direction: column; gap: .125rem; }
.section-label { font-size: .6875rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--text-subtle); margin-bottom: .125rem; }
/* ── Cards ──────────────────────────────────────────────────────────── */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 1rem;
}
.card-flat {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
}
.card--hover { transition: border-color var(--transition), box-shadow var(--transition); cursor: pointer; }
.card--hover:hover { border-color: var(--border-light); box-shadow: var(--shadow-md); }
/* ── KPI Grid ───────────────────────────────────────────────────────── */
.kpi-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 1rem;
  margin-bottom: 1.5rem;
}
.kpi-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 1rem;
  display: flex;
  flex-direction: column;
  gap: .375rem;
}
.kpi-card__icon {
  width: 36px; height: 36px;
  border-radius: var(--radius-md);
  display: flex; align-items: center; justify-content: center;
  margin-bottom: .25rem;
  flex-shrink: 0;
}
.kpi-card__value { font-size: 1.75rem; font-weight: 700; line-height: 1; }
.kpi-card__label { font-size: .75rem; color: var(--text-muted); font-weight: 500; }
.kpi-card__delta {
  display: inline-flex; align-items: center; gap: .25rem;
  font-size: .75rem; font-weight: 500; margin-top: .125rem;
}
.kpi-card__delta--up   { color: var(--success); }
.kpi-card__delta--down { color: var(--danger); }
/* ── Buttons ────────────────────────────────────────────────────────── */
.btn {
  display: inline-flex; align-items: center; gap: .375rem;
  padding: .4375rem .875rem;
  border-radius: var(--radius-md);
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  font-size: .875rem;
  font-weight: 500;
  cursor: pointer;
  transition: all var(--transition);
  white-space: nowrap;
  line-height: 1;
  text-decoration: none;
}
.btn:hover { background: var(--surface-2); border-color: var(--border-light); }
.btn:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.btn--primary { background: var(--primary); border-color: var(--primary); color: #fff; }
.btn--primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
.btn--danger  { background: var(--danger);  border-color: var(--danger);  color: #fff; }
.btn--danger:hover  { background: #dc2626;  border-color: #dc2626; }
.btn--success { background: var(--success); border-color: var(--success); color: #fff; }
.btn--ghost   { background: transparent; border-color: transparent; }
.btn--ghost:hover { background: var(--surface-2); }
.btn--sm { padding: .25rem .625rem; font-size: .8125rem; border-radius: var(--radius-sm); }
.btn--icon { padding: .375rem; border-radius: var(--radius-md); }
.btn[disabled] { opacity: .5; cursor: not-allowed; pointer-events: none; }
/* ── Badges ─────────────────────────────────────────────────────────── */
.badge {
  display: inline-flex; align-items: center; gap: .25rem;
  padding: 2px 8px; border-radius: var(--radius-full);
  font-size: .6875rem; font-weight: 600;
}
.badge--success { background: var(--success-bg); color: var(--success); }
.badge--danger  { background: var(--danger-bg);  color: var(--danger); }
.badge--warning { background: var(--warning-bg); color: var(--warning); }
.badge--info    { background: var(--info-bg);    color: var(--info); }
.badge--muted   { background: var(--surface-3);  color: var(--text-muted); }
.badge--dot::before {
  content: '';
  display: inline-block;
  width: 6px; height: 6px;
  border-radius: 50%;
  background: currentColor;
  flex-shrink: 0;
}
/* ── Skeleton ───────────────────────────────────────────────────────── */
.skeleton {
  background: linear-gradient(90deg, var(--surface) 25%, var(--surface-2) 50%, var(--surface) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.5s infinite;
  border-radius: var(--radius-md);
  height: 1.125em;
}
@keyframes shimmer {
  0%   { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}
.skeleton-block { border-radius: var(--radius-lg); animation: shimmer 1.5s infinite;
  background: linear-gradient(90deg, var(--surface) 25%, var(--surface-2) 50%, var(--surface) 75%);
  background-size: 200% 100%;
}
/* ── Empty state ────────────────────────────────────────────────────── */
.empty-state {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: .75rem;
  padding: 3rem 1.5rem;
  text-align: center; color: var(--text-muted);
}
.empty-state__icon { opacity: .4; }
.empty-state__title { font-weight: 600; font-size: 1rem; color: var(--text); }
.empty-state__text  { font-size: .875rem; max-width: 28ch; }
/* ── Table ──────────────────────────────────────────────────────────── */
.table-wrap { overflow-x: auto; border-radius: var(--radius-lg); border: 1px solid var(--border); }
.table { width: 100%; border-collapse: collapse; font-size: .875rem; }
.table th, .table td { padding: .5rem .875rem; text-align: left; border-bottom: 1px solid var(--border); }
.table th {
  font-weight: 600; color: var(--text-muted); font-size: .6875rem;
  text-transform: uppercase; letter-spacing: .06em;
  background: rgba(0,0,0,.2); white-space: nowrap;
}
.table tr:last-child td { border-bottom: none; }
.table tbody tr:hover td { background: rgba(255,255,255,.02); }
.table td.mono { font-family: var(--font-mono); font-size: .8rem; }
/* ── Forms ──────────────────────────────────────────────────────────── */
.field { display: flex; flex-direction: column; gap: .375rem; }
.field label { font-size: .75rem; font-weight: 600; color: var(--text-muted); }
input, select, textarea {
  background: var(--bg);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: .4375rem .75rem;
  font-size: .875rem;
  font-family: inherit;
  width: 100%;
  transition: border-color var(--transition), box-shadow var(--transition);
}
input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 3px var(--primary-glow);
}
input::placeholder, textarea::placeholder { color: var(--text-subtle); }
textarea { resize: vertical; min-height: 120px; font-family: var(--font-mono); font-size: .8125rem; }
.char-count { font-size: .75rem; color: var(--text-subtle); text-align: right; }
/* ── Tabs (pill) ────────────────────────────────────────────────────── */
.tabs {
  display: flex; gap: .25rem;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  padding: .25rem;
  width: fit-content;
  flex-wrap: wrap;
  margin-bottom: 1.25rem;
}
.tab-btn {
  padding: .3125rem .875rem;
  border-radius: var(--radius-full);
  border: none;
  background: transparent;
  color: var(--text-muted);
  font-size: .8125rem;
  font-weight: 500;
  cursor: pointer;
  transition: all var(--transition);
  white-space: nowrap;
}
.tab-btn:hover { color: var(--text); }
.tab-btn.active { background: var(--primary); color: #fff; }
/* ── Bot avatar ─────────────────────────────────────────────────────── */
.bot-avatar {
  border-radius: var(--radius-md);
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; color: #fff;
  flex-shrink: 0;
  font-size: .875rem;
  text-transform: uppercase;
}
/* ── Bot cards grid ──────────────────────────────────────────────────── */
.bots-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 1rem;
  margin-bottom: 1.5rem;
}
.bot-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 1.25rem;
  cursor: pointer;
  transition: border-color var(--transition), box-shadow var(--transition), transform var(--transition);
  display: flex; flex-direction: column; gap: 1rem;
}
.bot-card:hover {
  border-color: var(--border-light);
  box-shadow: var(--shadow-md);
  transform: translateY(-2px);
}
.bot-card.selected { border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary-glow); }
.bot-card__header { display: flex; align-items: flex-start; gap: .875rem; }
.bot-card__header-meta { flex: 1; min-width: 0; }
.bot-card__name   { font-weight: 600; font-size: 1rem; display: flex; align-items: center; gap: .375rem; flex-wrap: wrap; }
.bot-card__slug   { font-size: .6875rem; color: var(--text-muted); font-family: var(--font-mono); margin-top: .125rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bot-card__phone  { font-size: .75rem; color: var(--text-muted); margin-top: .25rem; display: flex; align-items: center; gap: .25rem; }
.bot-card__status-row { display: flex; align-items: center; gap: .5rem; }
/* ── Dot pulsante de status ─────────────────────────────────────── */
.bot-card__dot {
  width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
}
.bot-card__dot--working {
  background: var(--success);
  animation: dot-pulse 2s ease-in-out infinite;
}
.bot-card__dot--failed  { background: var(--danger); }
.bot-card__dot--muted   { background: var(--text-muted); }
.bot-card__dot--warning { background: var(--warning); animation: dot-pulse 1.2s ease-in-out infinite; }
@keyframes dot-pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50%       { opacity: .5; transform: scale(.65); }
}
/* ── Mini KPIs ──────────────────────────────────────────────────── */
.bot-card__kpis {
  display: flex; gap: .5rem; flex-wrap: wrap;
}
.bot-card__kpi {
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: .25rem .625rem;
  font-size: .6875rem;
  color: var(--text-muted);
  display: flex; flex-direction: column; align-items: center; gap: .0625rem;
}
.bot-card__kpi-val {
  font-size: .8125rem;
  font-weight: 600;
  color: var(--text);
  font-variant-numeric: tabular-nums;
}
/* ── Footer de ações ────────────────────────────────────────────── */
.bot-card__footer {
  display: flex; gap: .5rem; flex-wrap: wrap;
  margin-top: auto;
  padding-top: .25rem;
  border-top: 1px solid var(--border);
}
/* ── Bot rows (lista densa profissional) ─────────────────────────── */
.bot-row-list {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  overflow: hidden;
  margin-bottom: 1rem;
  box-shadow: var(--shadow-xs);
}
.bot-row {
  display: flex; align-items: center; gap: 1.25rem;
  padding: .75rem 1rem;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  transition: background var(--transition);
  position: relative;
}
.bot-row:last-child { border-bottom: none; }
.bot-row:hover { background: var(--surface-2); }
.bot-row:focus-visible { outline: none; background: var(--surface-2); }
.bot-row.selected {
  background: var(--surface-2);
  box-shadow: inset 3px 0 0 var(--primary);
}
.bot-row__title {
  display: flex; align-items: center; gap: .75rem;
  min-width: 0; flex: 1.6 1 240px;
}
.bot-row__title-meta { min-width: 0; flex: 1; }
.bot-row__name {
  font-weight: 600; font-size: .9375rem;
  display: flex; align-items: center; gap: .5rem;
  flex-wrap: wrap; line-height: 1.25;
  overflow: hidden;
}
.bot-row__name-text {
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  max-width: 100%;
}
.bot-row__sub {
  font-size: .75rem; color: var(--text-muted);
  margin-top: .25rem;
  display: flex; align-items: center; gap: .75rem;
  flex-wrap: wrap;
}
.bot-row__sub-item {
  display: inline-flex; align-items: center; gap: .25rem;
}
.bot-row__sub-item code {
  font-family: var(--font-mono); font-size: .6875rem;
  background: var(--bg-2); border: 1px solid var(--border);
  padding: 1px 6px; border-radius: var(--radius-sm);
  color: var(--text-muted);
}
.bot-row__status-dot {
  width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
  background: var(--text-muted);
  display: inline-block;
}
.bot-row__status-dot--working {
  background: var(--success);
  animation: dot-pulse 2s ease-in-out infinite;
}
.bot-row__status-dot--failed  { background: var(--danger); }
.bot-row__status-dot--warning { background: var(--warning); animation: dot-pulse 1.2s ease-in-out infinite; }
.bot-row__metrics {
  display: flex; align-items: stretch; gap: 1.5rem;
  flex-shrink: 0;
}
.bot-row__metric {
  display: flex; flex-direction: column;
  min-width: 56px;
}
.bot-row__metric-val {
  font-size: 1rem; font-weight: 600; color: var(--text);
  font-variant-numeric: tabular-nums; line-height: 1.15;
  white-space: nowrap;
}
.bot-row__metric-val--sm {
  font-size: .8125rem; font-weight: 500; color: var(--text-muted);
}
.bot-row__metric-label {
  font-size: .65rem; color: var(--text-subtle);
  text-transform: uppercase; letter-spacing: .05em;
  margin-top: 2px; white-space: nowrap;
}
.bot-row__actions {
  display: flex; align-items: center; gap: .375rem;
  flex-shrink: 0;
}
/* Resumo do grupo (KPIs no header) */
.bots-group-header__top {
  display: flex; align-items: flex-start; justify-content: space-between;
  gap: 1rem; flex-wrap: wrap;
}
.bots-group-summary {
  display: flex; align-items: baseline; gap: 1.25rem;
  flex-wrap: wrap;
  font-size: .8125rem; color: var(--text-muted);
}
.bots-group-summary__item {
  display: inline-flex; align-items: baseline; gap: .375rem;
}
.bots-group-summary__val {
  font-size: .9375rem; font-weight: 600; color: var(--text);
  font-variant-numeric: tabular-nums;
}
.bots-group-summary__sep {
  width: 1px; height: 14px; background: var(--border);
}
.bot-row__empty {
  padding: 2rem 1rem; text-align: center;
  color: var(--text-muted); font-size: .8125rem;
}
@media (max-width: 900px) {
  .bot-row {
    flex-direction: column; align-items: stretch;
    gap: .875rem; padding: .875rem 1rem;
  }
  .bot-row__metrics {
    gap: 1rem; flex-wrap: wrap;
    padding-top: .5rem; border-top: 1px dashed var(--border);
  }
  .bot-row__metric { min-width: 70px; }
  .bot-row__actions { justify-content: flex-end; }
  .bot-row.selected { box-shadow: inset 0 3px 0 var(--primary); }
}
/* ── Bot detail ─────────────────────────────────────────────────────── */
.bot-detail {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 1.25rem;
}
/* Quando renderizado dentro do drawer, herda o estilo do drawer */
.bot-detail--in-drawer {
  background: transparent;
  border: none;
  border-radius: 0;
  padding: 0;
}
.bot-detail__header {
  display: flex; align-items: center; gap: 1rem;
  margin-bottom: 1.25rem; padding-bottom: 1rem;
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
}
/* Oculta o header interno quando dentro do drawer (o drawer já tem o seu próprio) */
.bot-detail--in-drawer .bot-detail__header { display: none; }
.bot-detail__title { font-size: 1.125rem; font-weight: 700; }
.bot-detail__meta  { font-size: .8125rem; color: var(--text-muted); }
/* ── Media table (Retool dense) ───────────────────────────────────────── */
.media-table { width: 100%; border-collapse: collapse; font-size: .8125rem; }
.media-table th {
  text-align: left; font-weight: 600; color: var(--text-muted);
  padding: .4rem .75rem; border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
.media-table td { padding: .5rem .75rem; border-bottom: 1px solid var(--border); vertical-align: middle; }
.media-table tr:last-child td { border-bottom: none; }
.media-table tr:hover td { background: var(--bg-2); }
.media-thumb {
  width: 40px; height: 40px; object-fit: cover;
  border-radius: var(--radius-sm); border: 1px solid var(--border);
  display: block;
}
.media-thumb-icon {
  width: 40px; height: 40px; border-radius: var(--radius-sm);
  border: 1px solid var(--border); background: var(--bg-2);
  display: flex; align-items: center; justify-content: center;
  color: var(--text-muted);
}
.media-type-badge {
  display: inline-block; padding: .15rem .45rem;
  border-radius: var(--radius-sm); font-size: .7rem; font-weight: 600;
  text-transform: uppercase; letter-spacing: .03em;
}
.media-type-badge--image  { background: #d1fae5; color: #065f46; }
.media-type-badge--video  { background: #dbeafe; color: #1e40af; }
.media-type-badge--audio  { background: #ede9fe; color: #5b21b6; }
.media-type-badge--doc    { background: #fef3c7; color: #92400e; }
.media-type-badge--other  { background: var(--bg-2); color: var(--text-muted); }
.media-context-cell { max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-muted); }
.media-filename-cell { max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* ── Media grid v2 (cards com player inline + edição in-place) ──────── */
.media-grid-v2 {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 1rem;
}
.media-card-v2 {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  overflow: hidden;
  display: flex; flex-direction: column;
  transition: border-color var(--transition), box-shadow var(--transition);
}
.media-card-v2:hover { border-color: var(--border-light); box-shadow: var(--shadow-md); }
.media-card-v2--editing {
  border-color: var(--primary);
  box-shadow: 0 0 0 2px var(--primary-glow);
}
.media-card-v2__preview {
  background: #050a14;
  position: relative;
  display: flex; align-items: center; justify-content: center;
  aspect-ratio: 16 / 9;
  overflow: hidden;
}
.media-card-v2__preview video {
  width: 100%; height: 100%;
  object-fit: contain;
  background: #000;
  display: block;
}
.media-card-v2__preview img {
  width: 100%; height: 100%;
  object-fit: cover;
  cursor: zoom-in;
  display: block;
}
.media-card-v2__preview--audio {
  aspect-ratio: auto;
  flex-direction: column;
  gap: .625rem;
  padding: 1.25rem 1rem .875rem;
  background: linear-gradient(135deg, #1e293b, #0f172a);
}
.media-card-v2__preview--audio audio {
  width: 100%;
  height: 38px;
}
.media-card-v2__preview--audio-label {
  display: flex; align-items: center; gap: .5rem;
  color: var(--text); font-weight: 600; font-size: .8125rem;
  align-self: flex-start;
}
.media-card-v2__preview--icon {
  aspect-ratio: 16 / 9;
  flex-direction: column; gap: .5rem;
  background: var(--bg-2);
  color: var(--text-muted);
}
.media-card-v2__preview--icon span.muted {
  font-size: .75rem; max-width: 80%;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.media-card-v2__pos-badge {
  position: absolute; top: .5rem; left: .5rem;
  background: rgba(0, 0, 0, .65);
  color: #fff;
  font-size: .65rem; font-weight: 700;
  padding: 3px 8px; border-radius: var(--radius-full);
  font-variant-numeric: tabular-nums;
  letter-spacing: .02em;
  backdrop-filter: blur(4px);
  pointer-events: none;
  z-index: 2;
}
.media-card-v2__body {
  padding: .75rem .875rem;
  display: flex; flex-direction: column; gap: .5rem;
  flex: 1;
}
.media-card-v2__title {
  font-weight: 600; font-size: .875rem; color: var(--text);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  line-height: 1.3;
}
.media-card-v2__chips {
  display: flex; gap: .375rem; flex-wrap: wrap;
}
.media-card-v2__chips .course-slug-badge {
  font-size: .68rem;
}
.media-card-v2__meta {
  font-size: .75rem;
  display: flex; flex-direction: column; gap: .375rem;
  margin-top: .125rem;
}
.media-card-v2__meta-row {
  display: flex; gap: .5rem; align-items: flex-start;
}
.media-card-v2__meta-label {
  font-size: .625rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: .05em;
  color: var(--text-subtle);
  flex-shrink: 0; min-width: 64px;
  padding-top: 2px;
}
.media-card-v2__meta-val {
  color: var(--text-muted); flex: 1;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  line-height: 1.4;
}
.media-card-v2__meta-val--empty {
  color: var(--text-subtle); font-style: italic;
}
.media-card-v2__footer {
  display: flex; align-items: center; gap: .375rem;
  padding: .5rem .75rem;
  border-top: 1px solid var(--border);
  background: var(--bg-2);
}
.media-card-v2__footer-spacer { flex: 1; }
.media-card-v2__edit-form {
  border-top: 1px solid var(--border);
  padding: .875rem;
  background: var(--bg-2);
  display: flex; flex-direction: column; gap: .75rem;
}
.media-card-v2__edit-form .field-label {
  display: block;
  font-size: .65rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: .05em;
  color: var(--text-subtle);
  margin-bottom: .25rem;
}
.media-card-v2__edit-form textarea,
.media-card-v2__edit-form input[type="text"],
.media-card-v2__edit-form input[type="number"],
.media-card-v2__edit-form select {
  width: 100%;
}
.media-card-v2__edit-form textarea { min-height: 70px; resize: vertical; }
.media-card-v2__edit-row {
  display: flex; gap: .625rem; align-items: flex-end;
}
.media-card-v2__edit-row > div { flex: 1; min-width: 0; }
.media-card-v2__edit-row > div.compact { flex: 0 0 110px; }
.media-card-v2__edit-actions {
  display: flex; gap: .5rem; justify-content: flex-end;
  padding-top: .25rem;
  border-top: 1px dashed var(--border);
  margin-top: .25rem;
}
.media-card-v2__type-summary {
  display: flex; align-items: center; gap: .5rem; flex-wrap: wrap;
  font-size: .8125rem; color: var(--text-muted);
}
@media (max-width: 640px) {
  .media-grid-v2 { grid-template-columns: 1fr; }
  .media-card-v2__edit-row { flex-direction: column; align-items: stretch; }
  .media-card-v2__edit-row > div.compact { flex: 1; }
}
/* dropdown de ações */
.media-actions-wrap { position: relative; display: inline-block; }
.media-actions-menu {
  display: none; position: absolute; right: 0; top: 100%; z-index: 200;
  background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-md);
  min-width: 140px; box-shadow: 0 4px 16px rgba(0,0,0,.12);
}
.media-actions-menu.open { display: block; }
.media-actions-menu button {
  display: flex; align-items: center; gap: .5rem;
  width: 100%; padding: .5rem .875rem; background: none; border: none;
  font-size: .8125rem; color: var(--text); cursor: pointer; white-space: nowrap;
}
.media-actions-menu button:hover { background: var(--bg-2); }
.media-actions-menu button.danger { color: var(--danger); }
/* progress bar de upload */
.upload-progress { height: 4px; background: var(--border); border-radius: 2px; margin-top: .5rem; overflow: hidden; }
.upload-progress__bar { height: 100%; background: var(--primary); border-radius: 2px; transition: width .2s; width: 0; }
/* preview no modal */
.upload-preview { margin-top: .75rem; text-align: center; }
.upload-preview img { max-height: 120px; max-width: 100%; border-radius: var(--radius-sm); }
.upload-preview-icon { display: inline-flex; flex-direction: column; align-items: center; gap: .25rem; color: var(--text-muted); font-size: .8rem; }
/* ── Courses table (006-C) ────────────────────────────────────────────── */
.course-table { width: 100%; border-collapse: collapse; font-size: .8125rem; }
.course-table th {
  text-align: left; font-weight: 600; color: var(--text-muted);
  padding: .4rem .75rem; border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
.course-table td { padding: .5rem .75rem; border-bottom: 1px solid var(--border); vertical-align: middle; }
.course-table tbody tr:last-child td { border-bottom: none; }
.course-table .js-course-row:hover td { background: var(--bg-2); }
.course-slug-badge {
  display: inline-flex; align-items: center;
  background: var(--info-bg); color: var(--info);
  border-radius: var(--radius-sm); padding: .125rem .4rem;
  font-size: .72rem; font-family: var(--font-mono); white-space: nowrap;
}
.course-slug-badge--warning { background: var(--warning-bg); color: var(--warning); }
.course-media-count { font-size: .8125rem; }
/* sub-linhas de mídias dentro da tabela de cursos */
.course-media-sub-row td { background: var(--surface-2) !important; border-bottom: 1px solid var(--border); padding-top: .3rem; padding-bottom: .3rem; }
.course-media-sub-row:hover td { background: var(--bg-2) !important; }
/* modal de vínculo de mídia */
.link-media-group { margin-bottom: .75rem; }
.link-media-group__title {
  font-size: .6875rem; font-weight: 700; text-transform: uppercase;
  letter-spacing: .08em; color: var(--text-subtle); margin-bottom: .375rem;
}
.link-media-row {
  display: flex; align-items: center; gap: .5rem;
  padding: .375rem 0; border-bottom: 1px solid var(--border);
  font-size: .8125rem;
}
.link-media-row:last-child { border-bottom: none; }
.link-media-row__name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.link-media-row--disabled { opacity: .5; }
@media (max-width: 640px) {
  .course-table .col-course-desc,
  .course-table th.col-course-desc { display: none; }
  .link-media-row { flex-wrap: wrap; }
  .link-media-row__name { flex-basis: 100%; }
}
@media (max-width: 480px) {
  .course-table .col-course-price,
  .course-table th.col-course-price,
  .course-table .col-course-intro,
  .course-table th.col-course-intro { display: none; }
}
/* ── Media cards (legado — mantido pra compat com renderMediaPreview) ─── */
.media-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 1rem;
}
.media-card {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  overflow: hidden;
  display: flex; flex-direction: column;
}
.media-card__preview {
  background: var(--bg-2);
  min-height: 140px;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
  position: relative;
}
.media-card__preview video,
.media-card__preview audio { width: 100%; }
.media-card__preview .media-img {
  width: 100%; height: 160px; object-fit: cover; cursor: zoom-in;
  transition: transform .2s;
}
.media-card__preview .media-img:hover { transform: scale(1.03); }
.media-card__info {
  padding: .625rem .75rem;
  display: flex; align-items: center; justify-content: space-between; gap: .5rem;
  border-top: 1px solid var(--border);
}
.media-card__name { font-size: .8125rem; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
/* ── Lightbox ────────────────────────────────────────────────────────── */
.lightbox {
  display: none;
  position: fixed; inset: 0; z-index: 1000;
  background: rgba(0,0,0,.92);
  align-items: center; justify-content: center;
  padding: 1rem;
}
.lightbox.open { display: flex; }
.lightbox img { max-height: 90vh; max-width: 90vw; border-radius: var(--radius-md); }
.lightbox__close {
  position: absolute; top: 1rem; right: 1rem;
  background: rgba(255,255,255,.1); border: none;
  border-radius: var(--radius-full);
  color: #fff; width: 36px; height: 36px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; font-size: 1.25rem;
  transition: background var(--transition);
}
.lightbox__close:hover { background: rgba(255,255,255,.2); }
/* ── WAHA session cards ───────────────────────────────────────────────── */
.sessions-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 1rem;
  margin-bottom: 1.5rem;
}
.session-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 1rem;
  display: flex; flex-direction: column; gap: .5rem;
}
.session-card__name { font-weight: 600; font-size: .9375rem; }
/* ── Toast ──────────────────────────────────────────────────────────── */
#toast-container {
  position: fixed; bottom: 5rem; right: 1.25rem;
  display: flex; flex-direction: column; gap: .5rem;
  z-index: 9999;
  max-width: min(360px, calc(100vw - 2.5rem));
}
.toast {
  padding: .75rem 1rem;
  border-radius: var(--radius-lg);
  font-size: .875rem; font-weight: 500;
  display: flex; align-items: center; gap: .5rem;
  box-shadow: var(--shadow-lg);
  animation: toast-in .2s ease forwards;
  border: 1px solid transparent;
}
.toast--success { background: var(--success-bg); border-color: var(--success); color: var(--success); }
.toast--danger  { background: var(--danger-bg);  border-color: var(--danger);  color: var(--danger); }
.toast--info    { background: var(--info-bg);    border-color: var(--info);    color: var(--info); }
.toast--warning { background: var(--warning-bg); border-color: var(--warning); color: var(--warning); }
@keyframes toast-in {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}
/* ── Modal ──────────────────────────────────────────────────────────── */
#modal-backdrop {
  display: none;
  position: fixed; inset: 0; z-index: 500;
  background: rgba(0,0,0,.7);
  align-items: center; justify-content: center;
  padding: 1rem;
}
#modal-backdrop.open { display: flex; }
.modal {
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-xl);
  width: 100%; max-width: 520px;
  max-height: 90vh; overflow-y: auto;
  padding: 1.5rem;
  box-shadow: var(--shadow-lg);
}
.modal__header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 1.25rem; padding-bottom: .875rem;
  border-bottom: 1px solid var(--border);
}
.modal__title { font-weight: 700; font-size: 1.0625rem; }
/* ── Upload area ────────────────────────────────────────────────────── */
.upload-area {
  border: 2px dashed var(--border-light);
  border-radius: var(--radius-lg);
  padding: 2rem;
  text-align: center;
  color: var(--text-muted);
  cursor: pointer;
  transition: border-color var(--transition), background var(--transition);
}
.upload-area:hover { border-color: var(--primary); background: var(--primary-glow); color: var(--text); }
.upload-area--active { border-color: var(--primary); background: var(--primary-glow); color: var(--text); outline: 2px solid var(--primary); outline-offset: -2px; }
.upload-area input[type="file"] { display: none; }
/* ── Divider ────────────────────────────────────────────────────────── */
.divider { height: 1px; background: var(--border); margin: 1.25rem 0; }
/* ── Routing table rows (legado — mantido para compat) ──────────────── */
.routing-row { display: flex; align-items: center; gap: .75rem; padding: .625rem 0; border-bottom: 1px solid var(--border); }
.routing-row:last-child { border-bottom: none; }
.routing-row__pattern { font-family: var(--font-mono); font-size: .8125rem; flex: 1; }
.routing-row__target  { font-size: .8125rem; color: var(--text-muted); }
/* ── Routing page (003-F) ───────────────────────────────────────────── */
.rt-kpi-strip { display:flex; gap:1rem; margin-bottom:1.25rem; flex-wrap:wrap; }
.rt-kpi { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:.625rem 1rem; display:flex; flex-direction:column; gap:.125rem; min-width:120px; }
.rt-kpi__value { font-size:1.375rem; font-weight:700; line-height:1.1; }
.rt-kpi__label { font-size:.6875rem; font-weight:600; text-transform:uppercase; letter-spacing:.06em; color:var(--text-muted); }
.rt-filter-bar { display:flex; align-items:center; gap:.5rem; flex-wrap:wrap; margin-bottom:.875rem; }
.rt-filter-bar select,
.rt-filter-bar input[type="text"] { min-width:0; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); color:var(--text); padding:.375rem .625rem; font-size:.8125rem; height:32px; }
.rt-filter-bar select:focus,
.rt-filter-bar input[type="text"]:focus { outline:none; border-color:var(--primary); box-shadow:0 0 0 2px var(--primary-glow); }
.rt-bulk-bar { display:none; align-items:center; gap:.75rem; background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-md); padding:.5rem .875rem; margin-bottom:.75rem; }
.rt-bulk-bar.visible { display:flex; }
.rt-bulk-bar__count { font-size:.8125rem; font-weight:600; color:var(--text-muted); }
.rt-table { width:100%; border-collapse:collapse; font-size:.8125rem; }
.rt-table th { text-align:left; font-weight:600; color:var(--text-muted); font-size:.6875rem; text-transform:uppercase; letter-spacing:.05em; padding:.4rem .75rem; border-bottom:1px solid var(--border); white-space:nowrap; }
.rt-table td { padding:.5rem .75rem; border-bottom:1px solid var(--border); vertical-align:middle; }
.rt-table tr:last-child td { border-bottom:none; }
.rt-table tbody tr:hover td { background:rgba(255,255,255,.02); }
.rt-table td.rt-col-phone { font-family:var(--font-mono); font-size:.8rem; }
.rt-wf-badge { display:inline-flex; align-items:center; gap:.35rem; padding:.2rem .55rem; border-radius:var(--radius-sm); font-size:.75rem; font-weight:600; cursor:pointer; transition:opacity var(--transition); }
.rt-wf-badge:hover { opacity:.8; }
.rt-inline-select { background:var(--surface-2); border:1px solid var(--primary); border-radius:var(--radius-sm); color:var(--text); padding:.2rem .4rem; font-size:.75rem; }
.rt-actions-wrap { position:relative; display:inline-block; }
.rt-actions-menu { display:none; position:absolute; right:0; top:100%; z-index:250; background:var(--bg); border:1px solid var(--border); border-radius:var(--radius-md); min-width:130px; box-shadow:0 4px 16px rgba(0,0,0,.2); }
.rt-actions-menu.open { display:block; }
.rt-actions-menu button { display:flex; align-items:center; gap:.5rem; width:100%; padding:.5rem .875rem; background:none; border:none; font-size:.8125rem; color:var(--text); cursor:pointer; white-space:nowrap; }
.rt-actions-menu button:hover { background:var(--bg-2); }
.rt-actions-menu button.danger { color:var(--danger); }
@media (max-width:768px) {
  .rt-col-updated,.rt-col-ativo,.rt-col-sessao { display:none; }
  .rt-col-nome { max-width:80px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
}
/* ── Dashboard grid ─────────────────────────────────────────────────── */
.dash-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1rem;
  margin-top: 1.5rem;
}
.dash-grid--full { grid-column: 1 / -1; }
/* ── Spinner ────────────────────────────────────────────────────────── */
.spinner {
  width: 20px; height: 20px;
  border: 2px solid var(--surface-3);
  border-top-color: var(--primary);
  border-radius: 50%;
  animation: spin .7s linear infinite;
  flex-shrink: 0;
}
@keyframes spin { to { transform: rotate(360deg); } }
/* ── Section status indicator row ─────────────────────────────────────── */
.status-row {
  display: flex; align-items: center; gap: .75rem;
  padding: .5rem 0; border-bottom: 1px solid var(--border);
  font-size: .875rem;
}
.status-row:last-child { border-bottom: none; }
.status-row__name { flex: 1; font-weight: 500; }
.status-row__detail { color: var(--text-muted); font-size: .8125rem; }
/* ── Drawer lateral ─────────────────────────────────────────────── */
.drawer-backdrop { position:fixed; inset:0; background:rgba(0,0,0,0.4); z-index:900; opacity:0; pointer-events:none; transition:opacity 200ms; }
.drawer-backdrop.open { opacity:1; pointer-events:auto; }
.drawer { position:fixed; top:0; right:0; bottom:0; width:min(420px, 90vw); background:var(--surface); border-left:1px solid var(--border); transform:translateX(100%); transition:transform 250ms ease-out; z-index:901; overflow-y:auto; padding:1.5rem; }
.drawer--wide { width:min(520px, 95vw); }
.drawer.open { transform:translateX(0); }
.drawer__header { display:flex; align-items:center; justify-content:space-between; margin-bottom:1.25rem; padding-bottom:.875rem; border-bottom:1px solid var(--border); }
.drawer__title { font-weight:700; font-size:1rem; }
.drawer__body pre { background:var(--bg); border:1px solid var(--border); border-radius:var(--radius-md); padding:.75rem; font-size:.75rem; font-family:var(--font-mono); overflow-x:auto; white-space:pre-wrap; word-break:break-all; }
/* ── Toggle switch ──────────────────────────────────────────────── */
.toggle { position:relative; display:inline-flex; align-items:center; cursor:pointer; gap:.5rem; font-size:.875rem; }
.toggle input { position:absolute; opacity:0; width:0; height:0; }
.toggle__track { width:36px; height:20px; background:var(--surface-3); border-radius:var(--radius-full); transition:background var(--transition); flex-shrink:0; position:relative; }
.toggle input:checked + .toggle__track { background:var(--success); }
.toggle__track::after { content:''; position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:#fff; transition:transform var(--transition); }
.toggle input:checked + .toggle__track::after { transform:translateX(16px); }
/* ── Filter bar ─────────────────────────────────────────────────── */
.filter-bar { display:flex; align-items:center; gap:.5rem; flex-wrap:wrap; margin-bottom:1rem; }
.filter-bar .pill-group { display:flex; gap:2px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-full); padding:2px; }
.filter-bar .pill { padding:.25rem .6rem; border-radius:var(--radius-full); border:none; background:transparent; color:var(--text-muted); font-size:.8rem; cursor:pointer; transition:all var(--transition); white-space:nowrap; }
.filter-bar .pill.active { background:var(--primary); color:#fff; }
.filter-bar select, .filter-bar input[type="text"] { width:auto; min-width:0; flex:1; }
/* ── Bar chart ──────────────────────────────────────────────────── */
.bar-chart { display:flex; align-items:flex-end; gap:4px; height:120px; }
.bar-chart__col { display:flex; flex-direction:column; align-items:center; flex:1; gap:3px; }
.bar-chart__bar { width:100%; background:var(--primary); border-radius:var(--radius-sm) var(--radius-sm) 0 0; min-height:2px; transition:opacity var(--transition); }
.bar-chart__bar:hover { opacity:.8; }
.bar-chart__val { font-size:.65rem; color:var(--text-muted); font-family:var(--font-mono); line-height:1; }
.bar-chart__lbl { font-size:.6rem; color:var(--text-subtle); white-space:nowrap; }
/* ── Live dot ───────────────────────────────────────────────────── */
.live-dot { width:8px; height:8px; border-radius:50%; background:var(--success); animation:pulse-dot 1.4s ease-in-out infinite; flex-shrink:0; }
@keyframes pulse-dot { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(.7)} }
/* ── Responsive ─────────────────────────────────────────────────────── */
@media (max-width: 768px) {
  :root { --sidebar-w: 240px; }
  .sidebar {
    transform: translateX(-100%);
    top: var(--header-h);
    bottom: 0;
    z-index: 200;
    box-shadow: var(--shadow-lg);
  }
  .sidebar.open { transform: translateX(0); }
  .sidebar-backdrop.open { display: block; }
  .mobile-header { display: flex; }
  .main { margin-left: 0; padding-top: var(--header-h); }
  .section { padding: 1rem; }
  .kpi-grid { grid-template-columns: 1fr 1fr; }
  .bots-grid { grid-template-columns: 1fr; }
  .media-grid { grid-template-columns: 1fr; }
  .media-table .media-context-cell,
  .media-table th.col-context { display: none; }
  .media-table .col-course,
  .media-table th.col-course { display: none; }
  .sessions-grid { grid-template-columns: 1fr; }
  .dash-grid { grid-template-columns: 1fr; }
  .tabs { width: 100%; justify-content: flex-start; overflow-x: auto; }
  .section-header { flex-direction: column; align-items: flex-start; }
}
@media (max-width: 480px) {
  .kpi-grid { grid-template-columns: 1fr; }
  .kpi-card__value { font-size: 1.375rem; }
}
/* ── Accent button (atalho de clonagem) ─────────────────────────── */
.btn--accent { background: #059669; border-color: #059669; color: #fff; }
.btn--accent:hover { background: #047857; border-color: #047857; }
@media (max-width: 480px) {
  .btn--accent .btn-label { display: none; }
  .btn--accent::before { content: '+'; font-size: 1rem; }
}
/* ── Utilitários de layout ───────────────────────────────────────── */
.row { display: flex; align-items: center; gap: .75rem; }
.row--wrap { flex-wrap: wrap; }
.flex-1 { flex: 1; min-width: 0; }
/* ── Grupos da seção Bots ────────────────────────────────────────── */
.bots-group { margin-bottom: 2rem; }
.bots-group-header { margin-bottom: 1rem; padding-bottom: .625rem; border-bottom: 1px solid var(--border); }
.bots-group-header .h2 { margin-bottom: .125rem; }
.bots-group-header .label { display: block; font-size: .6875rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--text-subtle, var(--text-muted)); margin-bottom: .25rem; }
/* ── Clones ──────────────────────────────────────────────────────── */
.clones-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 1rem;
  margin-bottom: 1.5rem;
}
.clone-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 1rem;
  display: flex; flex-direction: column; gap: .75rem;
  transition: border-color var(--transition), box-shadow var(--transition);
}
.clone-card:hover { border-color: var(--border-light); box-shadow: var(--shadow-md); }
.clone-card__header { display: flex; align-items: center; gap: .75rem; }
.clone-card__info { flex: 1; min-width: 0; }
.clone-card__name { font-weight: 600; font-size: .9375rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.clone-card__sub  { font-size: .75rem; color: var(--text-muted); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.clone-card__actions { display: flex; align-items: center; gap: .375rem; flex-wrap: wrap; }
/* ── Clone wizard ────────────────────────────────────────────────── */
.modal--lg { max-width: 600px; }
.wizard-steps {
  display: flex; align-items: center; gap: .375rem;
  margin-bottom: 1.25rem;
}
.wizard-step {
  display: flex; align-items: center; justify-content: center;
  width: 28px; height: 28px;
  border-radius: 50%;
  font-size: .75rem; font-weight: 700;
  background: var(--surface-3); color: var(--text-muted);
  flex-shrink: 0;
}
.wizard-step.active { background: var(--primary); color: #fff; }
.wizard-step.done   { background: var(--success); color: #fff; }
.wizard-step-sep { flex: 1; height: 2px; background: var(--surface-3); border-radius: 1px; }
.wizard-step-sep.done { background: var(--success); }
.wizard-body { min-height: 240px; }
.wizard-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 1.25rem; gap: .75rem; }
/* ── Matrix selection cards ─────────────────────────────────────── */
.matrix-cards {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: .75rem;
}
.matrix-card {
  border: 2px solid var(--border);
  border-radius: var(--radius-lg);
  padding: .875rem;
  cursor: pointer;
  transition: border-color var(--transition), box-shadow var(--transition);
  text-align: center;
}
.matrix-card:hover { border-color: var(--border-light); }
.matrix-card.selected { border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary-glow); }
.matrix-card__icon { margin: 0 auto .5rem; opacity: .7; }
.matrix-card.selected .matrix-card__icon { opacity: 1; color: var(--primary); }
.matrix-card__name { font-weight: 600; font-size: .875rem; margin-bottom: .25rem; }
.matrix-card__desc { font-size: .75rem; color: var(--text-muted); line-height: 1.4; }
/* ── Personalization key-value list ─────────────────────────────── */
.kv-row { display: flex; align-items: center; gap: .5rem; margin-bottom: .5rem; }
.kv-row input { flex: 1; min-width: 0; }
/* ── QR display ─────────────────────────────────────────────────── */
.qr-wrap {
  display: flex; flex-direction: column; align-items: center;
  gap: 1rem; padding: 1rem 0;
}
.qr-wrap img { max-width: 280px; border-radius: var(--radius-md); border: 3px solid var(--primary); }
.qr-connected {
  display: flex; flex-direction: column; align-items: center;
  gap: .75rem; padding: 2rem 0;
  color: var(--success);
}
/* ── Pairing code — segmented control + display ─────────────────── */
.auth-seg {
  display: flex;
  background: var(--surface-2);
  border-radius: var(--radius-full);
  padding: 3px;
  gap: 2px;
  margin-bottom: 1.25rem;
}
.auth-seg__btn {
  flex: 1;
  padding: .3125rem .75rem;
  border-radius: var(--radius-full);
  border: none;
  background: transparent;
  color: var(--text-muted);
  font-size: .8125rem;
  font-weight: 500;
  cursor: pointer;
  transition: all var(--transition);
  white-space: nowrap;
}
.auth-seg__btn.active {
  background: var(--primary);
  color: #fff;
  box-shadow: 0 1px 4px rgba(0,0,0,.25);
}
.auth-seg__btn:not(.active):hover { color: var(--text); }
.pairing-code-display {
  font-family: var(--font-mono);
  font-size: 2.25rem;
  font-weight: 700;
  letter-spacing: .15em;
  color: var(--text);
  text-align: center;
  padding: 1rem 1.5rem;
  background: var(--surface-2);
  border: 2px solid var(--border);
  border-radius: var(--radius-md);
  margin: .75rem 0;
  user-select: all;
}
.pairing-instructions {
  font-size: .8125rem;
  color: var(--text-muted);
  line-height: 1.6;
  text-align: center;
  margin-top: .5rem;
}
.pairing-instructions ol {
  text-align: left;
  margin: .375rem 0 0;
  padding-left: 1.25rem;
  display: inline-block;
}
/* ── Step 4 — opções de sessão WAHA ─────────────────────────────── */
.wz-sessao-opts {
  display: flex;
  flex-direction: column;
  gap: .5rem;
}
.wz-sessao-opt {
  display: flex;
  align-items: flex-start;
  gap: .75rem;
  padding: .75rem 1rem;
  border: 2px solid var(--border);
  border-radius: var(--radius-lg);
  cursor: pointer;
  transition: border-color var(--transition), box-shadow var(--transition);
  user-select: none;
}
.wz-sessao-opt:hover { border-color: var(--border-light); }
.wz-sessao-opt.active {
  border-color: var(--primary);
  box-shadow: 0 0 0 2px var(--primary-glow);
}
.wz-opt-radio {
  flex-shrink: 0;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  border: 2px solid var(--border-light);
  margin-top: 2px;
  transition: border-color var(--transition), background var(--transition);
}
.wz-sessao-opt.active .wz-opt-radio {
  border-color: var(--primary);
  background: var(--primary);
}
.wz-opt-body { display: flex; flex-direction: column; gap: .125rem; }
.wz-opt-body strong { font-size: .875rem; font-weight: 600; color: var(--text); }
.wz-opt-desc { font-size: .75rem; color: var(--text-muted); line-height: 1.4; }
.wz-opt-panel { padding-top: .25rem; }
.wz-opt-panel.hidden { display: none; }
.wz-pular-info {
  display: flex;
  align-items: flex-start;
  gap: .625rem;
  padding: .875rem 1rem;
  background: var(--surface-2);
  border-radius: var(--radius-md);
  font-size: .8125rem;
  color: var(--text-muted);
  line-height: 1.5;
}
.wz-pular-info svg { flex-shrink: 0; color: var(--warning); margin-top: 1px; }
.field-hint { font-size: .75rem; color: var(--text-muted); margin-top: .25rem; display: block; }
/* ── Clone config tabs ──────────────────────────────────────────── */
.clone-config-tab-content { padding-top: .75rem; }
/* ── Pulsing dot (connected) ────────────────────────────────────── */
.dot-pulse {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--success);
  display: inline-block;
  animation: pulse-dot 1.4s ease-in-out infinite;
  flex-shrink: 0;
}
@media (max-width: 768px) {
  .clones-grid { grid-template-columns: 1fr; }
  .matrix-cards { grid-template-columns: 1fr; }
}
/* ── Métricas 003-I ─────────────────────────────────────────────── */
@media (max-width: 768px) {
  .m-charts-grid { grid-template-columns: 1fr !important; }
}
/* ── Card variants (ADR 0005) ────────────────────────────────────── */
.card--highlight {
  border-color: var(--primary);
  box-shadow: 0 0 0 1px var(--primary-glow);
}
/* ── Badge variants (ADR 0005) ───────────────────────────────────── */
.badge--outline {
  background: transparent;
  border: 1px solid currentColor;
}
/* ── Tabs underline (ADR 0005) ───────────────────────────────────── */
.tabs--underline {
  display: flex; gap: 0;
  border-bottom: 1px solid var(--border);
  margin-bottom: var(--space-5);
  background: transparent;
  border-radius: 0;
  padding: 0;
  width: auto;
}
.tabs--underline .tab-btn {
  border-radius: 0;
  padding: var(--space-2) var(--space-4);
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  font-size: var(--text-base);
}
.tabs--underline .tab-btn.active {
  background: transparent;
  color: var(--text);
  border-bottom-color: var(--primary);
}
/* ── Alert banner (ADR 0005) ─────────────────────────────────────── */
.alert--danger {
  background: var(--danger-bg);
  border: 1px solid var(--danger);
  border-radius: var(--radius-md);
  padding: var(--space-3) var(--space-4);
  color: var(--danger);
  font-size: var(--text-sm);
  display: flex; align-items: center; gap: var(--space-2);
}
/* ── Empty state action ──────────────────────────────────────────── */
.empty-state__action { margin-top: var(--space-2); }
/* ── Sidebar agrupada (003-D2) ───────────────────────────────────── */
.nav-group { margin-bottom: .125rem; }
.nav-group__header {
  display: flex; align-items: center; justify-content: space-between;
  padding: .3125rem .75rem .3125rem .5rem;
  font-size: .6875rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: .1em;
  color: var(--text-subtle);
  cursor: pointer;
  border-radius: var(--radius-sm);
  user-select: none;
  gap: .375rem;
  transition: color var(--transition);
}
.nav-group__header:hover { color: var(--text-muted); }
.nav-group__chevron {
  flex-shrink: 0;
  transition: transform .15s ease;
  opacity: .5;
}
.nav-group.collapsed .nav-group__chevron { transform: rotate(-90deg); }
.nav-group__items { overflow: hidden; }
.nav-group.collapsed .nav-group__items { display: none; }
.nav-item {
  display: flex; align-items: center; gap: .5rem;
  padding: .3125rem .5rem .3125rem 1.125rem;
  border-radius: var(--radius-sm);
  color: var(--text-muted); font-size: .8125rem; font-weight: 500;
  cursor: pointer; border: none; background: transparent;
  width: 100%; text-align: left;
  transition: background var(--transition), color var(--transition);
  margin-bottom: 1px;
}
.nav-item:hover { background: rgba(255,255,255,.04); color: var(--text); }
.nav-item.active {
  background: rgba(59,130,246,.12);
  color: var(--primary);
  font-weight: 600;
}
.nav-item .nav-dot {
  width: 5px; height: 5px; border-radius: 50%;
  background: currentColor; flex-shrink: 0;
  opacity: 0;
}
.nav-item.active .nav-dot { opacity: 1; }
/* ── KPI Strip (003-D2) ──────────────────────────────────────────── */
.kpi-strip {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  overflow: hidden;
  margin-bottom: 1rem;
}
.kpi-strip__cell {
  padding: .625rem 1rem;
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column; gap: .125rem;
}
.kpi-strip__cell:last-child { border-right: none; }
.kpi-strip__label {
  font-size: .6875rem; font-weight: 700; text-transform: uppercase;
  letter-spacing: .08em; color: var(--text-subtle); white-space: nowrap;
}
.kpi-strip__value {
  font-size: 1.375rem; font-weight: 700;
  font-family: var(--font-mono); line-height: 1.1;
  color: var(--text); white-space: nowrap;
}
.kpi-strip__sub {
  font-size: .7rem; color: var(--text-subtle);
  font-family: var(--font-mono);
  display: flex; align-items: center; gap: .25rem;
  white-space: nowrap;
}
.kpi-strip__delta--up   { color: var(--success); }
.kpi-strip__delta--down { color: var(--danger); }
/* ── Dashboard denso (003-D2) ────────────────────────────────────── */
.dash-dense-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: .75rem;
  margin-bottom: .75rem;
}
.dash-block {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  overflow: hidden;
}
.dash-block__hdr {
  display: flex; align-items: center; justify-content: space-between;
  padding: .5rem .875rem;
  border-bottom: 1px solid var(--border);
  gap: .5rem;
}
.dash-block__title {
  font-size: .6875rem; font-weight: 700; text-transform: uppercase;
  letter-spacing: .08em; color: var(--text-subtle);
}
.dash-block__body { padding: 0; }
/* Tabela densa de sessões WAHA */
.sessions-table { width: 100%; border-collapse: collapse; font-size: .8rem; }
.sessions-table th {
  padding: .3125rem .75rem; text-align: left;
  font-size: .6rem; font-weight: 700; text-transform: uppercase;
  letter-spacing: .06em; color: var(--text-subtle);
  background: rgba(0,0,0,.15); border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
.sessions-table td {
  padding: .4375rem .75rem;
  border-bottom: 1px solid rgba(255,255,255,.04);
  vertical-align: middle;
}
.sessions-table tbody tr:last-child td { border-bottom: none; }
.sessions-table tbody tr:hover td { background: rgba(255,255,255,.02); }
/* Status dot inline */
.s-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; vertical-align: middle; }
.s-dot--on  { background: var(--success); box-shadow: 0 0 5px rgba(16,185,129,.5); }
.s-dot--off { background: var(--text-subtle); }
.s-dot--warn{ background: var(--warning); }
/* Dropdown stub [...] */
.more-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 24px; height: 24px; border-radius: var(--radius-sm);
  border: none; background: transparent;
  color: var(--text-muted); cursor: pointer; font-size: .9rem;
  transition: background var(--transition), color var(--transition);
  letter-spacing: .1em; line-height: 1; flex-shrink: 0;
}
.more-btn:hover { background: var(--surface-2); color: var(--text); }
/* ── Activity feed (003-D2) ──────────────────────────────────────── */
.activity-block {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  overflow: hidden;
  margin-bottom: .75rem;
}
.activity-block__hdr {
  display: flex; align-items: center; justify-content: space-between;
  padding: .5rem .875rem;
  border-bottom: 1px solid var(--border);
  gap: .5rem;
}
.activity-block__title {
  display: flex; align-items: center; gap: .5rem;
  font-size: .6875rem; font-weight: 700; text-transform: uppercase;
  letter-spacing: .08em; color: var(--text-subtle);
}
.activity-feed { padding: 0; }
.activity-row {
  display: grid;
  grid-template-columns: 3.5rem 5.5rem 1fr 6rem 2.25rem 3.5rem;
  align-items: center;
  gap: .25rem;
  padding: .3125rem .875rem;
  border-bottom: 1px solid rgba(255,255,255,.03);
  font-family: var(--font-mono);
  font-size: .75rem;
  color: var(--text-muted);
  transition: background var(--transition);
}
.activity-row:last-child { border-bottom: none; }
.activity-row:hover { background: rgba(255,255,255,.02); }
.activity-row__time  { color: var(--text-subtle); }
.activity-row__phone { color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.activity-row__bot   { color: var(--text); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.activity-row__status--ok  { color: var(--success); }
.activity-row__status--err { color: var(--danger); }
.activity-row__status--run { color: var(--warning); }
.activity-row__lat   { color: var(--text-subtle); text-align: right; }
.activity-empty { padding: 1.5rem; text-align: center; color: var(--text-subtle); font-size: .8125rem; }
/* ── Section block label (mantido do #56) ────────────────────────── */
.section-block-label {
  font-size: var(--text-xs);
  font-weight: 600; text-transform: uppercase;
  letter-spacing: .1em; color: var(--text-subtle);
  margin-bottom: var(--space-3); display: block;
}
/* ── Dash two-col (legado para seções não-dashboard) ─────────────── */
.dash-two-col {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: var(--space-4); margin-bottom: var(--space-4);
}
/* ── kpi-card__value mono (legado) ──────────────────────────────── */
.kpi-card__value { font-family: var(--font-mono); }
.kpi-card--featured { grid-column: span 2; flex-direction: row; align-items: center; gap: var(--space-6); }
.kpi-card--featured .kpi-card__value { font-size: 2.5rem; }
/* Variação badge inline */
.kpi-delta {
  display: inline-flex; align-items: center; gap: 3px;
  font-size: var(--text-xs); font-weight: 600;
  padding: 2px 7px; border-radius: var(--radius-full);
  font-family: var(--font-mono);
}
.kpi-delta--up   { background: var(--success-bg); color: var(--success); }
.kpi-delta--down { background: var(--danger-bg);  color: var(--danger); }
.kpi-delta--neutral { background: var(--surface-3); color: var(--text-muted); }
/* Tabela de leads recentes no dashboard */
.dash-leads-table td:first-child { color: var(--text); font-weight: 500; }
/* ── Metrics grid (legado KPIs em grid para seção execuções) ──────── */
.dash-metrics-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: var(--space-4); margin-bottom: var(--space-6);
}
@media (max-width: 768px) {
  .dash-two-col { grid-template-columns: 1fr; }
  .kpi-card--featured { grid-column: span 1; flex-direction: column; }
  .kpi-card--featured .kpi-card__value { font-size: 1.75rem; }
  .kpi-strip { grid-template-columns: 1fr 1fr; }
  .kpi-strip__cell { border-bottom: 1px solid var(--border); }
  .kpi-strip__cell:nth-child(even) { border-right: none; }
  .kpi-strip__cell:last-child { border-bottom: none; }
  .kpi-strip__cell:nth-last-child(2) { border-bottom: none; }
  .dash-dense-grid { grid-template-columns: 1fr; }
  .activity-row { grid-template-columns: 3.5rem 1fr 5rem 2rem; }
  .activity-row__phone { display: none; }
  .activity-row__lat   { display: none; }
}
@media (max-width: 480px) {
  .kpi-strip { grid-template-columns: 1fr 1fr; }
  .dash-metrics-grid { grid-template-columns: 1fr 1fr; }
}
/* ── Cleanup countdown widget ────────────────────────────────────── */
#cleanup-countdown {
  position: fixed;
  bottom: 1.25rem;
  right: 1.25rem;
  z-index: 400;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: .5rem .875rem;
  display: flex;
  align-items: center;
  gap: .5rem;
  font-size: .75rem;
  color: var(--text-muted);
  box-shadow: var(--shadow-md);
  cursor: pointer;
  transition: border-color var(--transition), box-shadow var(--transition), color var(--transition);
  user-select: none;
}
#cleanup-countdown:hover {
  border-color: var(--border-light);
  box-shadow: var(--shadow-lg);
  color: var(--text);
}
#cleanup-countdown.warning {
  border-color: var(--warning);
  color: var(--warning);
}
#cleanup-countdown.running {
  border-color: var(--primary);
  color: var(--primary);
  animation: dot-pulse 1s ease-in-out infinite;
}
#cleanup-countdown__label { font-variant-numeric: tabular-nums; white-space: nowrap; }
@media (max-width: 640px) {
  #cleanup-countdown #cleanup-countdown__label { display: none; }
  #cleanup-countdown { padding: .5rem .625rem; }
}

/* ── icon() helper ──────────────────────────────────────────────── */
function icon(name, size = 16) {
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name] || ''}</svg>`;
}

/* ── logout() ───────────────────────────────────────────────────── */
// Session-based logout: destrói a sessão no servidor via POST /api/logout,
// depois redireciona para /login.html.
// CSRF token é incluído porque é uma rota mutativa e o usuário está autenticado.
async function logout() {
  try {
    await fetch('/api/logout', {
      method: 'POST',
      credentials: 'include',
      headers: { 'X-CSRF-Token': getCsrfToken() },
    });
  } catch (_) { /* ignora erro de rede — redireciona de qualquer forma */ }
  window.location.href = '/login.html';
}

/* ── botAvatar() ────────────────────────────────────────────────── */
function botAvatar(slug, size = 40) {
  const PALETTE = ['#3b82f6','#8b5cf6','#10b981','#f59e0b','#ef4444','#ec4899','#06b6d4','#f97316'];
  let hash = 0;
  for (let i = 0; i < (slug || '').length; i++) hash = (hash * 31 + slug.charCodeAt(i)) >>> 0;
  const color = PALETTE[hash % PALETTE.length];
  const letter = (slug || '?')[0].toUpperCase();
  const el = document.createElement('div');
  el.className = 'bot-avatar';
  el.style.cssText = `width:${size}px;height:${size}px;background:${color};font-size:${Math.round(size * 0.4)}px;`;
  el.textContent = letter;
  return el;
}

/* ── renderMediaPreview() ───────────────────────────────────────── */
function renderMediaPreview(media) {
  if (!media) {
    const el = document.createElement('div');
    el.style.cssText = 'display:flex;align-items:center;justify-content:center;height:120px;color:var(--text-subtle);';
    el.innerHTML = icon('upload-cloud', 32);
    return el;
  }
  let url = media.url || media.media_url || '';
  const mtype = (media.media_type || '').toLowerCase();
  const fname = media.filename || media.name || url.split('/').pop() || 'arquivo';

  // Proxy insecure URLs
  if (url && url.startsWith('http://')) url = `/media-proxy?u=${encodeURIComponent(url)}`;

  const isVideo = mtype === 'video' || /\.(mp4|webm|mov)(\?|$)/i.test(url);
  const isAudio = mtype === 'audio' || /\.(mp3|ogg|wav|m4a)(\?|$)/i.test(url);
  const isImage = mtype === 'image' || /\.(jpe?g|png|gif|webp|svg)(\?|$)/i.test(url);

  const wrap = document.createElement('div');
  wrap.className = 'media-card__preview';

  if (!url) {
    wrap.innerHTML = `<span style="color:var(--text-subtle)">${icon('upload-cloud', 28)}</span>`;
    return wrap;
  }

  if (isVideo) {
    const v = document.createElement('video');
    v.controls = true;
    v.preload = 'metadata';
    v.src = url;
    v.style.cssText = 'width:100%;max-width:360px;aspect-ratio:16/9;border-radius:var(--radius-md);background:#000;';
    wrap.appendChild(v);
  } else if (isAudio) {
    const a = document.createElement('audio');
    a.controls = true;
    a.src = url;
    a.style.cssText = 'width:100%;padding:.5rem;';
    wrap.appendChild(a);
  } else if (isImage) {
    const img = document.createElement('img');
    img.loading = 'lazy';
    img.src = url;
    img.className = 'media-img';
    img.alt = fname;
    img.addEventListener('click', () => openLightbox(url));
    wrap.appendChild(img);
  } else {
    // file / pdf / etc
    wrap.style.flexDirection = 'column';
    wrap.style.gap = '.5rem';
    wrap.innerHTML = `
      <span style="color:var(--text-muted)">${icon('file-text', 36)}</span>
      <span class="muted" style="max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(fname)}</span>
      <a href="${url}" target="_blank" rel="noopener noreferrer" class="btn btn--sm btn--primary">Abrir</a>`;
  }
  return wrap;
}

/* ── statusBadge() ──────────────────────────────────────────────── */
function statusBadge(wahaStatus) {
  const map = {
    'WORKING':       { cls: 'badge--success', label: 'Conectado' },
    'FAILED':        { cls: 'badge--danger',  label: 'Falhou' },
    'STARTING':      { cls: 'badge--warning', label: 'Iniciando' },
    'STOPPED':       { cls: 'badge--muted',   label: 'Parado' },
    'SCAN_QR_CODE':  { cls: 'badge--info',    label: 'Aguardando QR' },
  };
  const s = map[wahaStatus] || { cls: 'badge--muted', label: wahaStatus || 'Desconhecido' };
  return `<span class="badge badge--dot ${s.cls}">${escapeHtml(s.label)}</span>`;
}

/* ── Helpers ────────────────────────────────────────────────────── */
function escapeHtml(str) {
  return String(str ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function fmtNum(n) {
  if (n == null || isNaN(n)) return '—';
  return Number(n).toLocaleString('pt-BR');
}

function fmtBRL(n) {
  if (n == null || isNaN(n)) return '—';
  return Number(n).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
}

function fmtDate(d) {
  if (!d) return '—';
  return new Intl.DateTimeFormat('pt-BR', {
    timeZone: 'America/Sao_Paulo',
    day: '2-digit', month: '2-digit', year: '2-digit',
    hour: '2-digit', minute: '2-digit',
  }).format(new Date(d));
}

function fmtRelative(d) {
  if (!d) return '—';
  const diff = Date.now() - new Date(d).getTime();
  const m = Math.floor(diff / 60000);
  if (m < 1)  return 'agora';
  if (m < 60) return `há ${m} min`;
  const h = Math.floor(m / 60);
  if (h < 24) return `há ${h} h`;
  const days = Math.floor(h / 24);
  return `há ${days} d`;
}

/** Lê o cookie csrf_token (não-HttpOnly) para injetar em requisições mutativas. */
function getCsrfToken() {
  const match = document.cookie.split(';').map(c => c.trim()).find(c => c.startsWith('csrf_token='));
  return match ? decodeURIComponent(match.split('=').slice(1).join('=')) : '';
}

async function api(path, opts = {}) {
  const method = (opts.method || 'GET').toUpperCase();
  const mutative = !['GET', 'HEAD', 'OPTIONS'].includes(method);
  const extraHeaders = mutative ? { 'X-CSRF-Token': getCsrfToken() } : {};
  const res = await fetch(path, {
    credentials: 'include',
    ...opts,
    headers: { ...(opts.headers || {}), ...extraHeaders },
  });
  if (!res.ok) {
    let msg = `Erro ${res.status}`;
    try { const j = await res.json(); msg = j.error || j.message || msg; } catch (_) {}
    const err = new Error(msg);
    err.status = res.status;
    throw err;
  }
  return res.json();
}

/* ── Toast ─────────────────────────────────────────────────────── */
function toast(msg, type = 'info') {
  const container = document.getElementById('toast-container');
  const el = document.createElement('div');
  el.className = `toast toast--${type}`;
  const iconName = { success: 'check-circle-2', danger: 'alert-triangle', warning: 'alert-triangle', info: 'message-circle' }[type] || 'message-circle';
  el.innerHTML = `${icon(iconName, 16)}<span>${escapeHtml(msg)}</span>`;
  container.appendChild(el);
  setTimeout(() => el.remove(), 4500);
}

/* ── Modal ─────────────────────────────────────────────────────── */
function openModal(html) {
  const backdrop = document.getElementById('modal-backdrop');
  document.getElementById('modal-content').innerHTML = html;
  backdrop.classList.add('open');
}
function closeModal() {

    clearInterval(_activeQRPoll);

  document.getElementById('modal-backdrop').classList.remove('open');
  document.getElementById('modal-content').innerHTML = '';
}
