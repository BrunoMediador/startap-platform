/* ── KPI Strip em linha única ────────────────────────────────────── */
async function renderDashKPIStrip() {
  const wrap = document.getElementById('dash-kpi-strip');
  if (!wrap) return;
  /* Skeleton: 4 células */
  wrap.innerHTML = [0,1,2,3].map(() =>
    `<div class="kpi-strip__cell"><div class="skeleton" style="width:4rem;height:.7rem;margin-bottom:.375rem"></div><div class="skeleton" style="width:3rem;height:1.4rem;margin-bottom:.25rem"></div><div class="skeleton" style="width:2.5rem;height:.7rem"></div></div>`
  ).join('');

  try {
    const [msgStatsRes, leadsRes, usageRes, statusRes] = await Promise.allSettled([
      api('/api/message-stats'),
      api('/api/leads'),
      api('/api/usage/summary?days=7'),
      api('/api/status'),
    ]);

    /* Mensagens 7d + variação */
    const msgs = msgStatsRes.status === 'fulfilled' && Array.isArray(msgStatsRes.value) ? msgStatsRes.value : [];
    const todayKey = new Date().toLocaleDateString('sv-SE', { timeZone: 'America/Sao_Paulo' });
    let msgs7d = 0, msgs7dPrev = 0, msgsToday = 0;
    const cutoff7d = Date.now() - 7 * 86400000;
    const cutoff14d = Date.now() - 14 * 86400000;
    for (const row of msgs) {
      const n = Number(row.total) || 0;
      const t = new Date(row.dia).getTime();
      if (String(row.dia).slice(0,10) === todayKey) msgsToday += n;
      if (t >= cutoff7d) msgs7d += n;
      if (t >= cutoff14d && t < cutoff7d) msgs7dPrev += n;
    }
    const msgs7dDelta = msgs7dPrev > 0 ? Math.round(((msgs7d - msgs7dPrev) / msgs7dPrev) * 100) : null;

    /* Execuções hoje */
    const statusData = statusRes.status === 'fulfilled' ? statusRes.value : {};
    const execs = statusData?.execucoes || [];
    const todayCutoff = new Date(); todayCutoff.setHours(0,0,0,0);
    const execsHjArr = execs.filter(e => new Date(e.created_at || e.startedAt || 0) >= todayCutoff);
    const execsHj = execsHjArr.length;
    const execsHjOk = execsHjArr.filter(e => (e.status || '').toLowerCase() === 'success').length;
    const execRate = execsHj > 0 ? Math.round((execsHjOk / execsHj) * 100) : null;

    /* Leads 24h */
    const leadsArr = leadsRes.status === 'fulfilled' && Array.isArray(leadsRes.value) ? leadsRes.value : [];
    const leads24h = leadsArr.filter(l => {
      const t = new Date(l.criado_em || l.created_at || 0).getTime();
      return Number.isFinite(t) && t >= Date.now() - 86400000;
    }).length;

    /* Custo 7d */
    const usage = usageRes.status === 'fulfilled' ? usageRes.value : null;
    let cost7d = usage?.total_cost ?? usage?.cost ?? null;
    if (cost7d == null && Array.isArray(usage?.rows)) {
      cost7d = usage.rows.reduce((s, r) => s + (Number(r.cost_usd) || 0), 0);
    }

    function deltaHtml(pct) {
      if (pct == null) return '';
      const cls = pct > 0 ? 'kpi-strip__delta--up' : pct < 0 ? 'kpi-strip__delta--down' : '';
      const arrow = pct > 0 ? '▲' : pct < 0 ? '▼' : '→';
      return `<span class="${cls}">${arrow} ${Math.abs(pct)}%</span>`;
    }

    wrap.innerHTML = `
      <div class="kpi-strip__cell">
        <span class="kpi-strip__label">MSG · 7D</span>
        <span class="kpi-strip__value">${fmtNum(msgs7d)}</span>
        <span class="kpi-strip__sub">${msgs7dDelta != null ? deltaHtml(msgs7dDelta) : '<span style="color:var(--text-subtle)">sem dados ant.</span>'}</span>
      </div>
      <div class="kpi-strip__cell">
        <span class="kpi-strip__label">EXEC · HJ</span>
        <span class="kpi-strip__value">${fmtNum(execsHj)}</span>
        <span class="kpi-strip__sub">${execRate != null ? `${execRate}% sucesso` : '—'}</span>
      </div>
      <div class="kpi-strip__cell">
        <span class="kpi-strip__label">LEADS · 24H</span>
        <span class="kpi-strip__value">${fmtNum(leads24h)}</span>
        <span class="kpi-strip__sub"><span style="color:var(--text-subtle)">últimas 24h</span></span>
      </div>
      <div class="kpi-strip__cell">
        <span class="kpi-strip__label">TOKENS · 7D</span>
        <span class="kpi-strip__value">${cost7d != null ? `US$${Number(cost7d).toFixed(2)}` : '—'}</span>
        <span class="kpi-strip__sub"><span style="color:var(--text-subtle)">custo OpenAI</span></span>
      </div>`;
  } catch (err) {
    wrap.innerHTML = `<div class="kpi-strip__cell" style="grid-column:1/-1"><span class="kpi-strip__label" style="color:var(--danger)">${icon('alert-triangle',12)} Erro ao carregar KPIs: ${escapeHtml(err.message)}</span></div>`;
  }
}

  const wrap = document.getElementById('dash-sessions-wrap');
  if (!wrap) return;

        <tbody>${skRow.repeat(3)}</tbody></table>

    </div>`;

  try {
    const data = await api('/api/status');
    const sessions = data?.waha || [];

    if (!sessArr.length) {
      wrap.querySelector('tbody').innerHTML = `<tr><td colspan="5" class="activity-empty">Nenhuma sessão</td></tr>`;

    }

    const rows = sessArr.map(s => {
      const name = escapeHtml(s.name || s.session || s.id || 'Sessão');
      const st = s.status || s.state || '';
      const isOn = st === 'WORKING';
      const isWarn = st === 'STARTING' || st === 'SCAN_QR_CODE';
      const dotCls = isOn ? 's-dot--on' : isWarn ? 's-dot--warn' : 's-dot--off';
      const stLabel = isOn ? 'ON' : isWarn ? 'AGUARD.' : 'OFF';
      const lastSeen = s.updatedAt || s.updated_at || s.lastActivity || null;
      const _meRaw = (typeof s.me === 'object' && s.me !== null) ? (s.me.id || '') : (s.me || '');
      const phonesStr = _fmtPhone(_meRaw) || (_meRaw ? _meRaw.replace(/@.+$/, '') : '—');

      return `<tr>
        <td class="mono" style="font-size:.75rem;color:var(--text)">${name}</td>
        <td><span class="s-dot ${dotCls}"></span> ${statusBadge(st)}</td>
        <td style="font-size:.75rem;color:var(--text-muted)">${lastSeen ? fmtRelative(lastSeen) : '—'}</td>
        <td style="font-size:.75rem;color:var(--text-muted);text-align:center">${escapeHtml(phonesStr)}</td>
        <td><button class="more-btn" title="Ações para ${name}" onclick="navigateTo('bots')" aria-label="Ações">···</button></td>
      </tr>`;
    }).join('');

    wrap.querySelector('tbody').innerHTML = rows;
  } catch (err) {
    wrap.querySelector('tbody').innerHTML = `<tr><td colspan="5" style="padding:.5rem .75rem"><div class="alert--danger" style="font-size:.75rem">${icon('alert-triangle',12)} ${escapeHtml(err.message)}</div></td></tr>`;
  }
}

        <button class="btn btn--sm btn--ghost" onclick="navigateTo('leads')" style="font-size:.7rem;padding:.2rem .5rem">Ver tudo →</button>
      </div>
      <div class="dash-block__body">
        <table class="sessions-table"><thead><tr><th>NOME</th><th>BOT</th><th>HÁ</th></tr></thead>
        <tbody>${skRow.repeat(5)}</tbody></table>
      </div>
    </div>`;

  try {
    const leadsRaw = await api('/api/leads');
    const leads = Array.isArray(leadsRaw) ? leadsRaw : [];
    const cutoff24h = Date.now() - 86400000;
    const today = leads.filter(l => {
      const t = new Date(l.criado_em || l.created_at || 0).getTime();
      return Number.isFinite(t) && t >= cutoff24h;
    });

    if (!today.length) {
      wrap.querySelector('tbody').innerHTML = `<tr><td colspan="3" class="activity-empty">Sem leads nas últimas 24h</td></tr>`;
      return;
    }

    const rows = today.slice(0, 8).map(l => {
      const nome = escapeHtml((l.nome || l.name || '—').slice(0, 22));
      const bot  = escapeHtml((l.bot_slug || l.source || '—').slice(0, 18));
      const hora = escapeHtml(fmtRelative(l.criado_em || l.created_at));
      return `<tr>
        <td style="font-size:.75rem;color:var(--text);font-weight:500">${nome}</td>
        <td class="mono" style="font-size:.7rem;color:var(--text-muted)">${bot}</td>
        <td style="font-size:.7rem;color:var(--text-subtle);white-space:nowrap">${hora}</td>
      </tr>`;
    }).join('');

    wrap.querySelector('tbody').innerHTML = rows;
  } catch (err) {
    wrap.querySelector('tbody').innerHTML = `<tr><td colspan="3" style="padding:.5rem .75rem"><div class="alert--danger" style="font-size:.75rem">${icon('alert-triangle',12)} ${escapeHtml(err.message)}</div></td></tr>`;
  }
}

/* ── Activity feed — ao vivo ─────────────────────────────────────── */
async function renderDashActivity() {
  const wrap = document.getElementById('dash-activity-block');
  if (!wrap) return;

  wrap.innerHTML = `
    <div class="activity-block">
      <div class="activity-block__hdr">
        <span class="activity-block__title">
          <span class="live-dot"></span>
          ATIVIDADE · ao vivo
        </span>
        <button class="btn btn--sm btn--ghost" id="dash-activity-refresh" aria-label="Atualizar atividade" style="font-size:.7rem;padding:.2rem .5rem">${icon('refresh-cw',12)} Atualizar</button>
      </div>
      <div class="activity-feed" id="dash-activity-feed">
        <div class="activity-empty">${icon('activity',20)}<br>Carregando...</div>
      </div>
    </div>`;

  wrap.querySelector('#dash-activity-refresh').addEventListener('click', _loadDashActivity);

  await _loadDashActivity();

  /* Polling a cada 12s */
  if (_dashActivityInterval) clearInterval(_dashActivityInterval);
  _dashActivityInterval = setInterval(_loadDashActivity, 12000);
}

async function _loadDashActivity() {
  const feed = document.getElementById('dash-activity-feed');
  if (!feed) { clearInterval(_dashActivityInterval); _dashActivityInterval = null; return; }

  try {
    const data = await api('/api/status');
    const execs = data?.execucoes || [];

    if (!execs.length) {
      feed.innerHTML = `<div class="activity-empty">Sem execuções recentes</div>`;
      return;
    }

    const rows = execs.filter(e => !String(e.flow_id || e.bot || '').startsWith('worker')).slice(0, 10).map(e => {
      const timeStr = (() => {
        try {
          const d = new Date(e.created_at || e.startedAt || Date.now());
          return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
        } catch { return '??:??'; }
      })();
      const phone = maskPhone(e.telefone || e.phone || e.from || '');
      const bot = escapeHtml((e.flow_id || e.workflow_id || e.flow_name || e.workflowName || '—').slice(0, 20));
      const st = (e.status || '').toLowerCase();
      const isOk  = st === 'success' || (e.finished && !e.stoppedAt);
      const isErr = st === 'error' || (e.stoppedAt && !e.finished);
      const stCls = isOk ? 'activity-row__status--ok' : isErr ? 'activity-row__status--err' : 'activity-row__status--run';
      const stTxt = isOk ? '✓' : isErr ? '✗' : '…';
      const dur = e.duration_ms != null ? fmtDuration(e.duration_ms) : (e.duration != null ? fmtDuration(e.duration) : '—');

      return `<div class="activity-row">
        <span class="activity-row__time">${escapeHtml(timeStr)}</span>
        <span class="activity-row__phone">${escapeHtml(phone)}</span>
        <span class="activity-row__bot">→ ${bot}</span>
        <span class="${stCls}" style="font-size:.8rem">${stTxt}</span>
        <span></span>
        <span class="activity-row__lat">${escapeHtml(dur)}</span>
      </div>`;
    }).join('');

    feed.innerHTML = rows;
  } catch (err) {
    feed.innerHTML = `<div class="activity-empty" style="color:var(--danger)">${icon('alert-triangle',14)} ${escapeHtml(err.message)}</div>`;
  }
}

/* ══════════════════════════════════════════════════════════════════

async function renderSessoes() {
  const wrap = document.getElementById('sessoes-content');
  if (!wrap) return;

  const skRow = `<tr><td colspan="5"><div class="skeleton" style="height:14px;width:100%"></div></td></tr>`;
  wrap.innerHTML = `
    <div class="section-header">
      <div class="section-header__left">
        <h1 class="h1">Sessões WAHA</h1>
        <p class="muted">Gerencie conexões WhatsApp — QR, reiniciar e criar novas sessões</p>
      </div>
      <div class="section-header__right">
        <button class="btn btn--primary" onclick="_sessaoNovaModal()" id="btn-nova-sessao">
          ${icon('plus',14)} Nova sessão
        </button>
      </div>
    </div>
    <div class="table-wrap" id="sessoes-table-wrap">
      <table class="table">
        <thead>
          <tr>
            <th>SESSÃO</th>
            <th>BOT</th>
            <th>STATUS</th>
            <th>ÚLTIMA ATIVIDADE</th>
            <th>WEBHOOK</th>
            <th style="width:2.5rem"></th>
          </tr>
        </thead>
        <tbody id="sessoes-tbody">${skRow.repeat(4)}</tbody>
      </table>
    </div>`;

  await _sessaoLoadTable();
}

async function _sessaoLoadTable() {
  const tbody = document.getElementById('sessoes-tbody');
  if (!tbody) return;
  const skRow = `<tr><td colspan="6"><div class="skeleton" style="height:14px;width:100%"></div></td></tr>`;
  tbody.innerHTML = skRow.repeat(4);

  try {
    const [data, botsRaw, clonesRaw] = await Promise.all([
      api('/api/status'),
      api('/api/bots').catch(() => []),
      api('/api/clones').catch(() => []),
    ]);
    const sessArr = Array.isArray(data?.waha) ? data.waha : Object.values(data?.waha ?? {});
    const bots   = Array.isArray(botsRaw) ? botsRaw : (botsRaw.bots || []);
    const clones = Array.isArray(clonesRaw) ? clonesRaw : (clonesRaw.clones || clonesRaw.data || []);

    if (!sessArr.length) {
      tbody.innerHTML = `<tr><td colspan="6" class="activity-empty">${icon('wifi-off',14)} Nenhuma sessão encontrada</td></tr>`;
      return;
    }

    tbody.innerHTML = sessArr.map(s => {
      const rawName = s.name || s.session || s.id || 'Sessão';
      const name = escapeHtml(rawName);
      const st = s.status || s.state || '';
      const webhook = escapeHtml((s.webhook || '').replace(/^https?:\/\/[^/]+/, '…') || '—');
      const lastAt = s.updatedAt || s.updated_at || s.lastActivity || null;

      // Cruza sessão com bot matriz (slot === session name) ou clone (waha_sessao === session name)
      const botMatch   = bots.find(b => (b.slot || b.slug) === rawName);
      const cloneMatch = !botMatch ? clones.find(c => c.waha_sessao === rawName) : null;
      let botCell;
      if (botMatch) {
        botCell = `<span style="font-size:.8125rem;font-weight:500">${escapeHtml(botMatch.display_name || botMatch.name || rawName)}</span>`;
      } else if (cloneMatch) {
        botCell = `<span style="font-size:.8125rem">${escapeHtml(cloneMatch.display_name || cloneMatch.cliente_nome || rawName)}</span> <span class="badge badge--muted" style="font-size:.7rem">Clone</span>`;
      } else {
        botCell = `<span style="font-size:.8125rem;color:var(--text-subtle)">—</span>`;
      }

      return `<tr>
        <td class="mono" style="font-size:.8125rem;font-weight:500">${name}</td>
        <td>${botCell}</td>
        <td>${statusBadge(st)}</td>
        <td style="font-size:.8125rem;color:var(--text-muted)">${lastAt ? fmtRelative(lastAt) : '—'}</td>
        <td class="mono" style="font-size:.75rem;color:var(--text-subtle);max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${escapeHtml(s.webhook||'')}">${webhook}</td>
        <td>
          <div class="dropdown" style="position:relative">
            <button class="more-btn" title="Ações para ${name}"
              onclick="_sessaoToggleMenu(this,'${name}')" aria-haspopup="true" aria-label="Ações">···</button>
          </div>
        </td>
      </tr>`;
    }).join('');
  } catch (err) {
    tbody.innerHTML = `<tr><td colspan="6"><div class="alert--danger" style="margin:.5rem">${icon('alert-triangle',14)} ${escapeHtml(err.message)}</div></td></tr>`;
  }
}

function _sessaoToggleMenu(btn, sessionName) {
  // Fecha qualquer menu aberto
  document.querySelectorAll('.sessao-menu').forEach(m => m.remove());

  const menu = document.createElement('div');
  menu.className = 'sessao-menu';
  menu.style.cssText = 'position:absolute;right:0;top:100%;z-index:200;min-width:160px;background:var(--bg-2);border:1px solid var(--border);border-radius:var(--radius-md);box-shadow:var(--shadow-lg);padding:.25rem 0';

  const items = [
    { label: `${icon('qr-code',14)} Ver QR / Reconectar`, action: () => _sessaoAbrirQR(sessionName) },
    { label: `${icon('refresh-cw',14)} Reiniciar`,         action: () => _sessaoReiniciar(sessionName) },
    { label: `${icon('power',14)} Derrubar`,               action: () => _sessaoDerrubar(sessionName) },
    { label: `${icon('trash-2',14)} Deletar`,              action: () => _sessaoDeletar(sessionName), danger: true },
  ];

  items.forEach(item => {
    const el = document.createElement('button');
    el.style.cssText = `display:flex;align-items:center;gap:.5rem;width:100%;padding:.4rem .75rem;background:none;border:none;cursor:pointer;font-size:.8125rem;color:${item.danger ? 'var(--danger)' : 'var(--text)'};text-align:left`;
    el.innerHTML = item.label;
    el.addEventListener('mouseenter', () => el.style.background = 'var(--bg-3)');
    el.addEventListener('mouseleave', () => el.style.background = 'none');
    el.addEventListener('click', () => { menu.remove(); item.action(); });
    menu.appendChild(el);
  });

  btn.parentElement.appendChild(menu);

  // Fecha ao clicar fora
  const close = (e) => { if (!menu.contains(e.target) && e.target !== btn) { menu.remove(); document.removeEventListener('click', close); } };
  setTimeout(() => document.addEventListener('click', close), 0);
}

function _sessaoAbrirQR(sessionName) {
  openModal(`
    <div class="modal__header">
      <span class="modal__title">${icon('qr-code',18)} Conectar — <span class="mono">${escapeHtml(sessionName)}</span></span>
      <button class="btn btn--sm btn--ghost" onclick="closeModal()" aria-label="Fechar">✕</button>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:.5rem;padding:1rem 0">
      <div class="auth-seg" role="tablist" aria-label="Método de autenticação">
        <button class="auth-seg__btn active" id="seg-qr-btn" role="tab" aria-selected="true" aria-controls="sessao-tab-qr">
          ${icon('qr-code',13)} QR Code
        </button>
        <button class="auth-seg__btn" id="seg-pair-btn" role="tab" aria-selected="false" aria-controls="sessao-tab-pair">
          ${icon('smartphone',13)} Código de pareamento
        </button>
      </div>

      <div id="sessao-tab-qr" role="tabpanel" style="display:flex;flex-direction:column;align-items:center;gap:.75rem;width:100%">
        <div id="sessao-qr-status"></div>
        <div id="sessao-qr-area" style="width:220px;height:220px;display:flex;align-items:center;justify-content:center">
          <div class="skeleton" style="width:220px;height:220px;border-radius:var(--radius-md)"></div>
        </div>
        <p class="muted" style="font-size:.8125rem;text-align:center">Aponte o WhatsApp para o QR code.<br>A tela atualiza automaticamente.</p>
      </div>

      <div id="sessao-tab-pair" role="tabpanel" style="display:none;flex-direction:column;align-items:center;gap:.75rem;width:100%">
        <div style="width:100%;max-width:300px">
          <label class="muted" style="display:block;margin-bottom:.375rem;font-size:.8125rem">Telefone do cliente (com DDI):</label>
          <input id="pair-phone-input" type="tel" class="input" placeholder="+55 11 99999-9999"
            style="width:100%;font-size:1rem" autocomplete="tel" inputmode="tel" />
        </div>
        <button class="btn btn--primary" id="pair-generate-btn" style="min-width:160px">
          ${icon('key',14)} Gerar código
        </button>
        <div id="pair-result" style="width:100%;max-width:300px;text-align:center"></div>
      </div>
    </div>
  `);

  // ── Aba QR: polling ────────────────────────────────────────────
  pollQR(sessionName, (data) => {
    const area = document.getElementById('sessao-qr-area');
    const statusEl = document.getElementById('sessao-qr-status');
    if (!area) { if (_activeQRPoll) { clearInterval(_activeQRPoll); _activeQRPoll = null; } return; }

    if (data.connected || data.qr === null) {
      if (_activeQRPoll) { clearInterval(_activeQRPoll); _activeQRPoll = null; }
      if (statusEl) statusEl.innerHTML = `<span class="badge badge--dot badge--success">${icon('check-circle-2',14)} Conectado</span>`;
      area.innerHTML = `<div style="display:flex;flex-direction:column;align-items:center;gap:.5rem;color:var(--success)">${icon('check-circle-2',48)}<span style="font-weight:600">WhatsApp conectado!</span></div>`;
      toast(`Sessão ${sessionName} conectada!`, 'success');
      _sessaoLoadTable();
      setTimeout(closeModal, 2500);
      return;
    }

    if (data.qr) {
      if (statusEl) statusEl.innerHTML = `<span class="badge badge--dot badge--info">${icon('qr-code',14)} Aguardando scan</span>`;
      area.innerHTML = `<img src="${escapeHtml(data.qr)}" style="width:220px;height:220px;border-radius:var(--radius-md);image-rendering:pixelated" alt="QR Code">`;
    }
  });

  // ── Toggle de abas ─────────────────────────────────────────────
  document.getElementById('seg-qr-btn')?.addEventListener('click', () => {
    document.getElementById('seg-qr-btn').classList.add('active');
    document.getElementById('seg-qr-btn').setAttribute('aria-selected','true');
    document.getElementById('seg-pair-btn').classList.remove('active');
    document.getElementById('seg-pair-btn').setAttribute('aria-selected','false');
    document.getElementById('sessao-tab-qr').style.display = 'flex';
    document.getElementById('sessao-tab-pair').style.display = 'none';
  });

  document.getElementById('seg-pair-btn')?.addEventListener('click', () => {
    document.getElementById('seg-pair-btn').classList.add('active');
    document.getElementById('seg-pair-btn').setAttribute('aria-selected','true');
    document.getElementById('seg-qr-btn').classList.remove('active');
    document.getElementById('seg-qr-btn').setAttribute('aria-selected','false');
    document.getElementById('sessao-tab-pair').style.display = 'flex';
    document.getElementById('sessao-tab-qr').style.display = 'none';
  });

  // ── Gerar pairing code ─────────────────────────────────────────
  document.getElementById('pair-generate-btn')?.addEventListener('click', () => _gerarPairingCode(sessionName));
  document.getElementById('pair-phone-input')?.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') _gerarPairingCode(sessionName);
  });
}

async function _gerarPairingCode(sessionName) {
  const input = document.getElementById('pair-phone-input');
  const resultEl = document.getElementById('pair-result');
  const btn = document.getElementById('pair-generate-btn');
  if (!input || !resultEl || !btn) return;

  const raw = input.value.trim();
  // Validação básica: pelo menos 10 dígitos
  const digits = raw.replace(/\D/g, '');
  if (digits.length < 10) {
    resultEl.innerHTML = `<p style="color:var(--danger);font-size:.8125rem">${icon('alert-triangle',14)} Telefone inválido — informe DDI + DDD + número (ex: +55 11 99999-9999).</p>`;
    return;
  }

  btn.disabled = true;
  btn.innerHTML = `${icon('loader',14)} Gerando...`;
  resultEl.innerHTML = `<div class="skeleton-block" style="height:64px;border-radius:var(--radius-md)"></div>`;

  try {
    const data = await api(`/api/sessions/${encodeURIComponent(sessionName)}/pairing-code`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ phoneNumber: raw }),
    });

    const codeText = escapeHtml(data.code || '');
    resultEl.innerHTML = `
      <div class="pairing-code-display" id="pair-code-value" title="Clique para selecionar">${codeText}</div>
      <button class="btn btn--sm btn--ghost" id="pair-copy-btn" style="gap:.375rem">
        ${icon('copy',13)} Copiar código
      </button>
      <div class="pairing-instructions">
        No WhatsApp do cliente:<br>
        <ol>
          <li>Configurações → Aparelhos conectados</li>
          <li>Conectar um aparelho</li>
          <li>Conectar com número de telefone</li>
          <li>Digite o código acima</li>
        </ol>
      </div>`;

    document.getElementById('pair-copy-btn')?.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(data.code || '');
        const copyBtn = document.getElementById('pair-copy-btn');
        if (copyBtn) {
          copyBtn.innerHTML = `${icon('check',13)} Copiado!`;
          setTimeout(() => { if (copyBtn) copyBtn.innerHTML = `${icon('copy',13)} Copiar código`; }, 2000);
        }
      } catch (_) {
        toast('Não foi possível copiar. Selecione o código manualmente.', 'info');
      }
    });

  } catch (err) {
    let msg = err.message || 'Erro desconhecido';
    if (err.status === 409) {
      msg = 'Sessão já está conectada ou não está aguardando autenticação.';
    } else if (err.status === 400) {
      msg = 'Telefone inválido — informe DDI + DDD + número (ex: +55 11 99999-9999).';
    }
    resultEl.innerHTML = `
      <p style="color:var(--danger);font-size:.8125rem;text-align:center">
        ${icon('alert-triangle',14)} ${escapeHtml(msg)}
      </p>`;
  } finally {
    // Reabilita após 30s (rate limit WAHA)
    setTimeout(() => {
      if (btn) { btn.disabled = false; btn.innerHTML = `${icon('key',14)} Gerar código`; }
    }, 30000);
    if (btn) btn.innerHTML = `${icon('clock',14)} Aguarde 30s para novo código`;
  }
}

async function _sessaoReiniciar(sessionName) {
  if (!confirm(`Reiniciar sessão "${sessionName}"?`)) return;
  try {
    await api(`/api/sessions/${encodeURIComponent(sessionName)}/restart`, { method: 'POST' });
    toast(`Sessão ${sessionName} reiniciada`, 'success');
    await _sessaoLoadTable();
  } catch (err) {
    toast(`Erro ao reiniciar: ${err.message}`, 'danger');
  }
}

async function _sessaoDerrubar(sessionName) {
  if (!confirm(`Derrubar sessão "${sessionName}"? (pode ser reiniciada depois)`)) return;
  try {
    await api(`/api/sessions/${encodeURIComponent(sessionName)}/stop`, { method: 'POST' });
    toast(`Sessão ${sessionName} derrubada`, 'info');
    await _sessaoLoadTable();
  } catch (err) {
    toast(`Erro ao derrubar: ${err.message}`, 'danger');
  }
}

async function _sessaoDeletar(sessionName) {
  if (!confirm(`DELETAR sessão "${sessionName}"? Esta ação é irreversível.`)) return;
  if (!confirm(`Confirmar: deletar "${sessionName}" permanentemente?`)) return;
  try {
    await api(`/api/sessions/${encodeURIComponent(sessionName)}`, { method: 'DELETE' });
    toast(`Sessão ${sessionName} deletada`, 'success');
    await _sessaoLoadTable();
  } catch (err) {
    toast(`Erro ao deletar: ${err.message}`, 'danger');
  }
}

function _sessaoNovaModal() {
  openModal(`
    <div class="modal__header">
      <span class="modal__title">${icon('plus-circle',18)} Nova sessão WAHA</span>
      <button class="btn btn--sm btn--ghost" onclick="closeModal()" aria-label="Fechar">✕</button>
    </div>
    <div style="padding:.25rem 0 .5rem">
      <label class="label" for="nova-sessao-nome">Nome da sessão</label>
      <input id="nova-sessao-nome" class="input" type="text" placeholder="ex: barbeiro_joao"
        style="margin-top:.4rem;width:100%"
        pattern="[a-zA-Z0-9_-]+" title="Apenas letras, números, _ e -">
      <p class="muted" style="margin-top:.35rem;font-size:.75rem">Apenas letras, números, _ e -. Sem espaços.</p>
    </div>
    <div style="display:flex;justify-content:flex-end;gap:.5rem;margin-top:.75rem">
      <button class="btn btn--ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn--primary" id="btn-criar-sessao-confirm" onclick="_sessaoCriarConfirm()">Criar sessão</button>
    </div>
  `);
  setTimeout(() => {
    const inp = document.getElementById('nova-sessao-nome');
    if (inp) inp.focus();
  }, 50);
}

async function _sessaoCriarConfirm() {
  const inp = document.getElementById('nova-sessao-nome');
  const btn = document.getElementById('btn-criar-sessao-confirm');
  if (!inp) return;
  const name = inp.value.trim();
  if (!name) { inp.focus(); return; }
  if (!/^[a-zA-Z0-9_-]{1,64}$/.test(name)) {
    toast('Nome inválido — use apenas letras, números, _ e -', 'warning');
    inp.focus();
    return;
  }
  if (btn) { btn.disabled = true; btn.textContent = 'Criando…'; }
  try {
    await api('/api/sessions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name }),
    });
    toast(`Sessão "${name}" criada`, 'success');
    closeModal();
    await _sessaoLoadTable();
  } catch (err) {
    toast(`Erro ao criar: ${err.message}`, 'danger');
    if (btn) { btn.disabled = false; btn.textContent = 'Criar sessão'; }
  }
}

async function renderLeadsStub() {
  const wrap = document.getElementById('leads-stub-content');
  if (!wrap) return;
  wrap.innerHTML = `<div class="skeleton" style="height:220px;border-radius:var(--radius-lg)"></div>`;
  try {
    const leadsRaw = await api('/api/leads');
    const leads = Array.isArray(leadsRaw) ? leadsRaw : [];
    if (!leads.length) {
      wrap.innerHTML = `<div class="empty-state">${icon('inbox',36)}<div class="empty-state__title">Nenhum lead</div></div>`;
      return;
    }
    const rows = leads.slice(0, 20).map(l => {
      const nome = escapeHtml(l.nome || l.name || '—');
      const tel  = escapeHtml(l.telefone || l.phone || '—');
      const bot  = escapeHtml(l.slot || l.bot_slug || l.source || '—');
      const hora = fmtDate(l.criado_em || l.created_at);
      return `<tr><td style="font-weight:500">${nome}</td><td class="mono">${tel}</td><td class="muted">${bot}</td><td class="muted">${escapeHtml(hora)}</td></tr>`;
    }).join('');
    const truncMsg = leads.length > 20 ? `<p class="muted" style="font-size:.8125rem;margin-bottom:.5rem">Exibindo ${Math.min(20, leads.length)} de ${fmtNum(leads.length)} leads</p>` : '';
    wrap.innerHTML = `<p class="muted" style="margin-bottom:.75rem">${fmtNum(leads.length)} lead${leads.length !== 1 ? 's' : ''} total</p>${truncMsg}<div class="table-wrap"><table class="table"><thead><tr><th>Nome</th><th>Telefone</th><th>Bot</th><th>Criado em</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  } catch (err) {
    wrap.innerHTML = `<div class="alert--danger">${icon('alert-triangle',14)} ${escapeHtml(err.message)}</div>`;
  }
}

function _renderGroupSummary(el, bots, allClones, { kind }) {
  if (!el) return;
  const items = [];
  if (kind === 'clones') {
    const total = allClones.length;
    const conectados = allClones.filter(c => (c.status || '').toLowerCase() === 'conectado').length;
    const pendentes = total - conectados;
    items.push({ val: fmtNum(total), label: total === 1 ? 'clone' : 'clones' });
    if (total) {
      items.push({ val: fmtNum(conectados), label: 'conectados' });
      if (pendentes) items.push({ val: fmtNum(pendentes), label: 'pendentes' });
    }
  } else {
    const totalMsgs = bots.reduce((s, b) => s + (Number(b.messages_today) || 0), 0);
    const totalLeads = bots.reduce((s, b) => s + (Number(b.leads_count) || 0), 0);
    items.push({ val: fmtNum(bots.length), label: bots.length === 1 ? 'bot' : 'bots' });
    items.push({ val: fmtNum(totalMsgs), label: 'msgs hoje' });
    items.push({ val: fmtNum(totalLeads), label: totalLeads === 1 ? 'lead' : 'leads' });
    if (kind === 'matriz') {
      const totalClones = allClones.filter(c => MATRIZ_SLOTS.includes(c.matriz_slot)).length;
      items.push({ val: fmtNum(totalClones), label: totalClones === 1 ? 'clone gerado' : 'clones gerados' });
    }
  }
  el.innerHTML = items.map((it, i) => `
    ${i > 0 ? '<span class="bots-group-summary__sep" aria-hidden="true"></span>' : ''}
    <span class="bots-group-summary__item">
      <span class="bots-group-summary__val">${it.val}</span>
      <span>${it.label}</span>
    </span>`).join('');
}

function _botDotClass(status) {
  if (!status) return 'bot-card__dot--muted';
  const s = status.toUpperCase();
  if (s === 'WORKING')   return 'bot-card__dot--working';
  if (s === 'FAILED')    return 'bot-card__dot--failed';
  if (s === 'STARTING')  return 'bot-card__dot--warning';
  return 'bot-card__dot--muted';
}

function _fmtPhone(raw) {
  if (!raw) return null;
  // Quando raw é objeto WAHA {id, pushName}, extrai o campo id
  if (typeof raw === 'object') raw = raw.id || raw.pushName || '';
  if (!raw) return null;
  // Remove @c.us or @s.whatsapp.net suffix (WAHA format)
  const digits = String(raw).replace(/@.+$/, '').replace(/\D/g, '');
  if (digits.length < 10) return null;
  // Brazilian: +55 (XX) XXXXX-XXXX
  if (digits.startsWith('55') && digits.length >= 12) {
    const ddd  = digits.slice(2, 4);
    const rest = digits.slice(4);
    const part1 = rest.slice(0, rest.length - 4);
    const part2 = rest.slice(-4);
    return `+55 (${ddd}) ${part1}-${part2}`;
  }
  return `+${digits}`;
}

async function loadBotTab(slot, tab, el, bot) {
  el.innerHTML = `<div style="padding:1rem 0"><div class="spinner"></div></div>`;

  if (tab === 'overview') {
    await renderBotOverview(slot, el, bot);
  } else if (tab === 'prompt') {
    await renderBotPrompt(slot, el);
  } else if (tab === 'courses') {
    await renderBotCourses(slot, el);
  } else if (tab === 'media') {
    await renderBotMedia(slot, el);
  } else if (tab === 'routing') {
    // aba removida em 003-F: roteamento virou seção global
    el.innerHTML = `<div class="empty-state" style="padding:2rem 0">
      ${icon('git-branch',32)}
      <div class="empty-state__title">Roteamento centralizado</div>
      <p class="empty-state__text">Todos os telefones são gerenciados numa tabela única.<br>Use a seção global de Roteamento para adicionar, editar ou remover acessos.</p>
      <button class="btn btn--primary btn--sm empty-state__action" onclick="navigateTo('roteamento')">${icon('sliders',14)} Ir para Roteamento</button>
    </div>`;
  } else if (tab === 'config-ia') {
    await renderBotConfigIA(slot, el);
  } else if (tab === 'horarios') {
    // Aba "Horários" da matriz — lê de bot_config.horarios_funcionamento.
    // O endpoint GET /api/bots/:slot retorna o campo; PUT aceita o update.
    el.innerHTML = `<div style="padding:1rem 0"><div class="spinner"></div></div>`;
    try {
      const fresh = await api(`/api/bots/${encodeURIComponent(slot)}`);
      _renderHorariosTab({
        container: el,
        entity: fresh,
        savePath: `/api/bots/${encodeURIComponent(slot)}`,
        method: 'PUT',
        onSaved: (updated) => Object.assign(bot, updated),
      });
    } catch (err) {
      el.innerHTML = `<p class="muted" style="color:var(--danger)">${icon('alert-triangle',14)} Falha ao carregar: ${escapeHtml(err.message)}</p>`;
    }
  } else if (tab === 'servicos') {
    // Aba "Serviços" da matriz — lê de bot_config.servicos.
    el.innerHTML = `<div style="padding:1rem 0"><div class="spinner"></div></div>`;
    try {
      const fresh = await api(`/api/bots/${encodeURIComponent(slot)}`);
      _renderServicosTab({
        container: el,
        entity: fresh,
        savePath: `/api/bots/${encodeURIComponent(slot)}`,
        method: 'PUT',
        onSaved: (updated) => Object.assign(bot, updated),
      });
    } catch (err) {
      el.innerHTML = `<p class="muted" style="color:var(--danger)">${icon('alert-triangle',14)} Falha ao carregar: ${escapeHtml(err.message)}</p>`;
    }
  } else if (tab === 'gcal') {
    /* ── Google Calendar da matriz — usa helper _renderGcalTab ── */
    el.innerHTML = '';
    _renderGcalTab({
      baseUrl: `/api/bots/${encodeURIComponent(slot)}`,
      entityLabel: 'matriz',
      container: el,
      reloadFn: null,
    });
  } else if (tab === 'pausa') {
    /* ── Palavras-chave de pausa/retomada do bot ── */
    await _renderPauseTab(el, slot);
  }
}

async function renderBotPrompt(slot, el) {
  _promptDirty = false; // reset ao (re)renderizar a aba
  try {
    const data = await api(`/api/bots/${slot}/prompt`);
    const promptText = data?.prompt || data?.content || data?.system_prompt || '';
    el.innerHTML = `
      <div class="field">
        <label for="prompt-ta">Prompt do sistema</label>
        <textarea id="prompt-ta" rows="16" placeholder="Escreva o prompt de sistema do bot aqui...">${escapeHtml(promptText)}</textarea>
        <div class="char-count"><span id="prompt-count">${promptText.length}</span> caracteres</div>
      </div>
      <div style="display:flex;gap:.5rem;margin-top:.75rem;flex-wrap:wrap">
        <button class="btn btn--primary" id="btn-save-prompt">${icon('check-circle-2',14)} Salvar prompt</button>
        <button class="btn btn--ghost" id="btn-prompt-history">${icon('clock',14)} Historico</button>
      </div>`;

    const ta = el.querySelector('#prompt-ta');
    const count = el.querySelector('#prompt-count');
    ta.addEventListener('input', () => {
      count.textContent = ta.value.length;
      _promptDirty = true;
    });

    el.querySelector('#btn-save-prompt').addEventListener('click', async () => {
      const btn = el.querySelector('#btn-save-prompt');
      btn.disabled = true;
      try {
        await api(`/api/bots/${slot}/prompt`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ prompt: ta.value }) });
        _promptDirty = false;
        toast('Prompt salvo com sucesso!', 'success');
      } catch (err) {
        toast('Erro ao salvar prompt: ' + err.message, 'danger');
      } finally {
        btn.disabled = false;
      }
    });

    el.querySelector('#btn-prompt-history').addEventListener('click', () => openPromptHistoryModal(slot, ta.value));

  } catch (err) {
    el.innerHTML = `<p class="muted">${icon('alert-triangle',14)} Erro ao carregar prompt: ${escapeHtml(err.message)}</p><button class="btn btn--sm" onclick="loadBotTab('${escapeHtml(slot)}','prompt',this.parentElement)">${icon('refresh-cw',14)} Tentar novamente</button>`;
  }
}

              <td style="padding:.4rem .5rem"><span class="badge">v${v.version}</span></td>
              <td style="padding:.4rem .5rem">${escapeHtml(v.edited_by || '-')}</td>
              <td style="padding:.4rem .5rem;white-space:nowrap">${fmtDate(v.edited_at)}</td>

async function rollbackPromptVersion(slot, version) {
  if (!window.confirm(`Restaurar v${version}? O prompt atual sera salvo como nova versao antes do rollback.`)) return;
  try {
    const result = await api(`/api/bots/${slot}/prompt/rollback/${version}`, { method: 'POST' });
    closeModal();
    toast(`Rollback concluido! Prompt restaurado para v${result.restored_version} (nova entrada: v${result.new_version}).`, 'success');
    // Recarrega aba prompt
    const el = document.querySelector('.tab-panel[data-tab="prompt"]') ||
                document.querySelector('[data-active-tab="prompt"]') ||
                document.getElementById('bot-tab-content');
    if (el) await renderBotPrompt(slot, el);
  } catch (err) {
    toast('Erro no rollback: ' + err.message, 'danger');
  }
}

/* ── Carrega /api/models com cache de sessão ─────────────────────────── */
async function loadModels() {
  if (_modelsCache) return _modelsCache;
  try {
    const data = await api('/api/models');
    _modelsCache = Array.isArray(data) ? data : [];
  } catch (_e) {
    _modelsCache = [];
  }
  return _modelsCache;
}

/* ── Formata label de modelo com custo ──────────────────────────────── */
function modelOptionLabel(m) {
  if (!m.in && !m.out) return m.label || m.id;
  const inCost  = m.in  != null ? `$${m.in}`  : '?';
  const outCost = m.out != null ? `$${m.out}` : '?';
  const est = m.isEstimate ? ' estimado' : '';
  return `${m.label || m.id} (${inCost}/${outCost}${est})`;
}

async function renderBotConfigIA(slot, el) {
  /* ── dados iniciais ──────────────────────────────────────── */
  let botData = null;
  let _dirty = false;
  _configIaDirty = false; // reset ao (re)renderizar a aba

  const MODELS_BY_PROVIDER = {
    openai:    ['gpt-5.4', 'gpt-4o', 'gpt-4o-mini'],
    anthropic: ['claude-opus-4-7', 'claude-sonnet-4-6', 'claude-haiku-4-5-20251001'],
    deepseek:  ['deepseek-chat', 'deepseek-reasoner'],
    groq:      ['llama-3.3-70b-versatile', 'mixtral-8x7b-32768'],
  };

  function markDirty() { _dirty = true; _configIaDirty = true; }

  /* ── render skeleton ─────────────────────────────────────── */
  el.innerHTML = `<div style="padding:1rem 0"><div class="spinner"></div></div>`;

  let apiModels = [];
  try {
    [botData, apiModels] = await Promise.all([
      api(`/api/bots/${slot}`),
      loadModels(),
    ]);
  } catch (err) {
    el.innerHTML = `<p class="muted">${icon('alert-triangle',14)} Erro ao carregar configurações: ${escapeHtml(err.message)}</p>
      <button class="btn btn--sm" onclick="renderBotConfigIA('${escapeHtml(slot)}',this.parentElement)">${icon('refresh-cw',14)} Tentar novamente</button>`;
    return;
  }

  const currentProvider = botData.provider || 'openai';
  const currentModel    = botData.model || '';
  const currentTemp     = botData.temperature !== undefined ? botData.temperature : 0.5;

  /* ── constrói opções de modelo ───────────────────────────── */
  function buildModelOptions(provider, selectedModel) {
    // Se /api/models retornou dados, usa eles filtrados por provider
    const fromApi = apiModels.filter(m => !m.provider || m.provider === provider);
    if (fromApi.length > 0) {
      const knownIds = fromApi.map(m => m.id);
      const isCustom = selectedModel && !knownIds.includes(selectedModel);
      let html = fromApi.map(m => {
        const lbl = modelOptionLabel(m);
        return `<option value="${escapeHtml(m.id)}" ${m.id === selectedModel ? 'selected' : ''}>${escapeHtml(lbl)}</option>`;
      }).join('');
      html += `<option value="__custom__" ${isCustom ? 'selected' : ''}>Outro (personalizado)...</option>`;
      return html;
    }
    // fallback: lista estática
    const known = MODELS_BY_PROVIDER[provider] || [];
    const isCustom = selectedModel && !known.includes(selectedModel);
    let html = known.map(m => `<option value="${escapeHtml(m)}" ${m === selectedModel ? 'selected' : ''}>${escapeHtml(m)}</option>`).join('');
    html += `<option value="__custom__" ${isCustom ? 'selected' : ''}>Outro (personalizado)...</option>`;
    return html;
  }

  function isKnownModel(provider, model) {
    const fromApi = apiModels.filter(m => !m.provider || m.provider === provider).map(m => m.id);
    if (fromApi.length > 0) return fromApi.includes(model);
    return (MODELS_BY_PROVIDER[provider] || []).includes(model);
  }

  /* ── markup ──────────────────────────────────────────────── */
  el.innerHTML = `
    <div class="config-ia-wrap">

      <!-- Bloco: Modelo e Parâmetros -->
      <div>
        <div class="label" style="margin-bottom:var(--space-3)">Modelo e parâmetros</div>
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:var(--space-4);margin-bottom:var(--space-4)">
          <div class="field">
            <label for="cia-provider">Provider</label>
            <select id="cia-provider">
              <option value="openai"    ${currentProvider === 'openai'    ? 'selected' : ''}>OpenAI</option>
              <option value="anthropic" ${currentProvider === 'anthropic' ? 'selected' : ''}>Anthropic</option>
              <option value="deepseek"  ${currentProvider === 'deepseek'  ? 'selected' : ''}>DeepSeek</option>
              <option value="groq"      ${currentProvider === 'groq'      ? 'selected' : ''}>Groq</option>
            </select>
          </div>
          <div class="field">
            <label for="cia-model">Modelo IA</label>
            <select id="cia-model">${buildModelOptions(currentProvider, currentModel)}</select>
          </div>
        </div>
        <div class="config-ia-model-hint" style="display:flex;align-items:flex-start;gap:.375rem;margin-bottom:var(--space-4);padding:.5rem .75rem;background:var(--surface-2);border-radius:var(--radius-md);font-size:.8125rem;color:var(--text-muted)">
          ${icon('info', 13)}
          <span>Modelo mais inteligente = melhor resposta, mas custo maior. O custo exibido é por 1M tokens (entrada/saída).</span>
        </div>
        <div id="cia-custom-model-wrap" style="display:${isKnownModel(currentProvider,currentModel)?'none':'block'};margin-bottom:var(--space-4)">
          <div class="field">
            <label for="cia-model-custom">Modelo personalizado</label>
            <input id="cia-model-custom" type="text" placeholder="ex: gpt-4o-2024-11-20"
              value="${escapeHtml(isKnownModel(currentProvider,currentModel) ? '' : currentModel)}" />
          </div>
        </div>
        <div class="field" style="max-width:360px;margin-bottom:var(--space-4)">
          <label for="cia-temp">Temperatura — <span id="cia-temp-val">${currentTemp}</span></label>
          <input id="cia-temp" type="range" min="0" max="2" step="0.1" value="${currentTemp}" style="width:100%;accent-color:var(--primary)" />
          <div style="display:flex;justify-content:space-between">
            <span class="subtle">0 (determinístico)</span>
            <span class="subtle">2 (criativo)</span>
          </div>
        </div>
        <div style="display:flex;gap:var(--space-3);flex-wrap:wrap">
          <button class="btn btn--primary" id="btn-save-config-ia">${icon('check-circle-2',14)} Salvar configuração</button>
        </div>
        <p class="subtle" style="margin-top:var(--space-3)">Mudanças de modelo e temperatura aplicam na próxima mensagem do bot (cache de 2s)</p>
      </div>
    </div>`;

  /* ── refs ────────────────────────────────────────────────── */
  const selProvider    = el.querySelector('#cia-provider');
  const selModel       = el.querySelector('#cia-model');
  const customWrap     = el.querySelector('#cia-custom-model-wrap');
  const inputCustom    = el.querySelector('#cia-model-custom');
  const rangeTemp      = el.querySelector('#cia-temp');
  const spanTemp       = el.querySelector('#cia-temp-val');
  const btnSaveConfig  = el.querySelector('#btn-save-config-ia');

  /* ── interações ──────────────────────────────────────────── */
  rangeTemp.addEventListener('input', () => {
    spanTemp.textContent = rangeTemp.value;
    markDirty();
  });

  selProvider.addEventListener('change', () => {
    const prov = selProvider.value;
    selModel.innerHTML = buildModelOptions(prov, '');
    customWrap.style.display = 'none';
    inputCustom.value = '';
    markDirty();
  });

  selModel.addEventListener('change', () => {
    const isCustom = selModel.value === '__custom__';
    customWrap.style.display = isCustom ? 'block' : 'none';
    if (!isCustom) inputCustom.value = '';
    markDirty();
  });

  inputCustom.addEventListener('input', markDirty);

  /* ── helpers ─────────────────────────────────────────────── */
  function resolvedModel() {
    return selModel.value === '__custom__' ? inputCustom.value.trim() : selModel.value;
  }

  /* ── salvar configuração ─────────────────────────────────── */
  btnSaveConfig.addEventListener('click', async () => {
    const model = resolvedModel();
    if (!model) { toast('Selecione ou informe um modelo.', 'danger'); return; }
    btnSaveConfig.disabled = true;
    const provider = selProvider.value;
    const temperature = Number(rangeTemp.value);
    try {
      // Tenta endpoint dedicado primeiro; cai no PUT geral se 404/405
      let saved = false;
      try {
        await api(`/api/bots/${slot}/model`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ model }),
        });
        saved = true;
      } catch (e) {
        if (e.status !== 404 && e.status !== 405) throw e;
      }
      if (!saved) {
        await api(`/api/bots/${slot}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ provider, model, temperature }),
        });
      } else {
        // Salva provider e temperatura separadamente via PUT geral
        await api(`/api/bots/${slot}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ provider, temperature }),
        });
      }
      _dirty = false; _configIaDirty = false;
      const modelLabel = escapeHtml(model);
      toast(`Modelo atualizado para ${modelLabel}. Próximas mensagens já vão usar.`, 'success');
    } catch (err) {
      toast('Erro ao salvar configuração: ' + escapeHtml(err.message), 'danger');
    } finally {
      btnSaveConfig.disabled = false;
    }
  });

}

// ── helpers de tipo de mídia ─────────────────────────────────────────────
function mediaMimeToType(mime) {
  if (!mime) return 'other';
  // Aceita tanto mime completo ("image/png") quanto a forma curta que o banco guarda ("image").
  const m = String(mime).toLowerCase();
  if (m === 'image' || m.startsWith('image/')) return 'image';
  if (m === 'video' || m.startsWith('video/')) return 'video';
  if (m === 'audio' || m.startsWith('audio/')) return 'audio';
  if (m === 'doc' || m === 'document' ||
      m === 'application/pdf' || m === 'application/msword' ||
      m.includes('wordprocessingml') || m === 'text/plain') return 'doc';
  return 'other';
}

function mediaTypeLabel(t) {
  return { image: 'Imagem', video: 'Vídeo', audio: 'Áudio', doc: 'Doc', other: 'Outro' }[t] || 'Outro';
}

function mediaThumbHtml(m) {
  const t = mediaMimeToType(m.media_type || m.mime_type);
  if (t === 'image' && m.url) {
    return `<img src="${escapeHtml(m.url)}" class="media-thumb" alt="" loading="lazy" onerror="this.style.display='none'">`;
  }
  const icons = { video: 'film', audio: 'music', doc: 'file-text', other: 'file' };
  return `<div class="media-thumb-icon">${icon(icons[t] || 'file', 20)}</div>`;
}

// ── renderBotMedia — grid de cards com player inline + edição in-place ──
async function renderBotMedia(slot, el) {
  try {
    const [medias, coursesRaw] = await Promise.all([
      api(`/api/bots/${slot}/media`),
      api(`/api/bots/${slot}/courses`).catch(() => []),
    ]);
    const arr = Array.isArray(medias) ? medias : (medias.media || medias.items || []);
    const coursesArr = Array.isArray(coursesRaw) ? coursesRaw : (coursesRaw.courses || coursesRaw.items || []);

    const byType = arr.reduce((acc, m) => {
      const t = mediaMimeToType(m.media_type || m.mime_type);
      acc[t] = (acc[t] || 0) + 1;
      return acc;
    }, {});
    const typeChips = ['video','image','audio','doc','other']
      .filter(t => byType[t])
      .map(t => `<span class="media-type-badge media-type-badge--${t}">${byType[t]} ${mediaTypeLabel(t).toLowerCase()}${byType[t] !== 1 ? 's' : ''}</span>`)
      .join('');

    const header = `<div style="display:flex;justify-content:space-between;align-items:center;gap:.75rem;margin-bottom:1rem;flex-wrap:wrap">
      <div class="media-card-v2__type-summary">
        <span style="font-size:.9375rem;font-weight:600;color:var(--text)">${arr.length} mídia${arr.length !== 1 ? 's' : ''}</span>
        ${typeChips}
      </div>
      <button class="btn btn--primary btn--sm" id="btn-add-media">${icon('plus',13)} Adicionar mídia</button>
    </div>`;

    if (!arr.length) {
      el.innerHTML = `${header}<div class="empty-state">${icon('inbox',36)}<div class="empty-state__title">Sem mídias</div><p class="empty-state__text">Nenhuma mídia cadastrada para este bot. Clique em <b>Adicionar mídia</b> para subir vídeo, imagem, áudio ou documento.</p></div>`;
      el.querySelector('#btn-add-media').addEventListener('click', () => openAddMediaModal(slot, el));
      return;
    }

    const grid = document.createElement('div');
    grid.className = 'media-grid-v2';
    el.innerHTML = header;
    el.appendChild(grid);

    arr.forEach((m, idx) => {
      grid.appendChild(_buildMediaCardV2(slot, m, idx, arr, coursesArr, el));
    });

    el.querySelector('#btn-add-media').addEventListener('click', () => openAddMediaModal(slot, el));
  } catch (err) {
    el.innerHTML = `<p class="muted">${icon('alert-triangle',14)} Erro ao carregar mídias: ${escapeHtml(err.message)}</p><button class="btn btn--sm" onclick="renderBotMedia('${escapeHtml(slot)}',this.parentElement)">${icon('refresh-cw',14)} Tentar novamente</button>`;
  }
}

function _buildMediaCardV2(slot, m, idx, arr, coursesArr, parentEl) {
  const card = document.createElement('div');
  card.className = 'media-card-v2';
  card.dataset.id = m.id;

  const t = mediaMimeToType(m.media_type || m.mime_type);
  const isVideo = t === 'video';
  const isAudio = t === 'audio';
  const isImage = t === 'image';
  const name = m.title || m.nome || m.filename || m.original_name
    || (m.url ? m.url.split('/').pop().split('?')[0] : '')
    || `Mídia #${m.position_order ?? m.position ?? m.id}`;
  const ctx = m.context || '';
  const cap = m.caption || '';
  const courseSlug = m.course_slug || null;
  const isIntro = m.is_course_intro === true || m.is_course_intro === 1;

  let url = m.url || m.media_url || '';
  if (url && url.startsWith('http://')) url = `/media-proxy?u=${encodeURIComponent(url)}`;

  // Preview com player real
  const preview = document.createElement('div');
  preview.className = 'media-card-v2__preview';

  if (isVideo && url) {
    const v = document.createElement('video');
    v.controls = true;
    v.preload = 'metadata';
    v.playsInline = true;
    // Inicia muted para permitir seek de thumbnail sem interação do usuário.
    // Restaura som antes do play real (assim o usuário ouve o vídeo normalmente).
    v.muted = true;
    v.src = url;
    // Força decode do primeiro frame após carregar metadata — sem isso vários browsers
    // (Chrome em alguns casos, Firefox sempre) mantêm o player preto até o user dar play.
    let seeked = false;
    v.addEventListener('loadedmetadata', () => {
      if (seeked) return;
      seeked = true;
      try { v.currentTime = Math.min(0.1, (v.duration || 1) / 2); } catch (_) {}
    }, { once: true });
    // Ao usuário dar play, desmuta para que o vídeo reproduza com som.
    v.addEventListener('play', () => { v.muted = false; }, { once: true });
    v.addEventListener('error', () => {
      preview.innerHTML = `<div style="color:var(--text-muted);font-size:.75rem;text-align:center;padding:1rem">${icon('alert-triangle', 24)}<br>Não consegui carregar o vídeo</div>`;
    }, { once: true });
    preview.appendChild(v);
  } else if (isAudio && url) {
    preview.classList.add('media-card-v2__preview--audio');
    preview.innerHTML = `<div class="media-card-v2__preview--audio-label">${icon('mic', 18)} Áudio</div>`;
    const a = document.createElement('audio');
    a.controls = true; a.preload = 'metadata'; a.src = url;
    preview.appendChild(a);
  } else if (isImage && url) {
    const img = document.createElement('img');
    img.loading = 'lazy';
    img.src = url; img.alt = name;
    img.addEventListener('click', () => { try { openLightbox(url); } catch (_) {} });
    preview.appendChild(img);
  } else {
    preview.classList.add('media-card-v2__preview--icon');
    const iconName = { video: 'film', audio: 'mic', doc: 'file-text', other: 'file-text' }[t] || 'file-text';
    preview.innerHTML = `${icon(iconName, 36)}<span class="muted">${escapeHtml(name)}</span>`;
  }
  preview.insertAdjacentHTML('beforeend', `<span class="media-card-v2__pos-badge">#${(m.position_order ?? idx) || idx + 1}</span>`);
  card.appendChild(preview);

  // Body com info
  const body = document.createElement('div');
  body.className = 'media-card-v2__body';
  const chips = [`<span class="media-type-badge media-type-badge--${t}">${mediaTypeLabel(t)}</span>`];
  if (courseSlug) {
    chips.push(`<span class="course-slug-badge${isIntro ? ' course-slug-badge--warning' : ''}">${isIntro ? icon('star', 10) + ' ' : ''}${escapeHtml(courseSlug)}</span>`);
  }
  body.innerHTML = `
    <div class="media-card-v2__title" title="${escapeHtml(name)}">${escapeHtml(name)}</div>
    <div class="media-card-v2__chips">${chips.join('')}</div>
    <div class="media-card-v2__meta">
      <div class="media-card-v2__meta-row">
        <span class="media-card-v2__meta-label">Contexto IA</span>
        <span class="media-card-v2__meta-val${!ctx ? ' media-card-v2__meta-val--empty' : ''}" title="${escapeHtml(ctx)}">${ctx ? escapeHtml(ctx) : 'Sem contexto'}</span>
      </div>
      <div class="media-card-v2__meta-row">
        <span class="media-card-v2__meta-label">Legenda</span>
        <span class="media-card-v2__meta-val${!cap ? ' media-card-v2__meta-val--empty' : ''}" title="${escapeHtml(cap)}">${cap ? escapeHtml(cap) : 'Sem legenda'}</span>
      </div>
    </div>`;
  card.appendChild(body);

  // Footer com ações diretas (sem dropdown)
  const footer = document.createElement('div');
  footer.className = 'media-card-v2__footer';

  const editBtn = document.createElement('button');
  editBtn.className = 'btn btn--sm';
  editBtn.innerHTML = `${icon('pencil', 13)} Editar`;
  editBtn.setAttribute('aria-label', `Editar ${name}`);
  editBtn.addEventListener('click', () => _toggleMediaCardEdit(card, slot, m, parentEl, coursesArr, editBtn));
  footer.appendChild(editBtn);

  const upBtn = document.createElement('button');
  upBtn.className = 'btn btn--sm btn--ghost btn--icon';
  upBtn.disabled = idx === 0;
  upBtn.setAttribute('aria-label', 'Mover para cima');
  upBtn.title = 'Mover para cima';
  upBtn.innerHTML = icon('chevron-up', 14);
  upBtn.addEventListener('click', () => _moveMediaCard(slot, arr, idx, -1, parentEl));
  footer.appendChild(upBtn);

  const downBtn = document.createElement('button');
  downBtn.className = 'btn btn--sm btn--ghost btn--icon';
  downBtn.disabled = idx === arr.length - 1;
  downBtn.setAttribute('aria-label', 'Mover para baixo');
  downBtn.title = 'Mover para baixo';
  downBtn.innerHTML = icon('chevron-down', 14);
  downBtn.addEventListener('click', () => _moveMediaCard(slot, arr, idx, +1, parentEl));
  footer.appendChild(downBtn);

  footer.insertAdjacentHTML('beforeend', `<span class="media-card-v2__footer-spacer"></span>`);

  const delBtn = document.createElement('button');
  delBtn.className = 'btn btn--sm btn--ghost btn--icon';
  delBtn.style.color = 'var(--danger)';
  delBtn.setAttribute('aria-label', `Excluir ${name}`);
  delBtn.title = 'Excluir';
  delBtn.innerHTML = icon('trash-2', 14);
  delBtn.addEventListener('click', async () => {
    if (!confirm(`Excluir "${name}"? Esta ação não pode ser desfeita.`)) return;
    delBtn.disabled = true;
    try {
      await api(`/api/media/${m.id}`, { method: 'DELETE' });
      toast('Mídia excluída.', 'success');
      await renderBotMedia(slot, parentEl);
    } catch (err) {
      toast('Erro ao excluir: ' + err.message, 'danger');
      delBtn.disabled = false;
    }
  });
  footer.appendChild(delBtn);

  card.appendChild(footer);
  return card;
}

async function _moveMediaCard(slot, arr, idx, dir, parentEl) {
  const swapIdx = idx + dir;
  if (swapIdx < 0 || swapIdx >= arr.length) return;
  const a = arr[idx], b = arr[swapIdx];
  try {
    await Promise.all([
      api(`/api/bots/${slot}/media/${a.id}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ position_order: b.position_order ?? swapIdx }) }),
      api(`/api/bots/${slot}/media/${b.id}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ position_order: a.position_order ?? idx }) }),
    ]);
    await renderBotMedia(slot, parentEl);
  } catch (err) {
    toast('Erro ao reordenar: ' + err.message, 'danger');
  }
}

function _toggleMediaCardEdit(card, slot, m, parentEl, coursesArr, triggerBtn) {
  const existing = card.querySelector('.media-card-v2__edit-form');
  if (existing) {
    existing.remove();
    card.classList.remove('media-card-v2--editing');
    if (triggerBtn) triggerBtn.innerHTML = `${icon('pencil', 13)} Editar`;
    return;
  }
  card.classList.add('media-card-v2--editing');
  if (triggerBtn) triggerBtn.innerHTML = `${icon('x', 13)} Fechar`;

  const t = mediaMimeToType(m.media_type || m.mime_type);
  const isVideo = t === 'video';
  const courseOptions = `<option value="">— nenhum / biblioteca livre —</option>` +
    coursesArr.map(c => `<option value="${escapeHtml(c.course_slug)}" ${m.course_slug === c.course_slug ? 'selected' : ''}>${escapeHtml(c.name)} (${escapeHtml(c.course_slug)})</option>`).join('');

  const form = document.createElement('div');
  form.className = 'media-card-v2__edit-form';
  form.innerHTML = `
    <div>
      <label class="field-label" for="ed-ctx-${m.id}">Contexto para IA</label>
      <textarea id="ed-ctx-${m.id}" data-field="context" placeholder="Quando a IA deve enviar essa mídia?">${escapeHtml(m.context || '')}</textarea>
    </div>
    <div>
      <label class="field-label" for="ed-cap-${m.id}">Legenda</label>
      <input id="ed-cap-${m.id}" data-field="caption" type="text" value="${escapeHtml(m.caption || '')}" placeholder="Texto que vai junto da mídia">
    </div>
    <div class="media-card-v2__edit-row">
      <div>
        <label class="field-label" for="ed-course-${m.id}">Curso vinculado</label>
        <select id="ed-course-${m.id}" data-field="course_slug">${courseOptions}</select>
      </div>
      <div class="compact">
        <label class="field-label" for="ed-pos-${m.id}">Posição</label>
        <input id="ed-pos-${m.id}" data-field="position_order" type="number" min="0" value="${m.position_order ?? 0}">
      </div>
    </div>
    <label class="toggle" style="font-size:.8125rem">
      <input type="checkbox" data-field="is_course_intro" ${m.is_course_intro ? 'checked' : ''} ${(!isVideo || !m.course_slug) ? 'disabled' : ''}>
      <span class="toggle__track"></span>
      <span>Apresentação principal do curso</span>
    </label>
    <div class="media-card-v2__edit-actions">
      <button class="btn btn--ghost btn--sm" data-action="cancel">Cancelar</button>
      <button class="btn btn--primary btn--sm" data-action="save">${icon('check', 13)} Salvar alterações</button>
    </div>`;
  card.appendChild(form);

  const courseSel = form.querySelector('[data-field="course_slug"]');
  const introCheck = form.querySelector('[data-field="is_course_intro"]');
  if (courseSel && introCheck) {
    courseSel.addEventListener('change', () => {
      const has = !!courseSel.value;
      introCheck.disabled = !has;
      if (!has) introCheck.checked = false;
    });
  }

  form.querySelector('[data-action="cancel"]').addEventListener('click', () => {
    form.remove();
    card.classList.remove('media-card-v2--editing');
    if (triggerBtn) triggerBtn.innerHTML = `${icon('pencil', 13)} Editar`;
  });

  form.querySelector('[data-action="save"]').addEventListener('click', async (ev) => {
    const btn = ev.currentTarget;
    btn.disabled = true;
    try {
      // course_slug aceito em qualquer media_type (decisão #14 — fix bug imagem)
      const courseSlugVal = courseSel ? (courseSel.value || null) : undefined;
      const wantIntro = isVideo && courseSlugVal && introCheck && introCheck.checked;
      const body = {
        context: (form.querySelector('[data-field="context"]').value || '').trim() || null,
        caption: (form.querySelector('[data-field="caption"]').value || '').trim() || null,
        position_order: Number(form.querySelector('[data-field="position_order"]').value) || 0,
        course_slug: courseSlugVal,
      };
      // Desmarcando intro existente: envia is_course_intro=false (não bate em UNIQUE — apenas remove)
      if (isVideo && !wantIntro && m.is_course_intro) {
        body.is_course_intro = false;
      }
      await api(`/api/bots/${slot}/media/${m.id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      // Se quer setar intro: usa endpoint dedicado (atômico — zera outras intros do curso primeiro)
      if (wantIntro) {
        await api(`/api/bots/${slot}/courses/${encodeURIComponent(courseSlugVal)}/intro/${m.id}`, {
          method: 'PUT',
        });
      }
      toast('Mídia atualizada.', 'success');
      await renderBotMedia(slot, parentEl);
    } catch (err) {
      toast('Erro ao salvar: ' + err.message, 'danger');
      btn.disabled = false;
    }
  });

  // foca primeiro campo
  setTimeout(() => form.querySelector('[data-field="context"]')?.focus(), 30);
}


// ── renderBotCourses — aba "Cursos" no drawer do bot (006-C) ─────────────
async function renderBotCourses(slot, el) {
  try {
    const [coursesRes, mediasRes] = await Promise.all([
      api(`/api/bots/${slot}/courses`),
      api(`/api/bots/${slot}/media`),
    ]);
    const courses = Array.isArray(coursesRes) ? coursesRes : (coursesRes.courses || coursesRes.items || []);
    const medias  = Array.isArray(mediasRes)  ? mediasRes  : (mediasRes.media  || mediasRes.items  || []);

    const header = `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.75rem">
      <span class="muted" style="font-size:.8125rem">${courses.length} curso${courses.length !== 1 ? 's' : ''}</span>
      <button class="btn btn--primary btn--sm" id="btn-add-course">${icon('plus',13)} Adicionar curso</button>
    </div>`;

    if (!courses.length) {
      el.innerHTML = `${header}<div class="empty-state">${icon('book-open',36)}<div class="empty-state__title">Sem cursos</div><p class="empty-state__text">Nenhum curso cadastrado para este bot.</p></div>`;
    } else {
      const rows = courses.map(c => {
        const linked = medias.filter(m => m.course_slug === c.course_slug);
        const intro  = linked.find(m => m.is_course_intro === true || m.is_course_intro === 1);
        const count  = linked.length;
        const noIntroWarning = count > 0 && !intro
          ? `<span class="badge badge--warning" style="margin-left:.375rem;font-size:.7rem">sem intro</span>`
          : '';
        const introLabel = intro
          ? escapeHtml(intro.caption || intro.context || (intro.position || '').replace(/_/g, ' ') || `mídia #${intro.id}`)
          : '—';
        const introCell = intro
          ? `<span class="muted" style="font-size:.75rem" title="${introLabel}">${introLabel}</span>`
          : `<span class="muted">—</span>`;
        const priceDisplay = (c.price != null && c.price >= 0) ? fmtBRL(c.price / 100) : '—';
        const durationDisplay = c.duration ? escapeHtml(c.duration) : '—';
        const enabledToggleId = `course-enabled-${c.id}`;

        // Lista de vídeos vinculados com botão "Definir como apresentação" por linha
        const linkedVideosHtml = linked.length === 0
          ? `<tr class="course-media-sub-row"><td colspan="7"><span class="muted" style="font-size:.75rem;padding-left:1.5rem">Nenhuma mídia vinculada.</span></td></tr>`
          : linked.map(m => {
            const mName = escapeHtml(m.caption || m.context || (m.position || '').replace(/_/g, ' ') || `Mídia #${m.id}`);
            const mIsIntro = m.is_course_intro === true || m.is_course_intro === 1;
            const introBadge = mIsIntro ? `<span class="course-slug-badge course-slug-badge--warning" style="font-size:.7rem">${icon('star',10)} apresentação</span>` : '';
            const introBtn = !mIsIntro
              ? `<button class="btn btn--ghost btn--sm js-set-intro" data-media-id="${m.id}" data-course-slug="${escapeHtml(c.course_slug)}" title="Definir como apresentação" style="font-size:.75rem;white-space:nowrap">${icon('star',12)} Definir intro</button>`
              : '';
            return `<tr class="course-media-sub-row" data-media-id="${m.id}">
              <td colspan="2" style="padding-left:2rem;font-size:.75rem;color:var(--text-muted)">${icon('film',11)} ${mName}</td>
              <td colspan="2" style="font-size:.75rem">${introBadge}</td>
              <td colspan="3" style="text-align:right">${introBtn}</td>
            </tr>`;
          }).join('');

        return `<tr data-id="${c.id}" data-slug="${escapeHtml(c.course_slug)}" class="js-course-row">
          <td><button class="btn btn--ghost btn--sm js-course-edit" data-id="${c.id}" style="font-weight:600;color:var(--text)">${escapeHtml(c.name)}</button></td>
          <td class="col-course-price" style="color:var(--text-muted);font-size:.8125rem">${priceDisplay}</td>
          <td class="col-course-desc" style="color:var(--text-muted);font-size:.8125rem">${durationDisplay}</td>
          <td class="course-media-count" title="${count} de 5 mídias máximas"><span>${count}/5</span>${noIntroWarning}</td>
          <td class="col-course-intro">${introCell}</td>
          <td>
            <label class="toggle">
              <input type="checkbox" class="js-course-toggle" data-id="${c.id}" data-slug="${escapeHtml(c.course_slug)}" id="${enabledToggleId}" ${c.enabled ? 'checked' : ''}>
              <span class="toggle__track"></span>
            </label>
          </td>
          <td style="text-align:right;white-space:nowrap">
            <div class="media-actions-wrap">
              <button class="btn btn--ghost btn--sm btn--icon js-course-menu-toggle" aria-label="Ações" title="Ações">${icon('more-horizontal',14)}</button>
              <div class="media-actions-menu" data-menu-id="c-${c.id}">
                <button class="js-course-edit" data-id="${c.id}">${icon('edit-2',13)} Editar</button>
                <button class="js-course-link" data-id="${c.id}" data-slug="${escapeHtml(c.course_slug)}">${icon('link',13)} Vincular mídia</button>
                <button class="js-course-del danger" data-id="${c.id}" data-slug="${escapeHtml(c.course_slug)}" data-name="${escapeHtml(c.name)}">${icon('trash-2',13)} Excluir</button>
              </div>
            </div>
          </td>
        </tr>
        ${linkedVideosHtml}`;
      }).join('');

      el.innerHTML = `${header}<div style="overflow-x:auto"><table class="course-table">
        <thead><tr>
          <th>Nome</th>
          <th class="col-course-price">Preço</th>
          <th class="col-course-desc">Duração</th>
          <th>Mídias</th>
          <th class="col-course-intro">Apresentação</th>
          <th>Ativo</th>
          <th style="width:48px"></th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table></div>`;
    }

    el.querySelector('#btn-add-course').addEventListener('click', () => openAddCourseModal(slot, el));

    // menu toggle
    el.querySelectorAll('.js-course-menu-toggle').forEach(btn => {
      btn.addEventListener('click', e => {
        e.stopPropagation();
        const wrap = btn.closest('.media-actions-wrap');
        const menu = wrap.querySelector('.media-actions-menu');
        const wasOpen = menu.classList.contains('open');
        document.querySelectorAll('.media-actions-menu.open').forEach(m => m.classList.remove('open'));
        if (!wasOpen) menu.classList.add('open');
      });
    });

    // editar (nome clicável + menu)
    el.querySelectorAll('.js-course-edit').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.dataset.id;
        const c = courses.find(x => String(x.id) === String(id));
        if (c) openEditCourseModal(slot, c, el);
      });
    });

    // vincular mídia
    el.querySelectorAll('.js-course-link').forEach(btn => {
      btn.addEventListener('click', () => {
        openLinkMediaModal(slot, btn.dataset.slug, medias, el);
      });
    });

    // toggle ativo
    el.querySelectorAll('.js-course-toggle').forEach(chk => {
      chk.addEventListener('change', async () => {
        const origChecked = !chk.checked;
        chk.disabled = true;
        try {
          await api(`/api/bots/${slot}/courses/${chk.dataset.slug}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ enabled: chk.checked }),
          });
          toast(chk.checked ? 'Curso ativado.' : 'Curso desativado.', 'success');
        } catch (err) {
          chk.checked = origChecked;
          toast('Erro ao alterar status: ' + err.message, 'danger');
        } finally {
          chk.disabled = false;
        }
      });
    });

    // excluir
    el.querySelectorAll('.js-course-del').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (!confirm(`Excluir curso "${btn.dataset.name}"? Esta ação desativa o curso.`)) return;
        btn.disabled = true;
        try {
          await api(`/api/bots/${slot}/courses/${btn.dataset.slug}`, { method: 'DELETE' });
          toast('Curso excluído.', 'success');
          await renderBotCourses(slot, el);
        } catch (err) {
          toast('Erro ao excluir: ' + err.message, 'danger');
          btn.disabled = false;
        }
      });
    });

    // definir intro diretamente da linha de mídia expandida
    el.querySelectorAll('.js-set-intro').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (!confirm('Definir este vídeo como apresentação do curso?')) return;
        btn.disabled = true;
        try {
          await api(`/api/bots/${slot}/courses/${btn.dataset.courseSlug}/intro/${btn.dataset.mediaId}`, {
            method: 'PUT',
          });
          toast('Vídeo de apresentação definido.', 'success');
          await renderBotCourses(slot, el);
        } catch (err) {
          toast('Erro: ' + err.message, 'danger');
          btn.disabled = false;
        }
      });
    });

  } catch (err) {
    el.innerHTML = `<p class="muted">${icon('alert-triangle',14)} Erro ao carregar cursos: ${escapeHtml(err.message)}</p><button class="btn btn--sm" onclick="renderBotCourses('${escapeHtml(slot)}',this.parentElement)">${icon('refresh-cw',14)} Tentar novamente</button>`;
  }
}

function _courseFormHtml(c, isEdit) {
  const slugField = isEdit
    ? `<div>
        <label class="label">Slug do curso</label>
        <div class="input" style="background:var(--surface-2);color:var(--text-muted);cursor:default">${escapeHtml(c.course_slug || '')}</div>
        <p class="muted" style="font-size:.72rem;margin:.25rem 0 0">O slug é a identidade do curso e não pode ser alterado.</p>
      </div>`
    : `<div>
        <label class="label" for="course-slug">Slug <span style="color:var(--danger)">*</span></label>
        <input id="course-slug" class="input" type="text" placeholder="ex: curso-online-degrade" value="${escapeHtml(c.course_slug || '')}">

      </div>`;
  return `
    <div id="course-form-status"></div>
    <div style="display:flex;flex-direction:column;gap:.625rem">
      <div>
        <label class="label" for="course-name">Nome <span style="color:var(--danger)">*</span></label>

      </div>
      ${slugField}
      <div>
        <label class="label" for="course-desc">Descrição</label>
        <textarea id="course-desc" class="input" rows="2" style="resize:vertical">${escapeHtml(c.description || '')}</textarea>
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:.625rem">
        <div>
          <label class="label" for="course-price">Preço (R$)</label>
          <input id="course-price" class="input" type="number" min="0" step="0.01" placeholder="297.00" value="${c.price != null ? (c.price / 100).toFixed(2) : ''}">
        </div>
        <div>
          <label class="label" for="course-order">Posição</label>
          <input id="course-order" class="input" type="number" min="0" value="${c.position_order ?? 0}" style="width:100%">
        </div>
      </div>
      <div>
        <label class="label" for="course-duration">Duração (texto livre)</label>
        <input id="course-duration" class="input" type="text" placeholder="ex: 8 horas" value="${escapeHtml(c.duration || '')}">
      </div>
      <div>
        <label class="toggle">
          <input type="checkbox" id="course-enabled" ${(c.enabled !== false) ? 'checked' : ''}>
          <span class="toggle__track"></span>
          <span>Curso ativo</span>
        </label>
      </div>
    </div>
    <div style="margin-top:1rem;display:flex;gap:.5rem;justify-content:flex-end">
      <button class="btn btn--ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn--primary" id="btn-save-course">${icon('save',13)} Salvar</button>
    </div>`;
}

function openAddCourseModal(slot, parentEl) {
  openModal(`
    <div class="modal__header">
      <span class="modal__title">Adicionar curso</span>
      <button class="btn btn--ghost btn--icon" onclick="closeModal()" aria-label="Fechar">${icon('x', 16)}</button>
    </div>
    ${_courseFormHtml({}, false)}
  `);

  document.getElementById('btn-save-course').addEventListener('click', async () => {
    const btn = document.getElementById('btn-save-course');
    const statusDiv = document.getElementById('course-form-status');
    const name  = document.getElementById('course-name').value.trim();
    const slug  = document.getElementById('course-slug').value.trim();
    const desc  = document.getElementById('course-desc').value.trim();
    const priceRaw = document.getElementById('course-price').value;
    const order = Number(document.getElementById('course-order').value) || 0;
    const duration = document.getElementById('course-duration').value.trim();
    const enabled  = document.getElementById('course-enabled').checked;

    if (!name) {
      statusDiv.innerHTML = `<p style="color:var(--danger);font-size:.8rem;margin-bottom:.5rem">${icon('alert-triangle',13)} Nome é obrigatório.</p>`;
      return;
    }
    if (!slug) {
      statusDiv.innerHTML = `<p style="color:var(--danger);font-size:.8rem;margin-bottom:.5rem">${icon('alert-triangle',13)} Slug é obrigatório.</p>`;
      return;
    }
    if (!/^[a-z0-9]+(-[a-z0-9]+)*$/.test(slug)) {
      statusDiv.innerHTML = `<p style="color:var(--danger);font-size:.8rem;margin-bottom:.5rem">${icon('alert-triangle',13)} Slug inválido. Use letras minúsculas, números e hífens. Ex: <code>curso-online-degrade</code></p>`;
      return;
    }
    const price = priceRaw !== '' ? Math.round(parseFloat(priceRaw) * 100) : 0;
    if (isNaN(price) || price < 0) {
      statusDiv.innerHTML = `<p style="color:var(--danger);font-size:.8rem;margin-bottom:.5rem">${icon('alert-triangle',13)} Preço inválido.</p>`;
      return;
    }

    btn.disabled = true;
    statusDiv.innerHTML = '';
    try {
      await api(`/api/bots/${slot}/courses`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ course_slug: slug, name, description: desc || null, price, duration: duration || null, position_order: order, enabled }),
      });
      toast('Curso adicionado.', 'success');
      closeModal();
      await renderBotCourses(slot, parentEl);
    } catch (err) {
      const msg = (err.message || '').includes('409') || (err.message || '').toLowerCase().includes('duplicado') || (err.message || '').toLowerCase().includes('já existe')
        ? 'Já existe um curso com esse slug para este bot.'
        : err.message;
      statusDiv.innerHTML = `<p style="color:var(--danger);font-size:.8rem;margin-bottom:.5rem">${icon('alert-triangle',13)} ${escapeHtml(msg)}</p>`;
      btn.disabled = false;
    }
  });
}
