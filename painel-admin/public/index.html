      </div>`
    : `<div>
        <label class="label" for="cc-slug">Slug <span style="color:var(--danger)">*</span></label>
        <input id="cc-slug" class="input" type="text" placeholder="ex: curso-online-degrade" value="${escapeHtml(c.course_slug || '')}">
        <p class="muted" style="font-size:.72rem;margin:.25rem 0 0">Somente letras minúsculas, números e hífens. Ex: <code>curso-online-degrade</code></p>
      </div>`;

  return `
    <div id="cc-form-status"></div>
    <div style="display:flex;flex-direction:column;gap:.625rem">
      <div>
        <label class="label" for="cc-name">Nome <span style="color:var(--danger)">*</span></label>
        <input id="cc-name" class="input" type="text" placeholder="Nome do curso" value="${escapeHtml(c.name || '')}">
      </div>
      ${slugField}
      <div>
        <label class="label" for="cc-desc">Descrição curta</label>
        <textarea id="cc-desc" class="input" rows="2" style="resize:vertical">${escapeHtml(c.description || '')}</textarea>
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:.625rem">
        <div>
          <label class="label" for="cc-price">Preço (R$)</label>
          <input id="cc-price" class="input" type="number" min="0" step="0.01" placeholder="297.00" value="${c.price != null ? (c.price / 100).toFixed(2) : ''}">
        </div>
        <div>
          <label class="label" for="cc-order">Posição</label>
          <input id="cc-order" class="input" type="number" min="0" value="${c.position_order ?? 0}">
        </div>
      </div>
      <div>
        <label class="label" for="cc-duration">Duração (texto livre)</label>
        <input id="cc-duration" class="input" type="text" placeholder="ex: Acesso vitalício, ~30h" value="${escapeHtml(c.duration || '')}">
      </div>
      <div>
        <label class="label" for="cc-details">
          Detalhes para o bot <span class="muted" style="font-size:.75rem;font-weight:400">(details_for_llm)</span>
        </label>
        <textarea id="cc-details" class="input" rows="10" style="resize:vertical;font-size:.8125rem"
          placeholder="Tudo que o bot deve saber sobre o curso: modalidade (online/presencial), certificado (sim/não), parcelamento, próxima turma, carga horária, diferenciais, política de cancelamento, suporte, etc.

Exemplo:
- Modalidade: online com acesso vitalício
- Certificado: sim, reconhecido pelo SENAC
- Parcelamento: 12x R$ 29,90 no cartão
- Próxima turma: todo mês, início imediato
- Diferenciais: kit de ferramentas incluso, mentoria ao vivo semanal
- Cancelamento: 7 dias corridos para reembolso integral"
        >${escapeHtml(c.details_for_llm || '')}</textarea>
        <p class="muted" style="font-size:.72rem;margin:.25rem 0 0">${icon('info',11)} Essas informações são injetadas no contexto do bot para que ele responda com precisão sobre o curso.</p>
      </div>
      <div>
        <label class="toggle">
          <input type="checkbox" id="cc-enabled" ${(c.enabled !== false) ? 'checked' : ''}>
          <span class="toggle__track"></span>
          <span>Curso ativo</span>
        </label>
      </div>
    </div>
    <div style="margin-top:1rem;display:flex;gap:.5rem;justify-content:flex-end">
      <button class="btn btn--ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn--primary" id="btn-save-clone-course">${icon('save',13)} Salvar</button>
    </div>`;
}

function openCloneCourseModal(slot, course, parentEl, clone) {
  const isEdit = !!course;
  const c = course || {};

  openModal(`
    <div class="modal__header">
      <span class="modal__title">${isEdit ? 'Editar curso' : 'Adicionar curso'}</span>
      <button class="btn btn--ghost btn--icon" onclick="closeModal()" aria-label="Fechar">${icon('x', 16)}</button>
    </div>
    ${_cloneCourseFormHtml(c, isEdit)}
  `);

  // auto-preencher slug a partir do nome (somente no modo criação)
  if (!isEdit) {
    document.getElementById('cc-name')?.addEventListener('input', (ev) => {
      const slugEl = document.getElementById('cc-slug');
      if (!slugEl || slugEl.dataset.manualEdit === '1') return;
      slugEl.value = ev.target.value
        .toLowerCase()
        .normalize('NFD').replace(/[̀-ͯ]/g, '')
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/^-|-$/g, '');
    });
    document.getElementById('cc-slug')?.addEventListener('input', (ev) => {
      ev.currentTarget.dataset.manualEdit = ev.currentTarget.value ? '1' : '0';
    });
  }

  document.getElementById('btn-save-clone-course').addEventListener('click', async () => {
    const btn = document.getElementById('btn-save-clone-course');
    const statusDiv = document.getElementById('cc-form-status');

    const name     = document.getElementById('cc-name').value.trim();
    const slug     = isEdit ? c.course_slug : document.getElementById('cc-slug').value.trim();
    const desc     = document.getElementById('cc-desc').value.trim();
    const priceRaw = document.getElementById('cc-price').value;
    const order    = Number(document.getElementById('cc-order').value) || 0;
    const duration = document.getElementById('cc-duration').value.trim();
    const details  = document.getElementById('cc-details').value.trim();
    const enabled  = document.getElementById('cc-enabled').checked;

    if (!name) {
      statusDiv.innerHTML = `<p style="color:var(--danger);font-size:.8rem;margin-bottom:.5rem">${icon('alert-triangle',13)} Nome é obrigatório.</p>`;
      return;
    }
    if (!isEdit && !slug) {
      statusDiv.innerHTML = `<p style="color:var(--danger);font-size:.8rem;margin-bottom:.5rem">${icon('alert-triangle',13)} Slug é obrigatório.</p>`;
      return;
    }
    if (!isEdit && !/^[a-z0-9]+(-[a-z0-9]+)*$/.test(slug)) {
      statusDiv.innerHTML = `<p style="color:var(--danger);font-size:.8rem;margin-bottom:.5rem">${icon('alert-triangle',13)} Slug inválido. Use letras minúsculas, números e hífens.</p>`;
      return;
    }
    const price = priceRaw !== '' ? Math.round(parseFloat(priceRaw) * 100) : 0;
    if (isNaN(price) || price < 0) {
      statusDiv.innerHTML = `<p style="color:var(--danger);font-size:.8rem;margin-bottom:.5rem">${icon('alert-triangle',13)} Preço inválido.</p>`;
      return;
    }

    btn.disabled = true;
    statusDiv.innerHTML = '';
    try {
      const payload = { name, description: desc || null, price, duration: duration || null, position_order: order, details_for_llm: details || null, enabled };
      if (!isEdit) payload.course_slug = slug;

      await api(
        isEdit
          ? `/api/bots/${encodeURIComponent(slot)}/courses/${encodeURIComponent(c.course_slug)}`
          : `/api/bots/${encodeURIComponent(slot)}/courses`,
        {
          method: isEdit ? 'PUT' : 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        }
      );
      toast(isEdit ? 'Curso atualizado.' : 'Curso adicionado.', 'success');
      closeModal();
      await renderCloneCourses(clone, parentEl);
    } catch (err) {
      const msg = (err.message || '').includes('409') || (err.message || '').toLowerCase().includes('já existe')
        ? 'Já existe um curso com esse slug para este bot.'
        : err.message;
      statusDiv.innerHTML = `<p style="color:var(--danger);font-size:.8rem;margin-bottom:.5rem">${icon('alert-triangle',13)} ${escapeHtml(msg)}</p>`;
      btn.disabled = false;
    }
  });
}

/* ══ MODAL QR ISOLADO ════════════════════════════════════════════= */
function openCloneQRModal(clone) {
  if (clone.status === 'conectado') {
    openModal(`
      <div class="modal__header">
        <span class="modal__title">WhatsApp — ${escapeHtml(clone.display_name || 'Clone')}</span>
        <button class="btn btn--ghost btn--icon" onclick="closeModal()" aria-label="Fechar">${icon('x', 16)}</button>
      </div>
      <div class="qr-connected" style="padding:1.5rem 0">
        ${icon('check-circle-2', 48)}
        <div style="font-weight:700">Já conectado</div>
        <p class="muted">Esta sessão está ativa.</p>
        <button class="btn btn--danger" id="qr-modal-disconnect">${icon('unlink',13)} Desconectar</button>
      </div>`);
    document.getElementById('qr-modal-disconnect')?.addEventListener('click', async () => {
      try {
        await api(`/api/sessions/${encodeURIComponent(clone.waha_sessao)}/stop`, { method: 'POST' });
        toast('Sessão desconectada.', 'success');
        clone.status = 'desconectado';
        _rendered['bots'] = false;
        closeModal();
        renderBots();
      } catch (err) { toast('Erro: ' + err.message, 'danger'); }
    });
    return;
  }

  // Sem sessão vinculada: abre step 4 com as 3 opções
  if (!clone.waha_sessao) {
    _wizardState = {
      step: 4,
      matriz_slot:      clone.matriz_slot,
      display_name:     clone.display_name || '',
      cliente_nome:     clone.cliente_nome || '',
      cliente_telefone: clone.cliente_telefone || '',
      personalizacao:   clone.personalizacao || {},
      sessao_name:      'clone_' + slugify(clone.display_name || String(clone.id)),
      waha_option:      'nova',
      cloneId:          clone.id,
      stopQR:           null,
    };
    renderWizardStep();
    return;
  }

  // Tem sessão mas não conectada: abre QR + opção de pairing code
  const cloneSessao = clone.waha_sessao;
  openModal(`
    <div class="modal__header">
      <span class="modal__title">Conectar WhatsApp — ${escapeHtml(clone.display_name || 'Clone')}</span>
      <button class="btn btn--ghost btn--icon" onclick="closeModal()" aria-label="Fechar">${icon('x', 16)}</button>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:.5rem;padding:.5rem 0">
      <div class="auth-seg" role="tablist" aria-label="Método de autenticação">
        <button class="auth-seg__btn active" id="clone-seg-qr-btn" role="tab" aria-selected="true" aria-controls="clone-tab-qr">
          ${icon('qr-code',13)} QR Code
        </button>
        <button class="auth-seg__btn" id="clone-seg-pair-btn" role="tab" aria-selected="false" aria-controls="clone-tab-pair">
          ${icon('smartphone',13)} Código de pareamento
        </button>
      </div>

      <div id="clone-tab-qr" role="tabpanel" style="display:flex;flex-direction:column;align-items:center;width:100%">
        <div id="standalone-qr-area" style="padding:.5rem 0;width:100%;display:flex;justify-content:center">
          <div class="qr-wrap">
            <div class="skeleton-block" style="width:200px;height:200px;border-radius:var(--radius-md)"></div>
            <p class="muted">Carregando QR Code...</p>
          </div>
        </div>
      </div>

      <div id="clone-tab-pair" role="tabpanel" style="display:none;flex-direction:column;align-items:center;gap:.75rem;width:100%">
        <div style="width:100%;max-width:300px">
          <label class="muted" style="display:block;margin-bottom:.375rem;font-size:.8125rem">Telefone do cliente (com DDI):</label>
          <input id="clone-pair-phone-input" type="tel" class="input" placeholder="+55 11 99999-9999"
            style="width:100%;font-size:1rem" autocomplete="tel" inputmode="tel" />
        </div>
        <button class="btn btn--primary" id="clone-pair-generate-btn" style="min-width:160px">
          ${icon('key',14)} Gerar código
        </button>
        <div id="clone-pair-result" style="width:100%;max-width:300px;text-align:center"></div>
      </div>
    </div>`);

  document.getElementById('modal-content').classList.add('modal--lg');

  // ── QR polling ─────────────────────────────────────────────────
  pollQR(cloneSessao, (data) => {
    const area = document.getElementById('standalone-qr-area');
    if (!area) { if (_activeQRPoll) { clearInterval(_activeQRPoll); _activeQRPoll = null; } return; }
    if (data.connected || data.qr === null) {
      if (_activeQRPoll) { clearInterval(_activeQRPoll); _activeQRPoll = null; }
      area.innerHTML = `<div class="qr-connected">${icon('check-circle-2', 48)}<div style="font-weight:700">WhatsApp conectado!</div><button class="btn btn--primary" onclick="closeModal();renderBots()">Concluir</button></div>`;
      toast('WhatsApp conectado!', 'success');
      clone.status = 'conectado';
      _rendered['bots'] = false;
    } else if (data.qr) {
      area.innerHTML = `<div class="qr-wrap"><img src="${data.qr}" alt="QR Code" /><p class="muted" style="font-size:.8125rem">Escaneie no WhatsApp do cliente</p></div>`;
    } else if (data.error) {
      area.innerHTML = `<p class="muted" style="color:var(--danger)">${icon('alert-triangle',14)} ${escapeHtml(data.error)}</p>`;
    }
  });

  // ── Toggle de abas ─────────────────────────────────────────────
  document.getElementById('clone-seg-qr-btn')?.addEventListener('click', () => {
    document.getElementById('clone-seg-qr-btn').classList.add('active');
    document.getElementById('clone-seg-qr-btn').setAttribute('aria-selected','true');
    document.getElementById('clone-seg-pair-btn').classList.remove('active');
    document.getElementById('clone-seg-pair-btn').setAttribute('aria-selected','false');
    document.getElementById('clone-tab-qr').style.display = 'flex';
    document.getElementById('clone-tab-pair').style.display = 'none';
  });

  document.getElementById('clone-seg-pair-btn')?.addEventListener('click', () => {
    document.getElementById('clone-seg-pair-btn').classList.add('active');
    document.getElementById('clone-seg-pair-btn').setAttribute('aria-selected','true');
    document.getElementById('clone-seg-qr-btn').classList.remove('active');
    document.getElementById('clone-seg-qr-btn').setAttribute('aria-selected','false');
    document.getElementById('clone-tab-pair').style.display = 'flex';
    document.getElementById('clone-tab-qr').style.display = 'none';
  });

  // ── Gerar pairing code (clone) ─────────────────────────────────
  const cloneGenerateHandler = () => _gerarPairingCodeClone(cloneSessao);
  document.getElementById('clone-pair-generate-btn')?.addEventListener('click', cloneGenerateHandler);
  document.getElementById('clone-pair-phone-input')?.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') cloneGenerateHandler();
  });
}

async function _gerarPairingCodeClone(sessaoName) {
  const input = document.getElementById('clone-pair-phone-input');
  const resultEl = document.getElementById('clone-pair-result');
  const btn = document.getElementById('clone-pair-generate-btn');
  if (!input || !resultEl || !btn) return;

  const raw = input.value.trim();
  const digits = raw.replace(/\D/g, '');
  if (digits.length < 10) {
    resultEl.innerHTML = `<p style="color:var(--danger);font-size:.8125rem">${icon('alert-triangle',14)} Telefone inválido — informe DDI + DDD + número (ex: +55 11 99999-9999).</p>`;
    return;
  }

  btn.disabled = true;
  btn.innerHTML = `${icon('loader',14)} Gerando...`;
  resultEl.innerHTML = `<div class="skeleton-block" style="height:64px;border-radius:var(--radius-md)"></div>`;

  try {
    const data = await api(`/api/sessions/${encodeURIComponent(sessaoName)}/pairing-code`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ phoneNumber: raw }),
    });

    const codeText = escapeHtml(data.code || '');
    resultEl.innerHTML = `
      <div class="pairing-code-display" title="Clique para selecionar">${codeText}</div>
      <button class="btn btn--sm btn--ghost" id="clone-pair-copy-btn" style="gap:.375rem">
        ${icon('copy',13)} Copiar código
      </button>
      <div class="pairing-instructions">
        No WhatsApp do cliente:<br>
        <ol>
          <li>Configurações → Aparelhos conectados</li>
          <li>Conectar um aparelho</li>
          <li>Conectar com número de telefone</li>
          <li>Digite o código acima</li>
        </ol>
      </div>`;

    document.getElementById('clone-pair-copy-btn')?.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(data.code || '');
        const copyBtn = document.getElementById('clone-pair-copy-btn');
        if (copyBtn) {
          copyBtn.innerHTML = `${icon('check',13)} Copiado!`;
          setTimeout(() => { if (copyBtn) copyBtn.innerHTML = `${icon('copy',13)} Copiar código`; }, 2000);
        }
      } catch (_) {
        toast('Não foi possível copiar. Selecione o código manualmente.', 'info');
      }
    });

  } catch (err) {
    let msg = err.message || 'Erro desconhecido';
    if (err.status === 409) {
      msg = 'Sessão já está conectada ou não está aguardando autenticação.';
    } else if (err.status === 400) {
      msg = 'Telefone inválido — informe DDI + DDD + número (ex: +55 11 99999-9999).';
    }
    resultEl.innerHTML = `
      <p style="color:var(--danger);font-size:.8125rem;text-align:center">
        ${icon('alert-triangle',14)} ${escapeHtml(msg)}
      </p>`;
  } finally {
    setTimeout(() => {
      if (btn) { btn.disabled = false; btn.innerHTML = `${icon('key',14)} Gerar código`; }
    }, 30000);
    if (btn) btn.innerHTML = `${icon('clock',14)} Aguarde 30s para novo código`;
  }
}

/* ══════════════════════════════════════════════════════════════════
   ROTEAMENTO — seção de primeiro nível (003-F: implementação completa)
   Tabela única routing_clientes — CRUD completo com filtros, bulk delete,
   edição inline de workflow e modal de adicionar/editar.
   ══════════════════════════════════════════════════════════════════ */

// Estado local da seção de roteamento
let _rtRoutes   = [];   // cache completo de routing_clientes
let _rtWfs      = [];   // cache de workflows roteáveis
let _rtFilter   = { wfId: '', q: '' };
let _rtSelected = new Set();
let _rtDebounce = null;

// Paleta de cores para badges de workflow (determinístico por id)
const RT_WF_COLORS = [
  { bg:'rgba(59,130,246,.18)',  color:'#60a5fa' },
  { bg:'rgba(16,185,129,.18)',  color:'#34d399' },
  { bg:'rgba(245,158,11,.18)',  color:'#fbbf24' },
  { bg:'rgba(139,92,246,.18)', color:'#a78bfa' },
  { bg:'rgba(236,72,153,.18)', color:'#f472b6' },
  { bg:'rgba(6,182,212,.18)',  color:'#22d3ee' },
];
function _rtWfColor(wfId) {
  let h = 0;
  for (let i = 0; i < (wfId||'').length; i++) h = (h*31 + (wfId||'').charCodeAt(i)) >>> 0;
  return RT_WF_COLORS[h % RT_WF_COLORS.length];
}

async function renderRoteamento() {
  const sec = document.querySelector('#sec-roteamento');
  if (!sec) return;

  sec.innerHTML = `
    <div class="section-header">
      <div class="section-header__left">
        <h1 class="h1">Roteamento de Telefones</h1>
        <p class="muted">Tabela única de acesso — vincula número ao fluxo de teste correspondente</p>
      </div>
      <div class="section-header__right">
        <button class="btn btn--primary" id="rt-btn-add">${icon('plus',14)} Adicionar telefone</button>
      </div>
    </div>
    <div id="rt-kpis" class="rt-kpi-strip">
      <div class="rt-kpi"><span class="rt-kpi__value skeleton-inline" style="width:3ch">…</span><span class="rt-kpi__label">Cadastrados</span></div>
      <div class="rt-kpi"><span class="rt-kpi__value skeleton-inline" style="width:3ch">…</span><span class="rt-kpi__label">Fluxos routáveis</span></div>
    </div>
    <div class="rt-filter-bar" id="rt-filter-bar">
      <select id="rt-sel-wf" style="max-width:220px">
        <option value="">Todos os fluxos</option>
      </select>
      <input type="text" id="rt-search" placeholder="Buscar telefone ou nome…" style="flex:1;max-width:280px" />
      <button class="btn btn--ghost btn--sm" id="rt-btn-clear" style="white-space:nowrap">${icon('x',12)} Limpar filtros</button>
    </div>
    <div class="rt-bulk-bar" id="rt-bulk-bar">
      <span class="rt-bulk-bar__count" id="rt-bulk-count"></span>
      <button class="btn btn--sm btn--danger" id="rt-btn-bulk-del">${icon('trash-2',13)} Deletar selecionados</button>
    </div>
    <div id="rt-table-wrap">
      <div style="padding:1.5rem 0;display:flex;align-items:center;gap:.5rem;color:var(--text-muted)"><div class="spinner"></div> Carregando…</div>
    </div>`;

  document.getElementById('rt-btn-add').addEventListener('click', () => _rtOpenModal(null));
  document.getElementById('rt-btn-clear').addEventListener('click', _rtClearFilters);
  document.getElementById('rt-search').addEventListener('input', () => {
    clearTimeout(_rtDebounce);
    _rtDebounce = setTimeout(() => {
      _rtFilter.q = document.getElementById('rt-search').value.trim().toLowerCase();
      _rtRender();
    }, 200);
  });
  document.getElementById('rt-sel-wf').addEventListener('change', () => {
    _rtFilter.wfId = document.getElementById('rt-sel-wf').value;
    _rtRender();
  });
  document.getElementById('rt-btn-bulk-del').addEventListener('click', _rtBulkDelete);

  try {
    const [rawRoutes, rawWfs] = await Promise.all([
      api('/api/routing'),
      api('/api/workflows'),
    ]);
    _rtRoutes = Array.isArray(rawRoutes) ? rawRoutes : (rawRoutes.routes || rawRoutes.rules || []);
    const allWfs = Array.isArray(rawWfs) ? rawWfs : (rawWfs.workflows || rawWfs.data || []);
    _rtWfs = allWfs.filter(w => w.routable);

    // Popula KPIs
    document.getElementById('rt-kpis').innerHTML = `
      <div class="rt-kpi"><span class="rt-kpi__value">${_rtRoutes.length}</span><span class="rt-kpi__label">Cadastrados</span></div>
      <div class="rt-kpi"><span class="rt-kpi__value">${_rtWfs.length}</span><span class="rt-kpi__label">Fluxos disponíveis</span></div>`;

    // Popula select de fluxos
    const sel = document.getElementById('rt-sel-wf');
    _rtWfs.forEach(w => {
      const opt = document.createElement('option');
      opt.value = w.id;
      opt.textContent = w.name || w.id;
      sel.appendChild(opt);
    });

    _rtRender();
  } catch (err) {
    document.getElementById('rt-table-wrap').innerHTML =
      `<div class="alert--danger" style="background:var(--danger-bg);border:1px solid var(--danger);border-radius:var(--radius-md);padding:.75rem 1rem;color:var(--danger);display:flex;align-items:center;gap:.5rem">${icon('alert-triangle',14)} Erro ao carregar: ${escapeHtml(err.message)}</div>`;
  }
}

function _rtFiltered() {
  return _rtRoutes.filter(r => {
    if (_rtFilter.wfId && r.workflow_id !== _rtFilter.wfId) return false;
    if (_rtFilter.q) {
      const phone = (r.telefone || r.phone || '').toLowerCase();
      const nome  = (r.nome_cliente || r.nome || '').toLowerCase();
      if (!phone.includes(_rtFilter.q) && !nome.includes(_rtFilter.q)) return false;
    }
    return true;
  });
}

function _rtClearFilters() {
  _rtFilter = { wfId: '', q: '' };
  const selEl = document.getElementById('rt-sel-wf');
  const srEl  = document.getElementById('rt-search');
  if (selEl) selEl.value = '';
  if (srEl)  srEl.value = '';
  _rtRender();
}

function _rtRender() {
  const rows = _rtFiltered();
  const wrap = document.getElementById('rt-table-wrap');
  if (!wrap) return;

  const hasFilters = !!((_rtFilter.wfId || _rtFilter.q));

  if (!rows.length) {
    wrap.innerHTML = `
      <div class="empty-state">
        ${icon('phone',32)}
        <div class="empty-state__title">${hasFilters ? 'Nenhum resultado' : 'Sem telefones cadastrados'}</div>
        <p class="empty-state__text">${hasFilters
          ? 'Nenhum telefone corresponde aos filtros aplicados.'
          : 'Adicione um telefone para liberar o acesso ao fluxo de teste.'}</p>
        ${hasFilters ? `<button class="btn btn--ghost btn--sm empty-state__action" onclick="_rtClearFilters()">${icon('x',12)} Limpar filtros</button>` : ''}
      </div>`;
    return;
  }

  const tbody = rows.map(r => {
    const id       = r.id;
    const phone    = escapeHtml(_fmtPhone(r.telefone || r.phone) || r.telefone || r.phone || '—');
    const nome     = escapeHtml(r.nome_cliente || r.nome || '—');
    const wfId     = r.workflow_id || '';
    const wf       = _rtWfs.find(w => w.id === wfId);
    const wfName   = escapeHtml(wf?.name || r.workflow_name || wfId || '—');
    // Sessão WAHA: o nome do workflow é o mesmo que o slot/sessão (ex: "teste_barbearia")
    const sessaoName = escapeHtml(wf?.name || r.workflow_name || '—');
    const ativo    = r.ativo !== false;
    const updated  = r.atualizado_em ? fmtRelative(r.atualizado_em) : (r.criado_em ? fmtRelative(r.criado_em) : '—');
    const checked  = _rtSelected.has(id);
    const c        = _rtWfColor(wfId);
    return `<tr data-rt-id="${escapeHtml(String(id))}">
      <td style="width:36px;padding-left:.875rem">
        <input type="checkbox" class="rt-row-check" data-id="${escapeHtml(String(id))}" ${checked ? 'checked' : ''} aria-label="Selecionar linha" />
      </td>
      <td class="rt-col-phone">${phone}</td>
      <td class="rt-col-nome">${nome}</td>
      <td>
        <span class="rt-wf-badge" style="background:${c.bg};color:${c.color}" data-wf-id="${escapeHtml(wfId)}" data-row-id="${escapeHtml(String(id))}" title="Clique para editar workflow">${wfName}</span>
      </td>
      <td class="rt-col-sessao"><code style="font-size:.75rem;color:var(--text-muted)">${sessaoName}</code></td>
      <td class="rt-col-ativo">
        <label class="toggle" title="${ativo ? 'Ativo' : 'Inativo'}">
          <input type="checkbox" class="rt-toggle-ativo" data-id="${escapeHtml(String(id))}" ${ativo ? 'checked' : ''} />
          <span class="toggle__track"></span>
        </label>
      </td>
      <td class="rt-col-updated muted">${escapeHtml(updated)}</td>
      <td style="width:40px">
        <div class="rt-actions-wrap">
          <button class="more-btn rt-more" data-id="${escapeHtml(String(id))}" aria-label="Ações">···</button>
          <div class="rt-actions-menu" id="rt-menu-${escapeHtml(String(id))}">
            <button class="rt-act-edit" data-id="${escapeHtml(String(id))}">${icon('pencil',13)} Editar</button>
            <button class="rt-act-del danger" data-id="${escapeHtml(String(id))}">${icon('trash-2',13)} Deletar</button>
          </div>
        </div>
      </td>
    </tr>`;
  }).join('');

  wrap.innerHTML = `
    <div class="table-wrap">
      <table class="rt-table">
        <thead><tr>
          <th style="width:36px;padding-left:.875rem"><input type="checkbox" id="rt-check-all" title="Selecionar todos" /></th>
          <th>TELEFONE</th>
          <th>CLIENTE</th>
          <th>FLUXO</th>
          <th class="rt-col-sessao">SESSÃO</th>
          <th class="rt-col-ativo">ATIVO</th>
          <th class="rt-col-updated">ATUALIZADO</th>
          <th></th>
        </tr></thead>
        <tbody>${tbody}</tbody>
      </table>
    </div>`;

  // Listeners — select all
  wrap.querySelector('#rt-check-all').addEventListener('change', e => {
    const checked = e.target.checked;
    wrap.querySelectorAll('.rt-row-check').forEach(cb => {
      cb.checked = checked;
      const rid = cb.dataset.id;
      if (checked) _rtSelected.add(rid); else _rtSelected.delete(rid);
    });
    _rtUpdateBulkBar();
  });

  // Listeners — individual checkboxes
  wrap.querySelectorAll('.rt-row-check').forEach(cb => {
    cb.addEventListener('change', e => {
      if (e.target.checked) _rtSelected.add(e.target.dataset.id);
      else _rtSelected.delete(e.target.dataset.id);
      _rtUpdateBulkBar();
    });
  });

  // Listeners — toggle ativo
  wrap.querySelectorAll('.rt-toggle-ativo').forEach(tog => {
    tog.addEventListener('change', async e => {
      const rid = e.target.dataset.id;
      const ativoNovo = e.target.checked;
      try {
        await api(`/api/routing/${encodeURIComponent(rid)}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ativo: ativoNovo }),
        });
        const idx = _rtRoutes.findIndex(r => String(r.id) === rid);
        if (idx !== -1) _rtRoutes[idx].ativo = ativoNovo;
        toast(ativoNovo ? 'Registro ativado' : 'Registro desativado', 'success');
      } catch (err) {
        toast('Erro ao atualizar: ' + err.message, 'danger');
        e.target.checked = !ativoNovo; // reverte
      }
    });
  });

  // Listeners — dropdown de ações
  wrap.querySelectorAll('.rt-more').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const rid = btn.dataset.id;
      // fecha todos os outros menus
      wrap.querySelectorAll('.rt-actions-menu').forEach(m => {
        if (m.id !== `rt-menu-${rid}`) m.classList.remove('open');
      });
      document.getElementById(`rt-menu-${rid}`)?.classList.toggle('open');
    });
  });
  document.addEventListener('click', _rtCloseMenus, { once: true });

  wrap.querySelectorAll('.rt-act-edit').forEach(btn => {
    btn.addEventListener('click', () => {
      const rid = btn.dataset.id;
      const route = _rtRoutes.find(r => String(r.id) === rid);
      if (route) _rtOpenModal(route);
    });
  });

  wrap.querySelectorAll('.rt-act-del').forEach(btn => {
    btn.addEventListener('click', async () => {
      const rid = btn.dataset.id;
      const route = _rtRoutes.find(r => String(r.id) === rid);
      const label = route ? (route.telefone || route.phone || rid) : rid;
      if (!window.confirm(`Deletar o telefone ${label}?`)) return;
      try {
        await api(`/api/routing/${encodeURIComponent(rid)}`, { method: 'DELETE' });
        _rtRoutes = _rtRoutes.filter(r => String(r.id) !== rid);
        _rtSelected.delete(rid);
        toast('Telefone removido', 'success');
        _rtUpdateKPIs();
        _rtRender();
      } catch (err) {
        toast('Erro ao deletar: ' + err.message, 'danger');
      }
    });
  });

  // Edição inline de workflow ao clicar no badge
  wrap.querySelectorAll('.rt-wf-badge').forEach(badge => {
    badge.addEventListener('click', e => {
      const rid   = badge.dataset.rowId;
      const curWf = badge.dataset.wfId;
      const sel = document.createElement('select');
      sel.className = 'rt-inline-select';
      _rtWfs.forEach(w => {
        const opt = document.createElement('option');
        opt.value = w.id;
        opt.textContent = w.name || w.id;
        if (w.id === curWf) opt.selected = true;
        sel.appendChild(opt);
      });
      badge.replaceWith(sel);
      sel.focus();
      sel.addEventListener('change', async () => {
        const newWfId = sel.value;
        const newWf   = _rtWfs.find(w => w.id === newWfId);
        try {
          await api(`/api/routing/${encodeURIComponent(rid)}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ workflow_id: newWfId, workflow_name: newWf?.name }),
          });
          const idx = _rtRoutes.findIndex(r => String(r.id) === rid);
          if (idx !== -1) {
            _rtRoutes[idx].workflow_id   = newWfId;
            _rtRoutes[idx].workflow_name = newWf?.name;
          }
          toast('Fluxo atualizado', 'success');
          _rtRender();
        } catch (err) {
          toast('Erro ao atualizar fluxo: ' + err.message, 'danger');
          _rtRender();
        }
      });
      sel.addEventListener('blur', () => _rtRender());
    });
  });

  _rtUpdateBulkBar();
}

function _rtCloseMenus() {
  document.querySelectorAll('.rt-actions-menu.open').forEach(m => m.classList.remove('open'));
}

function _rtUpdateBulkBar() {
  const bar = document.getElementById('rt-bulk-bar');
  const cnt = document.getElementById('rt-bulk-count');
  if (!bar) return;
  if (_rtSelected.size > 0) {
    bar.classList.add('visible');
    if (cnt) cnt.textContent = `${_rtSelected.size} selecionado${_rtSelected.size !== 1 ? 's' : ''}`;
  } else {
    bar.classList.remove('visible');
  }
}

function _rtUpdateKPIs() {
  const kpis = document.getElementById('rt-kpis');
  if (!kpis) return;
  kpis.innerHTML = `
    <div class="rt-kpi"><span class="rt-kpi__value">${_rtRoutes.length}</span><span class="rt-kpi__label">Cadastrados</span></div>
    <div class="rt-kpi"><span class="rt-kpi__value">${_rtWfs.length}</span><span class="rt-kpi__label">Fluxos routáveis</span></div>`;
}

async function _rtBulkDelete() {
  if (_rtSelected.size === 0) return;
  const n = _rtSelected.size;
  if (!window.confirm(`Deletar ${n} telefone${n !== 1 ? 's' : ''}? Essa ação não pode ser desfeita.`)) return;
  const ids = Array.from(_rtSelected);
  let errs = 0;
  for (const rid of ids) {
    try {
      await api(`/api/routing/${encodeURIComponent(rid)}`, { method: 'DELETE' });
      _rtRoutes = _rtRoutes.filter(r => String(r.id) !== rid);
    } catch (e) { errs++; console.warn('[rtBulkDelete] erro em', rid, ':', e?.message); }
  }
  _rtSelected.clear();
  if (errs) toast(`${errs} erro(s) ao deletar`, 'warning');
  else toast(`${n} telefone${n !== 1 ? 's' : ''} removido${n !== 1 ? 's' : ''}`, 'success');
  _rtUpdateKPIs();
  _rtRender();
}

function _rtOpenModal(route) {
  // route = null → modo "Adicionar"; route = objeto → modo "Editar"
  const isEdit = !!route;
  const titleText = isEdit ? 'Editar acesso' : 'Adicionar telefone';
  const phone = route ? (route.telefone || route.phone || '') : '';
  const nome  = route ? (route.nome_cliente || route.nome || '') : '';
  const wfId  = route ? (route.workflow_id || '') : '';
  const ativo = route ? (route.ativo !== false) : true;

  const wfOptions = _rtWfs.map(w =>
    `<option value="${escapeHtml(w.id)}" ${w.id === wfId ? 'selected' : ''}>${escapeHtml(w.name || w.id)}</option>`
  ).join('');

  openModal(`
    <div class="modal__header">
      <span class="modal__title">${escapeHtml(titleText)}</span>
      <button class="btn btn--ghost btn--sm" onclick="closeModal()" aria-label="Fechar">${icon('x',16)}</button>
    </div>
    <div style="display:flex;flex-direction:column;gap:.875rem">
      <div class="field">
        <label for="rt-modal-phone">Telefone <span style="color:var(--danger)">*</span></label>
        <input id="rt-modal-phone" type="tel" placeholder="5511999990000" maxlength="15"
          value="${escapeHtml(phone)}"
          style="font-family:var(--font-mono)" />
        <span class="muted" style="font-size:.75rem">Somente dígitos, incluindo código do país (ex: 5511999990000)</span>
      </div>
      <div class="field">
        <label for="rt-modal-nome">Nome do cliente <span class="muted">(opcional)</span></label>
        <input id="rt-modal-nome" type="text" placeholder="Ex: João da Silva" maxlength="80"
          value="${escapeHtml(nome)}" />
      </div>
      <div class="field">
        <label for="rt-modal-wf">Fluxo de teste <span style="color:var(--danger)">*</span></label>
        <select id="rt-modal-wf">
          <option value="">— selecione um fluxo —</option>
          ${wfOptions || '<option disabled>Nenhum fluxo disponível</option>'}
        </select>
      </div>
      ${isEdit ? `<div class="field" style="display:flex;align-items:center;gap:.75rem">
        <label class="toggle">
          <input type="checkbox" id="rt-modal-ativo" ${ativo ? 'checked' : ''} />
          <span class="toggle__track"></span>
          <span>Ativo</span>
        </label>
      </div>` : ''}
      <div style="display:flex;gap:.5rem;justify-content:flex-end;padding-top:.25rem">
        <button class="btn btn--ghost btn--sm" onclick="closeModal()">Cancelar</button>
        <button class="btn btn--primary btn--sm" id="rt-modal-save">${isEdit ? `${icon('check-circle-2',13)} Salvar` : `${icon('plus',13)} Adicionar`}</button>
      </div>
    </div>`);

  document.getElementById('rt-modal-save').addEventListener('click', async () => {
    const telRaw  = (document.getElementById('rt-modal-phone')?.value || '').replace(/\D/g, '');
    const nomeVal = (document.getElementById('rt-modal-nome')?.value || '').trim();
    const wfVal   = document.getElementById('rt-modal-wf')?.value;
    const ativoVal = isEdit ? (document.getElementById('rt-modal-ativo')?.checked !== false) : true;

    if (!telRaw || telRaw.length < 10) {
      toast('Informe um telefone válido (mínimo 10 dígitos)', 'warning'); return;
    }
    if (!wfVal) {
      toast('Selecione um fluxo de teste', 'warning'); return;
    }
    const wf = _rtWfs.find(w => w.id === wfVal);
    const btn = document.getElementById('rt-modal-save');
    if (btn) btn.disabled = true;

    try {
      const body = {
        telefone: telRaw,
        nome_cliente: nomeVal || undefined,
        workflow_id: wfVal,
        workflow_name: wf?.name,
        ativo: ativoVal,
      };
      if (isEdit) {
        const updated = await api(`/api/routing/${encodeURIComponent(route.id)}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        const idx = _rtRoutes.findIndex(r => String(r.id) === String(route.id));
        if (idx !== -1) _rtRoutes[idx] = { ..._rtRoutes[idx], ...body, ...(updated || {}) };
        toast('Acesso atualizado', 'success');
      } else {
        const created = await api('/api/routing', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        _rtRoutes.push(created && created.id ? created : { ...body, id: Date.now() });
        toast('Telefone adicionado', 'success');
      }
      _rtUpdateKPIs();
      _rtRender();
      closeModal();
    } catch (err) {
      toast('Erro: ' + err.message, 'danger');
      if (btn) btn.disabled = false;
    }
  });
}

/* ── SVG chart helpers (vanilla, sem libs) ───────────────────────── */
function _chartPad(values) {
  // Normaliza array de números para escala 0-1; retorna [] se vazio ou tudo zero.
  if (!values.length) return [];
  const min = 0;
  const max = Math.max(...values);
  if (max === 0) return values.map(() => 0);
  return values.map(v => (v - min) / (max - min));
}

function drawSparkline(values, w, h) {
  const norm = _chartPad(values);
  if (!norm.length) return `<svg width="${w}" height="${h}"></svg>`;
  const pts = norm.map((v, i) => {
    const x = (i / (norm.length - 1 || 1)) * w;
    const y = h - v * h;
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true">
    <polyline points="${pts}" fill="none" stroke="#00d9b2" stroke-width="1.5" stroke-linejoin="round"/>
  </svg>`;
}

function drawBarChart(points, w, h, label) {
  // points: [{t, value}]
  if (!points.length) {
    return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-label="${label||''}">
      <text x="${w/2}" y="${h/2}" text-anchor="middle" fill="#6b7280" font-size="11">Sem dados</text>
    </svg>`;
  }
  const values = points.map(p => Number(p.value) || 0);
  const max = Math.max(...values, 0.001);
  const bw = Math.max(1, (w - 4) / values.length - 1);
  const step = (w - 4) / values.length;
  const gridY = [0.25, 0.5, 0.75, 1].map(f => (h - 20) - f * (h - 20));
  let svg = `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-label="${label||''}">`;
  // grid lines
  gridY.forEach(y => {
    svg += `<line x1="0" y1="${y.toFixed(1)}" x2="${w}" y2="${y.toFixed(1)}" stroke="#374151" stroke-width="0.5"/>`;
  });
  // bars
  values.forEach((v, i) => {
    const barH = (v / max) * (h - 20);
    const x = 2 + i * step;
    const y = (h - 20) - barH;
    svg += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${barH.toFixed(1)}" fill="#00d9b2" opacity="0.8" rx="1"/>`;
  });
  // x axis labels (first + last)
  if (points.length >= 2) {
    const fmt = t => {
      const d = new Date(t);
      // Se o timestamp for só data (ex: "2026-05-04"), usa formato data; caso contrário, hora
      const isDateOnly = typeof t === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(t);
      return isDateOnly ? d.toLocaleDateString('pt-BR', {day:'2-digit',month:'2-digit'}) : d.toLocaleTimeString('pt-BR', {hour:'2-digit',minute:'2-digit'});
    };
    svg += `<text x="2" y="${h-4}" font-size="9" fill="#9ca3af">${fmt(points[0].t)}</text>`;
    svg += `<text x="${w-2}" y="${h-4}" font-size="9" fill="#9ca3af" text-anchor="end">${fmt(points[points.length-1].t)}</text>`;
  }
  svg += '</svg>';
  return svg;
}

function drawLineChart(points, w, h, label) {
  if (!points.length) {
    return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-label="${label||''}">
      <text x="${w/2}" y="${h/2}" text-anchor="middle" fill="#6b7280" font-size="11">Sem dados</text>
    </svg>`;
  }
  const values = points.map(p => Number(p.value) || 0);
  const max = Math.max(...values, 0.001);
  const gridY = [0.25, 0.5, 0.75, 1].map(f => (h - 20) - f * (h - 20));
  let svg = `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-label="${label||''}">`;
  gridY.forEach(y => {
    svg += `<line x1="0" y1="${y.toFixed(1)}" x2="${w}" y2="${y.toFixed(1)}" stroke="#374151" stroke-width="0.5"/>`;
  });
  const pts = values.map((v, i) => {
    const x = (i / (values.length - 1 || 1)) * w;
    const y = (h - 20) - (v / max) * (h - 20);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
  svg += `<polyline points="${pts}" fill="none" stroke="#00d9b2" stroke-width="2" stroke-linejoin="round"/>`;
  // dots
  values.forEach((v, i) => {
    const x = (i / (values.length - 1 || 1)) * w;
    const y = (h - 20) - (v / max) * (h - 20);
    svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.5" fill="#00d9b2"/>`;
  });
  if (points.length >= 2) {
    const fmt = t => {
      const d = new Date(t);
      return d.toLocaleTimeString('pt-BR', {hour:'2-digit',minute:'2-digit'});
    };
    svg += `<text x="2" y="${h-4}" font-size="9" fill="#9ca3af">${fmt(points[0].t)}</text>`;
    svg += `<text x="${w-2}" y="${h-4}" font-size="9" fill="#9ca3af" text-anchor="end">${fmt(points[points.length-1].t)}</text>`;
  }
  svg += '</svg>';
  return svg;
}

async function _mLoad() {
  try {
    const [byBotRes, errRes] = await Promise.all([
      api(`/api/metrics/by-bot?period=${_mPeriod}`),
      api(`/api/metrics/top-errors?period=${_mPeriod}&limit=10`),
    ]);

    const bots  = (byBotRes.rows || []).filter(b => !String(b.slot || '').startsWith('worker'));
    const erros = errRes.rows   || [];

    // sparklines: busca série de mensagens por bot (só os que têm execuções)
    const sparkMap = {};
    await Promise.all(
      bots.slice(0, 8).map(async b => {
        try {
          const s = await api(`/api/metrics/timeseries?metric=messages&period=24h&bot=${encodeURIComponent(b.slot)}`);
          sparkMap[b.slot] = (s.points || []).map(p => Number(p.value) || 0);
        } catch { sparkMap[b.slot] = []; }
      })
    );

    _mRender(bots, erros, sparkMap);
    // carrega gráficos timeseries
    await _mLoadCharts();

    document.getElementById('m-body').innerHTML = `<div class="empty-state"><span class="text-danger">Erro: ${e.message}</span></div>`;

async function _mLoadChart(metric, bot, containerId) {
  const el = document.getElementById(containerId);
  if (!el) return;
  try {
    const url = `/api/metrics/timeseries?metric=${metric}&period=${_mPeriod}&bot=${encodeURIComponent(bot)}`;
    const data = await api(url);
    const pts  = data.points || [];
    const w    = el.clientWidth  || 260;
    const h    = 80;
    const chartSvg = metric === 'latency' ? drawLineChart(pts, w, h, metric) : drawBarChart(pts, w, h, metric);
    el.innerHTML = `<div style="width:100%">${chartSvg}</div>`;
  } catch {
    el.innerHTML = `<span class="muted" style="font-size:.8rem">Erro ao carregar</span>`;
  }
}

async function _mLoadCharts() {
  await Promise.all([
    _mLoadChart('messages', _mBotMessages, 'm-chart-messages-body'),
    _mLoadChart('cost',     _mBotCost,     'm-chart-cost-body'),
    _mLoadChart('latency',  _mBotLatency,  'm-chart-latency-body'),
  ]);
}

/* Flat map de id → item para lookup rápido */
const NAV_ITEMS_MAP = {};
NAV_GROUPS.forEach(g => g.items.forEach(i => { NAV_ITEMS_MAP[i.id] = i; }));

/* Estado de colapso dos grupos — persiste no localStorage */
function _loadGroupState() {
  try { return JSON.parse(localStorage.getItem('paineladmin:nav-groups') || '{}'); } catch { return {}; }
}
function _saveGroupState(st) {
  try { localStorage.setItem('paineladmin:nav-groups', JSON.stringify(st)); } catch {}
}

let _groupState = _loadGroupState();

let _savedSection = localStorage.getItem('paineladmin:section') || 'dashboard';
if (_savedSection === 'clones') { _savedSection = 'bots'; localStorage.setItem('paineladmin:section', 'bots'); }
let _activeSection = _savedSection;
let _rendered = {};

function buildNav() {
  const nav = document.getElementById('sidebar-nav');
  nav.innerHTML = '';

  NAV_GROUPS.forEach(grp => {
    const isCollapsed = _groupState[grp.id] === true;
    const grpEl = document.createElement('div');
    grpEl.className = 'nav-group' + (isCollapsed ? ' collapsed' : '');
    grpEl.dataset.group = grp.id;

    /* Cabeçalho do grupo */
    const hdr = document.createElement('div');
    hdr.className = 'nav-group__header';
    hdr.setAttribute('role', 'button');
    hdr.setAttribute('aria-expanded', String(!isCollapsed));
    hdr.setAttribute('tabindex', '0');
    hdr.innerHTML = `<span>${grp.label}</span><span class="nav-group__chevron">${icon('chevron-down', 12)}</span>`;
    hdr.addEventListener('click', () => toggleNavGroup(grp.id, grpEl, hdr));
    hdr.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleNavGroup(grp.id, grpEl, hdr); } });

    /* Itens */
    const itemsEl = document.createElement('div');
    itemsEl.className = 'nav-group__items';

    grp.items.forEach(item => {
      const btn = document.createElement('button');
      btn.className = 'nav-item' + (_activeSection === item.id ? ' active' : '');
      btn.dataset.section = item.id;
      btn.setAttribute('aria-current', _activeSection === item.id ? 'page' : 'false');
      btn.innerHTML = `<span class="nav-dot"></span><span>${item.label}</span>`;
      btn.addEventListener('click', () => navigateTo(item.id));
      itemsEl.appendChild(btn);
    });

    grpEl.appendChild(hdr);
    grpEl.appendChild(itemsEl);
    nav.appendChild(grpEl);
  });
}

function toggleNavGroup(groupId, grpEl, hdr) {
  const isNowCollapsed = !grpEl.classList.contains('collapsed');
  grpEl.classList.toggle('collapsed', isNowCollapsed);
  hdr.setAttribute('aria-expanded', String(!isNowCollapsed));
  _groupState[groupId] = isNowCollapsed;
  _saveGroupState(_groupState);
}

function navigateTo(sectionId) {
  _activeSection = sectionId;
  localStorage.setItem('paineladmin:section', sectionId);

  // Update sections visibility
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  const target = document.getElementById(`sec-${sectionId}`);
  if (target) target.classList.add('active');

  // Update nav active state
  document.querySelectorAll('.nav-item').forEach(btn => {
    const isActive = btn.dataset.section === sectionId;
    btn.classList.toggle('active', isActive);
    btn.setAttribute('aria-current', isActive ? 'page' : 'false');
  });

  // Close mobile sidebar
  closeSidebar();

  // Fecha SSE se sair da seção execuções
  if (sectionId !== 'execucoes' && _execSSE) {
    const liveBtn = document.querySelector('#exec-live-btn');
    if (liveBtn) stopExecSSE(liveBtn); else { _execSSE.close(); _execSSE = null; }
  }

  // Para polling de atividade do dashboard ao sair
  if (sectionId !== 'dashboard' && _dashActivityInterval) {
    clearInterval(_dashActivityInterval);
    _dashActivityInterval = null;
  }

  // Para auto-refresh de métricas ao sair (evita requests fantasma)
  if (sectionId !== 'metricas' && _mRefreshId) {
    clearInterval(_mRefreshId);
    _mRefreshId = null;
  }

  // Render if not yet rendered (or always re-render dashboard for freshness)
  const item = NAV_ITEMS_MAP[sectionId];
  if (item && (sectionId === 'dashboard' || !_rendered[sectionId])) {
    _rendered[sectionId] = true;
    item.render();
  }
}

/* ── Mobile sidebar ─────────────────────────────────────────────── */
function openSidebar() {
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('sidebar-backdrop').classList.add('open');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebar-backdrop').classList.remove('open');
}

/* ══════════════════════════════════════════════════════════════════
   CLEANUP COUNTDOWN WIDGET
   ══════════════════════════════════════════════════════════════════ */
function mountCleanupCountdown() {
  // Cria o elemento fixo se ainda não existir
  let widget = document.getElementById('cleanup-countdown');
  if (!widget) {
    widget = document.createElement('div');
    widget.id = 'cleanup-countdown';
    widget.setAttribute('role', 'button');
    widget.setAttribute('tabindex', '0');
    widget.setAttribute('title', 'Ir para configurações de limpeza');
    widget.setAttribute('aria-label', 'Próxima limpeza automática');
    widget.innerHTML = `${icon('trash-2', 14)}<span id="cleanup-countdown__label">Carregando...</span>`;
    document.body.appendChild(widget);
  }

  const labelEl = () => document.getElementById('cleanup-countdown__label');

  widget.addEventListener('click', () => {
    navigateTo('configuracoes');
    // Força aba limpeza após navegação (pequeno delay para render)
    setTimeout(() => {
      const btn = document.querySelector('#cfg-tabs [data-tab="limpeza"]');
      if (btn) btn.click();
    }, 80);
  });
  widget.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') widget.click(); });

  let _nextRun = null; // Date object do próximo run
  let _tickId  = null;
  let _fetchId = null;

  function _fmtCountdown(ms) {
    if (ms <= 0) return null;
    const totalSec = Math.floor(ms / 1000);
    const min = Math.floor(totalSec / 60);
    const sec = totalSec % 60;
    if (min > 0) return `${min}min ${String(sec).padStart(2,'0')}s`;
    return `${sec}s`;
  }

  function _tick() {
    const lbl = labelEl();
    if (!lbl) return;
    if (!_nextRun) { lbl.textContent = 'Aguardando...'; return; }
    const ms = _nextRun - Date.now();
    if (ms <= 0) {
      // Limpeza em execução (ou passou)
      lbl.textContent = 'Executando...';
      widget.className = 'running';
      // Re-fetch após 30s pra pegar novo next_run
      clearTimeout(_fetchId);
      _fetchId = setTimeout(_fetchStatus, 30000);
      return;
    }
    const txt = _fmtCountdown(ms);
    lbl.textContent = `Prox. limpeza em ${txt}`;
    widget.className = ms < 60000 ? 'warning' : '';
  }

  async function _fetchStatus() {
    try {
      const s = await api('/api/cleanup/status');
      const raw = s?.next_run || s?.nextRun;
      _nextRun = raw ? new Date(raw) : null;
    } catch (_) {
      _nextRun = null;
    }
    _tick();
    // Re-sincroniza a cada 5 minutos
    clearTimeout(_fetchId);
    _fetchId = setTimeout(_fetchStatus, 5 * 60 * 1000);
  }

  // Tick a cada 1s
  _tickId = setInterval(_tick, 1000);

  // Fetch inicial
  _fetchStatus();
}

/* ══════════════════════════════════════════════════════════════════
   BOOTSTRAP
   ══════════════════════════════════════════════════════════════════ */
(function init() {
  // Hamburger icon
  const hambBtn = document.getElementById('btn-hamburger');
  if (hambBtn) {
    hambBtn.innerHTML = icon('menu', 20);
    hambBtn.addEventListener('click', openSidebar);
  }

  // Backdrop click to close
  document.getElementById('sidebar-backdrop').addEventListener('click', closeSidebar);

  // Modal close on backdrop click
  document.getElementById('modal-backdrop').addEventListener('click', (e) => {
    if (e.target === e.currentTarget) closeModal();
  });

  // Lightbox close
  document.getElementById('lightbox-close').addEventListener('click', closeLightbox);
  document.getElementById('lightbox').addEventListener('click', (e) => {
    if (e.target === e.currentTarget) closeLightbox();
  });

  // Build navigation
  buildNav();

  // Activate stored or default section
  document.getElementById(`sec-${_activeSection}`)?.classList.add('active');
  const initItem = NAV_ITEMS_MAP[_activeSection];
  if (initItem) {
    _rendered[_activeSection] = true;
    initItem.render();
  }

  // Keyboard ESC closes modal / lightbox / drawer
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      closeModal();
      closeLightbox();
      closeDrawer();
    }
  });

  // Fechar SSE e polling antes de sair da página
  window.addEventListener('beforeunload', () => {
    if (_execSSE) { _execSSE.close(); _execSSE = null; }
    if (_dashActivityInterval) { clearInterval(_dashActivityInterval); _dashActivityInterval = null; }
  });

  // Widget de countdown da limpeza automática
  mountCleanupCountdown();
})();
</script>
